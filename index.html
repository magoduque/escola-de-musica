{id:"n5m3", t1:"Contraponto", t2:"& Forma", g:"🎻", c:"#3b82f6", t2c:"#4c9bff", sub:"Condução de vozes, contraponto, formas, rearmonização",
desc:"As bases da escrita musical séria: como as vozes andam, como melodias se combinam, como músicas inteiras se organizam e como reharmonizar uma melodia.",
aulas:[
{t:"Condução de vozes", e:"🧵", min:"20 min", sub:"As regras da harmonia a 4 vozes",
goal:"encadear acordes a 4 vozes seguindo as regras tradicionais.",
body:`
<p>Na harmonia tradicional, os acordes são escritos a <b>4 vozes</b>, como num coral: <b>Soprano, Contralto, Tenor e Baixo</b> (SCTB, ou SATB). Cada voz é uma pequena melodia. <b>Condução de vozes</b> é a arte de fazer cada uma andar bem de um acorde para o outro.</p>
<h2>📏 Regras principais (estilo coral tradicional)</h2>
<ol>
<li><b>Notas comuns ficam paradas</b>: se dois acordes têm uma nota em comum, a voz que a canta fica na mesma nota.</li>
<li><b>Caminho mais curto</b>: as outras vozes se movem por grau conjunto ou pequenos saltos, sempre que possível.</li>
<li><b>Evite 5ªs e 8ªs paralelas</b>: duas vozes que estão a uma 5ª justa (ou 8ª) não devem se mover juntas para outra 5ª (ou 8ª). Isso tira a independência das vozes.</li>
<li><b>A sensível sobe</b> para a tônica, e a <b>7ª de um acorde desce</b> por grau (lembre do trítono).</li>
<li><b>Não cruze as vozes</b> e mantenha no máximo uma oitava entre soprano–contralto e contralto–tenor.</li>
<li>Em tríades no estado fundamental, prefira <b>dobrar a fundamental</b>.</li>
</ol>
${st("G","E4+C5/h D4+B4/h | C4+C5/w",{bpm:60,playNotes:"C3+G3+E4+C5/h G2+G3+D4+B4/h C3+G3+E4+C5/w",cap:"C – G – C a 4 vozes (vozes superiores mostradas): o Sol fica parado no tenor, as outras andam por grau"})}
${box("ana","Imagine quatro pessoas atravessando uma sala de um lugar para outro. O mais elegante é cada uma dar o menor número de passos possível, sem trombar com as outras e sem que todas façam exatamente o mesmo movimento ao mesmo tempo.")}
${box("prof","Por que evitar 5ªs e 8ªs paralelas? Esses intervalos são tão consonantes que as duas vozes quase se fundem em uma; em paralelo, o ouvido perde uma voz. No estilo coral (Bach, hinos tradicionais) isso é regra; na música popular e no jazz, quintas paralelas são usadas livremente (acordes de power chord, planing de Debussy). As regras valem para um estilo, não para toda a música.")}
${box("dica","A condução de vozes é o que faz um arranjo de naipe soar \"profissional\". Os mesmos princípios valem para arranjar hinos para quarteto de metais ou para escrever as vozes de trombone numa banda.")}
${box("pra","Escreva I–IV–V–I em Si♭ maior a 4 vozes (B♭–E♭–F–B♭), mantendo notas comuns e evitando paralelas. Toque cada voz separadamente no trombone para ouvir as linhas.")}
${box("res","Notas comuns paradas, movimento mínimo, sem 5ªs/8ªs paralelas, sensível sobe, 7ª desce, sem cruzar vozes.")}
`,
quiz:[
["O que fazer com uma nota comum a dois acordes seguidos?",["Mudar de oitava","Manter na mesma voz","Tirar do acorde"],1,"Nota comum fica parada."],
["Por que evitar 5ªs paralelas no estilo coral?",["Porque desafinam","Porque as vozes perdem a independência","Porque são dissonantes"],1,"As vozes se fundem."],
["Para onde vai a 7ª de um acorde dominante?",["Sobe por grau","Desce por grau","Fica parada sempre"],1,"A 7ª desce (ex.: Fá → Mi em G7→C)."]
],
pdf:[["Hindemith · Harmonia Tradicional","Harmonia Tradicional_Paul Hindemith_12ed.pdf"],["Schoenberg · Harmonia","Harmonia (Arnold Schoenberg).pdf"]]},

{t:"Contraponto: melodias que conversam", e:"🕸️", min:"22 min", sub:"Movimentos e as espécies",
goal:"entender os tipos de movimento entre vozes e escrever um contraponto simples de 1ª espécie.",
body:`
<p><b>Contraponto</b> é a arte de combinar <b>melodias independentes</b> que soam bem juntas. O nome vem do latim <i>punctus contra punctum</i>: \"nota contra nota\". É a base da música de Bach e de toda a tradição erudita, e também das segundas vozes e contracantos na música popular.</p>
<h2>↕️ Os quatro movimentos entre duas vozes</h2>
${tbl(["Movimento","O que acontece","Efeito"],[["<b>Contrário</b>","uma sobe, a outra desce","máxima independência (o preferido)"],["<b>Oblíquo</b>","uma fica parada, a outra se move","independência"],["<b>Direto (similar)</b>","as duas vão na mesma direção, com intervalos diferentes","menos independência"],["<b>Paralelo</b>","as duas vão na mesma direção, mantendo o mesmo intervalo","pouca independência (3ªs e 6ªs paralelas soam doces; 5ªs e 8ªs, evitadas no estilo tradicional)"]])}
${st("G","C4+C5/w D4+B4/w E4+G4/w D4+B4/w C4+C5/w",{bpm:70,cap:"Contraponto de 1ª espécie em movimento contrário: 8ª, 6ª, 3ª, 6ª, 8ª (a 6ª se abre para a 8ª no final)"})}
<h2>🪜 As cinco espécies</h2>
<p>O método clássico de ensino (de Johann Joseph Fux, 1725) usa uma melodia dada, o <b>cantus firmus</b>, e ensina a escrever outra voz contra ela em 5 etapas:</p>
${tbl(["Espécie","Ritmo da voz nova (contra 1 nota do cantus firmus)","O que treina"],[["1ª","1 nota (nota contra nota)","consonâncias e movimentos"],["2ª","2 notas","nota de passagem"],["3ª","4 notas","bordaduras, linhas fluentes"],["4ª","notas ligadas (síncopas)","retardos (dissonância preparada e resolvida)"],["5ª","ritmo livre (florido)","tudo junto"]])}
<h2>📏 Regras da 1ª espécie (resumo)</h2>
<ul><li>Só <b>consonâncias</b> (uníssono, 3ªs, 5ªs, 6ªs, 8ªs).</li><li>Começar e terminar em consonância <b>perfeita</b> (uníssono, 5ª ou 8ª).</li><li>Sem 5ªs ou 8ªs paralelas; prefira movimento contrário.</li><li>Prefira graus conjuntos; saltos grandes compensados por movimento na direção oposta.</li><li>Não repita muito o mesmo intervalo seguido (no máximo 3 terças ou sextas paralelas, como recomendação).</li><li>Chegar à nota final por grau conjunto (ex.: 6ª maior abrindo para 8ª).</li></ul>
${box("ana","Contraponto é uma conversa em que as duas pessoas falam ao mesmo tempo e mesmo assim tudo se entende, porque uma fala quando a outra respira, uma sobe o tom quando a outra baixa.")}
${box("dica","Para o trombonista: escrever e tocar contracantos é uma habilidade muito valorizada em bandas, orquestras de igreja e grupos de choro. O trombone é o instrumento clássico do contracanto no choro e no samba de gafieira.")}
${box("pra","Pegue uma melodia simples em semibreves (Dó Ré Fá Mi Ré Dó) e escreva uma voz acima, nota contra nota, seguindo as regras da 1ª espécie. Toque as duas vozes (grave uma e toque a outra).")}
${box("res","Contraponto = melodias independentes juntas. Prefira movimento contrário. 1ª espécie: só consonâncias, sem 5ªs/8ªs paralelas, começa e termina em consonância perfeita.")}
`,
quiz:[
["Qual movimento dá mais independência entre as vozes?",["Paralelo","Contrário","Direto"],1,"Uma sobe, a outra desce."],
["Na 1ª espécie, quantas notas a voz nova tem contra cada nota do cantus firmus?",["1","2","4"],0,"Nota contra nota."],
["Qual espécie treina retardos (síncopas)?",["2ª","4ª","1ª"],1,"4ª espécie: notas ligadas."]
],
pdf:[["Kennan · Contraponto",NP+"Teoria Musical - Contraponto - Kent Kennan.pdf"],["Koellreutter · Contraponto",NP+"Teoria Musical - Contraponto - H.J.Koellreutter.pdf"],["Owen · Josquin a Stravinsky",NP+"Teoria Musical - Contraponto - Josquin a Strawinsky.pdf"],["Schoenberg · Exercícios de contraponto",NP+"Teoria Musical - Exercícios Contraponto - Arnold Schoenberg.pdf"]]},

{t:"Formas musicais", e:"🏗️", min:"16 min", sub:"AB, ABA, AABA, rondó, blues, sonata",
goal:"reconhecer as formas mais comuns ouvindo e lendo.",
body:`
<p><b>Forma</b> é a arquitetura da música: como as partes se organizam, se repetem e contrastam. Usamos letras (A, B, C) para as partes; uma parte que volta recebe a mesma letra (com ' se voltar modificada: A').</p>
${tbl(["Forma","Esquema","Onde aparece"],[

{t:"Rearmonização", e:"🎛️", min:"22 min", sub:"A mesma melodia, outra harmonia",
goal:"rearmonizar uma melodia simples usando as técnicas dos Níveis 3 e 5.",
body:`
<p><b>Rearmonizar</b> é trocar os acordes de uma música mantendo a melodia. É o que arranjadores fazem para dar uma cara nova a uma canção conhecida. A regra básica: <b>a nota da melodia precisa ser nota do acorde ou uma tensão aceitável dele</b> (nunca uma nota evitada sustentada).</p>
<h2>🧰 A caixa de ferramentas (do mais simples ao mais ousado)</h2>
<ol>
<li><b>Substituição por mesma função</b>: I ↔ VI ↔ III; IV ↔ II; V ↔ VII.</li>
<li><b>Acrescentar o II</b> antes de cada V (virar V em II–V).</li>
<li><b>Dominantes secundárias</b> antes de qualquer acorde (Nível 3).</li>
<li><b>SubV</b> no lugar de dominantes (baixo cromático).</li>
<li><b>Empréstimo modal</b>: IVm, ♭VII7, ♭VI7M.</li>
<li><b>Diminutos de passagem</b>.</li>
<li><b>Pedal</b>: manter a mesma nota no baixo enquanto os acordes mudam em cima.</li>
<li><b>Linha de baixo cromática</b> guiando os acordes.</li>
</ol>
<h2>🧪 Exemplo: \"Brilha, brilha\" rearmonizada</h2>
${tbl(["Compasso","Melodia","Original","Rearmonizado","Técnica"],[
["1","Dó Dó Sol Sol","C","C7M – A7","dominante secundária"],
["2","Lá Lá Sol","F – C","Dm7 – C7M/E","II no lugar do IV; inversão no baixo (Ré → Mi)"],
["3","Fá Fá Mi Mi","F – C","D♭7M – C7M","♭II7M (empréstimo do frígio)"],
["4","Ré Ré Dó","G7 – C","Dm7 – D♭7 – C6","II–SubV–I (o Ré da melodia vira ♭9 do D♭7, tensão aceita em dominantes)"]])}
${ouvir("C3+E3+G3+B3/h A2+G3+C#4/h D3+F3+A3+C4/h E3+G3+B3+C4/h Db3+F3+Ab3+C4/h C3+E3+G3+B3/h D3+F3+A3+C4/q Db3+F3+B3/q C3+E3+A3/h","Ouvir só a rearmonização",70)} ${ouvir("C3+E3+G3+B3+C5/q C3+E3+G3+B3+C5/q A2+G3+C#4+G5/q A2+G3+C#4+G5/q D3+F3+A3+C4+A5/q D3+F3+A3+C4+A5/q E3+G3+B3+C4+G5/h Db3+F3+Ab3+C4+F5/q Db3+F3+Ab3+C4+F5/q C3+G3+B3+E5/q C3+G3+B3+E5/q D3+F3+A3+C4+D5/q Db3+F3+B3+D5/q C3+E3+A3+C5/h","Ouvir com a melodia",70)}
${box("aten","Confira cada nota da melodia contra o acorde novo. Exemplo: no compasso 3, a melodia Fá sobre D♭7M é a 3ª do acorde, ótimo; Mi sobre C7M é a 3ª, ótimo. Se a melodia cair numa nota evitada, troque o acorde.")}
${box("ana","Rearmonizar é como trocar o figurino de um ator: é o mesmo personagem (melodia), falando o mesmo texto, mas a roupa e o cenário mudam a leitura da cena.")}
${box("prof","A rearmonização também pode partir da melodia para trás: para cada nota importante, liste todos os acordes em que ela é 1, 3, 5, 7, 9, 11 ou 13, e escolha pelo caminho da linha de baixo e pela cor desejada. Arranjadores como Johnny Alf, Tom Jobim e o próprio Almir Chediak nos songbooks (como o de Vinicius, na pasta de estudos) são grandes referências brasileiras.")}
${box("pra","Pegue um hino ou uma canção simples de 8 compassos e rearmonize usando no mínimo 3 técnicas da lista. Confira a melodia contra cada acorde.")}
${box("res","Mantenha a melodia; troque os acordes. Regra: nota da melodia = nota do acorde ou tensão boa. Ferramentas: substituição, II–V, secundárias, SubV, empréstimo, diminutos, pedal, baixo cromático.")}
`,

["Trocar G7 por D♭7 é uma técnica de...",["empréstimo modal","SubV","pedal"],1,"Substituição de trítono."],

<p>Para escrever para outros instrumentos, você precisa saber duas coisas: <b>até onde cada um vai</b> (extensão, ou tessitura) e <b>se ele lê a nota real</b> ou uma nota transposta.</p>
<h2>🔁 Instrumentos transpositores</h2>

["Trompa em Fá","Fá (5ª justa abaixo)","escreva uma 5ª justa acima"],

{t:"Escrevendo para naipe", e:"🎛️", min:"22 min", sub:"Uníssono, soli, drop 2, dobras",
goal:"escrever uma frase para 2, 3 ou 4 sopros usando as técnicas básicas de arranjo.",
body:`
<p>Um <b>naipe</b> é um grupo de instrumentos do mesmo tipo ou função (naipe de trombones, de metais, de saxofones). O mapa \"Arranjos\" lista as ferramentas principais. Aqui está cada uma explicada.</p>
${tbl(["Técnica","O que é","Efeito"],[
["<b>Uníssono</b>","todos tocam a mesma nota (mesma altura)","força, clareza"],
["<b>Oitavas / dobras</b>","a mesma melodia em oitavas diferentes","força com mais amplitude"],
["<b>Duetos</b>","duas vozes, geralmente em 3ªs ou 6ªs","doce, cantado"],
["<b>Soli</b> (bloco)","a melodia no topo e os outros instrumentos formando acordes embaixo, no mesmo ritmo","o som clássico de big band"],
["<b>Contraponto / contracanto</b>","uma linha independente contra a melodia","movimento, riqueza"],
["<b>Tutti</b>","todo o grupo junto","clímax"]])}
<h2>🧱 Vozes fechadas e drop 2</h2>
<p><b>Voz fechada</b> (close): as 4 notas do acorde dentro de uma oitava, a melodia em cima. Soa compacto, mas pode ficar \"embolado\" na região grave.</p>
<p><b>Drop 2</b>: pegue a voz fechada e jogue a <b>2ª voz de cima</b> uma oitava para baixo. O acorde \"abre\", soa mais claro e fica mais fácil de distribuir entre instrumentos.</p>
${st("G","G4+B4+D5+F5/w:fechada D4+G4+B4+F5/w:drop_2",{bpm:50,cap:"G7 com a melodia Fá no topo: voz fechada (Sol Si Ré Fá) e drop 2 (Ré desce uma oitava)"})}
<h2>📋 Princípios que valem sempre</h2>
<ul><li><b>A melodia sempre no topo</b> e clara.</li><li>Respeite a <b>tessitura</b> de cada instrumento (aula anterior).</li><li>Evite intervalos pequenos (2ªs, 3ªs) muito <b>graves</b>: soam embolados. Na região grave, use intervalos abertos (5ªs, 8ªs).</li><li>Cada voz deve ser <b>cantável</b> (condução de vozes, Módulo 3).</li><li>Alterne texturas: uníssono → soli → contracanto. Isso é o \"quadrante 8 em 8\" do o mapa.</li></ul>
${box("ana","Um naipe é um coral de instrumentos. Um bom arranjador faz o que um bom regente de coral faz: cada voz bonita sozinha, todas juntas soando como uma só.")}
${box("prof","Existem também drop 3 e drop 2+4, e técnicas como \"spread\" (aberta em várias oitavas) e voicings em quartas. Os métodos de arranjo de big band (Sammy Nestico, Rayburn Wright, Dick Lowell e Ken Pullig) são as referências clássicas; no Brasil, Ian Guest escreveu \"Arranjo – Método Prático\", em 3 volumes.")}
${box("pra","Escreva os 4 primeiros compassos de um hino para 2 trombones: primeiro em uníssono, depois em 3ªs (dueto), depois com a 2ª voz fazendo notas longas (contracanto).")}
${box("res","Uníssono, oitavas, duetos, soli, contracanto, tutti. Drop 2 = 2ª voz de cima uma oitava abaixo. Melodia no topo, respeite tessitura, evite 3ªs no grave.")}
`,

{t:"Rítmica avançada e polirritmia", e:"🥁", min:"18 min", sub:"3 contra 2, métricas irregulares, Gramani",
goal:"tocar uma polirritmia 3:2 e entender compassos irregulares.",
body:`
<h2>🔀 Polirritmia: dois ritmos ao mesmo tempo</h2>
<p><b>Polirritmia</b> é quando duas divisões diferentes do tempo acontecem juntas. A mais comum é o <b>3 contra 2</b>: três notas iguais no mesmo espaço de duas.</p>
<p>O truque para tocar: ache o <b>menor múltiplo comum</b>. 3 e 2 → 6. Conte até 6: uma mão bate em 1, 3, 5 (divide em 3); a outra bate em 1 e 4 (divide em 2).</p>
${tbl(["Contagem","1","2","3","4","5","6"],[["Mão 1 (3)","●","","●","","●",""],["Mão 2 (2)","●","","","●","",""]])}
${ouvir("C4+G5/e3 r/e3 G5/e3 C4/e3 G5/e3 r/e3 C4+G5/e3 r/e3 G5/e3 C4/e3 G5/e3 r/e3 C4+G5/e3 r/e3 G5/e3 C4/e3 G5/e3 r/e3 C4+G5/h","Ouvir 3 contra 2 (agudo = 3, grave = 2)",50)}
<h2>🔢 Compassos irregulares (assimétricos)</h2>
<p>Compassos como <b>5/8, 7/8</b> ou 5/4 misturam grupos de 2 e 3. Um 7/8 pode ser 2+2+3, 3+2+2 ou 2+3+2. Na música dos Bálcãs isso é tradicional, e compassos assim também aparecem com frequência no jazz moderno e na música instrumental contemporânea, inclusive brasileira.</p>
${st("G","C5/e*:1 G4/e C5/e*:2 G4/e C5/e*:3 G4/e G4/e",{time:"7/8",bpm:180,cap:"7/8 agrupado 2+2+3"})}
<h2>📘 Gramani e a Rítmica</h2>
<p>O livro <b>Rítmica</b>, de José Eduardo Gramani (na pasta de estudos), é uma das obras mais importantes do ensino de ritmo no Brasil. Ele propõe exercícios em que você executa <b>duas camadas rítmicas independentes</b> (por exemplo, uma com a voz e outra com as mãos), treinando a coordenação e a percepção de acentos que se deslocam.</p>
${box("dica","Comece devagar, conte alto e só junte as duas camadas quando cada uma estiver automática sozinha. Com polirritmia, velocidade vem por último.")}
${box("prof","A <b>hemíola</b> é um caso famoso de 3 contra 2 ao longo de compassos: dois compassos de 3/4 soando como três compassos de 2/4 (ou vice-versa). É muito usada em cadências barrocas e em música latino-americana (chacarera, zamba, joropo).")}
${box("pra","Batendo nas pernas: mão direita 3, mão esquerda 2, contando até 6 em voz alta, 5 minutos por dia, metrônomo marcando o ciclo inteiro.")}
${box("res","Polirritmia = divisões diferentes ao mesmo tempo. 3:2 → conte até 6. Compassos irregulares = grupos de 2 e 3 misturados.")}
`,
quiz:[
["Para tocar 3 contra 2, qual grade usar?",["4","6","5"],1,"Menor múltiplo comum de 3 e 2."],
["Na grade de 6, em quais pulsos cai a camada de 2?",["1 e 4","1 e 3","2 e 5"],0,"6 ÷ 2 = 3: pulsos 1 e 4."],
["Um 7/8 pode ser agrupado como...",["2+2+3","4+4","3+3"],0,"Soma 7: 2+2+3, 3+2+2 ou 2+3+2."]
],
pdf:[["Gramani · Rítmica",NP+"Gramani_Ritmica.pdf"],["Mato Alonso · Rítmica",NP+"manual-de-ritmica-abelardo-mato-alonsopdf.pdf"]]},

{t:"Composição instantânea: juntando tudo", e:"⚡", min:"20 min", sub:"O mapa, do começo ao fim",
goal:"ter um roteiro para improvisar e compor usando tudo o que foi estudado.",
body:`
<p>O mapa \"Composição instantânea\" é, na verdade, um resumo de todo este curso. Improvisar em alto nível é compor em tempo real, com todas estas camadas funcionando ao mesmo tempo:</p>
${tbl(["Camada do o mapa","Onde você estudou","Pergunta que ela responde"],[

["Fraseologia (motivo, semifrase, frase, período, forma)","Nível 4","Minha ideia tem começo, meio e fim?"],
["Acento métrico (notas do acorde nos tempos fortes)","Nível 4","As colunas estão no lugar?"],

["7 técnicas do instrumento","Trilha do trombone","Meu corpo executa o que eu imagino?"],
["Repertório: standard + 10 músicas por estilo","Nível 4","Que linguagem estou falando?"],
["Frases com aproximação cromática, swing","Nível 4 e 5","Tenho o sotaque do estilo?"],
["Ideias, imaginação","tudo","O que eu quero dizer?"]])}
<h2>🧭 Um roteiro para um solo de 32 compassos (AABA)</h2>
<ol><li><b>A1</b>: exponha um motivo simples, com muito espaço. Notas-guia claras.</li><li><b>A2</b>: desenvolva o motivo (sequência, mudança de ritmo).</li><li><b>B</b> (ponte): contraste. Outra região do instrumento, outro ritmo, mais cromatismo ou um pouco de outside.</li><li><b>A3</b>: clímax e resolução. Frase mais longa, chegando na tônica com clareza.</li></ol>
${box("ana","É como contar uma história: apresente o personagem (motivo), mostre ele se desenvolvendo, crie um conflito (a ponte) e dê um final satisfatório.")}
${box("dica","O mapa \"Qual o nível de aprendizado\" é a régua final: cada camada acima precisa estar no nível <b>de memória</b>, com <b>tempo de reflexo de 1 segundo</b> e <b>precisão 5x</b>. Só assim a cabeça fica livre para a camada mais importante: as ideias.")}
<h2>🎓 O que você aprendeu no Nível 5</h2>
<ul><li>SubV, empréstimo modal, diminutos, modulação.</li><li>Escalas bebop, menor melódica e seus modos, escalas simétricas, outside e sobreposição.</li><li>Condução de vozes, contraponto, formas e rearmonização.</li><li>Transposição, arranjo para naipe, polirritmia e composição instantânea.</li></ul>
${box("res","Composição instantânea = todas as camadas (harmonia, escala, padrões, ritmo, fraseologia, acento, articulação, técnica, repertório, estilo) automáticas, para a cabeça ficar livre para as ideias.")}

body:`
<p>O trombone é um instrumento da família dos <b>metais</b> (ou metais de bocal). Nessa família, quem produz a vibração não é o instrumento: é o <b>músico</b>. O caminho do som é:</p>
<ol><li>O ar sai dos pulmões.</li><li>Os <b>lábios</b>, encostados no bocal, vibram (\"zumbem\") com a passagem do ar. Isso se chama <b>buzz</b>.</li><li>A vibração entra no <b>tubo</b>, que funciona como um amplificador e um \"filtro\": ele só deixa soar com força certas notas.</li><li>A <b>campana</b> (a boca larga no fim) projeta o som para fora.</li></ol>
<h2>🎯 Por que o mesmo tubo toca várias notas?</h2>
<p>Lembra da série harmônica (Nível 3)? Um tubo de comprimento fixo só \"aceita\" as notas da série harmônica daquele comprimento. Com a vara fechada, o trombone tenor pode tocar Si♭, Fá, Si♭, Ré, Fá... Para escolher <b>qual</b> dessas notas sai, o músico muda a <b>velocidade do ar</b> e a <b>tensão dos lábios</b>: lábios mais firmes e ar mais rápido = harmônico mais agudo.</p>
${st("F","Bb2/w:Si♭ F3/w:Fá Bb3/w:Si♭ D4/w:Ré F4/w:Fá",{bpm:50,cap:"Notas da 1ª posição (vara fechada): 2º ao 6º harmônicos de Si♭"})}
<h2>📏 E para que serve a vara?</h2>
<p>Com a vara fechada, faltam muitas notas (entre Si♭ e Fá, por exemplo). A <b>vara</b> resolve isso: ao empurrá-la para fora, o tubo fica <b>mais comprido</b>, e todas as notas da série abaixam. Cada posição da vara abaixa <b>um semitom</b>. Com 7 posições, o trombone toca todas as notas cromáticas da sua extensão.</p>
${box("ana","O tubo é como uma escada: os harmônicos são os degraus (e os lábios escolhem em qual degrau pisar). A vara é um elevador que abaixa a escada inteira meio degrau por vez. Com as duas coisas juntas, você alcança qualquer altura.")}
${box("prof","O trombone tenor em Si♭ tem cerca de 2,7 metros de tubo com a vara fechada. Tecnicamente, ele não é transpositor: o \"Si♭\" do nome indica a série harmônica da 1ª posição, mas ele lê e soa em Dó, em clave de Fá (e também em clave de Dó na 4ª linha para passagens agudas). Diferente do trompete, ele é cilíndrico em boa parte do tubo (a vara) e cônico na seção da campana, o que dá o timbre característico.")}
${box("res","Lábios vibram → tubo amplifica e escolhe as notas da série harmônica → campana projeta. Lábios e ar escolhem o harmônico; a vara abaixa tudo de semitom em semitom.")}

{t:"Montar, desmontar e cuidar", e:"🧰", min:"12 min", sub:"Sem amassar, sem arranhar, sem travar",
goal:"montar e guardar o trombone com segurança e fazer a manutenção básica.",
body:`
<h2>🔧 Montagem passo a passo</h2>
<ol><li>Abra o estojo com ele deitado no chão. Pegue a <b>vara</b> primeiro, segurando pelos tubos internos (a parte fixa), com a <b>trava fechada</b>.</li><li>Apoie a ponta da vara (a curva) no chão ou num pano, na vertical, sem deixar a vara externa escorregar.</li><li>Pegue a <b>seção da campana</b> com a outra mão.</li><li>Encaixe as duas partes formando um ângulo um pouco <b>menor que 90°</b> entre a vara e a campana (ajuste ao seu conforto) e aperte a <b>porca de fixação</b> com a mão, sem força excessiva.</li><li>Coloque o <b>bocal</b> com um leve giro. <b>Nunca bata</b> o bocal para encaixar: ele pode entalar.</li></ol>
${box("aten","Os três acidentes mais comuns: (1) a vara externa escorrega e cai no chão, amassando a curva; (2) a campana bate na vara na hora de montar; (3) o bocal entala por ter sido encaixado com uma batida. Uma vara amassada fica \"presa\" e o conserto é caro. Trave sempre.")}
<h2>🧴 Lubrificação da vara</h2>
<ul><li>Opção 1: <b>creme de vara</b> + <b>borrifador de água</b>. Uma camada fina de creme nos \"pés\" da vara interna (a parte mais grossa, perto da ponta), espalhe e borrife água.</li><li>Opção 2: <b>óleo de vara</b> (algumas gotas). Não misture tipos diferentes de produto.</li><li>Na <b>bomba de afinação</b> usa-se <b>graxa</b> específica, não óleo de vara.</li></ul>
<h2>🧼 Limpeza</h2>
<ul><li>Escove os dentes (ou pelo menos enxágue a boca) antes de tocar: restos de comida vão para dentro do tubo.</li><li>Tire a água pela chave d'água sempre que o som ficar \"borbulhante\".</li><li>Limpe o bocal com escovinha e água morna toda semana.</li><li>De tempos em tempos (a cada 1 a 3 meses), dê um banho no instrumento: água <b>morna</b> (não quente, para não danificar o verniz) com um pouco de detergente neutro, escovão flexível (\"cobrinha\") dentro dos tubos, enxágue e seque bem.</li><li>Guarde sempre no estojo, com a trava fechada.</li></ul>
${box("pra","Pratique montar e desmontar 5 vezes seguidas, devagar, até ficar automático. É a primeira habilidade técnica do trombonista.")}
${box("res","Vara com trava fechada, ângulo confortável, bocal sem bater. Creme + água ou óleo na vara; graxa na bomba. Limpeza semanal do bocal e banho morno periódico.")}
`,

["O que usar na bomba de afinação?",["Óleo de vara","Graxa específica","Água"],1,"Óleo de vara é para a vara."],
["Qual o cuidado mais importante ao manusear a vara?",["Deixar sempre destravada","Manter a trava fechada para não escorregar e cair","Guardar fora do estojo"],1,"Vara que cai amassa."]

{t:"Postura e como segurar", e:"🧍", min:"14 min", sub:"Mão esquerda sustenta, mão direita guia",
goal:"segurar o trombone de forma estável, relaxada e sem tensão no corpo.",
body:`
<h2>✋ Mão esquerda: sustenta o peso</h2>
<ul><li><b>Polegar</b>: em volta da braçadeira da campana (ou no gatilho do rotor, se houver).</li><li><b>Indicador</b>: esticado por cima, apoiado no tubo perto do encaixe do bocal.</li><li><b>Médio, anelar e mindinho</b>: fecham em volta da braçadeira da vara interna (a parte fixa), logo abaixo.</li></ul>
<p>A mão esquerda faz <b>todo</b> o trabalho de segurar. O braço esquerdo fica relaxado, com o cotovelo apontando para baixo e um pouco para fora.</p>
<h2>🤏 Mão direita: só guia a vara</h2>
<ul><li>Segure a braçadeira da vara externa com o <b>polegar</b>, o <b>indicador</b> e o <b>médio</b>, <b>de leve</b>, como quem segura um lápis.</li><li>Anelar e mindinho ficam relaxados, apoiados embaixo do tubo inferior.</li><li>O pulso fica solto e flexível.</li></ul>
${box("aten","Erro número 1 de iniciantes: segurar o peso do trombone com a mão direita. Isso trava o pulso, deixa a vara lenta e imprecisa. Teste: solte a mão direita. Se o trombone cai ou balança, a mão esquerda não está segurando direito.")}
<h2>🧍 O corpo</h2>
<ul><li><b>Em pé</b>: pés afastados na largura dos ombros, peso distribuído, joelhos destravados.</li><li><b>Sentado</b>: na ponta da cadeira, costas retas sem encostar, pés no chão.</li><li><b>Cabeça</b>: reta, como se olhasse para a frente no horizonte. <b>O trombone vem até você</b>, não o contrário: não abaixe a cabeça nem estique o pescoço para alcançar o bocal.</li><li><b>Ombros</b>: soltos, para baixo. Nada de levantar os ombros ao respirar.</li><li>A vara fica aproximadamente paralela ao chão ou levemente inclinada para baixo.</li></ul>
${box("ana","Pense no trombone como um amigo apoiado no seu ombro esquerdo: a mão esquerda abraça, o corpo fica tranquilo, e a mão direita só aponta a direção.")}
${box("pra","Na frente de um espelho, segure o trombone por 2 minutos sem tocar. Confira: ombros baixos, cabeça reta, mão direita leve, cotovelos soltos. Depois tire uma foto de lado e compare com a lista.")}
${box("res","Esquerda sustenta (polegar na campana, indicador no tubo, 3 dedos na vara interna). Direita guia com 3 dedos, leve. Cabeça reta, ombros baixos, o trombone vem até você.")}
`,

{id:"tbm2", t1:"Ar &", t2:"Vibração", g:"🌬️", c:"#38bdf8", t2c:"#4cc9ff", sub:"Respiração, buzz, embocadura, primeira nota",
desc:"O som do trombone é feito de ar. Aqui está o \"motor\" (respiração), a \"palheta\" (os lábios) e o encaixe entre eles (a embocadura).",
aulas:[
{t:"Respiração para metais", e:"🫁", min:"16 min", sub:"Inspirar solto, soprar contínuo",
goal:"respirar fundo sem tensão e soprar um fluxo de ar contínuo e controlado.",
body:`
<p>O ar é o <b>combustível</b> do trombone. Quase todo problema de som, afinação e resistência começa numa respiração ruim. A boa notícia: respirar bem é simples, desde que sem tensão.</p>
<h2>⬇️ Inspiração</h2>
<ul><li>Inspire pela <b>boca</b>, com a garganta aberta, como se dissesse \"<b>ô</b>\" em silêncio. O ar deve entrar sem barulho de chiado.</li><li>Sinta o corpo expandir <b>de baixo para cima</b>: primeiro a barriga e a cintura (frente, lados e costas), depois as costelas, por último o peito.</li><li><b>Ombros parados</b>. Se os ombros sobem, o ar está ficando só na parte de cima dos pulmões, e o pescoço fica tenso.</li><li>Inspire <b>no tempo</b> da música: normalmente em um tempo, antes da entrada.</li></ul>
<h2>⬆️ Expiração (o sopro)</h2>
<ul><li>O ar sai como um fluxo <b>contínuo</b>, sem solavancos, como água numa mangueira aberta.</li><li>Para notas agudas, o ar precisa de mais <b>velocidade</b> (pense em soprar \"fino e rápido\", como para apagar uma vela longe). Para notas graves, mais <b>volume</b> e ar \"quente\" (como embaçar um vidro).</li><li>O \"<b>apoio</b>\" é o controle dos músculos do abdômen e das costelas para manter esse fluxo firme até o fim da frase. Não é travar a barriga nem prender a respiração.</li></ul>
${box("prof","Uma correção importante, porque muitos livros erram: o <b>diafragma</b> é um músculo de <b>inspiração</b>. Ele se contrai e desce quando o ar entra (por isso a barriga se expande). Na expiração ele relaxa; quem ajuda a empurrar o ar para fora de forma controlada são os músculos abdominais e intercostais. Dizer \"sopre com o diafragma\" é uma imagem popular, não uma descrição exata. O tubista Arnold Jacobs, grande referência mundial em respiração para metais, resumia sua abordagem como \"canção e vento\" (\"song and wind\"): pense na música que quer ouvir e deixe o ar fluir, sem ficar monitorando músculos.")}
<h2>🏋️ Exercícios (sem instrumento)</h2>
<ol><li><b>4 por 8</b>: com metrônomo a 60, inspire em 4 tempos e sopre em 8, com fluxo constante. Depois 4/12 e 4/16.</li><li><b>Inspiração rápida</b>: inspire em 1 tempo (como no meio da música) e sopre em 8.</li><li><b>Folha de papel</b>: segure uma folha na frente da boca e sopre mantendo a folha na mesma inclinação o tempo todo.</li></ol>
${metro(60,4)}
${box("aten","Nunca faça exercícios de respiração até ficar tonto. Se sentir tontura, pare e respire normalmente. Isso é hiperventilação.")}
${box("res","Inspire pela boca, garganta aberta, de baixo para cima, ombros parados. Sopre contínuo. Agudo = ar mais rápido; grave = ar mais volumoso. O diafragma trabalha na inspiração.")}
`,
quiz:[
["Como deve ser a inspiração?",["Pelo nariz, levantando os ombros","Pela boca, garganta aberta, expandindo de baixo para cima","Curta e com a garganta fechada"],1,"Ombros parados, corpo expandindo."],
["Para notas agudas, o ar precisa de mais...",["volume","velocidade","força nos ombros"],1,"Ar mais rápido."],
["O diafragma é um músculo principalmente de...",["expiração","inspiração","deglutição"],1,"Ele se contrai e desce na inspiração."]
],
pdf:[["Farkas · A arte de tocar metais",NP+"A arte de tocar metais - Philip Farkas.pdf"],["Aquecimento para metais (Gage)",NP+"Aquecimento para metais_.pdf"]]},

{t:"A vibração dos lábios (buzz)", e:"🐝", min:"14 min", sub:"A \"palheta\" do trombonista",
goal:"produzir um buzz estável sem bocal e com o bocal, e controlar a altura.",
body:`
<p>O <b>buzz</b> é o zumbido que os lábios fazem quando o ar passa entre eles. Nos metais, o buzz é o som original: o instrumento só o amplifica. Um buzz bom, centrado e livre gera um som bonito no trombone.</p>
<h2>1️⃣ Buzz sem bocal</h2>
<ol><li>Feche os lábios como se fosse dizer \"<b>M</b>\", de leve, com os lábios encostados (não apertados, nem enrolados para dentro).</li><li>Deixe os <b>cantos da boca firmes</b>, como uma leve \"meia careta\" (não um sorriso).</li><li>Sopre ar pelo meio. Os lábios devem vibrar fazendo um zumbido, parecido com um mosquito ou uma abelha.</li><li>Mantenha por 4 segundos com som estável.</li></ol>
${box("ana","É parecido com a \"brincadeira do motorzinho\" que as crianças fazem, só que com os lábios mais firmes e o ar passando só pelo centro, não pela boca inteira nem pelas bochechas.")}
<h2>2️⃣ Buzz no bocal</h2>
<ol><li>Segure o bocal pela haste, com dois dedos, sem pressionar contra o rosto.</li><li>Faça o buzz dentro dele. O som vai ficar mais cheio.</li><li><b>Sirene</b>: deslize do grave para o agudo e volte, sem interromper. Isso treina a flexibilidade.</li><li><b>Melodias</b>: faça buzz de melodias simples (\"Brilha, brilha\") no bocal. Se estiver afinado no bocal, estará afinado no trombone.</li></ol>
${box("aten","Buzz no bocal cansa rápido. Comece com 2 a 3 minutos por dia e aumente aos poucos, até uns 5 minutos no aquecimento. Pare se os lábios ficarem dormentes.")}
${box("prof","Muitos professores usam o buzz no bocal como diagnóstico: se o buzz é \"sujo\" (com ar vazando) ou instável, o problema de som no instrumento tem a mesma origem. O método de James Stamp e o aquecimento de John B. Gage (na pasta de estudos) usam muito o bocal isolado e notas longas.")}
${box("pra","Hoje: 1 minuto de buzz sem bocal (sons longos de 4 segundos), 2 minutos de sirenes no bocal, 1 minuto tentando fazer \"Brilha, brilha\" no bocal.")}
${box("res","Lábios de \"M\", cantos firmes, ar pelo centro. Buzz sem bocal → com bocal → sirenes → melodias. Pouco tempo por dia, todos os dias.")}
`,
quiz:[
["O que é o buzz?",["O som da campana","A vibração dos lábios produzida pelo ar","Um tipo de bocal"],1,"É o som original dos metais."],
["Como devem ficar os cantos da boca?",["Soltos e moles","Firmes, sem sorriso","Esticados num sorriso largo"],1,"Cantos firmes, centro livre para vibrar."],

],

{t:"A embocadura certa", e:"👄", min:"20 min", sub:"Lábios, cantos, dentes, queixo e bocal",
goal:"formar uma embocadura funcional, sem pressão excessiva, e reconhecer os erros comuns.",
body:`
<p><b>Embocadura</b> é o conjunto formado pelos lábios, pelos músculos em volta da boca, pelo maxilar e pela colocação do bocal. Não existe uma única embocadura perfeita para todos, porque cada pessoa tem dentes e lábios diferentes. Mas existem <b>princípios</b> que praticamente todos os bons trombonistas seguem.</p>
<h2>📋 Passo a passo</h2>
<ol>
<li><b>Lábios em \"M\"</b>: encostados de leve, úmidos (não molhados nem secos).</li>
<li><b>Cantos firmes</b>: os cantos da boca ficam firmes e levemente puxados para baixo, <b>sem sorrir</b>. O centro dos lábios fica relaxado para vibrar.</li>
<li><b>Dentes separados</b>: os dentes de cima e de baixo ficam afastados (um espaço de mais ou menos um dedo mindinho no médio; mais aberto no grave, menos no agudo). O ar precisa passar.</li>
<li><b>Queixo liso</b>: o queixo fica \"plano\" e apontando levemente para baixo, sem enrugar ou empelotar.</li>
<li><b>Bochechas sem inflar</b>: nada de \"bochecha de sapo\".</li>
<li><b>Colocação do bocal</b>: <b>centralizado na horizontal</b> (ou quase, dependendo dos dentes). Na vertical, a maioria dos trombonistas coloca <b>mais lábio de cima</b> dentro do bocal (algo próximo de 2/3 em cima e 1/3 embaixo), mas há ótimos músicos com proporções diferentes. O importante é que os dois lábios vibrem livremente.</li>
<li><b>Pressão mínima</b>: o bocal encosta com a pressão necessária para vedar o ar, e nada mais. Quem faz o trabalho é o ar e os cantos da boca.</li>
</ol>
${box("aten","<b>Pressão demais</b> é o vício mais destrutivo dos metais: machuca os lábios, corta a circulação, tira a resistência e limita os agudos. Teste: se ao tirar o bocal fica uma marca funda e vermelha, você está apertando demais. O braço esquerdo não deve \"puxar\" o trombone contra a boca.")}
${tbl(["Problema","O que acontece","Correção"],[["Sorriso (cantos esticados)","som fino, agudo difícil, cansaço","cantos firmes para baixo, como um \"M\" firme"],["Bochechas infladas","perda de controle, som sem centro","cantos firmes; pratique na frente do espelho"],["Dentes fechados","som abafado, pouco ar","abra o maxilar; pense em \"ô\" na boca"],["Queixo enrugado","instabilidade","queixo liso e \"pontudo\""],["Lábios enrolados para dentro","som abafado, vibração presa","lábios encostados naturalmente"],["Pressão excessiva","dor, pouca resistência","mais ar e cantos; menos braço"]])}
${box("prof","Philip Farkas, em \"A arte de tocar metais\" (na pasta de estudos), fotografou dezenas de músicos profissionais e mostrou que as embocaduras de sucesso variam na colocação, mas compartilham os princípios de cantos firmes, queixo liso e dentes separados. Colocações muito descentralizadas podem funcionar se forem naturais para a anatomia da pessoa. <b>Mudanças de embocadura</b> devem ser feitas com acompanhamento de um professor presencial, porque trocar a colocação sem orientação pode piorar o problema.")}
${box("pra","Na frente do espelho, sem instrumento: forme a embocadura e faça buzz por 4 segundos, 5 vezes. Depois, com o bocal, confira: centralizado? Bochechas paradas? Queixo liso? Sem marca vermelha funda?")}
${box("res","Lábios em M, cantos firmes (sem sorriso), dentes separados, queixo liso, bochechas paradas, bocal centralizado (geralmente mais lábio de cima), pressão mínima.")}
`,
quiz:[
["Como ficam os cantos da boca na embocadura?",["Esticados num sorriso","Firmes, sem sorrir","Totalmente relaxados"],1,"O sorriso é um dos erros mais comuns."],
["O que é pressão excessiva?",["Apertar demais o bocal contra os lábios","Soprar muito ar","Segurar forte com a mão esquerda"],0,"Ela machuca e tira a resistência."],
["Os dentes devem ficar...",["fechados","separados, permitindo a passagem do ar","encostados no bocal"],1,"Mais abertos no grave, menos no agudo."]
],
pdf:[["Farkas · A arte de tocar metais",NP+"A arte de tocar metais - Philip Farkas.pdf"],["Método Básico (embocadura)","Método Básico Para trombone.pdf"]]},

{t:"A primeira nota: Si♭ e Fá", e:"🎉", min:"15 min", sub:"Som bonito antes de tudo",
goal:"tocar Si♭2 e Fá3 na 1ª posição com som estável, começando e terminando bem.",
body:`
<p>Com o trombone montado, a postura certa e a embocadura formada, é hora do primeiro som. Tudo na <b>1ª posição</b> (vara totalmente fechada, mas destravada).</p>
<h2>1️⃣ Primeiro, sem língua</h2>
<ol><li>Inspire em um tempo pela boca (\"ô\").</li><li>Faça o buzz dentro do bocal, soprando um ar tranquilo e \"quente\".</li><li>Deixe o som sair <b>só com o ar</b>, sem atacar com a língua, como um \"<b>hhhô</b>\". Isso se chama <b>ataque de ar</b>.</li></ol>
<p>A nota que sai com mais facilidade costuma ser o <b>Si♭2</b> (2ª linha da clave de Fá) ou o <b>Fá3</b> (4ª linha).</p>
${st("F","Bb2/w:Si♭_(1ª_pos.) r/w F3/w:Fá_(1ª_pos.) r/w",{bpm:60,cap:"As duas primeiras notas do trombone, ambas na 1ª posição"})}
<h2>2️⃣ Depois, com a língua</h2>
<p>Quando o som sair estável, comece a nota com a língua, pronunciando \"<b>tu</b>\" (ou \"<b>du</b>\", mais suave). A língua só <b>abre a passagem</b> do ar; quem faz o som é o ar.</p>
<h2>3️⃣ Terminar bem</h2>
<p>Termine a nota <b>parando o ar</b> (como quando você para de falar), não fechando a língua com um \"t\" no final. O fim da nota deve ser limpo, sem \"cair\" a afinação.</p>
${box("dica","Grave essas primeiras notas no celular. Ouça: o som é redondo e estável, ou treme e tem ar vazando? Compare dia após dia. Ouvir a si mesmo é o treino mais honesto que existe.")}
${box("aten","Se a nota não sai: (1) confira se a vara está destravada e na 1ª posição; (2) confira se o bocal está bem encaixado; (3) sopre mais ar e mantenha o buzz; (4) não aperte o bocal. Se sai uma nota diferente (mais aguda ou grave), não tem problema: você só está em outro harmônico. Ajuste o ar (mais lento para descer, mais rápido para subir).")}
${box("pra","10 notas de Si♭2 com 4 tempos cada (metrônomo a 60), descansando 4 tempos entre elas. Depois 10 de Fá3. Depois alterne Si♭2 – Fá3 sem mexer a vara (isso já é um exercício de flexibilidade).")}
${box("res","1ª posição. Primeiro ataque de ar (\"hhhô\"), depois língua (\"tu\"). Termine parando o ar. Si♭2 e Fá3 são as primeiras notas.")}
`,
quiz:[
["Em qual posição ficam as primeiras notas (Si♭2 e Fá3)?",["1ª posição","4ª posição","7ª posição"],0,"Vara fechada (destravada)."],
["Como terminar a nota corretamente?",["Fechando a língua com um \"t\"","Parando o ar","Tirando o bocal da boca"],1,"O fim é feito pelo ar."],
["Se sai uma nota diferente da desejada, na mesma posição, o que ajustar?",["A velocidade do ar e a firmeza dos lábios","A trava","O bocal"],0,"Você está em outro harmônico."]
],
pdf:[["Da Capo · primeiras notas","Da Capo - Trombone_.pdf"],["Gagliardi · Iniciantes","Método de trombone para iniciantes - gilberto gagliardi.pdf"]]}

/* ============ TB 3 · A VARA ============ */
{id:"tbm3", t1:"A Vara", t2:"& as Posições", g:"📏", c:"#e11d2a", sub:"7 posições, como mover, série harmônica",
desc:"A vara é o que torna o trombone único. Aqui está como achar cada posição, mover com precisão e usar as posições alternativas.",
aulas:[
{t:"As 7 posições", e:"7️⃣", min:"18 min", sub:"Cada posição abaixa um semitom",
goal:"achar as 7 posições e saber as notas principais de cada uma.",
body:`
<p>O trombone tem <b>7 posições</b>. Cada vez que a vara sai para a próxima posição, todas as notas abaixam <b>um semitom</b>. Da 1ª à 7ª, são 6 semitons (um trítono) de diferença.</p>
${fig(SVG_POSICOES,"Distância aproximada de cada posição a partir da 1ª (cálculo teórico para trombone tenor em Si♭). Repare que os intervalos aumentam.")}
${box("aten","As distâncias <b>não são iguais</b>: a 2ª está um pouco mais perto da 1ª do que a 7ª da 6ª. Isso acontece porque, para abaixar um semitom, o tubo precisa crescer numa proporção (cerca de 6% do comprimento total), e o comprimento total vai aumentando. Por isso as posições mais longe ficam mais espaçadas.")}
<h2>🧭 Pontos de referência</h2>
<ul><li><b>1ª</b>: vara totalmente fechada (destravada).</li><li><b>3ª</b>: em muitos trombones tenor, um pouco antes da borda da campana.</li><li><b>4ª</b>: mais ou menos na altura da borda da campana.</li><li><b>6ª</b>: braço quase todo esticado.</li><li><b>7ª</b>: braço totalmente esticado (cuidado para a vara não escapar).</li></ul>
<p>Essas referências variam de instrumento para instrumento. Confira cada posição com um <b>afinador</b> e, principalmente, com o <b>ouvido</b>.</p>
<h2>🎼 Notas mais usadas em cada posição (harmônicos 2 a 6)</h2>
${tbl(["Posição","Harm. 2","Harm. 3","Harm. 4","Harm. 5","Harm. 6"],[
["1ª","Si♭2","Fá3","Si♭3","Ré4","Fá4"],
["2ª","Lá2","Mi3","Lá3","Dó♯4","Mi4"],
["3ª","Lá♭2","Mi♭3","Lá♭3","Dó4","Mi♭4"],
["4ª","Sol2","Ré3","Sol3","Si3","Ré4"],
["5ª","Sol♭2","Ré♭3","Sol♭3","Si♭3","Ré♭4"],
["6ª","Fá2","Dó3","Fá3","Lá3","Dó4"],
["7ª","Mi2","Si2","Mi3","Sol♯3","Si3"]])}
${st("F","Bb2/q:1ª A2/q:2ª Ab2/q:3ª G2/q:4ª Gb2/q:5ª F2/q:6ª E2/q:7ª",{bpm:60,cap:"Harmônico 2 em cada posição: descendo semitom por semitom"})}
${box("prof","Os harmônicos 5 (Ré4 na 1ª, Dó♯4 na 2ª, Dó4 na 3ª...) são naturalmente um pouco baixos em relação ao piano (cerca de 14 cents), e o harmônico 7 (Lá♭4 na 1ª, Sol4 na 2ª) é bem baixo (cerca de 31 cents). Por isso trombonistas tocam essas notas com a vara um pouco \"mais para dentro\" do que a posição padrão (na 1ª posição, onde não dá para entrar mais, ajusta-se com os lábios; alguns trombonistas afinam pela bomba de modo que a 1ª posição fique levemente fora do batente, deixando espaço para \"subir\" essas notas). O nome técnico é \"posição alta\" (raised).")}
${box("pra","Com um afinador (há aplicativos gratuitos), toque o harmônico 3 em cada posição: Fá3 (1ª), Mi3 (2ª), Mi♭3 (3ª), Ré3 (4ª), Ré♭3 (5ª), Dó3 (6ª), Si2 (7ª). Ajuste a vara até o ponteiro ficar no centro. Observe onde fica sua mão em cada posição.")}
${box("res","7 posições, cada uma um semitom abaixo da anterior; o espaçamento aumenta para fora. Confira com afinador e ouvido. Harmônicos 5 e 7 pedem vara um pouco para dentro.")}
`,
quiz:[
["Quantos semitons de diferença entre a 1ª e a 7ª posição?",["7","6","12"],1,"Cada posição = 1 semitom; 1ª→7ª = 6 semitons."],
["Em qual posição fica o Ré3?",["1ª","4ª","6ª"],1,"Harmônico 3 da 4ª posição."],
["Por que o espaço entre as posições aumenta para fora?",["Por defeito do instrumento","Porque cada semitom exige um aumento proporcional do tubo, que já está mais longo","Para ficar mais bonito"],1,"É uma proporção, não uma distância fixa."]
],
pdf:[["Tabela de posições (Yamaha)","TROMBONE_Tabela_de_digitaoDedilhado_bsicoYAMAHA.pdf"],["Tabela de posições (Weril)","TROMBONE_Tabela_de_digitaDedilhado_bsicoWERIL.pdf"]]},

{t:"Como mover a vara do jeito certo", e:"🤚", min:"18 min", sub:"Rápido, leve, no último instante",
goal:"mover a vara com precisão, velocidade e sincronia com a língua.",
body:`
<h2>🦾 De onde vem o movimento</h2>
<ul><li><b>Posições próximas</b> (1ª–2ª–3ª): movimento principalmente do <b>pulso</b> e do antebraço.</li><li><b>Posições médias</b> (4ª–5ª): antebraço, com o cotovelo abrindo.</li><li><b>Posições longe</b> (6ª–7ª): o braço inteiro, a partir do ombro, sem inclinar o corpo.</li></ul>
<p>A mão continua <b>leve</b>, segurando com três dedos. O pulso funciona como um amortecedor flexível.</p>
<h2>⚡ A regra de ouro: vara rápida, no último instante</h2>
<p>A vara deve se mover <b>o mais rápido possível</b>, mas <b>no último instante</b>, bem na hora da nota seguinte. Ela não \"passeia\" devagar durante a nota. Pense: a nota fica parada o tempo todo; a vara pula de uma posição para a outra no instante da troca.</p>
${box("ana","Pense num dedo apertando teclas de um piano: o dedo fica parado na tecla enquanto a nota soa e só troca de tecla no momento da nota seguinte, rapidinho. A vara é o seu dedo.")}
<h2>🔗 Sincronia língua + vara</h2>
<p>Em notas separadas, a vara chega na nova posição e a língua ataca a nota <b>exatamente juntas</b>. Se a língua vier antes, você ouve a nota errada por um instante; se vier depois, ouve um \"escorregão\" (glissando). Treinar essa sincronia é o principal trabalho técnico da mão direita.</p>
<h2>🚫 Erros comuns</h2>
${tbl(["Erro","Consequência","Correção"],[["Segurar a vara com força","vara lenta, imprecisa","3 dedos, leve"],["Mover o corpo junto","instabilidade da embocadura","só o braço se move"],["Vara lenta entre notas","glissando audível","movimento rápido no último instante"],["Não chegar na posição certa","desafinação","treinar com afinador; ouvir"],["Bater a vara na 1ª posição","barulho, pode danificar","parar a vara com o pulso, sem bater no batente"]])}
<h2>🏋️ Exercícios</h2>
<ol><li><b>Posições com afinador</b>: toque uma nota longa em cada posição (harmônico 2 ou 3), ajustando no afinador.</li><li><b>1ª – 4ª – 1ª</b>: Fá3 (1ª) → Ré3 (4ª) → Fá3, devagar, com a língua, depois em colcheias. Escute: há glissando entre as notas?</li><li><b>Escala cromática</b> lenta (Nível 2): passa por todas as posições em sequência.</li><li><b>Saltos longos</b>: 1ª ↔ 6ª (Fá3 – Dó3), 1ª ↔ 7ª (Si♭2 – Mi2).</li></ol>
${st("F","F3/q:1ª D3/q:4ª F3/q:1ª D3/q:4ª | Bb2/q:1ª C3/q:6ª D3/q:4ª Eb3/q:3ª | F3/w:1ª",{time:"4/4",bpm:70,cap:"Exercício de vara: 1ª–4ª e o começo da escala de Si♭"})}
${box("res","Mão leve, pulso solto. Vara rápida no último instante. Vara e língua chegam juntas. Treine com afinador e escute se há glissando.")}
`,
quiz:[
["Quando a vara deve se mover?",["Devagar, durante a nota","Rápido, no último instante, na troca de nota","Só no fim da frase"],1,"A nota fica parada; a vara pula na troca."],
["Se a língua ataca antes de a vara chegar...",["soa a nota errada por um instante","soa mais forte","não acontece nada"],0,"Por isso a sincronia é essencial."],
["Para as posições 6ª e 7ª, o movimento vem de...",["só do pulso","do braço inteiro, sem inclinar o corpo","do corpo inclinando"],1,"O corpo fica estável."]
],
pdf:[["Arban · primeiros estudos","Arbans Complete Method For The Trombone.pdf"],["Rubank Elementary","Rubank-Trombone-method-elementary.pdf"]]},

{t:"Posições alternativas", e:"🔀", min:"14 min", sub:"A mesma nota em outra posição",
goal:"usar posições alternativas para tocar trechos mais fáceis e mais ligados.",
body:`
<p>Várias notas podem ser tocadas em <b>mais de uma posição</b>, porque aparecem em harmônicos diferentes de posições diferentes. Essas são as <b>posições alternativas</b>.</p>
${tbl(["Nota","Posição comum","Alternativa","Por que funciona"],[["Fá3","1ª (harm. 3)","6ª (harm. 4)","Fá é a 8ª do Fá2 da 6ª"],["Si♭3","1ª (harm. 4)","5ª (harm. 5)","Si♭ é a 3ª maior acima do Sol♭ da 5ª"],["Ré4","1ª (harm. 5)","4ª (harm. 6)","Ré é a 5ª acima do Sol da 4ª"],["Dó4","3ª (harm. 5)","6ª (harm. 6)","Dó é a 5ª acima do Fá da 6ª"],["Lá3","2ª (harm. 4)","6ª (harm. 5)","Lá é a 3ª maior acima do Fá da 6ª"],["Si3","4ª (harm. 5)","7ª (harm. 6)","Si é a 5ª acima do Mi da 7ª"]])}
<h2>🎯 Quando usar</h2>
<ul><li><b>Evitar saltos longos de vara</b>: em Ré4 – Mi♭4 – Ré4 (1ª – 3ª – 1ª), tocar o Ré4 na 4ª deixa tudo mais perto (4ª – 3ª – 4ª).</li><li><b>Passagens rápidas</b>: menos movimento de vara = mais velocidade e precisão.</li><li><b>Legato</b>: escolher posições em que a vara vai numa direção e a nota na outra (próxima aula).</li></ul>
${st("F","Bb3/e:1ª C4/e:3ª D4/e:4ª Eb4/e:3ª D4/e:4ª C4/e:3ª Bb3/q:1ª",{bpm:90,cap:"Com Ré4 na 4ª, a vara fica entre a 3ª e a 4ª, perto uma da outra"})}
${box("aten","Posições alternativas costumam ter um timbre e uma afinação ligeiramente diferentes (notas em harmônicos mais altos, com vara mais longa, podem soar um pouco mais \"escuras\"). Treine cada uma com afinador antes de usar numa música.")}
${box("prof","No trombone com rotor de Fá, o gatilho abaixa a série para Fá, criando ainda mais opções. As mais comuns: Dó3 com rotor na 1ª (em vez da 6ª) e Si2 com rotor na \"2ª\" um pouco para fora (em vez da 7ª). Com o rotor as posições ficam mais longas e diferentes das sem rotor, e há só seis posições disponíveis.")}
${box("pra","Toque devagar: Fá3 (1ª) – Mi♭3 (3ª) – Fá3 (1ª) e depois Fá3 (6ª) – Mi♭3 (3ª) – Fá3 (6ª). Qual caminho é mais curto? Depois faça o mesmo com Ré4 (1ª vs 4ª) – Mi♭4 (3ª).")}
${box("res","Posições alternativas: Fá3 (1/6), Si♭3 (1/5), Ré4 (1/4), Dó4 (3/6), Lá3 (2/6), Si3 (4/7). Usar para evitar saltos longos e melhorar o legato; conferir afinação.")}
`,
quiz:[
["Qual é a posição alternativa do Ré4?",["4ª","2ª","7ª"],0,"Harmônico 6 da 4ª posição."],
["Por que usar posições alternativas?",["Para evitar saltos longos de vara e facilitar o legato","Porque soam sempre melhores","Para tocar mais alto"],0,"Menos movimento, mais fluidez."],
["Fá3 pode ser tocado na 1ª ou na...",["3ª","6ª","7ª"],1,"Harmônico 4 da 6ª posição."]
],
pdf:[["Tabela de posições (Yamaha)","TROMBONE_Tabela_de_digitaoDedilhado_bsicoYAMAHA.pdf"],["Lafosse · Método","metodo de trombone lafosse.pdf"]]}
]},

/* ============ TB 4 · TÉCNICA ============ */
{id:"tbm4", t1:"Técnica", t2:"do Trombone", g:"⚙️", c:"#8b5cf6", t2c:"#b18cff", sub:"Língua, legato, flexibilidade, som, registros",
desc:"As habilidades que separam um iniciante de um trombonista completo.",
aulas:[
{t:"Articulação com a língua", e:"👅", min:"16 min", sub:"Tu, du e as sílabas certas",
goal:"atacar notas com clareza usando a língua como válvula de ar, não como martelo.",
body:`
<p>A língua funciona como uma <b>válvula</b>: ela segura o ar por um instante e depois <b>solta</b>. É a soltura que dá o início claro da nota. A língua não \"empurra\" o ar nem \"bate\" no bocal.</p>
<h2>📍 Onde a língua toca</h2>
<p>A ponta da língua toca <b>atrás dos dentes de cima</b>, na região onde os dentes encontram a gengiva (ou nos próprios dentes, no grave). Como quando você fala \"<b>tu</b>\" ou \"<b>du</b>\".</p>
<h2>🔤 As sílabas</h2>
${tbl(["Sílaba","Uso"],[["<b>Tu / Tá</b>","ataque normal, claro"],["<b>Du / Dá</b>","ataque suave, notas ligadas, legato"],["<b>Lu / Lá</b>","legato ainda mais suave, especialmente no trombone"],["Vogal <b>ô / á</b>","registro grave (boca mais aberta por dentro)"],["Vogal <b>u / i</b>","registro agudo (espaço interno menor, ar mais rápido)"]])}
<h2>✂️ Staccato não é língua dura</h2>
<p>Uma nota em staccato é uma nota <b>curta</b>, com espaço depois. O começo continua com a mesma língua leve; o que muda é a <b>duração</b>. Para terminar, pare o ar (ou a língua volta para a posição de \"tu\" suavemente em passagens rápidas). Staccato com língua pesada soa agressivo e cansa.</p>
${box("ana","Pense na língua como alguém abrindo uma torneira que já está com pressão de água: basta girar e a água sai. Você não precisa \"empurrar\" a água com a mão.")}
<h2>🏋️ Exercícios</h2>
<ol><li><b>Uma nota, 4 semínimas + 1 semibreve</b>: Fá3 com \"tu tu tu tu tuuuu\". O som das semínimas deve ser igual ao começo da semibreve.</li><li><b>Colcheias</b>: mesmo exercício com colcheias, metrônomo a 60 → 100.</li><li><b>Tu × du</b>: alterne compassos com \"tu\" e com \"du\", ouvindo a diferença.</li></ol>
${st("F","F3/q F3/q F3/q F3/q | F3/w | F3/e F3/e F3/e F3/e F3/e F3/e F3/e F3/e | F3/w",{time:"4/4",bpm:72,cap:"Exercício de articulação na 1ª posição"})}
${box("prof","O ar deve estar \"pronto\" (com pressão atrás da língua) antes do ataque. Se o ar só começa depois da língua, a nota sai atrasada e sem centro. Muitos professores descrevem: \"a língua sai do caminho do ar\".")}
${box("res","Língua = válvula que solta o ar. Ponta atrás dos dentes de cima. Tu (normal), du (suave), lu (legato). Staccato = curto, não duro.")}
`,
quiz:[
["Qual a função da língua no ataque?",["Empurrar o ar","Soltar o ar, como uma válvula","Morder o bocal"],1,"Ela abre a passagem."],
["Qual sílaba é mais usada para legato no trombone?",["Tá","Du ou lu","Ká"],1,"Ataque suave."],
["Staccato significa...",["língua mais forte","nota curta, com espaço depois","nota mais aguda"],1,"Muda a duração, não a força da língua."]
],
pdf:[["Arban · articulação","Arbans Complete Method For The Trombone.pdf"],["Farkas · A arte de tocar metais",NP+"A arte de tocar metais - Philip Farkas.pdf"]]},

{t:"Legato sem glissando", e:"🌊", min:"18 min", sub:"O desafio único do trombone",
goal:"tocar notas ligadas sem o \"escorregão\" da vara.",
body:`
<p>Em outros instrumentos de sopro, ligar notas é só não usar a língua. No trombone, se você mover a vara com o ar soando e sem língua, ouve-se o som <b>escorregando</b> entre as notas: um <b>glissando</b>. Às vezes isso é um efeito desejado (no jazz, no samba), mas no legato normal ele precisa ser evitado.</p>
${ouvir("F3/h F3/e3 E3/e3 Eb3/e3 D3/h","Com glissando (indesejado no legato)",80)} ${ouvir("F3/h D3/h","Legato limpo",80)}
<h2>🔑 As duas soluções</h2>
<h3>1. Legato de língua suave</h3>
<p>Mantenha o ar <b>contínuo</b> e, a cada nota nova, toque a língua de leve, com \"<b>du</b>\" ou \"<b>lu</b>\", exatamente quando a vara chega. A língua mal interrompe o ar; ela só esconde o deslize da vara. A vara precisa se mover muito rápido.</p>
<h3>2. Legato natural (\"contra a vara\")</h3>
<p>Quando a nota <b>sobe</b> enquanto a vara <b>sai</b> (ou a nota desce enquanto a vara entra), a mudança acontece para outro harmônico, e os lábios fazem a \"quebra\" naturalmente, sem glissando. Aí dá para ligar <b>sem língua</b>.</p>
${tbl(["Movimento","Nota","Vara","Resultado sem língua"],[["Fá3 (1ª) → Sol3 (4ª)","sobe","sai","ligadura natural ✅"],["Ré3 (4ª) → Fá3 (1ª)","sobe","entra","glissando ❌ (use \"du\")"],["Mi♭3 (3ª) → Ré3 (4ª)","desce","sai","glissando ❌ (use \"du\")"],["Si♭3 (1ª) → Lá3 (2ª)","desce","sai","glissando ❌ (use \"du\")"],["Sol3 (4ª) → Fá3 (1ª)","desce","entra","ligadura natural ✅"]])}
${box("ana","Imagine escorregar num escorregador: se você desce pelo escorregador (vara e nota indo no mesmo sentido), você desliza. Se você pula de um degrau para outro de uma escada (troca de harmônico), não tem escorregão.")}
${box("dica","Os <b>Melodious Etudes</b> de Rochut (baseados nos vocalises de Bordogni, na pasta de estudos) são o estudo clássico de legato do trombone. Comece por eles quando dominar o básico. O objetivo é soar como um cantor.")}
${box("pra","Toque uma escala de Si♭ maior lenta, em legato com \"du\". Grave e ouça: tem glissando entre alguma nota? Onde tiver, vara mais rápida e língua mais sincronizada.")}
${box("res","Legato no trombone: ar contínuo + língua suave (du/lu) no instante em que a vara chega, ou ligadura natural quando vara e nota vão em sentidos opostos entre harmônicos.")}
`,
quiz:[
["Por que o trombone precisa de língua suave no legato?",["Para tocar mais alto","Para evitar o glissando da vara","Para cansar menos"],1,"Sem língua, o deslize da vara aparece."],
["Quando a ligadura natural (sem língua) funciona?",["Quando a nota e a vara vão em sentidos opostos entre harmônicos","Sempre","Nunca"],0,"A troca de harmônico evita o glissando."],
["Qual método é o clássico estudo de legato?",["Clarke","Rochut (Bordogni)","Real Book"],1,"Melodious Etudes."]
],
pdf:[["Rochut · Melodious Etudes","Joannes Rochut - Melodious Etudes for Trombone.pdf"]]},

{t:"Flexibilidade (lip slurs)", e:"🤸", min:"16 min", sub:"Mudar de harmônico sem mexer a vara",
goal:"trocar de harmônico na mesma posição com ar e vogal, sem pressão.",
body:`
<p><b>Flexibilidade</b> é a capacidade de passar de um harmônico para outro <b>na mesma posição</b>, ligado, sem usar a língua. É o exercício que mais desenvolve a embocadura, a resistência e a extensão.</p>
<h2>🔧 Como fazer</h2>
<ul><li>A vara fica <b>parada</b>.</li><li>Para <b>subir</b>: ar mais <b>rápido</b> e vogal mais fechada (\"ô → i\"), cantos firmes. Para <b>descer</b>: ar mais <b>lento e quente</b>, vogal mais aberta (\"i → ô\"), maxilar um pouco mais aberto.</li><li><b>Não use pressão</b> do bocal para subir. Se precisar apertar, você está forçando.</li></ul>
${st("F","Bb2/h F3/h | Bb3/h F3/h | Bb2/w",{time:"4/4",bpm:66,cap:"Flexibilidade na 1ª posição: Si♭2 – Fá3 – Si♭3 – Fá3 – Si♭2 (sem mexer a vara)"})}
<h2>📈 Progressão</h2>
<ol><li>Dois harmônicos (Si♭2 – Fá3), mínimas, lento.</li><li>Três harmônicos (Si♭2 – Fá3 – Si♭3).</li><li>Repita em <b>todas as 7 posições</b>, descendo: 1ª, 2ª, 3ª...</li><li>Aumente a velocidade (semínimas, colcheias) e depois acrescente o 5º harmônico (Ré4 na 1ª).</li></ol>
${st("F","Bb2/e F3/e Bb3/e F3/e A2/e E3/e A3/e E3/e | Ab2/e Eb3/e Ab3/e Eb3/e G2/e D3/e G3/e D3/e",{time:"4/4",bpm:72,cap:"A mesma figura descendo pelas posições 1ª, 2ª, 3ª e 4ª"})}
${box("aten","Faça pausas. Flexibilidade cansa a musculatura em volta da boca. Descanse tanto quanto toca (ex.: toque 30 segundos, descanse 30).")}
${box("prof","Os livros de flexibilidade mais usados no mundo incluem os de Charles Colin (\"Advanced Lip Flexibilities\") e os exercícios de Brad Edwards. Na sua pasta, os estudos de ligados do Arban e o aquecimento de Gage já trazem o essencial.")}
${box("res","Vara parada. Subir: ar rápido + vogal fechada. Descer: ar quente + vogal aberta. Sem pressão. Repetir em todas as posições, com descanso.")}
`,
quiz:[
["Na flexibilidade, o que fica parado?",["A língua","A vara","O ar"],1,"Troca-se de harmônico sem mexer a vara."],
["Para subir de harmônico, você usa...",["mais pressão do bocal","ar mais rápido e vogal mais fechada","a língua"],1,"Nunca pressão."],
["Por que fazer pausas no estudo de flexibilidade?",["Porque cansa a musculatura","Porque o trombone esquenta","Porque é regra de banda"],0,"Descanso evita lesões e vícios."]
],
pdf:[["Arban · ligados","Arbans Complete Method For The Trombone.pdf"],["Aquecimento para metais (Gage)",NP+"Aquecimento para metais_.pdf"]]},

{t:"Notas longas, afinação e som", e:"🎯", min:"16 min", sub:"O exercício mais importante do dia",
goal:"desenvolver um som bonito e afinado com notas longas e afinador.",
body:`
<p>Todo grande trombonista faz <b>notas longas</b> todos os dias. É o exercício que constrói o <b>som</b>: redondo, estável, sem ar vazando, afinado do começo ao fim.</p>
<h2>🎯 Como fazer</h2>
<ol><li>Escolha uma nota confortável (Fá3, Si♭2).</li><li>Metrônomo a 60. Inspire em 1 tempo e toque 8 tempos.</li><li>Foque em: começo limpo, som igual do início ao fim, final limpo (parando o ar).</li><li>Descanse 4 tempos. Suba ou desça uma nota. Repita.</li></ol>
<h2>🎚️ Variações</h2>
<ul><li><b>Dinâmica</b>: 8 tempos em <i>p</i>, depois <i>mf</i>, depois <i>f</i>. Depois crescendo e diminuendo numa nota só (\"nota em forma de diamante\": <i>p</i> &lt; <i>f</i> &gt; <i>p</i>).</li><li><b>Com drone</b>: toque junto com uma nota fixa (um aplicativo de drone ou um teclado segurando a tônica). Ouça os \"batimentos\" quando está desafinado e ajuste a vara até eles sumirem.</li><li><b>Com afinador</b>: mantenha o ponteiro no centro, mas <b>não olhe o tempo todo</b>: toque, olhe, feche os olhos, ajuste pelo ouvido, olhe de novo.</li></ul>
<h2>🔧 Afinando o instrumento</h2>
<p>Antes de tocar em grupo, aqueça por uns minutos (o instrumento frio soa mais baixo) e afine pela <b>bomba de afinação</b>: toque o Si♭3 (ou Fá3) na 1ª posição com o afinador; se estiver alto, puxe a bomba para fora; se estiver baixo, empurre para dentro.</p>
${box("ana","O som é a sua \"voz\" no instrumento. As pessoas reconhecem cantores pela voz antes de qualquer outra coisa. Notas longas são o treino dessa voz.")}
${box("dica","Tenha um <b>modelo de som</b>: ouça gravações de trombonistas que você admira antes de estudar. O cérebro tenta copiar o som que ele tem na memória.")}
${box("res","Notas longas todo dia: começo, meio e fim limpos. Varie a dinâmica, use drone e afinador (sem depender dele). Afine pela bomba depois de aquecer.")}
`,
quiz:[
["Qual o principal objetivo das notas longas?",["Tocar rápido","Desenvolver um som estável, bonito e afinado","Decorar posições"],1,"É o treino do som."],
["O instrumento está alto no afinador. O que fazer com a bomba de afinação?",["Empurrar para dentro","Puxar para fora","Nada"],1,"Tubo mais longo = som mais baixo."],
["Como usar o afinador sem ficar dependente?",["Olhar o tempo todo","Alternar: tocar, olhar, ajustar de ouvido, conferir","Nunca usar"],1,"O objetivo é treinar o ouvido."]
],
pdf:[["Aquecimento para metais (Gage)",NP+"Aquecimento para metais_.pdf"],["David Felter · aquecimento","TROMBONE_ESTUDOSAquecimento_David_Felter.pdf"]]},

{t:"Agudo, grave e notas pedais", e:"📶", min:"18 min", sub:"Expandindo a extensão",
goal:"expandir a extensão para cima e para baixo sem pressão nem tensão.",
body:`
<h2>⬆️ Registro agudo</h2>
<ul><li><b>Ar mais rápido</b>, não mais pressão. Pense em soprar \"fino e rápido\".</li><li><b>Vogal mais fechada</b> (\"i\"): a língua sobe um pouco na boca e o espaço diminui, acelerando o ar.</li><li><b>Cantos mais firmes</b>, abertura dos lábios um pouco menor.</li><li>Suba <b>aos poucos</b>: meio tom por semana é um ótimo ritmo. Use a flexibilidade como caminho (Si♭3 → Ré4 → Fá4 na 1ª).</li></ul>
<h2>⬇️ Registro grave</h2>
<ul><li><b>Mais volume de ar</b>, ar \"quente\".</li><li><b>Vogal aberta</b> (\"ô\"), maxilar mais aberto, dentes mais separados.</li><li>Lábios mais relaxados (mas cantos ainda firmes), para vibrar mais devagar.</li><li>Evite \"pular\" a embocadura para outra posição no rosto ao descer.</li></ul>
<h2>🦕 Notas pedais</h2>
<p>Abaixo do Mi2 (7ª posição), o trombone tem as <b>notas pedais</b>: o harmônico 1 de cada posição. O pedal mais fácil é o <b>Si♭1</b>, na 1ª posição. Elas soam graves e \"cheias\" e exigem lábios bem soltos e muito ar.</p>
${st("F","Bb2/h:Si♭2 F2/h | Bb1/w:Si♭1_pedal",{bpm:60,playNotes:"Bb2/h F2/h Bb1/w",cap:"Descendo até o pedal Si♭1 (1ª posição)"})}
${box("prof","Muitos professores usam notas pedais no aquecimento e no desaquecimento porque elas relaxam a embocadura e ensinam a usar muito ar sem pressão. Um exercício clássico é tocar uma frase no médio e repeti-la uma oitava abaixo, chegando no pedal, mantendo a mesma embocadura.")}
${box("aten","Não force o agudo. Dor nos lábios, som \"espremido\" ou marca funda do bocal são sinais de que você está compensando falta de ar com pressão. Volte para a região confortável e reconstrua devagar.")}
${box("res","Agudo: ar rápido, vogal \"i\", cantos firmes, sem pressão, meio tom por semana. Grave: muito ar quente, vogal \"ô\", maxilar aberto. Pedal Si♭1 na 1ª posição.")}
`,
quiz:[
["O que mais ajuda a tocar agudo?",["Apertar o bocal","Ar mais rápido e vogal mais fechada","Tocar mais baixinho"],1,"Velocidade do ar, não pressão."],
["Qual é o pedal mais fácil do trombone?",["Si♭1 na 1ª posição","Mi2 na 7ª","Fá3 na 1ª"],0,"O harmônico 1 da 1ª posição."],
["No grave, a vogal deve ser...",["\"i\"","\"ô\"","\"é\""],1,"Espaço interno maior."]
],
pdf:[["Arban · Complete Method","Arbans Complete Method For The Trombone.pdf"],["Clarke · Technical Studies","Tecknical Studies - H. Clarke.pdf"]]},

{t:"Língua dupla e tripla", e:"⚡", min:"14 min", sub:"Para passagens muito rápidas",
goal:"entender e começar a praticar a língua dupla e a tripla.",
body:`
<p>Em andamentos muito rápidos, a língua simples (\"tu tu tu\") não dá conta. A solução é alternar a ponta da língua com o <b>fundo da língua</b>, que toca o céu da boca como no som \"k\".</p>
${tbl(["Técnica","Sílabas","Uso"],[["Língua simples","tu tu tu tu","andamentos normais"],["<b>Língua dupla</b>","tu-ku tu-ku (ou du-gu, mais suave)","grupos de 2 e 4 muito rápidos"],["<b>Língua tripla</b>","tu-tu-ku tu-tu-ku (ou tu-ku-tu tu-ku-tu)","tercinas e grupos de 3 rápidos"]])}
<h2>🏋️ Como treinar</h2>
<ol><li><b>Sem instrumento</b>: fale \"ku ku ku\" até o \"k\" ficar claro e forte como o \"t\".</li><li><b>No bocal ou no trombone, só \"ku\"</b>: uma nota, semínimas lentas, só com \"ku\". O som deve ser igual ao do \"tu\".</li><li><b>Alternando</b>: \"tu-ku\" em colcheias lentas (metrônomo a 60), numa nota só.</li><li>Aumente a velocidade aos poucos e depois leve para escalas.</li></ol>
${box("aten","O \"ku\" costuma ser mais fraco no começo. O objetivo é que ninguém consiga ouvir diferença entre as notas atacadas com \"tu\" e com \"ku\". Isso leva semanas ou meses: é normal.")}
${box("dica","O Arban tem uma seção inteira de língua dupla e tripla. Faça quando já estiver seguro na língua simples e no legato.")}
${box("res","Dupla: tu-ku. Tripla: tu-tu-ku. Treine o \"ku\" sozinho até igualar ao \"tu\"; depois alterne, devagar, numa nota, e só então acelere.")}
`,
quiz:[
["Quais sílabas formam a língua dupla?",["tu-tu","tu-ku","la-la"],1,"Ponta + fundo da língua."],
["Qual o primeiro passo para treinar?",["Tocar escalas rápidas","Fazer o \"ku\" sozinho soar igual ao \"tu\"","Tocar agudo"],1,"Equilibrar as duas sílabas."],
["A língua tripla é usada em...",["grupos de 3 rápidos (tercinas)","notas longas","legato"],0,"tu-tu-ku."]
],
pdf:[["Arban · língua dupla e tripla","Arbans Complete Method For The Trombone.pdf"]]}
]},

/* ============ TB 5 · ROTINA ============ */
{id:"tbm5", t1:"Rotina &", t2:"Repertório", g:"📅", c:"#22c55e", t2c:"#3cff7a", sub:"Aquecimento, rotina, escalas, problemas, caminho",
desc:"Como organizar o estudo diário, resolver os problemas mais comuns e qual caminho de métodos e repertório seguir.",
aulas:[
{t:"Aquecimento completo (15 a 20 min)", e:"🔥", min:"10 min", sub:"A mesma sequência, todo dia",
goal:"ter uma sequência de aquecimento fixa, curta e completa.",
body:`
<p>O aquecimento prepara o corpo (lábios, respiração, língua, braço) e o ouvido. Ele deve ser <b>sempre parecido</b>, para você perceber como está o seu dia.</p>
${tbl(["#","Etapa","Tempo","O quê"],[["1","Respiração","2 min","4/8 e 4/12 sem instrumento (aula de respiração)"],["2","Buzz","2 min","sem bocal, depois sirenes no bocal"],["3","Notas longas","4 min","mínimas em legato, com \"du\", do Fá3 descendo cromaticamente até o Si♭2 (como o Gage)"],["4","Flexibilidade","4 min","Si♭2 – Fá3 – Si♭3 nas 7 posições"],["5","Articulação","3 min","\"tu\" e \"du\" numa nota, semínimas e colcheias"],["6","Escala","3 min","Si♭ maior, legato e staccato"],["7","(opcional) Pedais","1 min","descer até o Si♭1 para relaxar"]])}
${box("dica","O mapa de rotina tinha \"10 min de notas longas + 10 min de flexibilidade + 10 min de escalas\". É uma ótima versão estendida (30 minutos) para dias com mais tempo. O modelo acima é a versão curta.")}
${box("aten","Aquecimento não é hora de tocar agudo e forte. Tudo em dinâmica média, na região confortável, com calma.")}
${box("res","Respiração → buzz → notas longas → flexibilidade → articulação → escala (→ pedais). 15-20 minutos, todo dia, igual.")}
`,
quiz:[
["Qual a primeira etapa do aquecimento?",["Escalas rápidas","Respiração","Agudos"],1,"Primeiro o motor: o ar."],
["O aquecimento deve ser...",["diferente todo dia","sempre parecido, para comparar os dias","só antes de concertos"],1,"Consistência permite perceber o seu estado."],
["O que evitar no aquecimento?",["Notas longas","Agudo e forte logo de início","Buzz"],1,"Aquecer com calma."]
],
pdf:[["Aquecimento para metais (Gage)",NP+"Aquecimento para metais_.pdf"],["David Felter · aquecimento","TROMBONE_ESTUDOSAquecimento_David_Felter.pdf"]]},

{t:"Rotina diária por nível", e:"🗓️", min:"12 min", sub:"30, 60 ou 90 minutos",
goal:"montar uma rotina diária equilibrada para o seu nível.",
body:`
${tbl(["Bloco","Iniciante (30 min)","Intermediário (60 min)","Avançado (90+ min)"],[
["Aquecimento","10","15","20"],
["Técnica (escalas, arpejos, flexibilidade)","5","15","20"],
["Método / estudos","10 (Da Capo, Gagliardi)","15 (Arban, Rubank, BandFolio)","20 (Rochut, Clarke, Hering, Arban avançado)"],
["Leitura / solfejo","—","5","10"],
["Repertório / improviso","5","10","20+"]])}
<h2>📐 Princípios</h2>
<ul><li><b>Descanse tanto quanto toca</b>: nos metais, a regra popular é tocar alguns minutos e descansar alguns minutos. Lábio cansado aprende vício.</li><li><b>Divida</b>: 2 sessões de 30 minutos rendem mais que 1 de 60.</li><li><b>Toda sessão termina com música</b>: algo que você gosta de tocar.</li><li><b>Grave</b> pelo menos uma vez por semana (o mapa \"Gravar vídeo\").</li><li>Siga o <b>teste dos 5x</b> (do Nível 0 do seu método) antes de avançar num exercício.</li></ul>
${box("ana","Treinar música é como treinar um esporte: aquecimento, fundamentos, jogo. E a musculatura cresce no descanso, não só no treino.")}
${box("res","Aquecimento + técnica + método + leitura + música. Descansar tanto quanto tocar. Duas sessões curtas valem mais que uma longa.")}
`,
quiz:[
["Qual o princípio de descanso nos metais?",["Tocar sem parar","Descansar tanto quanto toca","Descansar só no fim"],1,"Lábio cansado aprende vício."],
["Como terminar cada sessão?",["Com escalas","Com música que você gosta","Com agudos fortes"],1,"Mantém a motivação."],
["O que rende mais?",["1 sessão de 60 min","2 sessões de 30 min","Tanto faz"],1,"Sessões menores, mais concentradas."]
],
pdf:[["Mapa: Rotina de Evolução","Screenshot_20220702-102430.png"]]},

{t:"Escalas no trombone", e:"🪜", min:"18 min", sub:"Si♭, Fá, Mi♭ e a cromática, com posições",
goal:"tocar as escalas mais usadas com as posições corretas.",
body:`
<h2>Si♭ maior (a primeira)</h2>
${st("F","Bb2/q:1 C3/q:6 D3/q:4 Eb3/q:3 F3/q:1 G3/q:4 A3/q:2 Bb3/q:1",{bpm:80,cap:"Números = posições"})}
<h2>Fá maior (grave)</h2>
${st("F","F2/q:6 G2/q:4 A2/q:2 Bb2/q:1 C3/q:6 D3/q:4 E3/q:2 F3/q:1",{bpm:80})}
<h2>Mi♭ maior</h2>

<script>
/* Trombone: imagens, exercícios de ar/vibração/embocadura e módulos de partituras */
(function(){
const TB = CURSO.find(l=>l.id==="tb");
/* posição da vara de cada nota (posição mais usada) */
const POS={Bb1:1,E2:7,F2:6,Gb2:5,"F#2":5,G2:4,Ab2:3,"G#2":3,A2:2,Bb2:1,B2:7,C3:6,Db3:5,"C#3":5,D3:4,Eb3:3,"D#3":3,E3:2,F3:1,Gb3:5,"F#3":5,G3:4,Ab3:3,"G#3":3,A3:2,Bb3:1,B3:4,C4:3,Db4:2,"C#4":2,D4:1,Eb4:3,E4:2,F4:1,G4:4,Ab4:3,A4:2,Bb4:1};
/* acrescenta a posição embaixo de cada nota que não tem legenda */
const tp = s => s.trim().split(/\s+/).map(t=>{ if(/^[|:]+$/.test(t)||t.startsWith("r/")||t.includes(":")) return t; const p=t.split("/")[0].replace("*",""); return POS[p]? t+":"+POS[p] : t; }).join(" ");
const X = (notes,o)=>st("F",tp(notes),Object.assign({time:"4/4",bpm:60},o||{}));
const Xn = (notes,o)=>st("F",notes,Object.assign({time:"4/4",bpm:60},o||{}));
const NOTA = `<p style="font-size:14px;color:#a1a1aa">Os números embaixo das notas são as <b>posições da vara</b>. Use 🐢 Lento para aprender, Normal para estudar e 🐇 Rápido como meta. O 🔔 Metrônomo dá um compasso de contagem antes de começar.</p>`;

/* ---------- imagens nas aulas existentes ---------- */
const m1 = TB.mods[0].aulas;
m1[0].body = foto("tbfoto","Trombone tenor com rotor (figura do Método Básico para Trombone, da pasta de estudos)",120) + m1[0].body;
m1[1].body = foto("tbpartes","As partes do trombone de vara (figura do Método Básico para Trombone)",460) + m1[1].body.replace("<h2>🔍 As partes do bocal</h2>","<h2>🔍 As partes do bocal</h2>"+foto("bocal","O bocal em corte: borda (aro), copo (bojo), garganta, backbore e haste",200));

/* ---------- módulo Ar & Vibração: aulas reescritas ---------- */
const respiracao = {t:"Respiração: os 2 melhores exercícios", e:"🫁", min:"20 min", sub:"Inspirar solto, soprar contínuo",
goal:"respirar fundo sem tensão e soprar um fluxo de ar contínuo, praticando dois exercícios diários.",
body:`
<p>O ar é o <b>combustível</b> do trombone. Quase todo problema de som, afinação e resistência começa numa respiração ruim. Respirar bem é simples, desde que sem tensão.</p>
${ill("respiracao","Na inspiração o corpo se expande de baixo para cima e o diafragma desce. Na expiração o abdômen conduz o ar e o diafragma relaxa e sobe. Os ombros ficam parados.")}
${foto("diafragma","Os pulmões antes e depois de o diafragma se contrair: a parte escura mostra o aumento da capacidade (figura do Método Básico para Trombone, da pasta de estudos)",330)}
<h2>⬇️ Como inspirar</h2>
<ul><li>Pela <b>boca</b>, com a garganta aberta, como se dissesse \"<b>ô</b>\" em silêncio. O ar entra sem barulho de chiado.</li><li>O corpo expande <b>de baixo para cima</b>: barriga e cintura (frente, lados e costas), depois as costelas, por último o peito.</li><li><b>Ombros parados</b>. Se os ombros sobem, o ar ficou só na parte de cima e o pescoço ficou tenso.</li></ul>
<h2>⬆️ Como soprar</h2>
<ul><li>Fluxo <b>contínuo</b>, sem solavancos, como água numa mangueira aberta.</li><li>Notas agudas: ar mais <b>rápido</b> e fino (como apagar uma vela de longe). Notas graves: ar mais <b>volumoso</b> e \"quente\" (como embaçar um vidro).</li><li>O \"<b>apoio</b>\" é o controle dos músculos do abdômen e das costelas para manter o fluxo firme até o fim da frase. Não é travar a barriga.</li></ul>

<h2>🏆 Exercício 1 · Respiração em tempos (4 por 4 → 4 por 16)</h2>
<p><b>Para que serve:</b> aumentar a capacidade e o controle do fluxo. É o exercício de respiração mais usado por professores de metais.</p>
<ol><li>Ligue o metrônomo abaixo em <b>60 bpm</b>. Fique em pé ou sentado, costas retas.</li><li><b>Inspire em 4 tempos</b> pela boca (\"ô\"), enchendo de baixo para cima.</li><li><b>Sopre em 4 tempos</b> com o som \"<b>ssss</b>\" ou \"<b>ffff</b>\", com a mesma força do começo ao fim, esvaziando tudo exatamente no tempo 4.</li><li>Repita 4 vezes. Depois mude a conta, como na tabela.</li></ol>
${tbl(["Etapa","Inspira","Sopra","Repetições"],[["1","4 tempos","4 tempos","4"],["2","4 tempos","8 tempos","4"],["3","4 tempos","12 tempos","3"],["4","4 tempos","16 tempos","3"],["5 (avançado)","2 tempos","16 tempos","3"]])}
${st("none","r/w:INSPIRA_(1_2_3_4) | x/w:SOPRA_ssss_(1_2_3_4) x/w:(5_6_7_8)",{play:false,spacing:150,cap:"Etapa 2 como partitura: um compasso de pausa (inspiração) e dois compassos de sopro"})}
${metro(60,4)}
${box("dica","Coloque uma mão na barriga e outra nas costas, na altura da cintura: as duas devem se afastar quando você inspira. Se só o peito sobe, recomece mais devagar.")}

<h2>🏆 Exercício 2 · Inspiração rápida + sopro longo (o da música real)</h2>
<p><b>Para que serve:</b> na música você quase nunca tem 4 tempos para respirar. Este exercício treina encher os pulmões em <b>1 tempo</b> e tocar uma frase longa.</p>
<ol><li>Metrônomo em <b>60 bpm</b>.</li><li>Conte \"1, 2, 3\" e <b>inspire rápido no tempo 4</b> (boca em \"ô\", garganta aberta, sem barulho).</li><li><b>Sopre 8 tempos</b> com fluxo constante.</li><li>No oitavo tempo, inspire de novo em 1 tempo e repita, sem parar, 6 vezes.</li><li>Variação com papel: segure uma folha a um palmo da boca e sopre mantendo a folha <b>na mesma inclinação</b> os 8 tempos. Se a folha balança, o ar não está constante.</li></ol>
${st("none","r/q:1 r/q:2 r/q:3 r/q*:INSPIRA | x/w:SOPRA_(8_tempos) x/h. r/q*:INSPIRA",{play:false,spacing:90,cap:"Inspire só no último tempo e sopre a frase inteira"})}
${box("aten","Nunca faça exercícios de respiração até ficar tonto. Se sentir tontura, pare, sente e respire normalmente: é sinal de excesso de oxigenação (hiperventilação). Faça poucas repetições e aumente aos poucos.")}
${box("prof","Uma correção importante, porque muitos livros erram: o <b>diafragma</b> é um músculo de <b>inspiração</b>. Ele se contrai e desce quando o ar entra (por isso a barriga se expande). Na expiração ele relaxa; quem conduz o ar para fora de forma controlada são os músculos abdominais e intercostais. Dizer \"sopre com o diafragma\" é uma imagem popular, não uma descrição exata. O tubista Arnold Jacobs, referência mundial em respiração para metais, resumia sua abordagem como \"canção e vento\": pense no som que quer ouvir e deixe o ar fluir, sem ficar vigiando músculos.")}
${box("res","Inspire pela boca em \"ô\", de baixo para cima, ombros parados. Exercício 1: 4 por 4 até 4 por 16. Exercício 2: inspira em 1 tempo, sopra 8. Todo dia, 3 a 5 minutos, antes de pegar o trombone.")}

const vibracao = {t:"Vibração dos lábios: 2 exercícios de buzz", e:"🐝", min:"18 min", sub:"A \"palheta\" do trombonista",
goal:"produzir um buzz estável sem bocal e com o bocal, e controlar a altura.",
body:`
<p>O <b>buzz</b> é o zumbido que os lábios fazem quando o ar passa entre eles. Nos metais, o buzz é o som original: o instrumento só amplifica. Um buzz centrado e livre gera um som bonito no trombone.</p>
<h2>👄 Como fazer os lábios vibrarem</h2>
<ol><li>Feche os lábios como se fosse dizer \"<b>M</b>\": encostados de leve, nem apertados nem enrolados para dentro.</li><li>Deixe os <b>cantos da boca firmes</b>, sem sorrir.</li><li>Sopre o ar pelo <b>centro</b>. Os lábios vibram e fazem um zumbido, parecido com o de uma abelha.</li></ol>
${box("ana","É parecido com a \"brincadeira do motorzinho\" que as crianças fazem, só que com os lábios mais firmes e o ar passando só pelo centro, não pela boca inteira nem pelas bochechas.")}

<h2>🏆 Exercício 1 · Notas longas de buzz (primeiro sem bocal, depois no bocal)</h2>
<p><b>Para que serve:</b> firmar os cantos da boca e acostumar o centro dos lábios a vibrar com pouco esforço.</p>
<ol><li><b>Sem bocal:</b> faça o zumbido por 4 tempos, descanse 4 tempos. Repita 4 vezes. O som deve ser contínuo, sem falhar.</li><li><b>No bocal:</b> segure o bocal pela haste, com dois dedos, sem pressionar contra o rosto. Repita o mesmo: 4 tempos de som, 4 de descanso.</li><li>Clique em <b>Ouvir</b> para ter a nota de referência (Fá) e tente zumbir na mesma altura.</li></ol>
${st("F","F3/w:buzz r/w:descansa F3/w:buzz r/w:descansa",{time:"4/4",bpm:60,t:"Buzz em notas longas",cap:"A nota é só uma referência de altura: o importante é o som contínuo e sem ar vazando."})}

<h2>🏆 Exercício 2 · Sirene e melodia no bocal</h2>
<p><b>Para que serve:</b> flexibilidade e afinação. Se você consegue tocar afinado só com o bocal, vai tocar afinado no trombone.</p>
<ol><li><b>Sirene:</b> no bocal, comece numa nota confortável e deslize <b>sem interromper</b> para o agudo e de volta, como a sirene de uma ambulância devagar. Para subir, ar mais rápido; para descer, ar mais lento.</li><li><b>Melodia:</b> ouça a melodia abaixo e reproduza no bocal, nota por nota.</li></ol>
${st("F","F3/h Bb3/h | F3/h Bb2/h | F3/w",{time:"4/4",bpm:60,t:"Sirene (deslize entre as notas)",cap:"No bocal, as notas não são separadas: o som escorrega de uma para a outra."})}
${st("F","Bb2/q Bb2/q F3/q F3/q | G3/q G3/q F3/h | Eb3/q Eb3/q D3/q D3/q | C3/q C3/q Bb2/h",{time:"4/4",bpm:72,t:"Melodia para fazer no bocal",cap:"\"Brilha, brilha, estrelinha\" em Si♭. Depois toque no trombone e compare a afinação."})}
${box("aten","Buzz cansa rápido. Comece com 2 a 3 minutos por dia e aumente aos poucos, até uns 5 minutos no aquecimento. Pare se os lábios ficarem dormentes.")}
${box("prof","Muitos professores usam o buzz no bocal como diagnóstico: se o buzz é \"sujo\" (com ar vazando) ou instável, o problema de som no instrumento tem a mesma origem. O aquecimento de John B. Gage (na pasta de estudos) e a escola de James Stamp usam muito o bocal isolado.")}
${box("res","Lábios de \"M\", cantos firmes, ar pelo centro. Exercício 1: notas longas de buzz. Exercício 2: sirene e melodia no bocal. Pouco tempo, todos os dias.")}
