<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escola de Música</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;600;700;800;900&family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0c; --bg2:#141417; --bg3:#1c1c21; --line:#2a2a31;
  --txt:#f4f4f5; --muted:#a1a1aa; --red:#e11d2a; --red2:#ff3b3b; --gold:#f5b300; --green:#22c55e;
  --display:'Anton','Impact','Arial Black',sans-serif;
  --body:'Montserrat','Segoe UI',system-ui,sans-serif;
  --read:'Montserrat','Segoe UI',system-ui,sans-serif;
  --music:'Segoe UI Symbol','Noto Music','Bravura Text','Apple Symbols',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:var(--body);overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- HERO ---------- */
.hero{position:relative;min-height:360px;display:flex;align-items:flex-end;padding:56px 48px 40px;overflow:hidden;
  background:radial-gradient(ellipse 60% 90% at 78% 30%,rgba(225,29,42,.55),transparent 70%),
   radial-gradient(ellipse 40% 60% at 20% 0%,rgba(245,179,0,.12),transparent 70%),linear-gradient(180deg,#1a0406 0%,#0a0a0c 100%)}
.hero .bigclef{position:absolute;right:6%;top:50%;transform:translateY(-50%);font-family:var(--music);font-size:300px;line-height:1;
  color:transparent;-webkit-text-stroke:2px rgba(255,80,80,.35);text-shadow:0 0 80px rgba(225,29,42,.6);pointer-events:none;user-select:none}
.hero .inner{position:relative;max-width:780px;width:100%;min-width:0}
.hero .tag{display:inline-block;font-weight:800;font-size:12px;letter-spacing:3px;background:var(--red);padding:6px 12px;border-radius:3px;margin-bottom:14px}
.hero h1{font-family:var(--display);font-size:64px;line-height:1;text-transform:uppercase;letter-spacing:1px}
.hero h1 span{color:var(--red2);text-shadow:0 0 30px rgba(255,59,59,.5)}
.hero p{color:#d4d4d8;margin-top:14px;font-size:15px;line-height:1.6;max-width:640px}
.stats{display:flex;gap:28px;margin-top:22px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--display);font-size:30px;color:#fff}
.stat small{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.gprog{margin-top:22px;max-width:520px}
.bar{height:6px;background:#2a2a31;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--red2));transition:width .4s}
.gprog small{display:block;margin-top:8px;color:var(--muted);font-size:12px;font-weight:700}
.cta{display:inline-flex;align-items:center;gap:8px;margin-top:20px;background:#fff;color:#000;font-weight:900;font-size:14px;padding:12px 20px;border-radius:6px;text-decoration:none;border:none;cursor:pointer}
.cta:hover{background:#ffd5d5}

nav.top{position:sticky;top:0;z-index:20;background:rgba(10,10,12,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;gap:6px;padding:10px 48px;overflow-x:auto;scrollbar-width:none}
nav.top::-webkit-scrollbar{display:none}
nav.top a{flex:none;text-decoration:none;font-size:12px;font-weight:800;padding:8px 12px;border-radius:999px;color:#d4d4d8;background:var(--bg3);border:1px solid var(--line)}
nav.top a:hover{border-color:var(--red);color:#fff}

section.lvl{padding:34px 48px 6px;min-width:0}
.lvl-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.lvl-head h2{font-size:19px;font-weight:800}
.lvl-head .pill{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.lvl-desc{color:var(--muted);font-size:13.5px;line-height:1.55;max-width:900px;margin-bottom:16px}
.row{display:flex;gap:18px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory;align-items:flex-start}
.row::-webkit-scrollbar{height:8px}.row::-webkit-scrollbar-thumb{background:#2a2a31;border-radius:8px}

.card{flex:none;width:214px;scroll-snap-align:start;cursor:pointer;border:none;background:none;text-align:left;display:flex;flex-direction:column;text-decoration:none}
.poster{position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:#111;box-shadow:0 10px 30px rgba(0,0,0,.6);transition:transform .25s,box-shadow .25s;isolation:isolate}
.card:hover .poster,.card:focus-visible .poster{transform:translateY(-6px) scale(1.03);box-shadow:0 18px 40px rgba(0,0,0,.7),0 0 0 2px var(--c)}
.poster .art{position:absolute;inset:0;z-index:-2;background:
   radial-gradient(circle at 50% 68%,color-mix(in srgb,var(--c) 75%,transparent) 0,transparent 42%),
   radial-gradient(ellipse 120% 60% at 50% 110%,color-mix(in srgb,var(--c) 55%,#000) 0,transparent 60%),
   repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 26px),
   linear-gradient(180deg,#050506 0%,#16090b 55%,#0a0506 100%)}
.poster .glyph{position:absolute;left:0;right:0;top:44%;text-align:center;font-size:112px;line-height:1;z-index:-1;color:#fff;
  text-shadow:0 0 18px var(--c),0 0 46px var(--c),0 0 90px var(--c)}
.poster .banners{position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.55;background:
   linear-gradient(180deg,color-mix(in srgb,var(--c) 45%,#200),color-mix(in srgb,var(--c) 30%,#100)) 8px 0/22px 38% no-repeat,
   linear-gradient(180deg,color-mix(in srgb,var(--c) 45%,#200),color-mix(in srgb,var(--c) 30%,#100)) calc(100% - 8px) 0/22px 38% no-repeat}
.poster img.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;display:none}
.poster.has-img img.cover{display:block}.poster.has-img .glyph,.poster.has-img .banners{display:none}
.poster .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.15) 38%,transparent 55%,rgba(0,0,0,.35) 100%);z-index:-1}
.poster .top{padding:14px 10px 0;text-align:center;color:#fff}
.badge{display:inline-block;font-weight:900;font-size:10.5px;letter-spacing:3px;padding:4px 12px;border-radius:2px;background:linear-gradient(180deg,#b3121d,#7a0a12);border:1px solid rgba(255,255,255,.18)}
.poster .t1,.poster .t2{font-family:var(--display);line-height:.98;text-shadow:0 3px 0 #000,0 0 14px rgba(0,0,0,.9),2px 2px 0 #000,-1px -1px 0 #000}
.poster .t1{color:#fff;font-size:29px;margin-top:8px}
.poster .t2{color:var(--t2,#ff2a2a);font-size:29px}
.poster .sm{font-size:23px}
.poster .done{position:absolute;right:8px;bottom:8px;font-size:11px;font-weight:800;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.2);padding:3px 7px;border-radius:4px;color:#fff}
.cprog{height:4px;background:#2a2a31;border-radius:0 0 6px 6px;margin-top:-1px;overflow:hidden}
.cprog i{display:block;height:100%;width:0;background:#f87171}
.card .sub{margin-top:9px;font-size:12px;color:var(--muted);font-weight:700;line-height:1.35}

/* ---------- PAGES ---------- */
.page{max-width:900px;margin:0 auto;padding:28px 24px 80px}
.crumbs{font-size:12px;font-weight:700;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumbs a{text-decoration:none;color:#fca5a5}.crumbs a:hover{text-decoration:underline}
.mhero{position:relative;margin-top:14px;padding:30px;border-radius:12px;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(ellipse 70% 120% at 85% 0%,color-mix(in srgb,var(--c) 55%,transparent),transparent 70%),linear-gradient(180deg,#1a0a0c,#141417)}
.mhero .kick{font-size:11px;font-weight:800;letter-spacing:2px;color:#fca5a5;text-transform:uppercase}
.mhero h1{font-family:var(--display);font-size:44px;line-height:1.05;margin-top:6px;font-weight:400}
.mhero h1 span{color:var(--t2,#ff3b3b)}
.mhero p{color:#d4d4d8;margin-top:10px;line-height:1.6;font-size:14.5px;max-width:680px}
.mhero .mbar{margin-top:16px;display:flex;align-items:center;gap:12px}
.mhero .mbar .bar{flex:1;max-width:320px}
.mhero .mbar small{font-size:12px;font-weight:800;color:var(--muted)}
.lesslist{margin-top:18px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg2)}
.lrow{display:flex;align-items:center;gap:14px;padding:14px 20px;text-decoration:none;border-top:1px solid var(--line)}
.lrow:first-child{border-top:none}
.lrow:hover{background:#1a1a1f}
.chk{flex:none;width:22px;height:22px;border-radius:4px;border:2px solid #52525b;display:grid;place-items:center;font-size:13px;font-weight:900}
.chk.on{background:#71717a;border-color:#71717a}
.thumb{flex:none;width:96px;height:54px;border-radius:5px;display:grid;place-items:center;font-size:26px;
  background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--c) 55%,transparent),transparent 70%),#0b0b0d;border-bottom:3px solid var(--red)}
.lrow .lt{flex:1;min-width:0}
.lrow .lt b{display:block;font-size:14.5px;font-weight:800;line-height:1.35}
.lrow .lt small{color:var(--muted);font-size:12px;font-weight:600}
.lrow .tm{flex:none;color:var(--muted);font-size:12px;font-weight:700}

/* ---------- LESSON ---------- */
.lesson-head{margin-top:14px;padding:28px 30px;border-radius:12px;border:1px solid var(--line);
  background:radial-gradient(ellipse 70% 140% at 90% 0%,color-mix(in srgb,var(--c) 45%,transparent),transparent 70%),linear-gradient(180deg,#1a0a0c,#141417)}
.lesson-head .kick{font-size:11px;font-weight:800;letter-spacing:2px;color:#fca5a5;text-transform:uppercase}
.lesson-head h1{font-size:30px;font-weight:900;line-height:1.2;margin-top:8px}
.lesson-head .meta{margin-top:10px;color:var(--muted);font-size:13px;font-weight:700}
.lesson-head .goal{margin-top:14px;font-size:15px;color:#e4e4e7;line-height:1.6}
.content{font-family:var(--read);font-size:16.5px;line-height:1.8;color:#e4e4e7;margin-top:22px}
.content h2{font-family:var(--body);font-size:21px;font-weight:900;color:#fff;margin:34px 0 10px;display:flex;align-items:center;gap:10px}
.content h3{font-family:var(--body);font-size:17px;font-weight:800;color:#fff;margin:24px 0 6px}
.content p{margin:10px 0}
.content ul,.content ol{margin:10px 0 10px 24px}
.content li{margin:5px 0}
.content b,.content strong{color:#fff}
.content em{color:#fde68a;font-style:normal;font-weight:600}
.content code{font-family:Consolas,monospace;background:#26262c;padding:1px 6px;border-radius:4px;font-size:.92em}
.content table{width:100%;border-collapse:collapse;margin:14px 0;font-size:14.5px;font-family:var(--body)}
.content th,.content td{border:1px solid #33333b;padding:8px 10px;text-align:left;vertical-align:top}
.content th{background:#1f1f25;color:#fff;font-weight:800}
.content td{background:#15151a}
.tblwrap{overflow-x:auto}
.box{margin:18px 0;padding:14px 18px;border-radius:10px;border:1px solid;font-size:15.5px;line-height:1.7}
.box .bt{display:block;font-family:var(--body);font-weight:900;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px}
.box.ana{background:#1d1a0c;border-color:#5c4a0f}.box.ana .bt{color:#fbbf24}
.box.aten{background:#200d10;border-color:#6b1a22}.box.aten .bt{color:#f87171}
.box.dica{background:#0c1a14;border-color:#14532d}.box.dica .bt{color:#4ade80}
.box.prof{background:#0e1424;border-color:#1e3a8a}.box.prof .bt{color:#93c5fd}
.box.pra{background:#171022;border-color:#4c1d95}.box.pra .bt{color:#c4b5fd}
.box.res{background:#1a1a1f;border-color:#3f3f46}.box.res .bt{color:#e4e4e7}
.fig{margin:18px 0;padding:16px;background:#111114;border:1px solid var(--line);border-radius:10px;overflow-x:auto;text-align:center}
.fig svg{display:inline-block;max-width:none}
.fig .cap{font-family:var(--body);font-size:13px;color:var(--muted);margin-top:8px;font-weight:600}
.play{display:inline-flex;align-items:center;gap:6px;margin:6px 6px 0 0;font-family:var(--body);font-size:13px;font-weight:800;padding:8px 14px;border-radius:999px;border:1px solid #4b1d22;background:#2a1215;color:#fecaca;cursor:pointer}
.play:hover{background:#3b161b;border-color:var(--red)}
.play.on{background:var(--red);color:#fff}
.kbd rect.k{cursor:pointer}
.metro{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;font-family:var(--body)}
.metro .dot{width:26px;height:26px;border-radius:50%;background:#2a2a31;transition:background .05s}
.metro .dot.on{background:var(--red2);box-shadow:0 0 18px var(--red2)}
.metro .dot.on.first{background:var(--gold);box-shadow:0 0 18px var(--gold)}
.metro input{accent-color:var(--red)}
.metro b{min-width:74px;font-size:14px}

.pctl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin-top:10px;font-family:var(--body)}
.pctl .play{margin:0}
.chip{font-family:var(--body);font-size:12px;font-weight:800;padding:7px 11px;border-radius:999px;border:1px solid #33333b;background:#1c1c21;color:#e4e4e7;cursor:pointer}
.chip:hover{border-color:#71717a}
.chip.on{background:#3b161b;border-color:var(--red);color:#fff}
.bpmv{font-weight:900;font-size:13px;min-width:74px;color:#fff}
.pctl input[type=range]{accent-color:var(--red);width:130px}
.gtitle{font-family:var(--body);font-weight:900;font-size:16px;color:#fff;text-align:left;margin-bottom:4px}
.gsub{font-family:var(--body);font-size:13px;color:#a1a1aa;text-align:left;margin-bottom:10px;line-height:1.5}
.gwrap{overflow-x:auto}
.content table.ggrid{width:auto;border-collapse:separate;border-spacing:3px;margin:6px auto;font-family:var(--body)}
.content table.ggrid td,.content table.ggrid th{border:none;padding:0;background:none}
.content table.ggrid th{font-size:10px;color:#71717a;font-weight:800;text-align:center;min-width:24px}
.content table.ggrid th.beat{color:#fca5a5;font-size:12px}
.content table.ggrid td.nm{font-size:12px;font-weight:800;color:#e4e4e7;text-align:right;padding-right:8px;white-space:nowrap}
.limb{display:inline-block;font-size:10px;font-weight:900;padding:2px 6px;border-radius:4px;margin-left:6px;color:#000}
.cell{width:24px;height:24px;border-radius:5px;background:#1f1f25;display:grid;place-items:center;font-size:11px;font-weight:900;color:#000}
.cell.b{box-shadow:inset 3px 0 0 #3f3f46}
.cell.cur{outline:2px solid #fff;outline-offset:1px}
.cell.acc{font-size:14px;box-shadow:0 0 0 2px #fff inset}
.cell.gh{opacity:.55}
.glegend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font-family:var(--body);font-size:11px;font-weight:700;color:#a1a1aa;margin-top:6px}
.glegend span b{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px}
.how{font-family:var(--body);text-align:left;font-size:13.5px;color:#d4d4d8;line-height:1.6;margin:8px 0 0}
.how b{color:#fff}
.illus svg{max-width:100%;height:auto}
.quiz{margin-top:14px;display:flex;flex-direction:column;gap:14px}
.qq{background:#141417;border:1px solid var(--line);border-radius:10px;padding:16px 18px;font-family:var(--body)}
.qq .qt{font-weight:800;font-size:15px;line-height:1.5}
.qq .ops{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.qq .op{text-align:left;padding:10px 14px;border-radius:8px;border:1px solid #33333b;background:#1c1c21;cursor:pointer;font-size:14.5px;font-weight:600;line-height:1.45}
.qq .op:hover{border-color:#71717a}
.qq .op.ok{background:#0f2a1a;border-color:#22c55e}
.qq .op.bad{background:#2a0f12;border-color:#ef4444}
.qq .exp{margin-top:10px;font-size:14px;line-height:1.6;color:#d4d4d8;display:none}
.qq.answered .exp{display:block}
.pdfs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mat{display:inline-flex;align-items:center;gap:7px;text-decoration:none;font-family:var(--body);font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:6px;background:#232329;border:1px solid #33333b;color:#e4e4e7}
.mat:hover{border-color:var(--red);background:#2a1a1d}
.mat .pgn{color:#fca5a5;font-weight:900;margin-left:2px}
span.mat{cursor:default}
.lfoot{margin-top:36px;padding-top:22px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:8px;border:1px solid var(--line);background:var(--bg3);font-weight:800;font-size:14px;cursor:pointer;text-decoration:none;color:#fff}
.btn:hover{border-color:#71717a}
.btn.pri{background:var(--red);border-color:var(--red)}
.btn.pri:hover{background:#c81824}
.btn.done{background:#14532d;border-color:#22c55e}

.foot{margin:40px 48px 60px;padding:24px;border:1px solid var(--line);border-radius:10px;background:var(--bg2)}
.foot h3{font-size:16px;font-weight:800}
.foot p{color:var(--muted);font-size:13px;line-height:1.6;margin-top:6px}
.foot button{margin-top:14px;font-size:12px;font-weight:800;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--bg3);cursor:pointer}

@media (max-width:720px){
  .hero{padding:40px 16px 28px;min-height:300px}.hero h1{font-size:40px}
  .hero .bigclef{font-size:200px;right:-20px;opacity:.6}
  nav.top{padding:10px 16px}section.lvl{padding:28px 16px 4px}
  .card{width:158px}.poster .t1,.poster .t2{font-size:22px}.poster .sm{font-size:18px}.poster .glyph{font-size:80px}
  .page{padding:18px 16px 60px}.mhero{padding:22px 18px}.mhero h1{font-size:32px}
  .lesson-head{padding:22px 18px}.lesson-head h1{font-size:24px}
  .content{font-size:16px}
  .lrow{padding:12px 14px;gap:10px}.thumb{width:56px;height:40px;font-size:20px}.lrow .tm{display:none}
  .foot{margin:32px 16px 40px}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ================= BASE / HELPERS DE CONTEÚDO ================= */
const PUBLICO = true; /* trocado para true na versão online (build.py --publico) */
const BASE = "file:///C:/Users/Rei Duque o Mago/Documents/CÉREBRO/Música/";
const NP = "Nova pasta/";
const fileUrl = p => BASE.replace(/ /g,"%20") + encodeURI(p).replace(/#/g,"%23");
const CURSO = [];
const enc = o => encodeURIComponent(JSON.stringify(o));

/* pauta: st("G","C4/q D4/q", {play:true, cap:"legenda", time:"4/4", bpm:90}) */
function st(clef, notes, o){ o=o||{}; return `<div class="fig" data-staff="${enc(Object.assign({clef,notes},o))}"></div>`; }
/* teclado: kb("C4","B4","C4 E4 G4",{labels:"pt"|"en"|"both"|"none", cap}) */
function kb(from,to,mark,o){ o=o||{}; return `<div class="fig" data-kbd="${enc(Object.assign({from,to,mark:mark||""},o))}"></div>`; }
/* botão de ouvir: ouvir("C4/q D4/q","Ouvir escala",90) */
function ouvir(notes,label,bpm,drum){ return `<button class="play" data-seq="${enc({notes,bpm:bpm||90,drum:!!drum})}">▶ ${label||"Ouvir"}</button>`; }
function ouvirB(notes,label,bpm){ return ouvir(notes,label,bpm,true); }
function stB(notes,o){ return st("P",notes,o); }
function metro(bpm,beats){ return `<div class="fig" data-metro="${enc({bpm:bpm||60,beats:beats||4})}"></div>`; }
/* ritmo de bateria com grade de membros: groove({t:"Rock", time:"4/4", beats:4, sub:4, bars:1, bpm:[60,90,120], rows:[["HH","MD","x.x.x.x.x.x.x.x."],...], cap}) */
function groove(g){ return `<div class="fig groove" data-groove="${enc(g)}"></div>`; }
/* partitura com controles de velocidade + metrônomo: ex("F","Bb2/w ...",{time:"4/4",bpm:60,t:"Título"}) */
function ex(clef,notes,o){ o=Object.assign({ctl:true},o||{}); return st(clef,notes,o); }

{id:"n1m1", t1:"O Mundo", t2:"do Som", g:"🔊", c:"#e11d2a", sub:"O que é som, silêncio e as 4 qualidades",
desc:"Antes de falar de notas, precisamos entender a matéria-prima da música: o som. Três aulas curtas que explicam de onde ele vem e como ele muda.",
aulas:[
{t:"O que é som?", e:"🌊", min:"8 min", sub:"Vibração que viaja pelo ar",
goal:"explicar com suas palavras de onde vem o som e como ele chega até o seu ouvido.",
body:`
<h2>🔊 Tudo começa com uma vibração</h2>
<p>Coloque a mão no seu pescoço e fale "aaaaa". Sentiu uma tremidinha? Isso é uma <b>vibração</b>. Todo som que existe nasce assim: alguma coisa balança, muito rápido, para frente e para trás.</p>
<ul>
<li>No violão, quem vibra é a <b>corda</b>.</li>
<li>No tambor, é a <b>pele</b> esticada.</li>
<li>Na sua voz, são as <b>pregas vocais</b>, dentro da garganta.</li>
<li>No trombone e no trompete, são os <b>lábios</b> do músico, encostados no bocal.</li>
</ul>
<h2>🌬️ Como o som chega até você</h2>
<p>Quando uma coisa vibra, ela empurra o ar que está do lado dela. Esse ar empurra o ar vizinho, que empurra o próximo... e assim o "empurrão" viaja até o seu ouvido. Dentro do ouvido existe uma pele fininha, o <b>tímpano</b>, que começa a balançar do mesmo jeito. O cérebro recebe essa informação e diz: "estou ouvindo um som".</p>
${box("ana","Jogue uma pedra num lago parado. Aparecem círculos de ondas que vão se espalhando. O ar faz a mesma coisa com o som, só que as ondas são invisíveis e se espalham em todas as direções. Por isso o som é chamado de <b>onda sonora</b>.")}
<p>Essa onda é rápida, mas não é instantânea: no ar, o som anda cerca de <b>340 metros por segundo</b>. É por isso que, numa tempestade, você vê o relâmpago antes de ouvir o trovão. A luz chega quase na hora; o som vem atrás.</p>
<h2>🚫 Sem ar, sem som</h2>
<p>O som precisa de alguma coisa para viajar: ar, água, madeira, metal. No espaço sideral quase não existe ar, então lá fora uma explosão seria silenciosa. Nos filmes tem barulho só porque fica mais emocionante.</p>
${box("prof","A onda sonora no ar é uma <b>onda mecânica longitudinal</b>: as partículas de ar oscilam na mesma direção em que a onda se propaga, formando regiões de compressão e rarefação. A velocidade de cerca de 343 m/s vale para o ar seco a 20 °C; ela muda com a temperatura.")}
${box("pra","Encoste o ouvido numa mesa e peça para alguém bater de leve na outra ponta. Depois ouça a mesma batida sem encostar. Pela madeira o som chega mais forte, porque os materiais sólidos conduzem bem a vibração.")}
${box("res","Som é <b>vibração</b>. A vibração empurra o ar, a onda viaja até o ouvido e o cérebro transforma isso em som.")}
`,
quiz:[
["O que precisa acontecer para existir um som?",["Alguma coisa precisa vibrar","Precisa ter luz","Precisa ser de dia"],0,"Todo som nasce de uma vibração: corda, pele, pregas vocais, lábios..."],
["Por que vemos o relâmpago antes de ouvir o trovão?",["Porque o trovão acontece depois","Porque a luz é muito mais rápida que o som","Porque o ouvido é mais lento que o olho"],1,"Os dois acontecem juntos, mas a luz viaja muito mais rápido do que os cerca de 340 metros por segundo do som."],
["Quem vibra quando um trombonista toca?",["A vara","A campana","Os lábios dentro do bocal"],2,"O tubo do trombone apenas amplifica e molda o som; quem começa a vibração são os lábios."]
],
pdf:[["Teoria Elementar (Pablo Gusmão)",NP+"Teoria Elementar da Música(Pablo Gusmão).pdf"],["Apostila Urtado · Propriedades do som",NP+"Apostila de Teoria Musical [2.0].pdf"]]},

{t:"Som, barulho e silêncio", e:"🤫", min:"6 min", sub:"O que transforma sons em música",
goal:"entender a diferença entre som musical e ruído, e por que o silêncio também faz parte da música.",
body:`
<h2>🎵 Som musical x ruído</h2>
<p>Bata com a mão numa mesa. Agora cante "lááá". Os dois são sons, mas são diferentes:</p>
<ul>
<li>A batida na mesa é um <b>ruído</b>: a vibração é bagunçada, não dá para cantar "a nota da mesa".</li>
<li>O "lááá" é um <b>som de altura definida</b>: a vibração se repete de um jeito organizado, e por isso dá para cantar igual, afinar, repetir.</li>
</ul>
<p>Os dois são úteis na música. O violão, o piano e o trombone fazem sons de altura definida. Chimbal, pratos e caixa trabalham principalmente com ruído, e mesmo assim são instrumentos musicais importantíssimos.</p>
${ouvir("C4/h E4/h G4/h","Ouvir sons de altura definida",80)} ${ouvir("x/q x/q x/e x/e x/q x/q x/q","Ouvir sons de percussão",110)}
<h2>🧩 Então o que é música?</h2>
<p>Uma definição simples, que aparece em muitos livros: <b>música é a arte de organizar sons e silêncios no tempo</b>. Repare em três palavras:</p>
<ul><li><b>Organizar</b>: escolher qual som vem, quando vem e como vem.</li><li><b>Silêncios</b>: a pausa também é música.</li><li><b>Tempo</b>: a música acontece enquanto o tempo passa. Não dá para ouvir uma música inteira num segundo, como se vê uma foto.</li></ul>
${box("ana","Pense numa conversa. Se alguém fala sem parar para respirar, fica impossível entender. As pausas separam as ideias. Na música é igual: o silêncio dá sentido aos sons.")}
${box("prof","Na acústica, um som de altura definida tem forma de onda <b>periódica</b>: ela se repete, e a quantidade de repetições por segundo é a frequência. O ruído tem forma de onda aperiódica, com energia espalhada por muitas frequências. Instrumentos como o tímpano de orquestra e alguns sinos ficam no meio do caminho.")}
${box("res","Existem sons de altura definida (dá para cantar) e ruídos (não dá). Música é organizar sons <b>e silêncios</b> no tempo.")}
`,
quiz:[
["Qual destes produz um som de altura definida?",["Bater palmas","Uma nota tocada no trombone","Amassar papel"],1,"O trombone produz uma vibração periódica; dá para cantar a mesma nota."],
["O silêncio faz parte da música?",["Não, música é só som","Sim, as pausas organizam e dão sentido aos sons","Só em música clássica"],1,"Todas as músicas usam pausas. Elas separam as ideias, como a respiração numa conversa."],
["Música acontece...",["no tempo, enquanto o tempo passa","toda de uma vez, como uma foto","só no papel"],0,"A música é uma arte do tempo: um som vem depois do outro."]
],
pdf:[["Penezzi · Noções Básicas",NP+"Apostila Teoria Musical - Penezzi 1.pdf"]]},

{t:"As 4 qualidades do som", e:"🎚️", min:"12 min", sub:"Altura, duração, intensidade e timbre",
goal:"reconhecer as quatro características que todo som tem e saber qual delas cada símbolo da partitura mostra.",
body:`
<p>Todo som pode ser descrito por quatro qualidades. Toda a teoria musical que você vai aprender serve para escrever e controlar essas quatro coisas.</p>
<h2>1️⃣ Altura: grave ou agudo</h2>
<p>Altura <b>não</b> é volume. Altura diz se o som é <b>grave</b> (grosso, como a voz de um leão) ou <b>agudo</b> (fino, como um passarinho).</p>
<p>O que decide a altura é a <b>velocidade</b> da vibração. Vibração lenta dá som grave; vibração rápida dá som agudo. Essa velocidade se mede em <b>hertz (Hz)</b>, que quer dizer "vibrações por segundo".</p>
${ouvir("C3/h C4/h C5/h C6/h","Ouvir do grave ao agudo",70)}
${box("ana","Pense numa régua presa na mesa. Deixe um pedaço grande para fora e faça vibrar: ela balança devagar e o som é grave. Deixe um pedaço pequeno: ela balança rápido e o som fica agudo.")}
<h2>2️⃣ Duração: curto ou longo</h2>
<p>É quanto tempo o som fica soando. Um "tá" curtinho ou um "tááááá" comprido. Na partitura, a duração é mostrada pelas <b>figuras</b> (semibreve, mínima, semínima...), que você vai aprender no Módulo 4.</p>
${ouvir("G4/e G4/e G4/e G4/e G4/w","Ouvir sons curtos e um longo",90)}
<h2>3️⃣ Intensidade: forte ou fraco</h2>
<p>Isso é o que no dia a dia chamamos de "volume". Depende da <b>força</b> da vibração: quanto maior o balanço, mais forte o som. Na partitura, a intensidade aparece com letras como <b>p</b> (piano = fraco) e <b>f</b> (forte).</p>
${box("aten","Muita gente troca: \"aumenta o som\" quer dizer mais <b>intensidade</b>, não mais altura. Um som pode ser grave e forte, ou agudo e fraquinho.")}
<h2>4️⃣ Timbre: a "voz" de cada instrumento</h2>
<p>Se um piano e um trombone tocarem a mesma nota, com a mesma duração e a mesma força, você ainda sabe qual é qual. Essa diferença é o <b>timbre</b>. É como a sua voz e a de um amigo: vocês podem falar a mesma palavra, mas cada um tem o seu jeito.</p>
${box("prof","O timbre depende principalmente do <b>espectro de harmônicos</b> (quais frequências mais agudas soam junto com a nota principal e com qual força) e do <b>envelope</b> (como o som começa, se mantém e termina). Você vai estudar harmônicos na aula de série harmônica, no Nível 3.")}
${tbl(["Qualidade","Pergunta que ela responde","Como aparece na partitura"],[["Altura","Grave ou agudo?","Posição da nota na pauta"],["Duração","Curto ou longo?","Formato da figura (semínima, mínima...)"],["Intensidade","Forte ou fraco?","Letras de dinâmica (p, mf, f...)"],["Timbre","Quem está tocando?","Nome do instrumento no início da partitura"]])}
${box("pra","Ouça qualquer música e tente descrever um único som dela usando as quatro palavras. Exemplo: \"a nota do trombone é grave, longa, forte e tem som de metal\".")}
${box("res","<b>Altura</b> (grave/agudo), <b>duração</b> (curto/longo), <b>intensidade</b> (forte/fraco) e <b>timbre</b> (quem toca).")}
`,
quiz:[
["Alguém pede: \"abaixa esse som, está muito alto\". Tecnicamente, o que a pessoa quer diminuir?",["A altura","A intensidade","O timbre"],1,"Ela quer menos volume, ou seja, menos intensidade. Altura, na música, é grave/agudo."],
["Uma corda vibra mais rápido que outra. O som dela é...",["mais agudo","mais forte","mais longo"],0,"Mais vibrações por segundo significam um som mais agudo."],
["Por que você distingue um piano de um trombone tocando a mesma nota?",["Pela duração","Pela intensidade","Pelo timbre"],2,"Timbre é a \"cor\" do som, a identidade de cada instrumento ou voz."]
],
pdf:[["Bohumil Med · Teoria da Música",NP+"Teoria da Música - Bohumil Med 4º Edição.pdf"],["Iniciação Musical",NP+"Apostila_Iniciacao_Musical.pdf"]]}
]},

/* ============ MÓDULO 2 · AS NOTAS ============ */
{id:"n1m2", t1:"As Sete", t2:"Notas", g:"🎹", c:"#f97316", t2c:"#ff7a1a", sub:"Dó, ré, mi... letras e teclado",
desc:"Os nomes das notas, o que é uma oitava, os nomes em letras (cifra) e o teclado do piano como mapa de tudo.",
aulas:[
{t:"Dó, Ré, Mi, Fá, Sol, Lá, Si", e:"🎶", min:"10 min", sub:"Os nomes e a escada que se repete",
goal:"saber as sete notas de cor, para frente e para trás, e entender o que é uma oitava.",
body:`
<h2>🪜 Sete nomes para todos os sons</h2>
<p>Existem muitos sons possíveis, do mais grave ao mais agudo. Para organizar isso, a música usa só <b>sete nomes</b>:</p>
<p style="font-size:22px;font-weight:900;text-align:center;letter-spacing:2px">Dó · Ré · Mi · Fá · Sol · Lá · Si</p>
<p>Depois do Si, vem de novo o Dó, só que mais agudo. E a sequência recomeça: Dó, Ré, Mi... É como os dias da semana: depois de domingo vem segunda de novo, mas é outra semana.</p>
${st("G","C4/q:Dó D4/q:Ré E4/q:Mi F4/q:Fá G4/q:Sol A4/q:Lá B4/q:Si C5/q*:Dó",{bpm:100,cap:"Subindo: do Dó até o próximo Dó"})}
<h2>🔁 A oitava</h2>
<p>A distância de um Dó até o próximo Dó se chama <b>oitava</b>. O nome vem de contar: Dó (1), Ré (2), Mi (3), Fá (4), Sol (5), Lá (6), Si (7), Dó (8). Oito notas, contando as duas pontas.</p>
<p>Ouça o Dó grave e o Dó agudo juntos. Eles "combinam" tanto que parecem quase o mesmo som. É por isso que recebem o mesmo nome.</p>
${ouvir("C4/h C5/h C4+C5/w","Ouvir uma oitava",70)}
${box("prof","Uma oitava acima significa exatamente o <b>dobro da frequência</b>. O Lá usado para afinar orquestras vibra 440 vezes por segundo (440 Hz); o Lá uma oitava acima vibra 880 Hz e o de baixo, 220 Hz. Essa relação 2:1 é tão simples que o ouvido percebe as duas notas como \"a mesma nota em outra altura\".")}
<h2>📜 De onde vieram esses nomes?</h2>
<p>Há quase mil anos, um monge italiano chamado <b>Guido d'Arezzo</b> usou um hino em latim para ensinar os cantores. Cada verso começava numa nota mais aguda, e ele pegou a primeira sílaba de cada verso: <i>Ut</i>, <i>Re</i>, <i>Mi</i>, <i>Fa</i>, <i>Sol</i>, <i>La</i>. Mais tarde o "Ut" virou "Dó" (é mais fácil de cantar) e acrescentaram o "Si".</p>
${box("pra","Fale as notas subindo e descendo sem olhar: Dó Ré Mi Fá Sol Lá Si Dó / Dó Si Lá Sol Fá Mi Ré Dó. Depois pule de duas em duas: Dó Mi Sol Si Ré Fá Lá Dó. Esse último exercício vai ser muito útil quando você estudar acordes.")}
${box("res","São 7 notas: Dó Ré Mi Fá Sol Lá Si. Depois do Si vem o Dó de novo, mais agudo. De um Dó ao próximo é uma <b>oitava</b>.")}
`,
quiz:[
["Qual nota vem depois do Si, subindo?",["Lá","Dó","Ré"],1,"Depois do Si a sequência recomeça no Dó, uma oitava acima."],
["Qual nota vem antes do Fá?",["Mi","Sol","Ré"],0,"Descendo: Fá, Mi, Ré..."],
["Por que a distância de Dó a Dó se chama oitava?",["Porque tem 8 teclas pretas","Porque contando as duas pontas são 8 notas","Porque foi inventada no século VIII"],1,"Dó-Ré-Mi-Fá-Sol-Lá-Si-Dó: 8 notas."]
],
pdf:[["Apostila Iniciação Musical",NP+"Apostila_Iniciacao_Musical.pdf"],["Musicaricando · cap. 1",NP+"Musicaricando - 1° Capítulo.pdf"]]},

{t:"Notas em letras: C, D, E, F, G, A, B", e:"🔤", min:"8 min", sub:"O sistema das cifras",
goal:"trocar o nome da nota pela letra (e ao contrário) sem pensar.",
body:`
<p>Em muitos países, e em quase toda música popular, as notas são escritas com <b>letras</b>. É isso que você vê em cifras de violão, em Real Books de jazz e em aplicativos de afinador.</p>
${tbl(["Nome","Dó","Ré","Mi","Fá","Sol","Lá","Si"],[["Letra","<b>C</b>","<b>D</b>","<b>E</b>","<b>F</b>","<b>G</b>","<b>A</b>","<b>B</b>"]])}
<h2>🧠 Truque para decorar</h2>
<p>O alfabeto começa em <b>A</b>, e A é o <b>Lá</b>. A partir daí é só seguir o alfabeto e as notas juntos:</p>
<p style="text-align:center;font-weight:800">A=Lá · B=Si · C=Dó · D=Ré · E=Mi · F=Fá · G=Sol</p>
${box("ana","Por que começa no Lá e não no Dó? Na Idade Média, as escalas usadas começavam em outra nota, e o Lá recebeu a primeira letra. Quando o Dó ficou mais importante, as letras já estavam espalhadas pelo mundo, e ficou assim.")}
<h2>🔢 O número depois da letra</h2>
<p>Às vezes você vai ver <b>C4</b>, <b>A4</b>, <b>Bb2</b>. O número diz <b>qual</b> Dó, qual Lá: é o número da oitava. Cada oitava começa num Dó. O Dó do meio do piano é o <b>C4</b>, também chamado de <b>Dó central</b>.</p>
${kb("C3","B5","C3:C3 C4:C4 C5:C5",{cap:"Três Dós diferentes: C3, C4 (Dó central) e C5"})}
${box("aten","Esse sistema de números, chamado \"índice acústico científico\", é o mais usado hoje. Alguns livros antigos e alguns programas usam outra numeração (o Dó central aparece como C3 ou C5). Quando ler um livro, veja qual regra ele usa.")}
${box("pra","Leia em voz alta, traduzindo: G – E – C – A – F – D – B. Depois o contrário: Sol – Lá – Mi – Dó – Si – Ré – Fá. Repita até não precisar pensar.")}
${box("res","A=Lá, B=Si, C=Dó, D=Ré, E=Mi, F=Fá, G=Sol. O número depois da letra diz a oitava; C4 é o Dó central.")}
`,
quiz:[
["Qual letra é o Sol?",["S","G","D"],1,"G = Sol. Truque: A=Lá, B=Si, C=Dó, D=Ré, E=Mi, F=Fá, G=Sol."],
["O que é a nota E?",["Mi","Ré","Fá"],0,"E = Mi."],
["O que significa o 4 em C4?",["Que a nota dura 4 tempos","Que é o Dó da oitava 4, o Dó central","Que é a quarta nota da música"],1,"O número indica a oitava; C4 é o Dó do meio do piano."]
],
pdf:[["Sistema de cifragens (Fernando Mattos)","Sistema de cifragens de acordes - PROF. FERNANDO LEWIS DE MATTOS.pdf"]]},

{t:"O teclado: o mapa de todas as notas", e:"🎹", min:"12 min", sub:"Achar qualquer nota no piano",
goal:"achar qualquer nota branca do teclado e entender para que servem as teclas pretas.",
body:`
<p>Mesmo que você não toque piano, o teclado é o melhor <b>mapa</b> para enxergar a música. Tudo o que você vai estudar (escalas, intervalos, acordes) fica fácil de ver nele.</p>
<h2>⚫ O segredo está nas teclas pretas</h2>
<p>As teclas pretas aparecem em grupinhos: <b>duas</b>, depois <b>três</b>, depois duas, depois três... Esses grupinhos são os pontos de referência.</p>
<ul>
<li>O <b>Dó</b> é a tecla branca logo <b>à esquerda do grupo de duas</b> pretas.</li>
<li>O <b>Fá</b> é a tecla branca logo <b>à esquerda do grupo de três</b> pretas.</li>
</ul>
${kb("C4","B5","C4:Dó F4:Fá C5:Dó F5:Fá",{cap:"Dó fica antes das duas pretas; Fá fica antes das três pretas. Clique para ouvir."})}
<p>Achou o Dó? Então as teclas brancas seguintes são Ré, Mi, Fá, Sol, Lá, Si, e o Dó de novo.</p>
${kb("C4","B4","",{labels:"pt",cap:"As sete notas nas teclas brancas"})}
<h2>🤔 E as teclas pretas?</h2>
<p>Repare que entre Mi e Fá não tem tecla preta, e entre Si e Dó também não. Entre as outras notas brancas sempre existe uma preta no meio. As teclas pretas são as notas "do meio do caminho", e elas têm nomes com <b>sustenido (♯)</b> ou <b>bemol (♭)</b>. Você vai estudar isso com calma no Nível 2.</p>
${box("ana","Pense numa escada onde a maioria dos degraus tem um degrauzinho extra no meio (a tecla preta), menos dois: Mi→Fá e Si→Dó, que já estão coladinhos. Essa diferença entre os degraus é o que dá personalidade às escalas.")}
<p>Contando brancas e pretas, de um Dó até o Si seguinte existem <b>12 teclas diferentes</b>. Essas 12 notas são todas as notas usadas na música ocidental; depois disso, tudo se repete em outra oitava.</p>
${box("pra","Num teclado de verdade ou num aplicativo de piano no celular: ache todos os Dós. Depois todos os Fás. Depois toque Dó-Ré-Mi-Fá-Sol-Lá-Si-Dó olhando só para os grupos de pretas.")}
${box("res","Dó fica à esquerda das 2 pretas; Fá fica à esquerda das 3 pretas. Entre Mi-Fá e Si-Dó não existe tecla preta. Somando tudo, são 12 notas diferentes por oitava.")}
`,
quiz:[
["Onde fica o Dó no teclado?",["À esquerda do grupo de 3 teclas pretas","À esquerda do grupo de 2 teclas pretas","Em qualquer tecla preta"],1,"Dó é a branca imediatamente antes das duas pretas."],
["Entre quais notas brancas NÃO existe tecla preta?",["Dó-Ré e Fá-Sol","Mi-Fá e Si-Dó","Sol-Lá e Lá-Si"],1,"Mi-Fá e Si-Dó são vizinhos diretos."],
["Quantas notas diferentes existem numa oitava, contando brancas e pretas?",["7","8","12"],2,"7 brancas + 5 pretas = 12 notas."]
],
pdf:[["Descomplicando a Música",NP+"Descomplicando a Música.pdf"]]}
]},

/* ============ MÓDULO 3 · A PAUTA ============ */
{id:"n1m3", t1:"A Pauta", t2:"& as Claves", g:"𝄞", c:"#8b5cf6", t2c:"#b18cff", sub:"Onde as notas moram no papel",
desc:"Como a altura das notas é escrita: as cinco linhas, as claves de Sol e de Fá, as linhas extras e o Dó central, que é a ponte entre as duas claves.",
aulas:[
{t:"A pauta: 5 linhas e 4 espaços", e:"📏", min:"8 min", sub:"O \"prédio\" das notas",
goal:"contar linhas e espaços na ordem certa e entender por que uma nota mais alta no papel é mais aguda.",
body:`
<p>Para escrever a <b>altura</b> das notas, a música usa a <b>pauta</b> (também chamada de <b>pentagrama</b>, porque "penta" quer dizer cinco): <b>cinco linhas</b> retas e os <b>quatro espaços</b> entre elas.</p>
${st("none","E4/w:1ª_linha F4/w:1º_espaço G4/w:2ª_linha A4/w:2º_espaço B4/w:3ª_linha C5/w:3º_espaço D5/w:4ª_linha E5/w:4º_espaço F5/w:5ª_linha",{play:false,cap:"Linhas e espaços sempre contados de BAIXO para CIMA"})}
<h2>⬆️ Regras de ouro</h2>
<ol>
<li>Linhas e espaços são contados <b>de baixo para cima</b>. A 1ª linha é a de baixo.</li>
<li>Uma nota pode ficar <b>em cima de uma linha</b> (a linha passa pelo meio da bolinha) ou <b>num espaço</b> (entre duas linhas).</li>
<li>Quanto <b>mais alto</b> no papel, mais <b>agudo</b> é o som. Quanto mais baixo, mais grave.</li>
<li>Andar de uma linha para o espaço vizinho (ou do espaço para a linha vizinha) é andar <b>uma nota</b>: por exemplo, de Mi para Fá.</li>
</ol>
${box("ana","A pauta é um prédio de 9 andares: 5 andares são linhas e 4 são espaços, alternando. Cada andar é uma nota. Subir um andar = subir uma nota.")}
${box("aten","A pauta sozinha não diz o nome das notas. Ela só mostra se uma nota é mais alta ou mais baixa que outra. Quem diz os nomes é a <b>clave</b>, o assunto da próxima aula.")}
${box("pra","Desenhe cinco linhas num papel. Coloque bolinhas: uma na 3ª linha, uma no 2º espaço, uma na 5ª linha, uma no 1º espaço. Confira contando de baixo para cima.")}
${box("res","Pauta = 5 linhas + 4 espaços, contados de baixo para cima. Mais alto no papel = mais agudo.")}
`,
quiz:[
["Como se contam as linhas da pauta?",["De cima para baixo","De baixo para cima","Da esquerda para a direita"],1,"A 1ª linha é a de baixo."],
["Quantos espaços tem a pauta?",["4","5","9"],0,"5 linhas e 4 espaços."],
["Uma nota na 5ª linha é mais ___ que uma nota na 1ª linha.",["grave","aguda","longa"],1,"Mais alto no papel = mais agudo."]
],
pdf:[["Urtado · Pentagrama",NP+"Apostila de Teoria Musical [2.0].pdf"],["Bohumil Med · Teoria",NP+"Teoria da Música - Bohumil Med 4º Edição.pdf"]]},

{t:"As claves: a chave que dá nome às notas", e:"🗝️", min:"10 min", sub:"Clave de Sol, de Fá e de Dó",
goal:"saber o que a clave faz e qual nota cada clave marca.",
body:`
<p>A <b>clave</b> é o desenho que fica no começo da pauta. Ela funciona como uma <b>chave</b> (é de onde vem o nome): ela diz o nome de <b>uma linha</b>, e a partir dela você descobre todas as outras, subindo e descendo na ordem Dó-Ré-Mi-Fá-Sol-Lá-Si.</p>
<h2>𝄞 Clave de Sol</h2>
<p>A voltinha do desenho enrola na <b>2ª linha</b>. Ela avisa: <b>"quem está na 2ª linha é o Sol"</b>. É a clave do violino, da flauta, do trompete, do saxofone, da mão direita do piano e das vozes mais agudas.</p>
${st("G","G4/w*:Sol",{cap:"Na clave de Sol, a nota da 2ª linha é Sol"})}
<h2>𝄢 Clave de Fá</h2>
<p>Os dois pontinhos ficam um acima e um abaixo da <b>4ª linha</b>. Ela avisa: <b>"quem está na 4ª linha é o Fá"</b>. É a clave dos instrumentos graves: <b>trombone</b>, tuba, bombardino, fagote, violoncelo, contrabaixo, mão esquerda do piano e vozes graves.</p>
${st("F","F3/w*:Fá",{cap:"Na clave de Fá, a nota da 4ª linha é Fá"})}
<h2>🎻 Clave de Dó (para conhecer)</h2>
<p>Tem forma de um "B" grande, e o centro dela aponta uma linha que passa a ser o <b>Dó central</b>. Ela pode ficar em linhas diferentes. A mais comum é a clave de Dó na 3ª linha, usada pela viola de orquestra. A clave de Dó na 4ª linha aparece em partituras de trombone e violoncelo para as notas agudas, porque evita muitas linhas extras.</p>
${box("ana","A pauta é uma rua com casas sem número. A clave é a placa na esquina que diz: \"esta casa aqui é a número 4\". Com essa informação você descobre o número de todas as outras.")}
${box("prof","Os desenhos das claves vieram das letras. A clave de Sol é uma letra <b>G</b> estilizada, a de Fá é um <b>F</b> e a de Dó é um <b>C</b>, justamente as letras das notas que elas marcam.")}
${box("pra","Olhe para uma partitura qualquer da pasta de estudos (por exemplo, um método de trombone) e identifique a clave. Nos métodos de trombone você vai ver quase sempre a clave de Fá.")}
${box("res","A clave dá o nome de uma linha. Clave de <b>Sol</b>: 2ª linha = Sol. Clave de <b>Fá</b>: 4ª linha = Fá. O trombone lê principalmente na clave de Fá.")}
`,
quiz:[
["Na clave de Sol, qual linha é o Sol?",["1ª linha","2ª linha","3ª linha"],1,"A voltinha da clave de Sol enrola na 2ª linha."],
["Na clave de Fá, qual linha é o Fá?",["4ª linha","2ª linha","5ª linha"],0,"Os dois pontinhos ficam em volta da 4ª linha."],
["Qual clave o trombone usa na maior parte do tempo?",["Clave de Sol","Clave de Fá","Nenhuma clave"],1,"Trombone, tuba e bombardino (na tradição de orquestra e de banda sinfônica) leem em clave de Fá."]
],
pdf:[["Bohumil Med · Claves",NP+"Teoria da Música - Bohumil Med 4º Edição.pdf"],["Regras de grafia (Lacerda)",NP+"Regras da Grafia Musical - Osvaldo Lacerda.pdf"]]},

{t:"Lendo na clave de Sol", e:"👀", min:"15 min", sub:"Todas as notas da pauta",
goal:"ler qualquer nota dentro da pauta na clave de Sol em menos de 2 segundos.",
body:`
<p>Se a 2ª linha é Sol, o resto é só contar. Subindo um degrau (linha → espaço → linha...) você anda uma nota para a frente; descendo, anda para trás.</p>
${st("G","E4/w:Mi F4/w:Fá G4/w*:Sol A4/w:Lá B4/w:Si C5/w:Dó D5/w:Ré E5/w:Mi F5/w:Fá",{bpm:80,cap:"Todas as notas da pauta na clave de Sol, de baixo para cima"})}
<h2>🧠 Dois atalhos para ler mais rápido</h2>
<h3>Notas nas linhas: Mi – Sol – Si – Ré – Fá</h3>
${st("G","E4/w:Mi G4/w:Sol B4/w:Si D5/w:Ré F5/w:Fá",{bpm:80})}
<h3>Notas nos espaços: Fá – Lá – Dó – Mi</h3>
${st("G","F4/w:Fá A4/w:Lá C5/w:Dó E5/w:Mi",{bpm:80})}
${box("dica","Crie uma frase boba para decorar. Linhas: \"<b>Mi</b>nha <b>Sol</b>a <b>Si</b>ngela <b>Ré</b>cebe <b>Fá</b>s\". Espaços: \"<b>Fá</b>, <b>Lá</b>, <b>Dó</b>, <b>Mi</b>\". Quanto mais engraçada a frase, mais fácil de lembrar.")}
<h2>🧭 Pontos de referência</h2>
<p>Leitores experientes não contam nota por nota. Eles decoram algumas <b>notas-âncora</b> e leem as outras pela distância:</p>
<ul><li><b>Sol</b> na 2ª linha (a própria clave)</li><li><b>Si</b> na 3ª linha, a do meio</li><li><b>Dó</b> no 3º espaço</li><li><b>Fá</b> na 5ª linha</li></ul>
${box("pra","Leia em voz alta esta sequência, sem ouvir primeiro. Depois clique para conferir.")}
${st("G","G4/q A4/q B4/q G4/q | C5/q B4/q A4/q G4/q | E4/q F4/q G4/q A4/q | G4/w",{bpm:90,time:"4/4",playLabel:"Conferir"})}
${box("res","Linhas (clave de Sol): Mi Sol Si Ré Fá. Espaços: Fá Lá Dó Mi. Âncoras: Sol na 2ª linha, Si na 3ª, Dó no 3º espaço.")}
`,
quiz:[
["Na clave de Sol, qual nota fica na 3ª linha (a do meio)?",["Si","Lá","Dó"],0,"Linhas: Mi Sol Si Ré Fá. A 3ª é Si."],
["Na clave de Sol, quais notas ficam nos quatro espaços, de baixo para cima?",["Mi Sol Si Ré","Fá Lá Dó Mi","Dó Mi Sol Si"],1,"Espaços: Fá Lá Dó Mi."],
["Uma nota no 3º espaço, na clave de Sol, é...",["Dó","Ré","Si"],0,"3º espaço = Dó."]
],
pdf:[["Bona (clave de Sol)",NP+"Bona.pdf"],["50 solfejos fáceis",NP+"50 solfejos faceis.pdf"]]},

{t:"Lendo na clave de Fá", e:"🎺", min:"15 min", sub:"A clave do trombone",
goal:"ler qualquer nota dentro da pauta na clave de Fá, que é a clave do trombone.",
body:`
<p>Agora a regra muda: a <b>4ª linha é Fá</b>. Contando para cima e para baixo a partir dela, você descobre todas as outras.</p>
${st("F","G2/w:Sol A2/w:Lá B2/w:Si C3/w:Dó D3/w:Ré E3/w:Mi F3/w*:Fá G3/w:Sol A3/w:Lá",{bpm:80,cap:"Todas as notas da pauta na clave de Fá, de baixo para cima"})}
<h2>🧠 Atalhos</h2>
<h3>Linhas: Sol – Si – Ré – Fá – Lá</h3>
${st("F","G2/w:Sol B2/w:Si D3/w:Ré F3/w:Fá A3/w:Lá",{bpm:80})}
<h3>Espaços: Lá – Dó – Mi – Sol</h3>
${st("F","A2/w:Lá C3/w:Dó E3/w:Mi G3/w:Sol",{bpm:80})}
${box("aten","O erro mais comum de quem aprendeu clave de Sol primeiro é ler a clave de Fá \"com os olhos da clave de Sol\". Uma nota na 1ª linha é <b>Mi</b> na clave de Sol, mas é <b>Sol</b> na clave de Fá. Sempre olhe para a clave antes de ler.")}
<h2>🧭 Âncoras da clave de Fá</h2>
<ul><li><b>Fá</b> na 4ª linha (a própria clave)</li><li><b>Ré</b> na 3ª linha, a do meio</li><li><b>Sol</b> na 1ª linha</li><li><b>Si bemol</b> na 2ª linha é a primeira nota que quase todo trombonista aprende a tocar (você vai ver na trilha do trombone)</li></ul>
${box("pra","Leia em voz alta e confira depois:")}
${st("F","F3/q E3/q D3/q C3/q | Bb2/h D3/h | F3/q D3/q Bb2/q D3/q | F3/w",{bpm:90,time:"4/4",playLabel:"Conferir",cap:"O Si da 2ª linha tem um bemol (♭) na frente; por enquanto, leia como \"Si bemol\"."})}
${box("dica","Treino diário de 5 minutos: escreva 20 notas aleatórias na clave de Fá e leia em voz alta com um cronômetro. Meta da primeira semana: 20 notas em 40 segundos. Meta final: 20 notas em 20 segundos sem erro.")}
${box("res","Linhas (clave de Fá): Sol Si Ré Fá Lá. Espaços: Lá Dó Mi Sol. Âncoras: Fá na 4ª linha, Ré na 3ª, Sol na 1ª.")}
`,
quiz:[
["Na clave de Fá, qual nota fica na 1ª linha?",["Mi","Sol","Fá"],1,"Linhas na clave de Fá: Sol Si Ré Fá Lá."],
["Na clave de Fá, qual nota fica na 3ª linha?",["Ré","Si","Dó"],0,"Sol Si Ré Fá Lá: a 3ª linha é Ré."],
["Uma nota no 2º espaço da clave de Fá é...",["Lá","Dó","Mi"],1,"Espaços: Lá Dó Mi Sol. O 2º é Dó."]
],
pdf:[["Bona · Clave de Fá",NP+"Bona clave de Fá.pdf"],["Fred Dantas · Teoria para Filarmônicas",NP+"Teoria e Leitura da Musica para as Filarmomicas - Fred Dantas.pdf"]]},

{t:"Linhas suplementares e o Dó central", e:"🌉", min:"12 min", sub:"Notas fora da pauta e a ponte entre as claves",
goal:"ler notas acima e abaixo da pauta e entender por que o Dó central liga as duas claves.",
body:`
<p>Cinco linhas não bastam para todas as notas. Quando uma nota é mais aguda ou mais grave do que a pauta, desenhamos <b>linhas suplementares</b>: pedacinhos de linha só para aquela nota. Elas seguem a mesma lógica: linha, espaço, linha, espaço...</p>
${st("G","A5/q B5/q C6/q:Dó D6/q | C4/q:Dó B3/q A3/q G3/q",{bpm:90,cap:"Acima e abaixo da pauta, na clave de Sol"})}
<h2>🌉 O Dó central: a ponte</h2>
<p>O <b>Dó central</b> (C4, o Dó do meio do piano) é escrito com <b>uma linha suplementar</b>:</p>
<ul><li>na clave de Sol, <b>uma linha abaixo</b> da pauta;</li><li>na clave de Fá, <b>uma linha acima</b> da pauta.</li></ul>
<p>É a <b>mesma nota</b>, com o mesmo som. Por isso as duas claves se encaixam como peças de um quebra-cabeça. Juntas, formam a pauta dupla do piano.</p>
${st("F","A3/q B3/q C4/h*:Dó_central",{bpm:80})}
${st("G","C4/h*:Dó_central D4/q E4/q",{bpm:80})}
${box("ana","Imagine dois andares de um prédio: o térreo é a clave de Fá (graves) e o primeiro andar é a clave de Sol (agudos). O Dó central é a escada entre eles: quem sai do andar de baixo chega exatamente no mesmo ponto de quem desce do andar de cima.")}
<h2>🎺 Por que isso importa para o trombone?</h2>
<p>O trombone toca muitas notas em volta do Dó central e acima dele. Em partituras de trombone é comum ver notas com 1, 2 ou 3 linhas suplementares acima da clave de Fá (Ré, Mi, Fá agudos). Aprenda a ler essas notas desde já.</p>
${st("F","C4/q:Dó D4/q:Ré E4/q:Mi F4/q:Fá | G4/q:Sol F4/q E4/q D4/q | C4/w",{bpm:90,time:"4/4",cap:"Região aguda do trombone, com linhas suplementares"})}
${box("pra","Na clave de Fá, escreva e leia: Dó central, Ré (espaço acima da 1ª linha suplementar), Mi (2ª linha suplementar), Fá (espaço acima dela). Depois confira ouvindo.")}
${box("res","Linhas suplementares continuam a pauta para cima e para baixo. O Dó central fica uma linha <b>abaixo</b> da clave de Sol e uma linha <b>acima</b> da clave de Fá: é a mesma nota.")}
`,
quiz:[
["Onde o Dó central aparece na clave de Fá?",["Uma linha suplementar acima da pauta","Na 1ª linha","Uma linha suplementar abaixo da pauta"],0,"Clave de Fá: uma linha acima. Clave de Sol: uma linha abaixo."],
["O Dó central na clave de Sol e na clave de Fá é...",["a mesma nota, com o mesmo som","notas diferentes com o mesmo nome","uma oitava de diferença"],0,"É exatamente a mesma nota (C4)."],
["Para que servem as linhas suplementares?",["Para marcar o fim da música","Para escrever notas mais agudas ou mais graves que a pauta","Para enfeitar a partitura"],1,"Elas estendem a pauta só para aquelas notas."]
],
pdf:[["Compêndio (Osvaldo Lacerda)",NP+"Compendio de Teoria Elementar da Musica - Osvaldo Lacerda.pdf"]]}
]},

/* ============ MÓDULO 4 · O TEMPO ============ */
{id:"n1m4", t1:"Ritmo", t2:"& Compasso", g:"🥁", c:"#22c55e", t2c:"#3cff7a", sub:"Pulso, figuras, pausas, compasso",
desc:"A altura diz QUAL nota tocar. O ritmo diz QUANDO e POR QUANTO TEMPO. Aqui você aprende a contar a música.",
aulas:[
{t:"Pulso: o coração da música", e:"💓", min:"10 min", sub:"A batida que você marca com o pé",
goal:"sentir e marcar o pulso de uma música, e entender o que é bpm.",
body:`
<p>Quando você ouve uma música e começa a bater o pé sem perceber, você está marcando o <b>pulso</b>. Pulso é uma batida <b>regular</b>, sempre com a mesma distância, que corre por baixo da música do começo ao fim.</p>
${box("ana","O pulso é como o coração. Ele bate sempre no mesmo ritmo, mesmo que você não pense nele. Pode bater mais devagar (quando você está calmo) ou mais rápido (quando corre), mas é sempre regular.")}
<h2>⏱️ BPM: a velocidade do pulso</h2>
<p>A velocidade do pulso se mede em <b>bpm</b>: <i>batidas por minuto</i>. 60 bpm é uma batida por segundo, igual ao ponteiro do relógio. 120 bpm são duas batidas por segundo.</p>
<p>O aparelho que marca o pulso é o <b>metrônomo</b>. Experimente:</p>
${metro(60,4)}
<h2>🎯 Pulso não é ritmo</h2>
<p>O pulso fica sempre igual. O <b>ritmo</b> é o desenho das notas por cima dele: algumas notas duram um pulso, outras duram vários, outras duram só um pedacinho. Nas próximas aulas você aprende a escrever esses desenhos.</p>
${box("dica","Estudar com metrônomo é o hábito que mais separa músicos amadores de profissionais. Ligue o metrônomo em todo estudo de ritmo, escala e método, começando devagar.")}
${box("pra","Ligue o metrônomo em 60 bpm e bata palma junto com cada clique durante 1 minuto, sem adiantar nem atrasar. Depois tente com 90 e com 120. Por último, desligue e ligue de novo depois de 10 segundos: você continuou no tempo?")}
${box("res","Pulso = batida regular da música. Bpm = quantas batidas por minuto. Metrônomo = aparelho que marca o pulso.")}
`,
quiz:[
["O que é o pulso?",["Uma nota muito forte","Uma batida regular que acompanha a música inteira","O som do bumbo"],1,"Pulso é a batida constante, o \"coração\" da música."],
["Uma música a 120 bpm tem quantas batidas por segundo?",["1","2","4"],1,"120 batidas ÷ 60 segundos = 2 por segundo."],
["Para que serve o metrônomo?",["Para afinar o instrumento","Para marcar o pulso numa velocidade escolhida","Para aumentar o volume"],1,"O metrônomo marca o pulso com cliques regulares."]
],
pdf:[["Andamento e expressividade",NP+"andamento variacoes e expressividade(1).pdf"]]},

{t:"As figuras: quanto tempo cada nota dura", e:"🍕", min:"18 min", sub:"Semibreve, mínima, semínima, colcheia, semicolcheia",
goal:"saber quanto vale cada figura e como elas se dividem.",
body:`
<p>A <b>forma</b> da nota mostra quanto tempo ela dura. Cada formato tem um nome. Por enquanto vamos medir tudo em <b>tempos</b> (pulsos), usando a semínima como 1 tempo, que é o caso mais comum.</p>
${tbl(["Figura","Como é","Duração (quando a semínima vale 1 tempo)"],[["<b>Semibreve</b>","bolinha vazia, sem haste","4 tempos"],["<b>Mínima</b>","bolinha vazia com haste","2 tempos"],["<b>Semínima</b>","bolinha cheia com haste","1 tempo"],["<b>Colcheia</b>","semínima com 1 bandeirinha","½ tempo"],["<b>Semicolcheia</b>","semínima com 2 bandeirinhas","¼ de tempo"]])}
${st("G","G4/w:Semibreve G4/h:Mínima G4/q:Semínima G4/e:Colcheia G4/s:Semicolcheia",{play:false,spacing:80})}
<h2>🍕 A regra da pizza</h2>
<p>Cada figura vale <b>metade</b> da figura anterior. Uma semibreve é uma pizza inteira. Corte ao meio: duas mínimas. Corte cada metade ao meio: quatro semínimas. E assim por diante.</p>
${tbl(["","Cabe quantas vezes numa semibreve?"],[["Mínima","2"],["Semínima","4"],["Colcheia","8"],["Semicolcheia","16"]])}
<p>Ouça as figuras uma depois da outra com o pulso marcado por baixo:</p>
${st("G","C5/w | C5/h C5/h | C5/q C5/q C5/q C5/q | C5/e C5/e C5/e C5/e C5/e C5/e C5/e C5/e",{time:"4/4",bpm:72,playNotes:"C5/w C5/h C5/h C5/q C5/q C5/q C5/q C5/e C5/e C5/e C5/e C5/e C5/e C5/e C5/e",cap:"Mesma nota, cada compasso com 4 tempos, dividido cada vez em partes menores"})}
${box("dica","Para contar colcheias, fale \"1 e 2 e 3 e 4 e\". Cada sílaba é uma colcheia. Para semicolcheias: \"1 e e e 2 e e e...\" ou use sílabas como \"ta-ka-di-mi\". Falar o ritmo antes de tocar evita metade dos erros.")}
${box("prof","Existem figuras ainda menores: <b>fusa</b> (3 bandeirinhas, ⅛ de tempo) e <b>semifusa</b> (4 bandeirinhas, 1/16 de tempo). E uma maior, a <b>breve</b>, que vale duas semibreves e quase não se usa hoje. Os livros tradicionais dão um número para cada figura: semibreve 1, mínima 2, semínima 4, colcheia 8, semicolcheia 16, fusa 32, semifusa 64. Esse número diz quantas daquela figura cabem numa semibreve, e é ele que aparece embaixo na fórmula de compasso.")}
${box("aten","As figuras não têm uma duração em segundos. Elas têm uma duração em <b>relação ao pulso</b>. Se o pulso for rápido, a semínima dura pouco; se for lento, dura mais. A proporção entre elas nunca muda.")}
${box("pra","Com o metrônomo a 60 bpm, fale \"tá\" segurando: 4 cliques (semibreve), 2 cliques (mínima), 1 clique (semínima), e dois \"tás\" por clique (colcheias).")}
${box("res","Semibreve 4, mínima 2, semínima 1, colcheia ½, semicolcheia ¼. Cada figura vale metade da anterior.")}
`,
quiz:[
["Quantas semínimas cabem numa mínima?",["2","4","1"],0,"Mínima = 2 tempos; semínima = 1 tempo."],
["Qual figura tem a bolinha cheia, haste e uma bandeirinha?",["Semínima","Colcheia","Semicolcheia"],1,"Uma bandeirinha = colcheia. Duas = semicolcheia."],
["Quantas colcheias cabem numa semibreve?",["4","8","16"],1,"Semibreve = 4 tempos; cada tempo tem 2 colcheias; 4 × 2 = 8."]
],
pdf:[["Pozzoli · Guia Prático",NP+"Guia Prático -Teórico Partes I e II(Pozzoli).pdf"],["Bohumil Med · Ritmo",NP+"Bohumil Med - Ritmo.pdf"]]},

{t:"As pausas: o silêncio também se escreve", e:"🤐", min:"10 min", sub:"Uma pausa para cada figura",
goal:"reconhecer as pausas e saber quanto cada uma dura.",
body:`
<p>Lembra que música é som <b>e silêncio</b>? Cada figura tem uma <b>pausa</b> com a mesma duração. Durante a pausa você não toca, mas continua <b>contando</b> o tempo.</p>
${st("G","r/w:Semibreve r/h:Mínima r/q:Semínima r/e:Colcheia r/s:Semicolcheia",{play:false,spacing:80})}
${tbl(["Pausa de...","Aparência","Duração"],[["Semibreve","retângulo <b>pendurado</b> na 4ª linha","4 tempos"],["Mínima","retângulo <b>sentado</b> na 3ª linha","2 tempos"],["Semínima","um zigue-zague em pé","1 tempo"],["Colcheia","um \"7\" com uma bolinha","½ tempo"],["Semicolcheia","um \"7\" com duas bolinhas","¼ de tempo"]])}
${box("dica","Para não confundir as pausas de semibreve e mínima: a de <b>semibreve</b> é mais \"pesada\" (dura mais), por isso fica <b>pendurada</b> para baixo, como um chapéu virado. A de <b>mínima</b> é mais leve e fica <b>sentada</b> em cima da linha, como um chapéu na cabeça.")}
${box("aten","Um detalhe que professores cobram: a pausa de semibreve também é usada para indicar <b>um compasso inteiro de silêncio</b>, qualquer que seja o compasso (3/4, 6/8...).")}
<p>Ouça um exemplo com notas e pausas misturadas. Nas pausas, continue contando mentalmente:</p>
${st("G","C5/q r/q C5/q r/q | C5/h r/h | C5/e C5/e r/q C5/q r/q | C5/w",{time:"4/4",bpm:80})}
${box("pra","Com o metrônomo a 70 bpm, bata palma nas notas do exemplo acima e fique em silêncio nas pausas, sem parar de contar \"1, 2, 3, 4\".")}
${box("res","Cada figura tem uma pausa do mesmo valor. Na pausa, o som para, mas a contagem continua.")}

{t:"Compasso: organizando os pulsos", e:"📦", min:"15 min", sub:"2/4, 3/4 e 4/4, tempo forte e fraco",
goal:"ler uma fórmula de compasso e sentir a diferença entre 2, 3 e 4 tempos.",
body:`
<p>Na música, os pulsos não são todos iguais: alguns são mais <b>fortes</b> (apoiados) e outros mais <b>fracos</b>. Esses pulsos se agrupam em pacotinhos que se repetem: os <b>compassos</b>. Na partitura, cada compasso é separado por uma linha vertical, a <b>barra de compasso</b>.</p>
<h2>🔢 A fórmula de compasso</h2>
<p>No começo da música aparecem dois números, um em cima do outro. Isso é a <b>fórmula de compasso</b>:</p>
<ul>
<li><b>Número de cima</b>: quantos tempos tem cada compasso.</li>
<li><b>Número de baixo</b>: qual figura vale 1 tempo. <b>4</b> significa semínima; <b>2</b> significa mínima; <b>8</b> significa colcheia.</li>
</ul>
${box("ana","Pense em caixas de ovos. O número de cima diz quantos ovos cabem em cada caixa; o de baixo diz o tamanho do ovo. 3/4 = caixas com 3 ovos do tamanho \"semínima\".")}
<h2>🥁 Os três compassos mais comuns</h2>
<h3>2/4: binário (FORTE – fraco)</h3>
<p>Marchas, dobrados, frevos, muito samba e muito forró.</p>
${st("G","C5/q*:1 G4/q:2 | C5/q*:1 G4/q:2 | C5/q*:1 G4/q:2 | C5/h*:1",{time:"2/4",bpm:100})}
<h3>3/4: ternário (FORTE – fraco – fraco)</h3>
<p>Valsas, muitos hinos, guarânias.</p>
${st("G","C5/q*:1 G4/q:2 G4/q:3 | C5/q*:1 G4/q:2 G4/q:3 | C5/h.*:1",{time:"3/4",bpm:110})}
<h3>4/4: quaternário (FORTE – fraco – meio-forte – fraco)</h3>
<p>O mais usado de todos: pop, rock, gospel, jazz, baladas. Também é chamado de <b>compasso comum</b> e pode aparecer como a letra <b>C</b>.</p>
${st("G","C5/q*:1 G4/q:2 E4/q:3 G4/q:4 | C5/q*:1 G4/q:2 E4/q:3 G4/q:4 | C5/w*:1",{time:"4/4",bpm:100})}
${box("aten","A soma das figuras dentro de cada compasso tem que dar exatamente o que a fórmula manda. Em 3/4, cada compasso soma 3 semínimas: pode ser uma mínima + uma semínima, ou seis colcheias, ou uma semínima + pausa de mínima...")}
${box("prof","O primeiro tempo de cada compasso é o <b>tempo forte</b> e costuma ser o lugar onde a harmonia muda. Por isso reconhecer o tempo 1 é importante para quem acompanha e para quem improvisa. Existe também o <b>compasso composto</b> (6/8, 9/8, 12/8), em que cada tempo se divide em três; você estuda no Nível 2.")}
${box("pra","Ligue o metrônomo e conte em voz alta, batendo palma mais forte no \"1\": em 2 (\"UM dois\"), em 3 (\"UM dois três\") e em 4 (\"UM dois três quatro\"). Depois ouça uma música que você conhece e descubra se ela é em 2, 3 ou 4.")}
${metro(90,3)}
${box("res","Compasso = grupo de pulsos com tempo forte no início. Fórmula: número de cima = quantos tempos; número de baixo = qual figura vale 1 tempo (4 = semínima).")}
`,
quiz:[
["No compasso 3/4, o número 3 significa...",["3 tempos por compasso","que a música tem 3 partes","que a colcheia vale 1 tempo"],0,"Número de cima = quantos tempos em cada compasso."],
["No compasso 3/4, o número 4 significa...",["4 compassos","que a semínima vale 1 tempo","4 notas por compasso"],1,"Número de baixo = qual figura é a unidade de tempo; 4 = semínima."],
["Qual compasso combina com uma valsa?",["2/4","3/4","4/4"],1,"A valsa é o exemplo clássico de compasso ternário: UM-dois-três."]
],
pdf:[["Pozzoli · Divisão rítmica",NP+"Guia Prático -Teórico Partes I e II(Pozzoli).pdf"],["Teoria Elementar (Pablo Gusmão) · tópico 2",NP+"Teoria Elementar da Música(Pablo Gusmão).pdf"]]},

{t:"Ponto de aumento e ligadura", e:"➕", min:"12 min", sub:"Somando durações",
goal:"calcular a duração de notas pontuadas e ligadas.",
body:`
<h2>• O ponto de aumento</h2>
<p>Um pontinho <b>ao lado</b> da nota aumenta a duração dela em <b>metade do valor dela mesma</b>.</p>
${tbl(["Figura","Valor","Com ponto"],[["Semibreve","4","4 + 2 = <b>6</b>"],["Mínima","2","2 + 1 = <b>3</b>"],["Semínima","1","1 + ½ = <b>1 e ½</b>"],["Colcheia","½","½ + ¼ = <b>¾</b>"]])}
${st("G","G4/h.:3_tempos G4/q:1 | G4/q.:1½ G4/e:½ G4/h:2",{time:"4/4",bpm:80,cap:"A mínima pontuada enche um compasso de 3/4; a semínima pontuada quase sempre vem acompanhada de uma colcheia"})}
${box("ana","O ponto é uma \"sobremesa\" que vale a metade do prato principal. Se o prato (a mínima) vale 2, a sobremesa vale 1, e o total dá 3.")}
<h2>⌒ A ligadura de valor</h2>
<p>A <b>ligadura</b> é um arco que une <b>duas notas iguais</b> (mesma altura). Você toca só a primeira e <b>segura</b> o som durante a duração das duas somadas. A segunda nota não é atacada de novo.</p>
${st("G","C5/h C5/q G4/q | G4/w",{time:"4/4",bpm:80,playNotes:"C5/h C5/q G4/h. G4/q",cap:"Se o Sol do fim do 1º compasso estiver ligado ao Sol do compasso seguinte, você toca uma nota só, que dura 1 + 4 = 5 tempos"})}
<p>A ligadura é a única forma de fazer uma nota <b>atravessar a barra de compasso</b>, e de escrever durações que não existem como uma figura só (por exemplo, 5 tempos).</p>
${box("aten","Cuidado para não confundir: um arco que liga notas <b>diferentes</b> não é ligadura de valor, é <b>ligadura de expressão</b> (ou de frase). Ela manda tocar as notas bem ligadas, sem separar. Você estuda isso na aula de articulação, no Nível 2.")}
${box("pra","Calcule: mínima pontuada + semínima = ? (resposta: 4 tempos). Semínima pontuada + colcheia = ? (resposta: 2 tempos). Semibreve ligada a mínima = ? (resposta: 6 tempos).")}
${box("res","Ponto = soma metade do valor da própria nota. Ligadura de valor = junta duas notas iguais numa só, somando as durações.")}
`,
quiz:[
["Quanto vale uma mínima pontuada?",["2 tempos","3 tempos","4 tempos"],1,"2 + metade de 2 (1) = 3."],
["Quanto vale uma semínima pontuada?",["1 tempo e meio","2 tempos","1 tempo"],0,"1 + ½ = 1½."],
["Numa ligadura de valor, quantas vezes você ataca a nota?",["Duas vezes","Uma vez, e segura","Nenhuma"],1,"Toca-se só a primeira e segura-se pela soma das duas."]
],
pdf:[["Bohumil Med · Teoria",NP+"Teoria da Música - Bohumil Med 4º Edição.pdf"]]},

{t:"Juntando tudo: sua primeira leitura", e:"🏆", min:"20 min", sub:"Lendo uma melodia completa",
goal:"ler sozinho uma melodia completa: notas, ritmo e compasso.",
body:`
<p>Você já sabe o suficiente para ler uma música de verdade. Vamos usar uma melodia que quase todo mundo conhece: <b>"Brilha, brilha, estrelinha"</b>, uma canção folclórica muito antiga.</p>
<h2>📝 O método em 5 passos (use sempre)</h2>
<ol>
<li><b>Olhe a clave</b>: é de Sol ou de Fá?</li>
<li><b>Olhe a fórmula de compasso</b>: quantos tempos por compasso e quem vale 1 tempo.</li>
<li><b>Leia só o ritmo</b>, falando "tá" e batendo o pulso com o pé.</li>
<li><b>Leia só os nomes das notas</b>, em voz alta, sem ritmo.</li>
<li><b>Junte os dois</b>: fale os nomes das notas no ritmo certo. Só depois toque ou cante.</li>
</ol>
<h2>🎼 Na clave de Sol</h2>
${st("G","C4/q C4/q G4/q G4/q | A4/q A4/q G4/h | F4/q F4/q E4/q E4/q | D4/q D4/q C4/h ||",{time:"4/4",bpm:96,cap:"Dó Dó Sol Sol | Lá Lá Sol | Fá Fá Mi Mi | Ré Ré Dó"})}
<h2>🎺 A mesma melodia na clave de Fá (tom do trombone)</h2>
<p>Agora uma oitava abaixo, começando no Si bemol, que é a nota mais fácil do trombone. É a mesma melodia, só que em outra altura (você vai entender o porquê no Nível 2).</p>
${st("F","Bb2/q Bb2/q F3/q F3/q | G3/q G3/q F3/h | Eb3/q Eb3/q D3/q D3/q | C3/q C3/q Bb2/h ||",{time:"4/4",bpm:96,cap:"Si♭ Si♭ Fá Fá | Sol Sol Fá | Mi♭ Mi♭ Ré Ré | Dó Dó Si♭"})}
${box("dica","Repare como a melodia é construída: os compassos 1-2 sobem e param numa nota longa; os compassos 3-4 descem degrau por degrau até a nota de partida. Perceber esses desenhos é o começo de \"entender\" uma música e não só decorar.")}
${box("pra","Faça os 5 passos com a versão em clave de Fá. Se você já tem o trombone, toque; se não, cante. Depois ouça e compare.")}
<h2>🎓 O que você aprendeu no Nível 1</h2>
<ul><li>Som é vibração, e tem altura, duração, intensidade e timbre.</li><li>As 7 notas, em nome e em letra, e o que é uma oitava.</li><li>O teclado como mapa: 12 notas por oitava.</li><li>Pauta, clave de Sol, clave de Fá, linhas suplementares e Dó central.</li><li>Pulso, figuras, pausas, compasso, ponto e ligadura.</li></ul>
${box("res","Método de leitura: clave → compasso → ritmo → nomes → juntar. Faça sempre nessa ordem.")}
`,
quiz:[
["Qual é o PRIMEIRO passo para ler uma partitura?",["Tocar direto","Olhar a clave","Ler a última nota"],1,"A clave diz o nome das notas; sem ela, nada faz sentido."],
["Na melodia em 4/4 acima, quantos tempos soma cada compasso?",["3","4","2"],1,"4/4 = 4 semínimas por compasso."],
["Por que ler o ritmo separado das notas no começo?",["Porque é mais bonito","Para resolver uma dificuldade de cada vez e errar menos","Porque o ritmo não importa"],1,"Separar as tarefas é a forma mais rápida de aprender a ler bem."]
],
pdf:[["Da Capo · Trombone","Da Capo - Trombone_.pdf"],["50 solfejos fáceis",NP+"50 solfejos faceis.pdf"]]}
]}
]});

</script>

CURSO.push({id:"n2", nome:"Nível 2 · Básico", emoji:"📖", pill:"Escalas, intervalos, ritmo e sinais",

mods:[

/* ============ MÓDULO 1 · DEGRAUS ============ */
{id:"n2m1", t1:"Tons &", t2:"Semitons", g:"🪜", c:"#e11d2a", sub:"Os degraus da música e os acidentes",
desc:"As 12 notas, o menor degrau da música (semitom), o sustenido, o bemol, o bequadro e as notas que têm dois nomes.",
aulas:[
{t:"Tom e semitom: o tamanho dos degraus", e:"📐", min:"12 min", sub:"A medida básica de distância entre notas",
goal:"medir a distância entre duas notas em tons e semitons, no teclado e na pauta.",
body:`
<p>No Nível 1 você viu que existem <b>12 notas</b> diferentes numa oitava (7 teclas brancas e 5 pretas). A distância entre duas teclas <b>vizinhas</b>, sem pular nenhuma, é o menor degrau da música ocidental: o <b>semitom</b>.</p>
<ul>
<li><b>Semitom</b> = de uma tecla para a vizinha mais próxima (branca ou preta).</li>
<li><b>Tom</b> = dois semitons.</li>
</ul>
${kb("C4","B4","C4:1 C#4:2",{cap:"Dó → Dó♯ (a preta ao lado): 1 semitom"})}
${kb("C4","B4","C4:1 D4:2",{cap:"Dó → Ré: 2 semitons = 1 tom (tem uma tecla preta no meio)"})}
<h2>🔍 Os dois semitons \"escondidos\"</h2>
<p>Lembra que entre <b>Mi e Fá</b> e entre <b>Si e Dó</b> não existe tecla preta? Isso quer dizer que eles já são vizinhos: a distância é de <b>um semitom</b>. Entre todas as outras notas brancas vizinhas, a distância é de <b>um tom</b>.</p>
${tbl(["Dó→Ré","Ré→Mi","Mi→Fá","Fá→Sol","Sol→Lá","Lá→Si","Si→Dó"],[["Tom","Tom","<b style='color:#ff4d4d'>Semitom</b>","Tom","Tom","Tom","<b style='color:#ff4d4d'>Semitom</b>"]])}
${ouvir("E4/h F4/h B4/h C5/h","Ouvir Mi-Fá e Si-Dó (semitons)",70)} ${ouvir("C4/h D4/h F4/h G4/h","Ouvir Dó-Ré e Fá-Sol (tons)",70)}
${box("ana","Numa escada comum, todos os degraus têm a mesma altura. A escada das notas brancas é diferente: a maioria dos degraus é \"alta\" (um tom), mas dois são \"baixinhos\" (meio tom). A posição desses dois degraus baixinhos é o que dá personalidade às escalas, como você vai ver no Módulo 2.")}
${box("aten","Na pauta, notas vizinhas (linha → espaço) sempre parecem ter a mesma distância, mas <b>não têm</b>. Mi-Fá parece igual a Fá-Sol no papel, mas soa menor. A pauta mostra a ordem das notas, não o tamanho exato dos degraus.")}
${box("prof","No sistema usado hoje, chamado <b>temperamento igual</b>, a oitava é dividida em 12 semitons exatamente iguais: cada semitom multiplica a frequência pela raiz duodécima de 2 (¹²√2), cerca de 1,0595. Músicos também dividem o semitom em 100 <b>cents</b>, a unidade que aparece nos afinadores eletrônicos.")}
${box("pra","Num teclado (ou aplicativo), toque Dó e vá subindo tecla por tecla, contando os semitons até o próximo Dó. Você deve contar 12.")}
${box("res","Semitom = teclas vizinhas. Tom = 2 semitons. Entre as brancas, só Mi-Fá e Si-Dó são semitons; o resto é tom.")}
`,
quiz:[
["Quantos semitons tem um tom?",["1","2","3"],1,"Tom = 2 semitons."],
["Qual é a distância entre Mi e Fá?",["Um tom","Um semitom","Dois tons"],1,"Não há tecla preta entre eles: são vizinhos."],
["Qual é a distância entre Sol e Lá?",["Um tom","Um semitom","Um tom e meio"],0,"Há uma tecla preta no meio: 2 semitons = 1 tom."]
],

{t:"Sustenido, bemol e bequadro", e:"♯", min:"14 min", sub:"Os acidentes",
goal:"ler e usar os acidentes e saber até onde vale o efeito de cada um.",
body:`
<p>Para chegar nas teclas pretas (e em outras notas "do meio"), a música usa três sinais chamados <b>acidentes</b>. Eles ficam <b>antes</b> da nota, na mesma linha ou espaço dela.</p>
${tbl(["Sinal","Nome","O que faz"],[["<b style='font-size:22px'>♯</b>","Sustenido","<b>Sobe</b> a nota 1 semitom"],["<b style='font-size:22px'>♭</b>","Bemol","<b>Desce</b> a nota 1 semitom"],["<b style='font-size:22px'>♮</b>","Bequadro","<b>Cancela</b> o sustenido ou o bemol e volta a nota ao natural"]])}
${st("G","F4/h:Fá F#4/h*:Fá♯ | B4/h:Si Bb4/h*:Si♭ | Bb4/h Bn4/h*:Si♮",{bpm:70,cap:"Fá → Fá sustenido; Si → Si bemol; Si bemol → Si natural (bequadro)"})}
${kb("C4","B4","F4:Fá F#4:Fá♯ Bb4:Si♭ B4:Si",{cap:"Fá♯ é a preta à direita do Fá. Si♭ é a preta à esquerda do Si."})}
<h2>⏳ Até onde vale um acidente?</h2>
<ol>
<li>O acidente vale para aquela nota <b>até o fim do compasso</b>.</li>
<li>Vale só para a nota <b>na mesma altura</b> (mesma linha ou espaço). Um Fá♯ na 1ª linha não muda o Fá de outra oitava.</li>
<li>Na barra de compasso, o efeito <b>acaba</b>. A exceção é quando a nota está <b>ligada</b> (ligadura de valor) ao compasso seguinte: a nota ligada continua alterada.</li>
</ol>
${st("G","F#4/q F4/q F4/q Fn4/q | F4/w",{time:"4/4",bpm:80,playNotes:"F#4/q F#4/q F#4/q F4/q F4/w",cap:"No 1º compasso, os três primeiros Fás são sustenidos (o acidente vale até o fim do compasso); o bequadro cancela no 4º tempo. No 2º compasso, o Fá já é natural."})}
${box("aten","Muitos iniciantes esquecem a regra 1 e tocam só a primeira nota com sustenido. Quando vir um acidente, passe o olho pelo resto do compasso procurando a mesma nota. Muitos editores escrevem um acidente \"de cortesia\" (às vezes entre parênteses) no compasso seguinte só para lembrar.")}
<h2>♯♯ Dobrado sustenido e dobrado bemol</h2>
<p>Às vezes a teoria precisa subir ou descer uma nota <b>dois semitons</b> mantendo o mesmo nome. Para isso existem o <b>dobrado sustenido</b> (𝄪, parece um "x") e o <b>dobrado bemol</b> (♭♭). São raros no começo, mas aparecem em tonalidades com muitos acidentes e em escalas como a menor harmônica de Sol♯.</p>
${box("prof","Existem dois tipos de acidente na partitura: os <b>ocorrentes</b> (escritos ao lado da nota, com as regras acima) e os <b>fixos</b>, da <b>armadura de clave</b>, escritos logo depois da clave e válidos para a música inteira, em todas as oitavas. A armadura é o assunto do Módulo 2.")}
${box("pra","No teclado: ache Dó♯, Ré♭, Fá♯, Sol♭, Si♭ e Lá♯. Algumas dessas são a mesma tecla! Qual par? (A resposta vem na próxima aula.)")}
${box("res","♯ sobe 1 semitom, ♭ desce 1 semitom, ♮ cancela. O acidente vale até o fim do compasso, só naquela altura.")}
`,
quiz:[
["O bemol...",["sobe a nota 1 semitom","desce a nota 1 semitom","cancela o acidente"],1,"Bemol desce meio tom."],
["Um Sol♯ aparece no 1º tempo. No 3º tempo do mesmo compasso há outro Sol na mesma linha, sem acidente. Ele é...",["Sol natural","Sol♯","depende do compositor"],1,"O acidente vale até o fim do compasso para aquela nota."],
["Para que serve o bequadro?",["Para subir 2 semitons","Para cancelar um sustenido ou bemol","Para indicar pausa"],1,"Bequadro devolve a nota ao estado natural."]
],
pdf:[["Urtado · Acidentes",NP+"Apostila de Teoria Musical [2.0].pdf"],["Lacerda · Regras de grafia",NP+"Regras da Grafia Musical - Osvaldo Lacerda.pdf"]]},

{t:"Enarmonia e a escala cromática", e:"🎭", min:"10 min", sub:"Uma tecla, dois nomes",
goal:"entender por que Dó♯ e Ré♭ são o mesmo som, e tocar a escala cromática.",
body:`
<p>A tecla preta entre Dó e Ré pode ser chamada de <b>Dó♯</b> (Dó subido) ou de <b>Ré♭</b> (Ré abaixado). É o <b>mesmo som</b>, com dois nomes. Isso se chama <b>enarmonia</b>, e as duas notas são <b>enarmônicas</b>.</p>
${kb("C4","B4","C#4:Dó♯/Ré♭ D#4:Ré♯/Mi♭ F#4:Fá♯/Sol♭ G#4:Sol♯/Lá♭ A#4:Lá♯/Si♭",{ww:44,cap:"Cada tecla preta tem dois nomes"})}
<p>Até teclas brancas podem ter outro nome: <b>Mi♯</b> soa igual a Fá, e <b>Dó♭</b> soa igual a Si. Parece estranho, mas às vezes a teoria precisa desses nomes.</p>
${box("ana","É como uma pessoa com nome e apelido. \"Roberto\" e \"Beto\" são a mesma pessoa, mas em cada situação um nome faz mais sentido. Na música, o nome certo depende da escala e do acorde em que a nota está, como você vai ver nas próximas aulas.")}
<h2>🌈 A escala cromática</h2>
<p>Se você tocar <b>todas as 12 notas</b> seguidas, de semitom em semitom, você tem a <b>escala cromática</b>. "Cromático" vem de <i>cor</i>: são todas as cores entre uma nota e outra.</p>
<p>A convenção mais comum de escrita: <b>subindo, use sustenidos</b>; <b>descendo, use bemóis</b>. Assim cada nota \"aponta\" para a direção em que a melodia vai.</p>
${st("G","C4/e C#4/e D4/e D#4/e E4/e F4/e F#4/e G4/e G#4/e A4/e A#4/e B4/e C5/q",{bpm:80,cap:"Escala cromática subindo (com sustenidos)"})}
${st("G","C5/e B4/e Bb4/e A4/e Ab4/e G4/e Gb4/e F4/e E4/e Eb4/e D4/e Db4/e C4/q",{bpm:80,cap:"Escala cromática descendo (com bemóis)"})}
${box("prof","Quando se consideram as funções harmônicas, a escrita cromática pode seguir outras regras (a chamada escala cromática \"harmônica\" ou \"tonal\" escolhe as alterações conforme a tonalidade). Para leitura e exercícios técnicos, a regra \"sustenido sobe, bemol desce\" é a mais usada.")}
${box("pra","No instrumento (ou cantando devagar), toque a escala cromática subindo e descendo com o metrônomo a 60, uma nota por clique. É um dos melhores exercícios técnicos para qualquer instrumento, e no trombone ele treina todas as 7 posições da vara.")}
${box("res","Enarmonia = mesmo som, nomes diferentes (Dó♯ = Ré♭). Escala cromática = as 12 notas em semitons. Subindo, sustenidos; descendo, bemóis.")}
`,

],

{id:"n2m2", t1:"Escalas &", t2:"Tonalidades", g:"🎼", c:"#f59e0b", t2c:"#ffb020", sub:"Escala maior, menores, armadura, ciclo",
desc:"A escala é o \"alfabeto\" de uma música. Aqui você aprende a montar qualquer escala maior ou menor, entende a armadura de clave e o ciclo de quintas.",
aulas:[
{t:"A escala maior: a receita T-T-S-T-T-T-S", e:"☀️", min:"15 min", sub:"Montando a escala maior em qualquer nota",
goal:"montar a escala maior começando de qualquer nota.",
body:`
<p>Uma <b>escala</b> é uma sequência de notas em ordem, subindo ou descendo, de uma nota até a sua oitava. A mais importante da música ocidental é a <b>escala maior</b>. Toque só as teclas brancas de Dó a Dó e você terá a escala de <b>Dó maior</b>.</p>
${st("G","C4/q:1 D4/q:2 E4/q:3 F4/q:4 G4/q:5 A4/q:6 B4/q:7 C5/q:8",{bpm:100,cap:"Dó maior: nenhum sustenido ou bemol"})}
<h2>📐 A receita</h2>
<p>Meça a distância entre cada nota da escala de Dó maior:</p>
${tbl(["Dó→Ré","Ré→Mi","Mi→Fá","Fá→Sol","Sol→Lá","Lá→Si","Si→Dó"],[["T","T","<b style='color:#ff4d4d'>S</b>","T","T","T","<b style='color:#ff4d4d'>S</b>"]])}
<p style="text-align:center;font-size:22px;font-weight:900;letter-spacing:4px">T – T – S – T – T – T – S</p>
<p>Esse desenho de tons (T) e semitons (S) é a <b>receita da escala maior</b>. Qualquer escala maior, começando em qualquer nota, segue exatamente essa receita. É ela que dá o som "alegre e resolvido" que todo mundo reconhece.</p>
<h2>🍳 Usando a receita: Sol maior</h2>
<p>Comece no Sol e aplique a receita:</p>
<ol><li>Sol → (T) → <b>Lá</b></li><li>Lá → (T) → <b>Si</b></li><li>Si → (S) → <b>Dó</b></li><li>Dó → (T) → <b>Ré</b></li><li>Ré → (T) → <b>Mi</b></li><li>Mi → (T) → ? De Mi para Fá é só semitom. Para ter um tom, precisamos de <b>Fá♯</b>.</li><li>Fá♯ → (S) → <b>Sol</b> ✔️</li></ol>
${st("G","G4/q:1 A4/q:2 B4/q:3 C5/q:4 D5/q:5 E5/q:6 F#5/q*:7 G5/q:8",{bpm:100,cap:"Sol maior: um sustenido (Fá♯)"})}
<h2>🍳 Fá maior</h2>
<p>Fá → Sol (T) → Lá (T) → ? De Lá para Si é tom, mas a receita pede <b>semitom</b>. Então usamos <b>Si♭</b>. Depois: Si♭ → Dó (T) → Ré (T) → Mi (T) → Fá (S) ✔️</p>
${st("F","F2/q:1 G2/q:2 A2/q:3 Bb2/q*:4 C3/q:5 D3/q:6 E3/q:7 F3/q:8",{bpm:100,cap:"Fá maior na clave de Fá: um bemol (Si♭)"})}
${box("aten","Regra importante de escrita: numa escala de 7 notas, <b>cada letra aparece uma vez só</b>. Por isso em Fá maior escrevemos Si♭ (e não Lá♯): já existe um Lá, e o Si ficaria sem aparecer. Essa regra decide qual dos nomes enarmônicos usar.")}
${box("ana","A receita é como a receita de um bolo: se você mudar a quantidade de um ingrediente, sai outro bolo. Se você mudar a ordem dos T e S, sai outra escala, com outro sabor (menor, dórica, etc.).")}
${box("pra","Monte, no papel, as escalas maiores de <b>Ré</b> (resposta: Ré Mi Fá♯ Sol Lá Si Dó♯ Ré) e de <b>Si♭</b> (resposta: Si♭ Dó Ré Mi♭ Fá Sol Lá Si♭). Si♭ maior é a escala mais importante do trombone.")}
${st("F","Bb2/q:1 C3/q:2 D3/q:3 Eb3/q:4 F3/q:5 G3/q:6 A3/q:7 Bb3/q:8",{bpm:100,cap:"Si♭ maior: a primeira escala de quase todo trombonista"})}
${box("res","Escala maior = T-T-S-T-T-T-S. Cada letra aparece uma vez. Com essa receita você monta a escala maior de qualquer nota.")}
`,
quiz:[
["Qual é a receita da escala maior?",["T-S-T-T-S-T-T","T-T-S-T-T-T-S","S-T-T-T-S-T-T"],1,"T-T-S-T-T-T-S."],
["Qual nota tem acidente na escala de Sol maior?",["Si♭","Fá♯","Dó♯"],1,"Mi→Fá♯ garante o tom que a receita pede."],
["Por que em Fá maior escrevemos Si♭ e não Lá♯?",["Porque soa diferente","Porque cada letra deve aparecer só uma vez na escala","Porque bemol é mais fácil"],1,"Si♭ e Lá♯ soam igual, mas com Lá♯ teríamos dois Lás e nenhum Si."]
],
