   <div class="mhero"><div class="kick">${esc(M.lvl.nome)} · Módulo ${M.no}</div><h1>${esc(M.t1)} <span>${esc(M.t2)}</span></h1><p>${esc(M.desc)}</p>
   <div class="mbar"><div class="bar"><i style="width:${d/t*100}%"></i></div><small>${d}/${t} aulas</small></div></div>
   <div class="lesslist">${M.aulas.map(A=>`<a class="lrow" href="#/a/${A.id}"><span class="chk ${done[A.id]?'on':''}">${done[A.id]?"✓":""}</span><span class="thumb">${A.e}</span><span class="lt"><b>${A.no}. ${esc(A.t)}</b><small>${esc(A.sub||"")}</small></span><span class="tm">${esc(A.min||"")}</span></a>`).join("")}</div></div>`;
}

function lessonPage(A){
  const M=A.mod, i=ALL.indexOf(A), prev=ALL[i-1], next=ALL[i+1];
  const quiz = (A.quiz||[]).map((q,k)=>`<div class="qq" data-ok="${q[2]}"><div class="qt">${k+1}. ${q[0]}</div><div class="ops">${q[1].map((o,j)=>`<button class="op" data-j="${j}">${o}</button>`).join("")}</div><div class="exp">${q[3]||""}</div></div>`).join("");
  return `<div class="page" style="--c:${M.c}">
   <div class="crumbs"><a href="#/">🏠 Início</a> › <a href="#/m/${M.id}">${esc(M.lvl.nome)} · ${esc(M.t1+" "+M.t2)}</a> › <span>Aula ${A.no}</span></div>
   <div class="lesson-head"><div class="kick">Aula ${A.no} de ${M.aulas.length} · ${esc(M.t1+" "+M.t2)}</div><h1>${A.e} ${esc(A.t)}</h1>
   <div class="meta">⏱ ${esc(A.min||"")}</div>${A.goal?`<div class="goal">🎯 <b>Ao final você vai:</b> ${A.goal}</div>`:""}</div>
   <div class="content">${A.body}
   ${quiz?`<h2>🧠 Teste rápido</h2><div class="quiz">${quiz}</div>`:""}
   ${(A.pdf&&A.pdf.length)?`<h2>📚 Para ir além (complemento)</h2><p style="font-size:14px;color:#a1a1aa">${PUBLICO?"Livros e apostilas que falam do mesmo assunto, com a página onde o tema é explicado, para quem tiver o material.":"Material da pasta de estudos que fala do mesmo assunto, com a página onde o tema é explicado. O link abre o PDF direto nessa página."}</p><div class="pdfs">${A.pdf.map(m=>{ const pg=m[2]; const pt=pg?` <b class="pgn">${esc(pg[1]||("pág. "+pg[0]))}</b>`:""; const isImg=/\.(png|jpg)$/i.test(m[1]);
     if(PUBLICO) return isImg?"":`<span class="mat">📄 ${esc(m[0])}${pt}</span>`;
     return `<a class="mat" href="${fileUrl(m[1])}${pg?"#page="+pg[0]:""}" target="_blank" rel="noopener">${isImg?"🗺️":"📄"} ${esc(m[0])}${pt}</a>`; }).join("")}</div>`:""}
   </div>
   <div class="lfoot">${prev?`<a class="btn" href="#/a/${prev.id}">← Anterior</a>`:"<span></span>"}
    <button class="btn ${done[A.id]?'done':''}" id="markdone">${done[A.id]?"✓ Aula concluída":"Marcar como concluída"}</button>
    ${next?`<a class="btn pri" href="#/a/${next.id}" id="nextbtn">Próxima →</a>`:`<a class="btn pri" href="#/">🏁 Fim do curso</a>`}</div></div>`;
}

function route(){
  stopAll(); stopGroove(); clearTimeout(metroTimer);
  const h=location.hash||"#/", app=document.getElementById("app");
  let m;
  if((m=h.match(/^#\/m\/(\w+)/)) && MODS[m[1]]){ app.innerHTML=modPage(MODS[m[1]]); scrollTo(0,0); document.title=MODS[m[1]].t1+" "+MODS[m[1]].t2+" · Escola de Música"; }
  else if((m=h.match(/^#\/a\/(\w+)/)) && LES[m[1]]){
    const A=LES[m[1]]; app.innerHTML=lessonPage(A); scrollTo(0,0); document.title=A.t+" · Escola de Música";
    hydrate(app);
    app.querySelectorAll(".qq").forEach(q=>q.querySelectorAll(".op").forEach(b=>b.onclick=()=>{
      if(q.classList.contains("answered")) return; q.classList.add("answered");
      const ok=+q.dataset.ok; q.querySelectorAll(".op").forEach((x,j)=>{ if(j===ok) x.classList.add("ok"); });
      if(+b.dataset.j!==ok) b.classList.add("bad");
      const all=[...app.querySelectorAll(".qq")]; if(all.every(z=>z.classList.contains("answered"))){ done[A.id]=true; save(); const md=document.getElementById("markdone"); md.classList.add("done"); md.textContent="✓ Aula concluída"; }
    }));
    document.getElementById("markdone").onclick=e=>{ done[A.id]=!done[A.id]; if(!done[A.id]) delete done[A.id]; save(); e.target.classList.toggle("done",!!done[A.id]); e.target.textContent=done[A.id]?"✓ Aula concluída":"Marcar como concluída"; };
  }
  else { app.innerHTML=home(); document.title="Escola de Música";
    const r=document.getElementById("reset"); if(r) r.onclick=()=>{ if(confirm("Zerar todo o progresso?")){ done={}; save(); route(); } };
    app.querySelectorAll("[data-jump]").forEach(a=>a.onclick=e=>{ e.preventDefault(); document.getElementById(a.dataset.jump).scrollIntoView({behavior:"smooth"}); });
    const sy=sessionStorage.getItem("sy"); if(sy){ scrollTo(0,+sy); }
  }
}
addEventListener("scroll",()=>{ if((location.hash||"#/")==="#/"){ try{sessionStorage.setItem("sy",scrollY)}catch(e){} } });
addEventListener("hashchange",route);
route();
</script>
</body>
</html>
