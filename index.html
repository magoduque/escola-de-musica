{t:"Dominantes secundárias", e:"🎯", min:"16 min", sub:"Emprestando um V7 para qualquer acorde",
goal:"criar e reconhecer dominantes secundárias (V7 de outros graus).",
body:`
<p>O V7 é tão forte que a música \"empresta\" essa força para outros acordes. Qualquer acorde maior ou menor do campo pode ganhar o <b>seu próprio V7</b>, tocado logo antes dele. Esse acorde emprestado é uma <b>dominante secundária</b>, escrita como <b>V7/X</b> (\"cinco do X\").</p>
${tbl(["Acorde alvo (em Dó)","Sua dominante","Nota alterada (fora do tom)","Símbolo"],[["Dm (II)","<b>A7</b>","Dó♯","V7/II"],["Em (III)","<b>B7</b>","Ré♯","V7/III"],["F (IV)","<b>C7</b>","Si♭","V7/IV"],["G (V)","<b>D7</b>","Fá♯","V7/V"],["Am (VI)","<b>E7</b>","Sol♯","V7/VI"]])}
<p>(O VII diminuto não recebe dominante secundária, porque um acorde diminuto não funciona como \"casa\" temporária.)</p>
${ouvir("C4+E4+G4/h C4+E4+G4/h D4+F4+A4/h D4+F4+A4/h G3+B3+D4+F4/h G3+B3+D4+F4/h C4+E4+G4/w","Sem secundária: C – Dm – G7 – C",90)} ${ouvir("C4+E4+G4/h A3+C#4+E4+G4/h D4+F4+A4/h D4+F#4+A4+C5/h G3+B3+D4+F4/h G3+B3+D4+F4/h C4+E4+G4/w","Com secundárias: C – A7 – Dm – D7 – G7 – C",90)}
${box("ana","É como dar um \"trampolim\" antes de cada acorde. O ouvido sente o acorde seguinte como uma casa temporária, só por um instante.")}
<h2>🔗 Com o II junto: II–V secundário</h2>
<p>Você também pode colocar o II antes da dominante secundária, criando um II–V para qualquer acorde. Para chegar em Dm7: <b>Em7(♭5) – A7 – Dm7</b> (II–V menor, porque Dm é menor). Esse II que prepara uma dominante secundária é chamado por Chediak de <b>II cadencial</b>.</p>
${ouvir("E3+Bb3+D4+G4/w A2+G3+C#4+E4/w D3+F3+A3+C4/w","Ouvir Em7(♭5) – A7 – Dm7",70)}
${box("prof","A dominante secundária cria uma <b>tonicização</b>: o acorde alvo soa como tônica por um momento, sem que a música mude de tom de verdade. Quando a nova tônica se firma por muitos compassos, com cadências próprias, aí sim é uma <b>modulação</b>.")}
${box("pra","No tom de Si♭ maior, encontre as dominantes secundárias de Cm (G7), Dm (A7), E♭ (B♭7), F (C7) e Gm (D7).")}
${box("res","Dominante secundária = V7 de um acorde que não é a tônica. Em Dó: A7→Dm, B7→Em, C7→F, D7→G, E7→Am.")}
`,
quiz:[
["Qual é a dominante secundária que leva a Dm, em Dó maior?",["A7","D7","G7"],0,"V de Ré = Lá: A7 (V7/II)."],
["D7 em Dó maior é o...",["V7/V","V7/IV","V7/II"],0,"D7 resolve em G, o V grau."],
["O que é tonicização?",["Mudar de tom definitivamente","Fazer um acorde soar como tônica por um instante","Tocar só a tônica"],1,"Uma \"casa temporária\" criada pela dominante secundária."]
],
pdf:[["Collura · Dominantes Secundárias","Método de Teoria - Harmonia.pdf"],["Ian Guest · vol. 1","Harmonia - Ian Guest Vol 1.pdf"]]}
]},

body:`
<p>Pegue as notas de Dó maior e comece a escala em <b>outra nota</b>, sem acrescentar nenhum acidente. Cada ponto de partida cria uma sequência diferente de tons e semitons, e por isso um \"clima\" diferente. Cada uma dessas escalas é um <b>modo</b>.</p>
${tbl(["Modo","Começa no grau","Em teclas brancas","Receita","Clima"],[

["<b>Mixolídio</b>","V","Sol a Sol","T T S T T S T","maior, \"bluesy\", nordestino (7ª menor)."],
["<b>Eólio</b>","VI","Lá a Lá","T S T T S T T","= menor natural. Melancólico."],
["<b>Lócrio</b>","VII","Si a Si","S T T S T T T","instável, muito tenso (5ª diminuta)."]])}
<h2>🔄 A forma mais útil de pensar: tudo a partir da mesma tônica</h2>
<p>Para usar os modos, compare cada um com a escala maior (ou menor) da <b>mesma</b> tônica. A nota diferente é a <b>nota característica</b>, a que dá o sabor do modo.</p>
${tbl(["Modo (em Dó)","Notas","Nota característica"],[
["Dó Jônio","Dó Ré Mi Fá Sol Lá Si","— (é a escala maior)"],
["Dó Lídio","Dó Ré Mi <b>Fá♯</b> Sol Lá Si","♯4 (4ª aumentada)"],
["Dó Mixolídio","Dó Ré Mi Fá Sol Lá <b>Si♭</b>","♭7 (7ª menor)"],

["Dó Lócrio","Dó Ré♭ Mi♭ Fá <b>Sol♭</b> Lá♭ Si♭","♭5 (5ª diminuta) e ♭2"]])}
${ouvir("C4/q D4/q E4/q F#4/q G4/q A4/q B4/q C5/q","Dó Lídio",120)} ${ouvir("C4/q D4/q E4/q F4/q G4/q A4/q Bb4/q C5/q","Dó Mixolídio",120)} ${ouvir("C4/q D4/q Eb4/q F4/q G4/q A4/q Bb4/q C5/q","Dó Dórico",120)} ${ouvir("C4/q Db4/q Eb4/q F4/q G4/q Ab4/q Bb4/q C5/q","Dó Frígio",120)}
${box("dica","Ordem do mais \"claro\" ao mais \"escuro\": <b>Lídio – Jônio – Mixolídio – Dórico – Eólio – Frígio – Lócrio</b>. A cada passo, uma nota desce um semitom. Essa ordem ajuda a decorar e a escolher o modo pelo clima que você quer.")}
${box("prof","Na música modal (e na improvisação sobre acordes), cada acorde do campo harmônico se relaciona com o modo do seu grau: IIm7 ↔ dórico, V7 ↔ mixolídio, I7M ↔ jônio (ou lídio), IV7M ↔ lídio, VIm7 ↔ eólio, IIIm7 ↔ frígio, VIIm7(♭5) ↔ lócrio. Os nomes gregos foram dados na Idade Média e não correspondem exatamente aos modos da Grécia Antiga.")}
${box("pra","O mapa \"Ciclos de uma escala por dia\": escolha um modo por semana e toque-o nas 12 tonalidades, seguindo o ciclo de quintas. Um dia, Dó; outro, Fá; outro, Si♭...")}
${box("res","Modos = escala maior começando em cada grau. Notas características: Lídio ♯4, Mixolídio ♭7, Dórico 6, Frígio ♭2, Lócrio ♭5.")}

{t:"Arpejos e o método \"Pensando em Números\"", e:"🔢", min:"20 min", sub:"Levar a harmonia para o instrumento",
goal:"organizar um treino de arpejos que cubra todos os acordes nas 12 tonalidades.",
body:`
<p><b>Arpejo</b> é tocar as notas de um acorde <b>uma de cada vez</b>. Para instrumentos melódicos (trombone, sax, flauta, voz), arpejo é a forma de \"tocar a harmonia\". Saber os arpejos de cor é a ponte entre a teoria e o improviso.</p>
${st("F","Bb2/e D3/e F3/e A3/e Bb3/e A3/e F3/e D3/e | Bb2/w",{time:"4/4",bpm:90,cap:"Arpejo de B♭7M no trombone"})}
<h2>🔢 O mapa \"Pensando em Números\" virou um plano</h2>
<p>A ideia do o mapa: a música tem uma quantidade <b>finita</b> de informação, e dá para estudar tudo de forma organizada.</p>
${tbl(["Etapa","O quê","Quanto"],[["1","Uma nota, depois as 12 notas: achar todas no instrumento, sem pensar","12"],["2","12 tríades maiores e 12 menores (arpejo 1-3-5)","24"],["3","As 4 tétrades principais de cada nota: X7M, X7, Xm7, Xº (e depois Xm7(♭5))","48 a 60"],["4","Os graus 1-3-5-7-9-11-13 de cada acorde (arpejos estendidos)","12 × tipos"],["5","7 notas de cada escala × 12 tons = 84 notas por tipo de escala, com tríades, tétrades e tensões","84 por escala"]])}
<h2>🗓️ Como praticar (sugestão)</h2>
<ol><li>Um <b>tipo</b> de acorde por semana (ex.: semana 1: tríades maiores).</li><li>Siga o ciclo de quintas: C, F, B♭, E♭, A♭, D♭, G♭, B, E, A, D, G.</li><li>Toque cada arpejo subindo e descendo, devagar, com metrônomo.</li><li>Use o teste do Nível 0 do seu método: <b>5 vezes seguidas sem erro</b> e <b>1 segundo</b> para achar cada acorde.</li><li>Depois, varie: comece da 3ª, da 5ª ou da 7ª (inversões melódicas).</li></ol>
${box("dica","Diga o nome das notas em voz alta (ou mentalmente) enquanto toca. Assim você treina a mão, o ouvido e a teoria ao mesmo tempo. Tocar sem saber o nome das notas deixa o conhecimento \"preso nos dedos\".")}
${box("pra","Esta semana: os 12 arpejos de tríade maior, na extensão confortável do seu instrumento.")}
${box("res","Arpejo = acorde tocado nota por nota. Treine por tipo de acorde, pelo ciclo de quintas, com metrônomo, até passar no teste dos 5x.")}
`,

["Por que arpejos são essenciais para instrumentos melódicos?",["Porque são mais rápidos","Porque é como esses instrumentos \"tocam a harmonia\"","Porque substituem as escalas"],1,"Um trombone não toca 4 notas ao mesmo tempo, mas pode arpejá-las."],

{t:"A série harmônica: a física da harmonia", e:"🔊", min:"18 min", sub:"Os sons escondidos dentro de cada nota",
goal:"entender o que são harmônicos e por que eles explicam o timbre, os intervalos e o próprio trombone.",
body:`
<p>Quando uma corda (ou uma coluna de ar) vibra, ela não vibra de um jeito só. Ela vibra inteira, e <b>ao mesmo tempo</b> vibra em metades, terços, quartos... Cada uma dessas vibrações produz um som mais agudo, bem fraquinho, misturado à nota principal. Esses sons são os <b>harmônicos</b>, e a sequência deles é a <b>série harmônica</b>.</p>
${st("F","C2/w:1 C3/w:2 G3/w:3 C4/w:4",{bpm:50,cap:"Harmônicos 1 a 4 de um Dó grave"})}
${st("G","E4/w:5 G4/w:6 Bb4/w:7 C5/w:8 D5/w:9 E5/w:10",{bpm:50,cap:"Harmônicos 5 a 10 (continuação)"})}
${tbl(["Harmônico","Nota (sobre Dó)","Intervalo com o anterior","Frequência (× a fundamental)"],[["1 (fundamental)","Dó","—","1"],["2","Dó (8ª acima)","8ª justa","2"],["3","Sol","5ª justa","3"],["4","Dó","4ª justa","4"],["5","Mi","3ª maior","5"],["6","Sol","3ª menor","6"],["7","Si♭ (bem mais baixo que o Si♭ do piano)","3ª menor (menor ainda)","7"],["8","Dó","2ª maior (aprox.)","8"]])}
<h2>🎁 O que a série harmônica explica</h2>
<ul>
<li><b>Timbre</b>: cada instrumento reforça harmônicos diferentes. Essa \"receita\" de harmônicos é a identidade do som (Nível 1).</li>
<li><b>Consonância</b>: os primeiros intervalos da série (8ª, 5ª, 4ª, 3ª) são os mais consonantes. Os primeiros harmônicos 4, 5 e 6 formam uma <b>tríade maior</b> (Dó Mi Sol).</li>
<li><b>Instrumentos de metal</b>: um tubo de metal só consegue tocar as notas da série harmônica do seu comprimento. Para ter outras notas, é preciso mudar o comprimento do tubo: o trompete usa pistos; o <b>trombone usa a vara</b>. Isso é explicado em detalhe na trilha do trombone.</li>
</ul>
${box("ana","Uma nota musical é como um coral: a fundamental é o cantor principal, e os harmônicos são vozes cada vez mais baixinhas cantando notas mais agudas. Você não ouve cada voz separada, mas elas dão a \"cor\" do som.")}
${box("aten","Alguns harmônicos não coincidem com as notas do piano. O 7º harmônico é bem mais baixo que o Si♭ temperado (cerca de 31 cents), e o 11º fica entre Fá e Fá♯. O 5º é um pouco mais baixo que o Mi do piano (cerca de 14 cents). Por isso, no trombone, algumas notas precisam de pequenos ajustes de vara.")}
${box("prof","As frequências dos harmônicos são múltiplos inteiros da fundamental (f, 2f, 3f, 4f...). As razões entre harmônicos vizinhos dão os intervalos \"justos\" da afinação natural: 2:1 (8ª), 3:2 (5ª), 4:3 (4ª), 5:4 (3ª maior), 6:5 (3ª menor). O temperamento igual do piano ajusta levemente esses intervalos (exceto a oitava) para que todas as tonalidades soem igualmente bem.")}
${box("res","Cada nota contém harmônicos: 8ª, 5ª, 8ª, 3ª, 5ª, ♭7, 8ª... Eles explicam timbre, consonância e como os metais produzem notas.")}
`,
quiz:[
["Qual é o 3º harmônico de Dó?",["Mi","Sol","Dó"],1,"Série sobre Dó: Dó, Dó, Sol, Dó, Mi, Sol..."],
["Quais harmônicos formam uma tríade maior?",["1, 2 e 3","4, 5 e 6","7, 8 e 9"],1,"4 (Dó), 5 (Mi), 6 (Sol)."],
["Por que o trombone precisa da vara?",["Para enfeitar","Para mudar o comprimento do tubo e ter outras séries harmônicas","Para mudar o timbre"],1,"Cada comprimento de tubo dá uma série harmônica diferente."]
],
pdf:[["Série Harmônica (Dirso Anderle)","Serie Harmonica.pdf"]]},

{t:"Analisando uma música do começo ao fim", e:"🔍", min:"20 min", sub:"Juntando tudo do Nível 3",
goal:"analisar uma progressão com graus, funções, dominantes secundárias e cadências.",
body:`
<p>Analisar é <b>dar nome ao que acontece</b>: em que tom estamos, qual o grau de cada acorde, qual a função, onde há tensão e onde há repouso. Com isso você memoriza mais rápido, transpõe com facilidade e improvisa melhor.</p>
<h2>📝 Método de análise</h2>
<ol><li><b>Descubra o tom</b>: armadura + último acorde.</li><li>Escreva o <b>grau</b> de cada acorde do campo harmônico.</li><li>Acordes <b>fora</b> do campo: procure dominantes secundárias (X7 que resolve uma 5ª abaixo) e II–Vs.</li><li>Marque as <b>funções</b> (T, SD, D) e as <b>cadências</b> nos finais de frase.</li></ol>
<h2>🧪 Exemplo (em Dó maior)</h2>
<p style="text-align:center;font-weight:900;font-size:17px">| C7M | A7 | Dm7 | G7 | Em7 | A7 | Dm7 G7 | C7M |</p>
${ouvir("C3+E3+G3+B3/w A2+G3+C#4+E4/w D3+F3+A3+C4/w G2+F3+B3+D4/w E3+G3+B3+D4/w A2+G3+C#4+E4/w D3+F3+A3+C4/h G2+F3+B3+D4/h C3+E3+G3+B3/w","Ouvir a progressão",90)}
${tbl(["Acorde","Grau / análise","Função"],[["C7M","I7M","T"],["A7","V7/II (dominante secundária de Dm)","D (secundária)"],["Dm7","IIm7","SD"],["G7","V7","D"],["Em7","IIIm7","T (substituto)"],["A7","V7/II de novo","D (secundária)"],["Dm7 G7","IIm7 – V7","SD – D"],["C7M","I7M: cadência autêntica","T"]])}
${box("dica","Repare na forma: dois II–V (compassos 3-4 e 7) e dominantes secundárias preparando o II. Esse tipo de progressão, com variações, aparece em muitas músicas populares e standards.")}
${box("pra","Pegue uma música com cifra que você toca (um hino, uma música da igreja, um samba). Faça os 4 passos. Se aparecer um acorde \"estranho\", teste: ele resolve uma 5ª abaixo no próximo acorde? Então é dominante secundária.")}
<h2>🎓 O que você aprendeu no Nível 3</h2>
<ul><li>Tríades, inversões, tétrades e cifras completas.</li><li>Campo harmônico maior e menor, funções e cadências.</li><li>Trítono, II–V–I e dominantes secundárias.</li><li>Modos, arpejos, série harmônica e análise.</li></ul>
${box("res","Análise: tom → graus → acordes de fora (dominantes secundárias, II-V) → funções e cadências.")}
`,
quiz:[
["Na progressão acima, por que A7 aparece em Dó maior?",["É um erro","É a dominante secundária de Dm7 (V7/II)","É o VI grau"],1,"A7 resolve uma 5ª abaixo, em Dm7."],
["Qual o primeiro passo de uma análise?",["Descobrir o tom","Tocar rápido","Escrever as funções"],0,"Tudo depende do tom."],
["Dm7 – G7 – C7M no final forma...",["um II–V–I com cadência autêntica","uma cadência plagal","uma meia cadência"],0,"II–V–I terminando em I."]
],
pdf:[["Análise harmônica · Vinicius (Chediak)","Analise harmonica Vinicius Songbook Vol 1 Almir Chediak.pdf"],["Chediak · vol. I","Harmonia e Improvisação Vol I Almir Chediak.pdf"]]}
]}
]});

/* ============ MÓDULO 1 ============ */
{id:"n4m1", t1:"Primeiros", t2:"Improvisos", g:"🚀", c:"#e11d2a", sub:"Uma nota, pentatônicas e blues",
desc:"Perder o medo de improvisar: começar com uma nota só, depois cinco (pentatônica) e aprender a forma que mais formou improvisadores na história, o blues.",
aulas:[
{t:"O que é improvisar (e o que não é)", e:"🗣️", min:"10 min", sub:"Conversa, não sorteio",
goal:"entender improvisação como linguagem e saber o que treinar.",
body:`
<p><b>Improvisar</b> é criar música no momento em que se toca. Mas não é tocar notas ao acaso. Pense em como você conversa: você não decorou as frases que vai falar hoje, mas usa <b>palavras</b> que já conhece, <b>gramática</b> que já domina e <b>ideias</b> que fazem sentido no assunto da conversa.</p>
${tbl(["Na fala","Na música"],[["Vocabulário (palavras)","Escalas, arpejos, padrões, frases decoradas"],["Gramática","Harmonia, ritmo, fraseologia"],["Sotaque","Estilo (choro, jazz, gospel, samba...)"],["Assunto da conversa","A música que está sendo tocada (a harmonia e a melodia)"],["Ouvir o outro","Interagir com a banda"]])}
${box("ana","Uma criança aprende a falar ouvindo e imitando os adultos, muito antes de estudar gramática. Os grandes improvisadores fizeram igual: ouviram e imitaram (transcreveram) os mestres. A teoria organiza, mas o ouvido ensina.")}
<h2>🧭 As três perguntas de todo improviso</h2>
<ol><li><b>Quando</b> tocar? (ritmo, espaço, silêncio)</li><li><b>O que</b> tocar? (notas que combinam com a harmonia)</li><li><b>Como</b> tocar? (articulação, dinâmica, som, estilo)</li></ol>
<p>A maioria dos iniciantes pensa só na pergunta 2. Os profissionais sabem que a 1 e a 3 são tão importantes quanto ela. Por isso este nível começa pelo ritmo.</p>
${box("prof","O mapa \"Composição instantânea\" resume isso muito bem: improvisar é compor em tempo real, juntando harmonia (ciclo de quintas), um modo de escala, padrões, células rítmicas, fraseologia (motivo, frase, período, forma), acento métrico, articulações e ornamentos, repertório e imaginação.")}
${box("res","Improvisar = conversar em música usando vocabulário (escalas, frases), gramática (harmonia, ritmo) e sotaque (estilo). Ritmo e expressão importam tanto quanto as notas.")}
`,
quiz:[
["Improvisar é...",["tocar notas aleatórias","criar na hora usando vocabulário e regras que você domina","tocar sempre a mesma coisa"],1,"É uma conversa, não um sorteio."],
["O que equivale ao \"vocabulário\" do improvisador?",["Escalas, arpejos, padrões e frases","A partitura","O metrônomo"],0,"São as \"palavras\" disponíveis."],
["Qual pergunta os iniciantes costumam esquecer?",["O que tocar","Quando e como tocar","Qual instrumento usar"],1,"Ritmo e expressão são metade do improviso."]
],
pdf:[["Glauber Santiago · Introdução à improvisação (clave de Fá)","Introdução à improvisação Em clave de Fá.pdf"],["Mapa: Composição instantânea","Screenshot_20220702-102444.png"]]},

{t:"Improvisar com uma nota só", e:"1️⃣", min:"12 min", sub:"Ritmo é rei",
goal:"criar frases interessantes usando só ritmo, articulação e dinâmica.",
body:`
<p>O mapa de metas começa com <b>\"Uma Nota\"</b>, e isso é uma das melhores ideias de estudo que existem. Com uma nota só, você fica <b>obrigado</b> a criar interesse com as outras ferramentas.</p>
<h2>🎛️ O que você pode variar sem mudar de nota</h2>
<ul><li><b>Ritmo</b>: longas, curtas, síncopes, tercinas, contratempos.</li><li><b>Silêncio</b>: pausas curtas e longas.</li><li><b>Articulação</b>: staccato, legato, acento.</li><li><b>Dinâmica</b>: forte, piano, crescendo.</li><li><b>Posição no compasso</b>: começar no tempo 1, no \"e\" do 2, no 4...</li></ul>
${st("G","G4/q r/e G4/e r/q G4/q | r/e G4/q G4/e G4/h | G4/e G4/e r/q r/e G4/q G4/e | G4/w",{time:"4/4",bpm:100,cap:"Exemplo: uma frase inteira só com a nota Sol"})}
${box("ana","Um bom contador de histórias consegue prender a atenção falando devagar, fazendo pausas, mudando o tom de voz. As palavras podem ser simples; o jeito de contar é que encanta.")}
<h2>📈 A progressão do o mapa</h2>
<ol><li>Uma nota → duas notas (a nota e a vizinha) → três → ... até as <b>12 notas</b>.</li><li>Faça isso sobre uma base (um acorde parado ou um blues). Escolha notas do acorde no início.</li></ol>
${box("pra","Ligue o metrônomo a 90 (ou uma base de um acorde só). Durante 3 minutos, improvise só com a nota Fá (no trombone, Fá da 1ª posição). Depois 3 minutos com Fá e Sol. Grave e ouça: tem variedade rítmica? Tem espaço?")}
${box("res","Com uma nota só, o ritmo, o silêncio, a articulação e a dinâmica fazem a música. Depois, acrescente uma nota por vez.")}
`,
quiz:[
["Por que improvisar com uma nota é um bom exercício?",["Porque é mais fácil de ler","Porque obriga a criar interesse com ritmo, silêncio e expressão","Porque é o único jeito certo"],1,"Isola as outras ferramentas do improviso."],
["O que NÃO muda nesse exercício?",["O ritmo","A nota","A dinâmica"],1,"Todo o resto pode mudar."],
["Qual o passo seguinte no o mapa de metas?",["Tocar muito rápido","Acrescentar notas, uma por vez, até as 12","Parar de usar metrônomo"],1,"1 nota → 12 notas."]
],
pdf:[["Mapa: Metas de Estudo Improvisação","Screenshot_20220615-101655.png"]]},

{t:"As escalas pentatônicas", e:"🖐️", min:"18 min", sub:"Cinco notas que combinam com quase tudo",
goal:"montar as pentatônicas maior e menor e usá-las em um improviso simples.",
body:`
<p>A <b>pentatônica</b> (\"penta\" = cinco) é uma escala de <b>5 notas</b>. Ela aparece em músicas tradicionais do mundo inteiro, no blues, no rock, no gospel, no pop e no jazz. O segredo dela: <b>não tem semitons</b>, então é muito difícil soar \"errado\".</p>
<h2>☀️ Pentatônica maior</h2>
<p>Pegue a escala maior e tire o <b>4º</b> e o <b>7º</b> graus (exatamente as notas que formam o trítono e os semitons).</p>
${st("G","C4/q:1 D4/q:2 E4/q:3 G4/q:5 A4/q:6 C5/q:8",{bpm:100,cap:"Dó pentatônica maior: Dó Ré Mi Sol Lá"})}
<h2>🌙 Pentatônica menor</h2>
<p>É a mesma coleção de notas começando no 6º grau (relativa). Lá pentatônica menor = Lá Dó Ré Mi Sol. Em graus: <b>1 – ♭3 – 4 – 5 – ♭7</b>.</p>
${st("G","A4/q:1 C5/q:♭3 D5/q:4 E5/q:5 G5/q:♭7 A5/q:8",{bpm:100,cap:"Lá pentatônica menor"})}
${st("F","Bb2/q:1 Db3/q:♭3 Eb3/q:4 F3/q:5 Ab3/q:♭7 Bb3/q:8",{bpm:100,cap:"Si♭ pentatônica menor (confortável no trombone)"})}
${box("dica","Onde usar: a pentatônica maior da tônica funciona sobre os acordes I, IV e V de muitas músicas em tom maior. A pentatônica menor funciona sobre acordes menores e é a base do blues.")}
${box("prof","Uma técnica avançada muito usada no jazz é tocar pentatônicas <b>a partir de outras notas</b> do acorde para gerar tensões. Exemplo: sobre C7M, a pentatônica de Sol maior (Sol Lá Si Ré Mi) dá 5, 13, 7M, 9 e 3, um som moderno e \"aberto\". Sobre Dm7, a pentatônica de Fá maior soa ótima.")}
${box("pra","Com uma base de acorde parado (ou metrônomo), improvise 3 minutos usando só a pentatônica menor. Use primeiro 2 notas, depois 3... como no exercício de uma nota.")}
${box("res","Pentatônica maior = 1 2 3 5 6. Pentatônica menor = 1 ♭3 4 5 ♭7. Sem semitons: segura e versátil.")}
`,
quiz:[
["Quais graus da escala maior são retirados para formar a pentatônica maior?",["2º e 6º","4º e 7º","3º e 5º"],1,"Tira-se o 4º e o 7º."],
["Quais notas formam Lá pentatônica menor?",["Lá Si Dó Mi Fá","Lá Dó Ré Mi Sol","Lá Dó♯ Mi Fá♯ Sol"],1,"1 ♭3 4 5 ♭7."],
["Por que a pentatônica soa \"segura\"?",["Porque tem só notas agudas","Porque não tem semitons","Porque é muito antiga"],1,"Sem semitons não há choques fortes."]
],
pdf:[["Nelson Faria · A arte da improvisação","A arte da improvisação Nelson Faria.pdf"]]},

{t:"O blues: forma, escala e sotaque", e:"🎸", min:"22 min", sub:"12 compassos que formaram gerações",
goal:"tocar a forma do blues de 12 compassos e improvisar sobre ela com a escala blues.",
body:`
<p>O <b>blues</b> nasceu entre os afro-americanos do sul dos Estados Unidos, no final do século XIX, e está na raiz do jazz, do rock, do soul e de muito do gospel. Para o improvisador, ele é a melhor escola: forma curta, poucos acordes e uma linguagem muito expressiva.</p>
<h2>📐 A forma de 12 compassos</h2>
${tbl(["Compassos 1-4","","",""],[["I7","I7 (ou IV7)","I7","I7"]])}
${tbl(["Compassos 5-8","","",""],[["IV7","IV7","I7","I7"]])}
${tbl(["Compassos 9-12","","",""],[["V7","IV7","I7","V7 (virada)"]])}
<p>Em Si♭ (tom muito comum para sopros): <b>B♭7 – E♭7 – F7</b>. Repare que no blues <b>todos</b> os acordes costumam ser dominantes (X7), mesmo o I. Isso é uma característica do estilo, não um erro de teoria.</p>
${ouvir("Bb2+D3+F3+Ab3/w Bb2+D3+F3+Ab3/w Bb2+D3+F3+Ab3/w Bb2+D3+F3+Ab3/w Eb3+G3+Bb3+Db4/w Eb3+G3+Bb3+Db4/w Bb2+D3+F3+Ab3/w Bb2+D3+F3+Ab3/w F2+A2+C3+Eb3/w Eb3+G3+Bb3+Db4/w Bb2+D3+F3+Ab3/w F2+A2+C3+Eb3/w","Ouvir um blues em Si♭ (harmonia)",140)}
<h2>🎵 A escala blues</h2>
<p>É a pentatônica menor com uma nota a mais: a <b>♭5</b> (a \"blue note\"). Em Si♭: Si♭ – Ré♭ – Mi♭ – <b>Mi♮</b> – Fá – Lá♭.</p>
${st("F","Bb2/q:1 Db3/q:♭3 Eb3/q:4 E3/q*:♭5 F3/q:5 Ab3/q:♭7 Bb3/q:8",{bpm:100,cap:"Escala blues de Si♭ (a nota vermelha é a blue note; escrita como Mi♮, equivalente a Fá♭)"})}
${box("ana","A escala blues por cima de acordes maiores cria um atrito proposital: a ♭3 da escala contra a 3ª maior do acorde. É esse \"choro\" que dá o sotaque do blues. Muitos músicos \"entortam\" essa nota, deslizando entre a ♭3 e a 3ª. No trombone, com a vara, isso fica muito natural.")}
<h2>💬 Pergunta e resposta</h2>
<p>A estrutura tradicional das letras de blues é <b>AAB</b>: uma frase (compassos 1-4), a mesma frase repetida (5-8) e uma resposta (9-12). Imite isso no improviso: faça uma frase, repita (ou varie) e responda.</p>
${box("prof","Existem muitas variações da forma: o \"quick change\" (IV7 no compasso 2), o blues de jazz com II–V (em Fá: \"| F7 | B♭7 | F7 | Cm7 F7 | B♭7 | Bº | F7 | D7 | Gm7 | C7 | F7 D7 | Gm7 C7 |\") e o blues menor. Todos mantêm os 12 compassos e o sentido I–IV–I–V–I.")}
${box("pra","Grave (ou use um aplicativo de play-along) o blues em Si♭. Improvise 5 voltas: 1ª só com 2 notas; 2ª com a pentatônica menor; 3ª com a escala blues; 4ª fazendo pergunta e resposta; 5ª livre.")}
${box("res","Blues de 12 compassos: I7 (4) – IV7 (2) – I7 (2) – V7 – IV7 – I7 – V7. Escala blues = pentatônica menor + ♭5.")}
`,
quiz:[
["Quantos compassos tem a forma tradicional do blues?",["8","12","16"],1,"12 compassos."],
["Qual nota a escala blues acrescenta à pentatônica menor?",["A 2ª","A ♭5","A 7ª maior"],1,"A blue note, ♭5."],
["No blues, os acordes I, IV e V costumam ser...",["todos 7M","todos dominantes (X7)","todos menores"],1,"Característica do estilo."]
],
pdf:[["Jazz Blues Play-along","Jazz blues Play a long solos for alto eb sax.pdf"],["Glauber Santiago · Introdução à improvisação","Introdução à improvisação Em clave de Fá.pdf"]]}
]},

/* ============ MÓDULO 2 ============ */
{id:"n4m2", t1:"Notas", t2:"Certas", g:"🎯", c:"#f59e0b", t2c:"#ffb020", sub:"Notas-alvo, escala do acorde, tensões",
desc:"Como escolher notas que \"conversam\" com cada acorde: começar pelas notas do acorde, saber qual escala serve para cada acorde, usar tensões e evitar os choques.",
aulas:[
{t:"Notas-alvo e acento métrico", e:"🎯", min:"16 min", sub:"Notas do acorde nos tempos fortes",
goal:"colocar notas do acorde nos tempos fortes e usar as outras como passagem.",
body:`
<p>A regra que mais melhora um improviso de uma vez: <b>nos tempos fortes, toque notas do acorde</b> (1, 3, 5, 7). Nas partes fracas, qualquer nota da escala (ou até cromática) pode servir de caminho entre elas.</p>
<p>O mapa \"Composição instantânea\" tem essa regra num galho chamado <b>Acento Métrico</b>: \"acentuar notas do acorde nos tempos 2 e 4, e nos tempos fracos notas fora do acorde\". A ideia é a mesma: as notas do acorde são as <b>colunas</b> da frase, e as outras são as <b>pontes</b>.</p>
${st("G","C5/e D5/e E5/e F5/e G5/e F5/e E5/e D5/e | C5/w",{time:"4/4",bpm:90,cap:"Sobre C7M: nas cabeças de tempo (1, 2, 3, 4) caem Dó, Mi, Sol, Mi, todas do acorde. Ré e Fá ficam nos contratempos."})}
${st("G","D5/e C5/e F5/e E5/e A5/e G5/e F5/e E5/e | D5/w",{time:"4/4",bpm:90,cap:"As mesmas notas deslocadas: agora Ré e Fá caem nos tempos. Sobre C7M soa menos resolvido. Ouça a diferença."})}
${box("ana","Numa ponte pênsil, as torres (notas do acorde) seguram tudo; os cabos e as tábuas (notas de passagem) ligam uma torre à outra. Se as torres estiverem no lugar certo, a ponte fica de pé.")}
<h2>🎯 Nota-alvo</h2>
<p>Improvisadores experientes <b>miram</b> uma nota do próximo acorde e constroem a frase para chegar nela exatamente no tempo 1. Essa nota se chama <b>nota-alvo</b>. As melhores notas-alvo são a <b>3ª</b> e a <b>7ª</b>, porque definem o tipo do acorde.</p>
${box("dica","Exercício do o mapa \"Metas\": sobre uma progressão, toque uma semínima por compasso, sempre numa nota do acorde. Depois semínimas nos tempos 2, 3 e 4. Só depois comece a preencher com colcheias.")}
${box("pra","Sobre Dm7 – G7 – C7M (2 compassos cada), toque só semínimas e sempre notas do acorde. Depois coloque colcheias, mantendo notas do acorde nas cabeças dos tempos.")}
${box("res","Tempos fortes = notas do acorde. Partes fracas = passagem. Mire a 3ª ou a 7ª do próximo acorde.")}
`,
quiz:[
["Onde colocar as notas do acorde, de preferência?",["Nos contratempos","Nos tempos fortes (cabeças de tempo)","Só no fim da música"],1,"Elas sustentam a frase."],
["Quais notas-alvo definem melhor o tipo do acorde?",["Fundamental e 5ª","3ª e 7ª","9ª e 11ª"],1,"3ª e 7ª: as notas-guia."],
["O que são as notas nas partes fracas?",["Erros","Pontes/passagens entre as notas do acorde","Sempre pausas"],1,"Podem ser da escala ou cromáticas."]
],
pdf:[["Mapa: Composição instantânea","Screenshot_20220614-185830.png"],["Mapa: Metas","Screenshot_20220702-102326.png"]]},

{t:"A escala de cada acorde", e:"🗝️", min:"22 min", sub:"Acorde-escala e notas evitadas",
goal:"escolher a escala certa para cada acorde e saber quais notas usar com cuidado.",
body:`
<p>Para cada acorde existe uma (ou mais) escala que \"veste\" o acorde: ela contém as notas do acorde e preenche os espaços entre elas. Isso se chama relação <b>acorde-escala</b>. Num tom maior, cada acorde do campo harmônico recebe o modo do seu grau.</p>
${tbl(["Acorde (em Dó)","Grau","Escala","Notas"],[
["C7M","I","Jônio (ou Lídio)","Dó Ré Mi <b>Fá</b> Sol Lá Si"],
["Dm7","II","Dórico","Ré Mi Fá Sol Lá Si Dó"],
["Em7","III","Frígio","Mi Fá Sol Lá Si Dó Ré"],
["F7M","IV","Lídio","Fá Sol Lá Si Dó Ré Mi"],
["G7","V","Mixolídio","Sol Lá Si <b>Dó</b> Ré Mi Fá"],
["Am7","VI","Eólio","Lá Si Dó Ré Mi Fá Sol"],
["Bm7(♭5)","VII","Lócrio","Si Dó Ré Mi Fá Sol Lá"]])}
<h2>⚠️ Notas evitadas</h2>
<p>Algumas notas da escala, se forem <b>sustentadas</b> (tocadas longas, em tempo forte), chocam com o acorde. São as <b>notas evitadas</b>. Elas podem ser usadas <b>de passagem</b>, rapidinho, mas não como nota de apoio.</p>
<ul>
<li>Sobre <b>C7M</b> (jônio): o <b>Fá</b> (4ª) fica meio tom acima do Mi (3ª) e cria uma 9ª menor com ele. Evite segurar. (Ou troque por Fá♯, usando o lídio.)</li>
<li>Sobre <b>G7</b> (mixolídio): o <b>Dó</b> (4ª) choca com o Si (3ª). Exceção: acorde G7sus4, que tem justamente o Dó no lugar do Si.</li>
<li>Sobre <b>Dm7</b> (dórico): o <b>Si</b> (6ª) forma trítono com o Fá (3ª do Dm7), e sustentado faz o acorde soar como G7. Muitos professores pedem cuidado com ele; outros consideram a 6ª maior a \"cor\" do dórico. Use com consciência.</li>
</ul>
${ouvir("C3+E3+G3+B3/w C5/q E5/q G5/q F5/w","F sustentado sobre C7M (choque)",80)} ${ouvir("C3+E3+G3+B3/w C5/q E5/q G5/q F#5/w","F♯ sustentado sobre C7M (lídio, sem choque)",80)}
${box("ana","Nota evitada é como uma palavra forte numa conversa: dita de passagem, dá tempero; repetida e enfatizada, soa agressiva e muda o sentido da frase.")}
${box("prof","A regra geral usada em escolas como a Berklee: é \"evitada\" a nota da escala que fica <b>uma 9ª menor acima</b> de uma nota do acorde (como Fá sobre Mi em C7M) ou que muda a função do acorde (como a 6ª no IIm7). O conceito vem da teoria de acorde-escala popularizada no jazz a partir dos anos 1950-60; Almir Chediak usa o mesmo princípio no livro Harmonia e Improvisação.")}
${box("dica","Não pense \"uma escala para cada acorde\" como regra fixa. Pense: <b>as notas do acorde são o esqueleto</b>, e a escala mostra quais notas podem preencher. Com o tempo você escolhe entre várias escalas possíveis pelo som que quer.")}
${box("pra","Sobre um Dm7 – G7 – C7M lento, toque o dórico no Dm7, o mixolídio no G7 e o jônio no C7M. Perceba que são as mesmas 7 notas (Dó maior): o que muda é quais notas você enfatiza em cada acorde.")}
${box("res","Cada acorde tem sua escala (IIm7 dórico, V7 mixolídio, I7M jônio/lídio...). Notas evitadas: não sustentar (4ª sobre 7M e sobre 7).")}
`,
quiz:[
["Qual escala combina com o IIm7 no tom maior?",["Mixolídio","Dórico","Lócrio"],1,"II grau = dórico."],
["Qual é a nota evitada de C7M no jônio?",["Ré","Fá","Lá"],1,"Fá fica meio tom acima de Mi (3ª)."],
["Uma nota evitada pode ser usada...",["nunca","de passagem, rapidamente","só em notas longas"],1,"O problema é sustentá-la."]
],
pdf:[["Chediak · Harmonia e Improvisação I","Harmonia e Improvisação Vol I Almir Chediak.pdf"],["Chediak · vol. II","harmonia e improvisação vol ii - almir chediak.pdf"]]},

{t:"Tensões: 9, 11 e 13", e:"✨", min:"18 min", sub:"As cores acima da sétima",
goal:"saber quais tensões combinam com cada tipo de acorde e usá-las no improviso.",
body:`
<p><b>Tensões</b> são as notas da escala que <b>não</b> estão no acorde básico (1-3-5-7): a <b>9ª</b>, a <b>11ª</b> e a <b>13ª</b>, e suas versões alteradas. Elas enriquecem o som sem destruir o acorde.</p>
${tbl(["Tipo de acorde","Tensões disponíveis (mais comuns)","Evitar sustentar"],[
["7M (maior)","9, ♯11, 13","11 justa"],
["m7 (menor)","9, 11 (13 com cuidado no II grau)","♭13 em contexto dórico"],
["7 (dominante)","9, 13 (\"naturais\") ou ♭9, ♯9, ♯11, ♭13 (\"alteradas\")","11 justa (exceto sus4)"],
["m7(♭5)","11, ♭13 (e 9 em alguns contextos)","♭9"],
["º (diminuto)","as notas um tom acima de cada nota do acorde","—"]])}
${ouvir("C3+E3+B3+D4/w","C7M(9)",50)} ${ouvir("G2+F3+B3+E4/w","G7(13)",50)} ${ouvir("G2+F3+B3+Ab4/w","G7(♭9)",50)} ${ouvir("D3+C4+F4+G4/w","Dm7(11)",50)}
<h2>🌶️ Dominantes naturais x alterados</h2>
<p>O acorde dominante é o que aceita <b>mais</b> tensões, porque ele já é instável. A regra prática:</p>
<ul><li>Dominante que vai para acorde <b>maior</b>: tensões naturais (9, 13) soam bem; alteradas também, para mais tensão.</li><li>Dominante que vai para acorde <b>menor</b>: tensões alteradas (♭9, ♭13) soam naturais, porque vêm da escala menor harmônica do tom de chegada. Ex.: E7(♭9) → Am.</li></ul>
${box("ana","Tensões são temperos. O acorde básico é o arroz com feijão; a 9ª é um tempero suave, a ♯11 é exótica, a ♭9 é pimenta forte. Todas cabem, mas cada prato pede um tempero.")}
${box("dica","No improviso, <b>resolver</b> uma tensão é muito expressivo: toque a 9ª num tempo forte e desça para a fundamental, ou a ♭9 de um dominante e resolva na 5ª do acorde seguinte (Lá♭ em G7 → Sol em C).")}
${box("pra","Sobre um C7M longo, toque arpejos estendidos: Dó Mi Sol Si <b>Ré Fá♯ Lá</b> (1-3-5-7-9-♯11-13). Isso é o \"1 3 5 7 9 11 13 de cada acorde\" do o mapa.")}
${box("res","Tensões = 9, 11, 13 (e alterações). 7M: 9, ♯11, 13. m7: 9, 11. Dominante: todas, naturais ou alteradas.")}
`,
quiz:[
["Qual tensão é mais usada em acordes maiores (7M) no lugar da 11 justa?",["♭9","♯11","♭13"],1,"A 11 justa choca com a 3ª maior; a ♯11 não."],
["Qual tipo de acorde aceita mais tensões alteradas?",["7M","Dominante (7)","m7"],1,"O dominante já é instável."],
["A 9ª de Dó é...",["Ré","Mi","Si"],0,"9ª = 2ª uma oitava acima."]
],
pdf:[["Chediak · vol. II","harmonia e improvisação vol ii - almir chediak.pdf"],["Ian Guest · vol. 2","Harmonia Ian Guest Vol 2.pdf"]]},

{t:"Notas-guia: tocar a harmonia com duas notas", e:"🧵", min:"14 min", sub:"Linhas de 3ªs e 7ªs",
goal:"construir linhas melódicas com as notas-guia que \"desenham\" qualquer progressão.",
body:`
<p>Você viu no Nível 3 que a <b>3ª</b> e a <b>7ª</b> andam por semitom (ou ficam paradas) de um acorde para o próximo num II–V–I. Isso tem uma consequência fantástica para o improviso: com <b>uma linha de 3ªs e 7ªs</b> você toca uma melodia que, sozinha, já faz o ouvinte \"escutar\" a harmonia.</p>
${st("G","C5/w:7ª_de_Dm7 B4/w:3ª_de_G7 B4/w:7ª_de_C7M",{bpm:60,playNotes:"D3+F3+A3+C5/w G2+F3+B4/w C3+E3+G3+B4/w",cap:"Linha-guia 1: Dó → Si → Si (com a harmonia por baixo)"})}
${st("G","F4/w:3ª_de_Dm7 F4/w:7ª_de_G7 E4/w:3ª_de_C7M",{bpm:60,playNotes:"D3+A3+F4/w G2+B3+F4/w C3+G3+E4/w",cap:"Linha-guia 2: Fá → Fá → Mi"})}
<h2>🪜 Como usar no improviso</h2>
<ol><li>Toque só a linha-guia, em notas longas, sobre a progressão.</li><li>Depois enfeite: chegue em cada nota-guia com uma nota vizinha antes.</li><li>Depois preencha com arpejos e escala, mas <b>sempre chegando</b> na nota-guia no tempo 1 de cada acorde.</li></ol>
${st("G","A4/e B4/e C5/q D5/q C5/q | A4/e G4/e F4/q E4/q B4/q | B4/w",{time:"4/4",bpm:90,cap:"Uma frase que \"mira\" nas notas-guia (Dó no Dm7, Si no G7, Si no C7M)"})}
${box("prof","Essa técnica é conhecida no jazz como <b>guide tone lines</b>. É uma das bases do estudo de improvisação harmônica e também do arranjo: nos arranjos para naipes, as vozes internas frequentemente seguem essas linhas.")}
${box("pra","Escreva as linhas-guia de um blues em Si♭ (a 3ª e a 7ª de cada acorde). Toque-as como uma melodia lenta. Você vai perceber a forma do blues só com essas notas.")}
${box("res","3ª e 7ª de cada acorde, conectadas pelo caminho mais curto, formam uma melodia que \"canta\" a harmonia.")}
`,
quiz:[
["Quais notas formam uma linha-guia?",["Fundamentais","3ªs e 7ªs","5ªs"],1,"As notas que definem o acorde."],
["Na linha-guia de Dm7–G7–C7M começando em Dó, a próxima nota é...",["Si","Ré","Lá"],0,"A 7ª de Dm7 (Dó) desce para a 3ª de G7 (Si)."],
["Para que servem as linhas-guia no improviso?",["Para tocar mais rápido","Para dar pontos de chegada que desenham a harmonia","Para evitar notas do acorde"],1,"São as \"colunas\" da frase."]
],
pdf:[["Coker · Elements of the Jazz Language","Elements of the Jazz Language - Jerry Coker.pdf"]]}
]},

/* ============ MÓDULO 3 ============ */
{id:"n4m3", t1:"Construindo", t2:"Frases", g:"✒️", c:"#8b5cf6", t2c:"#b18cff", sub:"Motivo, fraseologia, notas melódicas, cromatismo",
desc:"Como transformar notas certas em ideias musicais com começo, meio e fim.",
aulas:[
{t:"Motivo e desenvolvimento", e:"🧬", min:"18 min", sub:"Uma ideia pequena que cresce",
goal:"criar um motivo e desenvolvê-lo de 6 formas diferentes.",
body:`
<p>Um <b>motivo</b> é a menor ideia musical reconhecível: poucas notas com um desenho de altura e um ritmo característicos. As músicas mais memoráveis são feitas de <b>poucos motivos bem desenvolvidos</b>.</p>
${st("G","C5/e D5/e E5/q G4/h",{time:"4/4",bpm:100,cap:"Motivo original"})}
<h2>🛠️ Seis formas de desenvolver um motivo</h2>
${tbl(["Técnica","O que fazer","Exemplo"],[
["<b>Repetição</b>","tocar igual (ou quase)",ouvir("C5/e D5/e E5/q G4/h C5/e D5/e E5/q G4/h","",100)],
["<b>Sequência</b>","repetir o desenho começando em outra nota",ouvir("C5/e D5/e E5/q G4/h D5/e E5/e F5/q A4/h","",100)],
["<b>Inversão</b>","o que subia, desce (espelho)",ouvir("C5/e D5/e E5/q G4/h C5/e B4/e A4/q F5/h","",100)],
["<b>Mudança de ritmo</b>","mesmas notas, outro ritmo",ouvir("C5/e D5/e E5/q G4/h C5/q. D5/e E5/e G4/q.","",100)],
["<b>Aumentação / diminuição</b>","valores dobrados ou pela metade",ouvir("C5/e D5/e E5/q G4/h C5/q D5/q E5/h G4/w","",100)],
["<b>Fragmentação</b>","usar só um pedaço do motivo",ouvir("C5/e D5/e E5/q G4/h C5/e D5/e E5/q C5/e D5/e E5/q","",100)]])}
${box("ana","Um motivo é como o tema de uma redação. Um bom texto não muda de assunto a cada frase: ele volta ao tema, olha por outro ângulo, dá exemplos. Um bom improviso faz o mesmo com o motivo.")}
${box("dica","O mapa \"Criação Melódica\" é exatamente isso: 1 nota → 1 célula rítmica → 1 contorno melódico → 1 ornamento → 1 sílaba de articulação → 1 motivo → 2 motivos formam 1 frase. Cada item \"2\" do mapa é uma variação do primeiro.")}
${box("pra","Crie um motivo de 3 ou 4 notas. Toque-o com as seis técnicas acima, uma depois da outra, sobre um acorde parado ou um blues.")}
${box("res","Motivo = ideia curta. Desenvolva com repetição, sequência, inversão, ritmo, aumentação/diminuição e fragmentação.")}
`,
quiz:[
["Repetir o desenho de um motivo começando em outra nota é...",["inversão","sequência","fragmentação"],1,"Sequência = mesmo desenho, outra altura."],
["Inverter um motivo significa...",["tocar de trás para frente","espelhar as direções: o que subia, desce","tocar mais alto"],1,"Tocar de trás para frente é outra técnica (retrógrado)."],
["Por que desenvolver motivos no improviso?",["Para dar unidade e fazer o ouvinte acompanhar a ideia","Para tocar mais notas","Porque é obrigatório"],0,"Unidade e lógica."]
],
pdf:[["Turi Collura · Improvisação vol. 1","Curso de Improvisalçao Turi Collura.pdf"],["Mapa: Criação Melódica","Screenshot_20220702-102337.png"]]},

{t:"Fraseologia: motivo, frase, período, forma", e:"📚", min:"15 min", sub:"A gramática da melodia",
goal:"entender como motivos formam frases, períodos e formas.",
body:`
<p><b>Fraseologia</b> é o estudo de como uma melodia é construída, como uma gramática. As unidades, da menor para a maior:</p>
${tbl(["Unidade","O que é","Tamanho típico"],[["<b>Motivo</b> (inciso, célula)","a menor ideia reconhecível","1 ou 2 compassos (ou menos)"],["<b>Semifrase</b>","metade de uma frase","2 compassos"],["<b>Frase</b>","ideia completa, termina com uma cadência","4 compassos"],["<b>Período</b>","duas frases que se completam: <b>antecedente</b> (pergunta) + <b>consequente</b> (resposta)","8 compassos"],["<b>Forma</b>","organização das partes: A, AB, ABA, AABA...","a música inteira"]])}
${st("G","C5/q E5/q G5/q E5/q | F5/q D5/q B4/h | C5/q E5/q G5/q E5/q | D5/q B4/q C5/h ||",{time:"4/4",bpm:100,cap:"Um período de 4 compassos: antecedente (termina na dominante, \"pergunta\") + consequente (termina na tônica, \"resposta\")"})}
${box("ana","Motivo = palavra. Frase = frase. Período = pergunta e resposta. Forma = o texto inteiro, com capítulos.")}
<h2>🎤 No improviso</h2>
<ul><li>Pense em <b>frases</b>, não em \"notas sem fim\". Respire (literalmente, nos sopros) entre elas.</li><li>Use <b>pergunta e resposta</b>: uma frase que termina em suspenso, outra que conclui.</li><li>O mapa de <b>quadrantes de 8 em 8 compassos</b> é isso: organize o solo em blocos que o ouvinte consegue acompanhar.</li></ul>
${box("prof","Os tamanhos \"4 + 4\" são uma tendência forte da música tonal (chamada <b>quadratura</b>), mas não uma lei. Muitos compositores usam frases de 3, 5 ou 6 compassos, e frases que se sobrepõem (elisão). A fraseologia clássica foi sistematizada por autores como Riemann e, em língua portuguesa, tem como referência o livro \"Fraseologia Musical\", de Esther Scliar.")}
${box("pra","Improvise um período de 8 compassos sobre Si♭ maior: 4 compassos terminando no Fá (dominante) e 4 terminando no Si♭ (tônica).")}
${box("res","Motivo → semifrase → frase → período (antecedente + consequente) → forma.")}
`,
quiz:[
["Um período é formado por...",["dois motivos","antecedente + consequente","uma única nota"],1,"Pergunta e resposta."],
["Como costuma terminar o antecedente?",["Na tônica","Suspenso, frequentemente na dominante","Com uma pausa longa"],1,"Deixa a \"pergunta\" no ar."],
["Qual é a menor unidade da fraseologia?",["Frase","Motivo","Período"],1,"O motivo (inciso, célula)."]
],
pdf:[["Fraseologia",NP+"FRASEOLOGIA.pdf"]]},

{t:"Notas melódicas (notas de enfeite)", e:"🪄", min:"18 min", sub:"Passagem, bordadura, apojatura, retardo, antecipação, escapada",
goal:"reconhecer e usar os seis tipos principais de nota fora do acorde.",
body:`
<p>Notas que <b>não pertencem</b> ao acorde do momento, mas estão na melodia, são chamadas <b>notas melódicas</b> (ou notas estranhas, ornamentais). O que as classifica é <b>como elas chegam e como saem</b>.</p>
${tbl(["Tipo","Como chega","Como sai","Onde costuma cair"],[
["<b>Nota de passagem</b>","por grau (vizinha)","por grau, <b>mesma direção</b>","tempo fraco"],
["<b>Bordadura</b>","por grau","por grau, <b>volta</b> à nota de partida","tempo fraco"],
["<b>Apojatura</b>","por <b>salto</b>","por grau (resolve)","tempo <b>forte</b>"],
["<b>Retardo</b>","nota do acorde anterior, mantida (ligada)","por grau, geralmente descendo","tempo forte"],
["<b>Antecipação</b>","—","é a nota do <b>próximo</b> acorde tocada antes da hora","tempo fraco"],
["<b>Escapada</b>","por grau","por <b>salto</b>, em direção contrária","tempo fraco"]])}
${st("G","C5/q D5/q:passagem E5/q D5/q:passagem | E5/q F5/q:bordadura E5/h",{time:"4/4",bpm:90,playNotes:"C3+E3+G3/w C5/q D5/q E5/q D5/q E5/q F5/q E5/h",cap:"Sobre Dó maior: Ré de passagem (entre Dó e Mi) e Fá de bordadura (sai do Mi e volta)"})}
${st("G","A5/q*:apojatura G5/q E5/h",{time:"4/4",bpm:80,playNotes:"C4+E4+G4/w A5/q G5/q E5/h",cap:"Apojatura: Lá (fora do acorde) chega por salto no tempo forte e resolve em Sol"})}
${box("ana","Notas do acorde são os móveis de uma sala; notas melódicas são as pessoas passando entre eles. A pessoa pode passar direto (passagem), dar uma volta e voltar (bordadura), chegar pulando e sentar (apojatura)...")}
${box("dica","A <b>apojatura</b> e o <b>retardo</b> são os mais expressivos, porque colocam a dissonância no tempo forte. Um solo lento cheio de apojaturas bem resolvidas soa \"cantado\" e emocionante.")}
${box("prof","Outros tipos aparecem na literatura: nota cambiata, pedal, bordadura dupla (a base do enclosure, na próxima aula). A classificação detalhada, com notas submétricas, métricas e supermétricas, está no PDF \"Notas Melódicas\" da pasta de estudos.")}
${box("pra","Pegue uma melodia simples (\"Brilha, brilha\") e acrescente uma nota de passagem entre duas notas do acorde e uma bordadura em alguma nota longa.")}
${box("res","Passagem (vai em frente por grau), bordadura (sai e volta), apojatura (salto + resolve no forte), retardo (segura e resolve), antecipação (chega antes), escapada (grau + salto).")}
`,
quiz:[
["Uma nota que sai de uma nota do acorde e volta para ela, por grau, é...",["passagem","bordadura","antecipação"],1,"Bordadura = vizinha que volta."],
["Qual nota melódica cai no tempo forte, chega por salto e resolve por grau?",["Apojatura","Escapada","Passagem"],0,"Apojatura."],
["Tocar a nota do próximo acorde antes da hora é...",["retardo","antecipação","bordadura"],1,"Antecipação."]
],
pdf:[["Notas Melódicas",NP+"Notas Melódicas.pdf"]]},

{t:"Aproximação cromática e enclosure", e:"🌈", min:"16 min", sub:"Chegar nas notas-alvo com estilo",
goal:"usar notas cromáticas para chegar nas notas do acorde, incluindo o \"cerco\" (enclosure).",
body:`
<p>Uma das marcas do jazz (e também do choro) é <b>chegar</b> nas notas do acorde vindo de uma nota vizinha cromática, fora da escala. Como ela resolve na hora, o ouvido aceita e gosta.</p>
<h2>1️⃣ Aproximação cromática simples</h2>
<p>Toque a nota <b>um semitom abaixo</b> (ou acima) da nota-alvo, logo antes dela.</p>
${st("G","D#5/e:aprox. E5/q.*:alvo | F#4/e G4/q.*",{time:"2/4",bpm:90,playNotes:"C4+E4+G4/h D#5/e E5/q. F#4/e G4/q.",cap:"Ré♯ → Mi e Fá♯ → Sol, sobre Dó maior"})}
<h2>2️⃣ Enclosure (cerco)</h2>
<p>\"Cerque\" a nota-alvo: toque a nota de <b>cima</b> (geralmente da escala) e a de <b>baixo</b> (geralmente cromática), e então o alvo. O ouvido sente as duas vizinhas \"apertando\" a nota.</p>
${st("G","F5/e:cima D#5/e:baixo E5/q*:alvo | A4/e:cima F#4/e:baixo G4/q*:alvo",{time:"2/4",bpm:90,playNotes:"C4+E4+G4/h F5/e D#5/e E5/q A4/e F#4/e G4/q"})}
<h2>3️⃣ Cromatismo de passagem</h2>
<p>Encher um espaço de tom inteiro com a nota do meio: Dó–Dó♯–Ré. Muito usado nas <b>escalas bebop</b> (Nível 5).</p>
${box("aten","A nota cromática precisa <b>resolver</b> logo, geralmente na próxima nota e num tempo forte. Cromatismo sem destino soa como erro; cromatismo que chega num alvo soa como linguagem.")}
${box("prof","O PDF \"Cromatismo\" do Sergio Solimando da pasta de estudos mostra aproximações a notas-alvo de estruturas simétricas (trítono, tríade aumentada, acorde diminuto, escala hexafônica), escalas bebop e padrões cromáticos. É um ótimo próximo passo depois desta aula.")}
${box("pra","Sobre um Si♭7M (ou B♭ maior), faça enclosures em cada nota do arpejo: Ré (Mi♭–Dó♯–Ré), Fá (Sol–Mi–Fá), Lá (Si♭–Sol♯–Lá). Toque com colcheias, chegando no alvo no tempo.")}
${box("res","Aproximação: semitom antes do alvo. Enclosure: cima + baixo + alvo. Todo cromatismo precisa resolver.")}
`,
quiz:[
["O que é um enclosure?",["Tocar a nota-alvo repetida","Cercar a nota-alvo com as vizinhas de cima e de baixo antes de tocá-la","Pular uma oitava"],1,"Cerco da nota-alvo."],
["Qual a regra de ouro do cromatismo?",["Usar o máximo possível","Resolver logo numa nota-alvo","Evitar tempos fortes sempre"],1,"Cromatismo precisa de destino."],
["Aproximação cromática por baixo de Mi é...",["Fá","Ré♯","Ré"],1,"Um semitom abaixo de Mi = Ré♯."]
],
pdf:[["Cromatismo · Sergio Solimando","Cromatismo.pdf"],["Coker · Elements of the Jazz Language","Elements of the Jazz Language - Jerry Coker.pdf"]]}
]},

/* ============ MÓDULO 4 ============ */
{id:"n4m4", t1:"Linguagem", t2:"& Método", g:"🎙️", c:"#22c55e", t2c:"#3cff7a", sub:"Swing, padrões, transcrição, standards, metas",
desc:"Como soar dentro do estilo e como organizar anos de estudo: padrões, transcrição, um standard por semana e o seu plano de metas.",
aulas:[
{t:"Swing e articulação de jazz", e:"🎺", min:"15 min", sub:"Colcheias \"balançadas\"",
goal:"tocar colcheias com swing e articular como um músico de jazz.",
body:`
<p>No jazz tradicional, as colcheias escritas iguais são tocadas <b>desiguais</b>: a primeira de cada par mais longa, a segunda mais curta. Isso se chama <b>swing</b>. É como se cada tempo fosse uma tercina com as duas primeiras notas ligadas.</p>
${ouvir("C5/e D5/e E5/e F5/e G5/e F5/e E5/e D5/e","Colcheias retas",120)} ${ouvir("C5/q3 D5/e3 E5/q3 F5/e3 G5/q3 F5/e3 E5/q3 D5/e3","Colcheias com swing",120)}
${box("aten","A proporção do swing <b>não é fixa</b>. Em andamentos médios fica perto da tercina (2 para 1); em andamentos rápidos, fica bem mais próxima de colcheias retas. E o swing não é só o ritmo: é também a acentuação. Não existe fórmula matemática perfeita: o caminho é ouvir muito e imitar.")}
<h2>👅 Articulação típica</h2>
<ul><li>Muitas vezes o acento cai na <b>segunda</b> colcheia do par (o contratempo), e a primeira fica mais leve.</li><li>Linhas longas de colcheias costumam ser tocadas ligadas de duas em duas, começando no contratempo (\"du-<b>DAH</b> du-<b>DAH</b>\"), com a nota mais aguda de cada frase acentuada.</li><li>Notas curtas e acentuadas (\"dat\") fecham as frases.</li><li><b>Ghost notes</b> (notas quase inaudíveis) dão balanço.</li></ul>
${box("dica","Cante antes de tocar. Músicos de jazz usam sílabas como \"du-ba-du-ba\" (o chamado scat) para ensinar articulação. Se você consegue cantar com swing, consegue tocar.")}
${box("prof","O mapa \"Composição instantânea\" pede \"acentuação swing\" e \"acento métrico nos tempos 2 e 4\". Isso também vale para o <b>pulso</b>: no jazz, o prato de condução e o chimbal enfatizam os tempos 2 e 4 (backbeat). Bater palma no 2 e no 4 ao ouvir jazz ajuda a internalizar o balanço.")}
${box("pra","Metrônomo em 60, considerando os cliques como tempos 2 e 4 (um clique a cada 2 tempos). Toque uma escala em colcheias com swing, acentuando os contratempos.")}
${box("res","Swing = colcheias longa-curta (proporção varia com o andamento) + acentos nos contratempos e no 2 e 4. Aprende-se ouvindo e imitando.")}
`,
quiz:[
["No swing, a primeira colcheia de cada par é...",["mais curta","mais longa","igual"],1,"Longa-curta."],
["A proporção do swing é sempre exatamente 2:1?",["Sim","Não, varia com o andamento e o estilo","Só no blues"],1,"Em tempos rápidos o swing tende a ficar mais reto."],
["Em quais tempos o jazz costuma acentuar o pulso?",["1 e 3","2 e 4","Só no 1"],1,"Backbeat: 2 e 4."]
],
pdf:[["Niehaus · Jazz Conception","niehaus_-_jazz_conception_for_saxofone_vol_3_-_advanced_203.pdf"],["Greg Fishman · Jazz Etudes","Jazz-saxophone-etudes-by-greg-fishman-alto-and-tenorpdf.pdf"]]},

{t:"Padrões: exercícios que viram vocabulário", e:"🔁", min:"15 min", sub:"1-2-3-5, arpejos, digitais",
goal:"praticar padrões em todos os tons e saber quando usá-los.",
body:`
<p><b>Padrões</b> (patterns) são pequenas fórmulas melódicas, geralmente de 4 notas, praticadas em todas as tonalidades. Eles treinam a mão e a cabeça, e alguns viram vocabulário do seu improviso.</p>
${tbl(["Padrão","Graus","Em Dó"],[["1-2-3-5","fundamental, 2ª, 3ª, 5ª","Dó Ré Mi Sol"],["5-3-2-1","descendo","Sol Mi Ré Dó"],["1-3-5-7","arpejo de tétrade","Dó Mi Sol Si"],["3-5-7-9","arpejo a partir da 3ª","Mi Sol Si Ré"],["1-2-3-1","volta","Dó Ré Mi Dó"]])}
${st("F","Bb2/e C3/e D3/e F3/e Eb3/e F3/e G3/e Bb3/e | F3/e G3/e A3/e C4/e Bb3/q r/q",{time:"4/4",bpm:90,cap:"1-2-3-5 sobre B♭, E♭ e F (no trombone)"})}
<h2>📋 Como praticar</h2>
<ol><li>Escolha 1 padrão.</li><li>Toque-o nos 12 tons pelo ciclo de quintas.</li><li>Depois sobre uma progressão (ex.: II–V–I), ajustando as notas a cada acorde.</li><li>O mapa pede <b>10 padrões</b>: domine um por vez.</li></ol>
${box("aten","Padrão demais vira \"exercício tocado em público\". No improviso, use pedaços, mude o ritmo, combine com motivos. O padrão é tijolo, não é a casa.")}
${box("pra","Esta semana: 1-2-3-5 em todas as tonalidades maiores, subindo pelo ciclo de quintas, metrônomo a 60, colcheias.")}
${box("res","Padrões = fórmulas curtas nos 12 tons. Treinam técnica e viram vocabulário, desde que usados com variação.")}
`,
quiz:[
["O padrão 1-2-3-5 em Fá maior é...",["Fá Sol Lá Dó","Fá Lá Dó Mi","Fá Sol Lá Si♭"],0,"1 Fá, 2 Sol, 3 Lá, 5 Dó."],
["Qual o risco de usar muitos padrões no improviso?",["Soar como exercício, sem ideias próprias","Desafinar","Ficar lento"],0,"Padrão é tijolo, não a casa."],
["Qual a melhor ordem para praticar nos 12 tons?",["Aleatória","Ciclo de quintas","Só tons com sustenidos"],1,"O ciclo de quintas é o padrão de estudo."]
],
pdf:[["Patterns for Jazz","Patterns for Jazz - by Jerry Coker Jimmy Casale Gary Campbel.pdf"],["100 Ultimate Jazz Riffs","100 Ultimate Jazz Riff.pdf"]]},

{t:"Transcrever: aprender com os mestres", e:"👂", min:"15 min", sub:"O método mais antigo e eficaz",
goal:"transcrever um trecho de solo e incorporar as frases.",
body:`
<p><b>Transcrever</b> é aprender uma música ou um solo <b>de ouvido</b>, a partir de uma gravação. Foi assim que quase todos os grandes improvisadores aprenderam. O mapa \"Rotina de Evolução\" já tem: <b>Repertório → Transcrever harmonia e solos</b>.</p>
<h2>📋 Passo a passo</h2>
<ol><li><b>Escolha</b> um trecho curto (4 a 8 compassos) de um músico que você admira, de preferência do seu instrumento.</li><li><b>Ouça</b> muitas vezes, até conseguir <b>cantar</b> junto, com todas as nuances.</li><li><b>Ache</b> as notas no instrumento, frase por frase. Use programas que diminuem a velocidade sem mudar a afinação.</li><li><b>Toque junto</b> com a gravação até soar igual: notas, ritmo, articulação, som.</li><li>(Opcional) <b>Escreva</b> na partitura e <b>analise</b>: quais notas do acorde, quais aproximações, quais motivos?</li><li><b>Incorpore</b>: pegue uma frase e toque nos 12 tons, sobre outras músicas, variando.</li></ol>
${box("ana","Transcrever é como aprender um idioma morando no país. Você absorve o sotaque, as gírias e as expressões, coisas que nenhum livro de gramática ensina.")}
${box("dica","Os passos 2 e 4 (cantar e tocar junto) são os mais importantes. Escrever é útil para analisar, mas o aprendizado de verdade acontece no ouvido e no instrumento.")}
${box("pra","Escolha um trombonista (por exemplo, um solista de jazz, de choro ou de música de igreja que você admira) e transcreva 4 compassos esta semana.")}
${box("res","Transcrever: ouvir → cantar → achar → tocar junto → analisar → incorporar.")}

{t:"Substituição de trítono (SubV)", e:"🔀", min:"18 min", sub:"Trocar G7 por D♭7",
goal:"entender por que D♭7 pode substituir G7 e usar a SubV em progressões.",
body:`
<p>Lembra que o motor do G7 é o trítono entre <b>Si</b> e <b>Fá</b>? Agora olhe para o acorde <b>D♭7</b>: Ré♭, Fá, Lá♭, <b>Dó♭</b>. Dó♭ soa igual a Si (enarmonia). Ou seja, <b>D♭7 tem o mesmo trítono que G7</b>: Fá e Si/Dó♭.</p>
${tbl(["Acorde","Notas","Trítono"],[["G7","Sol Si Ré Fá","<b>Si – Fá</b>"],["D♭7","Ré♭ Fá Lá♭ Dó♭","<b>Fá – Dó♭ (= Si)</b>"]])}
<p>Como o trítono é o que cria a vontade de resolver, <b>D♭7 também resolve em C</b>. Esse acorde substituto é a <b>SubV</b> (substituto do V), e a fundamental dele fica exatamente um trítono (3 tons) longe da fundamental do V original.</p>
${ouvir("D3+F3+A3+C4/w G2+F3+B3+D4/w C3+E3+G3+B3/w","Dm7 – G7 – C7M (normal)",70)} ${ouvir("D3+F3+A3+C4/w Db3+F3+B3+Eb4/w C3+E3+G3+B3/w","Dm7 – D♭7 – C7M (com SubV)",70)}
<p>O baixo agora desce <b>cromaticamente</b>: Ré → Ré♭ → Dó. Essa linha de baixo é um dos sons mais característicos da bossa nova e do jazz.</p>
${box("ana","Dois caminhos diferentes para chegar na mesma casa: um pela avenida principal (G7), outro por uma rua lateral (D♭7). A chegada é a mesma, mas a paisagem muda.")}
<h2>🔧 Regras práticas</h2>
<ul><li>A SubV de qualquer dominante fica <b>um trítono</b> acima (ou abaixo) dele: SubV de G7 = D♭7; de C7 = G♭7; de A7 = E♭7.</li><li>Ela resolve <b>meio tom abaixo</b> da sua fundamental: D♭7 → C.</li><li>Funciona também com dominantes secundárias: E♭7 → Dm7 (SubV de A7).</li><li>Escala mais usada sobre a SubV: <b>lídio ♭7</b> (ex.: D♭ Mi♭ Fá Sol Lá♭ Si♭ Dó♭), que tem as mesmas notas da escala <b>alterada</b> de G7 (próximo módulo).</li></ul>
${box("prof","Na análise, a SubV é escrita como <b>SubV7</b> ou <b>♭II7</b> (em relação à tônica de chegada). Quando a SubV tem a 11ª aumentada, D♭7(♯11), a ♯11 é Sol, a fundamental do V original: os dois acordes ficam ainda mais parecidos.")}
${box("pra","Pegue um II–V–I em Si♭ (Cm7 – F7 – B♭7M) e troque o F7 pela SubV (B7). Escute a linha de baixo: Dó – Si – Si♭.")}
${box("res","SubV = dominante a um trítono do V original; tem o mesmo trítono, por isso resolve no mesmo lugar, com baixo cromático.")}
`,

["Qual é a SubV de G7?",["D♭7","D7","C♯m7"],0,"Um trítono acima de Sol: Ré♭."],

["Qual a SubV de A7 (que resolve em Dm)?",["E♭7","E7","D♭7"],0,"Lá + trítono = Mi♭."]
],

{t:"Empréstimo modal", e:"🎨", min:"18 min", sub:"Pegando acordes do tom menor",
goal:"usar acordes emprestados do tom homônimo menor (IVm, ♭VI, ♭VII...).",
body:`
<p>Uma música em Dó maior pode, por um momento, pegar \"emprestado\" um acorde de <b>Dó menor</b> (o tom homônimo, mesma tônica). Isso se chama <b>empréstimo modal</b> (ou intercâmbio modal). O resultado é uma mudança de cor instantânea, frequentemente emocionante.</p>
${tbl(["Acorde emprestado","Em Dó","Função","Som"],[["<b>IVm</b> (IVm6, IVm7)","Fm, Fm6","subdominante menor","saudade, emoção (muito usado em MPB e baladas)"],["<b>♭VII7</b>","B♭7","subdominante menor","\"volta pela porta dos fundos\""],["<b>♭VI7M</b>","A♭7M","subdominante menor","grandioso, cinematográfico"],["<b>♭III7M</b>","E♭7M","tônica (cor menor)","surpresa"],["<b>IIm7(♭5)</b>","Dm7(♭5)","subdominante menor","prepara o V com cor escura"]])}
${ouvir("C3+E3+G3+C4/w F2+A2+C3+F3/w C3+E3+G3+C4/w","C – F – C (normal)",60)} ${ouvir("C3+E3+G3+C4/w F2+Ab2+C3+F3/w C3+E3+G3+C4/w","C – Fm – C (IVm emprestado)",60)}
${ouvir("F2+Ab3+C4+Eb4/w Bb2+Ab3+D4/w C3+E3+G3+B3/w","Fm7 – B♭7 – C7M (\"backdoor\")",60)}
${box("ana","É como pintar um quadro alegre e, num canto, colocar uma sombra. A tonalidade continua a mesma (a casa é a mesma), mas por um instante a luz muda.")}
${box("dica","O IVm é o empréstimo mais comum. Um truque clássico: <b>IV → IVm → I</b> (F → Fm → C). A nota Lá desce para Lá♭ e depois para Sol: uma linha cromática descendente cheia de emoção.")}
${box("prof","Também se pode emprestar de outros modos com a mesma tônica (dórico, frígio, lídio, mixolídio). Ex.: ♭II7M (D♭7M em Dó) vem do frígio; II7 (D7 sem resolver em G) pode ser interpretado como empréstimo do lídio. Ao analisar, pergunte: \"este acorde existe em algum modo com a mesma tônica?\" A progressão IVm7–♭VII7–I é conhecida no jazz como \"backdoor progression\".")}
${box("pra","Numa música simples em Dó (C–F–G–C), troque o F por Fm em uma das vezes. Depois experimente trocar o G por B♭7 no final.")}
${box("res","Empréstimo modal = usar acordes do tom homônimo menor (ou de outros modos). Mais comuns: IVm, ♭VII7, ♭VI7M.")}
`,

["De onde vem o acorde Fm numa música em Dó maior?",["Do tom de Dó menor (homônimo)","Do tom de Fá maior","É dominante secundária"],0,"Empréstimo do homônimo menor."],

{t:"Os acordes diminutos e suas funções", e:"🌀", min:"20 min", sub:"Passagem, auxiliar e dominante disfarçado",
goal:"usar o acorde diminuto nas suas três funções principais.",
body:`
<p>O acorde diminuto (ex.: C♯º = Dó♯ Mi Sol Si♭) é feito só de terças menores. Ele é muito tenso e muito \"móvel\", e aparece com três funções:</p>
<h2>1️⃣ Diminuto de passagem ascendente (o mais comum)</h2>
<p>Fica entre dois acordes cujas fundamentais estão a um tom de distância, criando um baixo cromático subindo: <b>C7M – C♯º – Dm7</b>.</p>
${ouvir("C3+E3+G3+B3/w C#3+E3+G3+Bb3/w D3+F3+A3+C4/w","C7M – C♯º – Dm7",70)}
<p>Por que funciona? C♯º (Dó♯ Mi Sol Si♭) são as notas de <b>A7(♭9) sem a fundamental</b> (Lá Dó♯ Mi Sol Si♭). Ou seja, ele é uma <b>dominante disfarçada</b> do Dm7. Todo diminuto que sobe meio tom para o acorde seguinte funciona como um V7(♭9).</p>
<h2>2️⃣ Diminuto descendente</h2>
<p>Liga dois acordes com o baixo descendo cromaticamente: <b>Em7 – E♭º – Dm7</b>. Não tem função de dominante; é uma ponte cromática.</p>
${ouvir("E3+G3+B3+D4/w Eb3+Gb3+A3+C4/w D3+F3+A3+C4/w","Em7 – E♭º – Dm7",70)}
<h2>3️⃣ Diminuto auxiliar (de mesma fundamental)</h2>
<p>O acorde \"sai e volta\" para o mesmo acorde, com o diminuto construído sobre a mesma fundamental: <b>C – Cº – C</b>. As notas do diminuto funcionam como bordaduras das notas do acorde.</p>
${ouvir("C3+E3+G3+C4/w C3+Eb3+Gb3+A3/w C3+E3+G3+C4/w","C – Cº – C",70)}
${box("ana","O diminuto é o \"coringa\" da harmonia: um acorde de passagem que liga outros dois. Como ele não tem um centro estável, ele sempre quer ir para algum lugar.")}
${box("prof","Como o acorde diminuto é simétrico (divide a oitava em 4 partes iguais), qualquer uma de suas notas pode ser vista como fundamental. Por isso Cº = E♭º = G♭º = Aº (com grafias enarmônicas), e cada diminuto pode funcionar como V7(♭9) de quatro acordes diferentes, a meio tom acima de cada uma de suas notas.")}
${box("pra","Em Si♭ maior, crie a progressão B♭7M – Bº – Cm7 – C♯º – Dm7. Toque os arpejos: você vai ouvir o baixo subindo cromaticamente.")}
${box("res","Diminuto de passagem (sobe, = V7(♭9) sem fundamental), descendente (ponte cromática) e auxiliar (mesma fundamental, sai e volta).")}
`,
quiz:[
["C♯º entre C7M e Dm7 é um diminuto de...",["passagem ascendente","passagem descendente","auxiliar"],0,"O baixo sobe Dó–Dó♯–Ré."],
["C♯º equivale a qual dominante sem fundamental?",["A7(♭9)","G7","D7"],0,"Lá Dó♯ Mi Sol Si♭ sem o Lá."],
["Quantos acordes diminutos (de sons diferentes) existem?",["12","4","3"],2,"Por simetria, só três."]
],

{t:"Modulação: mudando de casa", e:"🚪", min:"16 min", sub:"Direta, por acorde pivô, por cadência",
goal:"reconhecer e escrever modulações entre tons vizinhos e distantes.",
body:`
<p><b>Modular</b> é mudar de tonalidade dentro de uma música, de forma que o novo tom passe a ser a nova casa (diferente da tonicização, que é passageira). Três formas principais:</p>
<h2>1️⃣ Por acorde pivô (comum)</h2>
<p>Um acorde que existe nos <b>dois</b> tons serve de ponte. De Dó maior para Sol maior: <b>Am</b> é VI em Dó e II em Sol. A música chega nele como VI, e sai dele como II, seguindo para D7 e G.</p>
${ouvir("C3+E3+G3/w F2+A2+C3/w A2+C3+E3/w D3+F#3+A3+C4/w G2+B2+D3/w","C – F – Am (pivô) – D7 – G",70)}
<h2>2️⃣ Direta (sem preparação)</h2>
<p>A música simplesmente recomeça no tom novo, muitas vezes no início de uma nova seção. O famoso \"subir meio tom\" no último refrão de muitas músicas pop é uma modulação direta.</p>
<h2>3️⃣ Por cadência (II–V do novo tom)</h2>
<p>Toca-se o II–V do novo tom e resolve-se nele. No jazz, é assim que muitas músicas passam de um centro tonal para outro.</p>
${tbl(["Relação","Exemplo a partir de Dó","Quão \"perto\""],[["Relativo","Lá menor","muito próximo (mesma armadura)"],["Dominante / subdominante","Sol / Fá","próximo (1 acidente de diferença)"],["Homônimo","Dó menor","cor diferente, mesma tônica"],["Mediantes cromáticas","Mi maior, Lá♭ maior","distante, som cinematográfico"]])}
${box("ana","Tonicização é visitar a casa de um vizinho; modulação é se mudar para lá. O acorde pivô é a porta que dá acesso às duas casas.")}
${box("prof","Tons \"vizinhos\" (próximos) são os que diferem em até um acidente na armadura, e seus relativos: a partir de Dó maior, são Sol, Fá, Lá menor, Mi menor e Ré menor. É para eles que a música clássica modula com mais frequência.")}
${box("pra","Escreva uma progressão que comece em Si♭ maior e module para Fá maior usando Gm (VI de Si♭, II de Fá) como pivô: B♭ – E♭ – Gm – C7 – F.")}
${box("res","Modulação = mudar de casa. Por pivô (acorde comum aos dois tons), direta ou por cadência (II–V do novo tom).")}
`,
quiz:[
["O que é um acorde pivô?",["Um acorde que pertence aos dois tons","Um acorde diminuto","O último acorde"],0,"Ele liga os dois tons."],
["Subir meio tom no último refrão é uma modulação...",["por pivô","direta","por empréstimo"],1,"Sem preparação."],
["Qual a diferença entre tonicização e modulação?",["Nenhuma","Tonicização é passageira; modulação estabelece um novo tom","Modulação só acontece em música clássica"],1,"Visita x mudança."]
],
pdf:[["Schoenberg · Harmonia","Harmonia (Arnold Schoenberg).pdf"],["Hindemith · Harmonia Tradicional","Harmonia Tradicional_Paul Hindemith_12ed.pdf"]]}
]},

{id:"n5m2", t1:"Escalas", t2:"Avançadas", g:"🧪", c:"#8b5cf6", t2c:"#b18cff", sub:"Bebop, menor melódica, simétricas, outside",
desc:"As escalas do jazz moderno e as técnicas para criar tensão planejada.",
aulas:[
{t:"Escalas bebop", e:"🎷", min:"15 min", sub:"8 notas que encaixam no tempo",
goal:"entender e usar a escala bebop dominante e a bebop maior.",
body:`
<p>Uma escala de 7 notas tocada em colcheias não \"fecha\" com os tempos: depois de 4 tempos, a nota do tempo 1 não é mais a fundamental. Os músicos do <b>bebop</b> (anos 1940) resolveram isso acrescentando <b>uma nota cromática de passagem</b>. Com 8 notas, as notas do acorde caem sempre nos tempos.</p>
<h2>🎺 Bebop dominante</h2>
<p>Mixolídio + a <b>7ª maior</b> como passagem. Sobre G7: Sol Fá♯ Fá Mi Ré Dó Si Lá (descendo).</p>
${st("G","G5/e:1 F#5/e F5/e:2 E5/e D5/e:3 C5/e B4/e:4 A4/e | G4/w",{time:"4/4",bpm:110,playNotes:"G2+B3+F4/w G5/e F#5/e F5/e E5/e D5/e C5/e B4/e A4/e G4/w",cap:"Descendo a partir da fundamental no tempo 1: nos tempos caem Sol, Fá, Ré, Si, todas notas do G7"})}
<h2>☀️ Bebop maior</h2>
<p>Escala maior + a <b>♯5 (ou ♭6)</b> como passagem. Sobre C7M ou C6: Dó Ré Mi Fá Sol <b>Sol♯</b> Lá Si.</p>
${box("aten","A escala bebop funciona como descrito quando você começa numa nota do acorde, <b>no tempo</b>, e anda por graus. Se você pular ou começar fora do tempo, a nota cromática pode cair num tempo forte, e aí ela soa como erro. Use as regras, depois quebre-as de propósito.")}
${box("prof","A sistematização das escalas bebop é associada ao educador <b>David Baker</b> (livro \"How to Play Bebop\"). Os próprios músicos do bebop, como Charlie Parker e Dizzy Gillespie, não pensavam em \"escalas bebop\": eles tocavam linhas cromáticas de passagem que depois foram organizadas assim pelos professores.")}
${box("pra","Sobre um G7 parado, toque a bebop dominante descendo a partir de Sol, Si, Ré e Fá (sempre começando no tempo 1). Depois, sobre um II–V–I, use a bebop dominante no V7.")}
${box("res","Bebop dominante = mixolídio + 7M. Bebop maior = maior + ♯5. A nota extra faz as notas do acorde caírem nos tempos.")}
`,
quiz:[
["Qual nota a bebop dominante acrescenta ao mixolídio?",["A 7ª maior","A 4ª aumentada","A 2ª menor"],0,"A 7M como passagem."],
["Para que serve a nota extra?",["Para soar mais triste","Para as notas do acorde caírem nos tempos","Para tocar mais agudo"],1,"8 notas encaixam em 4 tempos de colcheia."],
["Qual nota a bebop maior acrescenta?",["♯5 (♭6)","♭7","♭3"],0,"Sol♯ em Dó."]
],
pdf:[["Coker · Elements of the Jazz Language","Elements of the Jazz Language - Jerry Coker.pdf"],["Cromatismo (escalas bebop)","Cromatismo.pdf"]]},

{t:"A menor melódica e seus modos", e:"💎", min:"22 min", sub:"Alterada, lídio ♭7, lócrio 9",
goal:"montar os modos da menor melódica e saber em qual acorde usar cada um.",
body:`
<p>No jazz, a <b>menor melódica</b> (com 6ª e 7ª maiores, subindo e descendo) é tão importante quanto a escala maior. Como a escala maior, ela gera 7 modos, começando em cada grau. Três deles são essenciais.</p>
${tbl(["Grau","Modo (a partir de Dó menor melódica: Dó Ré Mi♭ Fá Sol Lá Si)","Acorde típico"],[
["1","Menor melódica (Dó)","Cm(7M), Cm6"],
["2","Dórico ♭2 (Ré)","Dsus4(♭9)"],
["3","Lídio aumentado (Mi♭)","E♭7M(♯5)"],
["4","<b>Lídio ♭7</b> ou lídio dominante (Fá)","<b>F7(♯11)</b>, SubV"],
["5","Mixolídio ♭13 (Sol)","G7(♭13)"],
["6","<b>Lócrio 9</b> ou lócrio ♯2 (Lá)","<b>Am7(♭5)</b> com 9ª"],
["7","<b>Alterada</b> ou superlócrio (Si)","<b>B7alt</b>: 7(♭9, ♯9, ♯11, ♭13)"]])}
<h2>🔥 A escala alterada</h2>
<p>É a escala mais tensa possível para um acorde dominante: contém <b>todas</b> as tensões alteradas (♭9, ♯9, ♯11/♭5, ♭13/♯5) e nenhuma natural. Para achar: <b>alterada de X = menor melódica de meio tom acima de X</b>.</p>
${st("G","G4/e:1 Ab4/e:♭9 Bb4/e:♯9 B4/e:3 Db5/e:♭5 Eb5/e:♭13 F5/e:♭7 G5/e:8",{bpm:100,playNotes:"G2+F3+B3/w G4/e Ab4/e Bb4/e B4/e Db5/e Eb5/e F5/e G5/e",cap:"Sol alterada = Lá♭ menor melódica (Lá♭ Si♭ Si Ré♭ Mi♭ Fá Sol)"})}
${ouvir("D3+F3+A3+C4/w G2+F3+B3+Eb4/w C3+E3+G3+B3/w","Dm7 – G7(♭13) – C7M",70)}
${box("ana","Pense na menor melódica como uma \"caixa de ferramentas especiais\". Uma única escala de 7 notas, vista de pontos diferentes, dá o som certo para acordes menores com 7M, meio-diminutos, dominantes com ♯11 e dominantes superalterados.")}
${box("dica","Conexão com a SubV: a alterada de G7 (Lá♭ menor melódica) tem exatamente as mesmas notas do lídio ♭7 de D♭7 (também Lá♭ menor melódica). Por isso a SubV e o dominante alterado soam tão parecidos.")}
${box("pra","Faça uma tabela: para cada dominante do ciclo (G7, C7, F7, B♭7...), qual é a menor melódica que dá a alterada (Lá♭, Ré♭, Sol♭, Si...)? Toque 2 por dia.")}
${box("res","Modos úteis da menor melódica: lídio ♭7 (4º grau, para 7(♯11) e SubV), lócrio 9 (6º grau, para m7(♭5)), alterada (7º grau, para 7alt). Alterada de X = menor melódica meio tom acima.")}
`,
quiz:[
["A escala alterada de G7 é igual a qual menor melódica?",["Sol menor melódica","Lá♭ menor melódica","Fá menor melódica"],1,"Meio tom acima de Sol."],
["O lídio ♭7 combina com qual acorde?",["X7M","X7(♯11)","Xm7"],1,"Dominante com 11ª aumentada."],
["Qual modo da menor melódica serve para m7(♭5) com 9ª?",["Lócrio 9 (6º grau)","Dórico ♭2","Lídio aumentado"],0,"Também chamado lócrio ♯2."]
],
pdf:[["Circle · Melódica menor Modes","Circle_Melódica_menor Modes.pdf"],["Circle · Harmônica menor Modes","Circle_Harm_menor Modes.pdf"]]},

{t:"Escalas simétricas: tons inteiros e diminuta", e:"♾️", min:"18 min", sub:"Escalas que se repetem",
goal:"montar e aplicar a escala de tons inteiros e as duas diminutas.",
body:`
<h2>1️⃣ Escala de tons inteiros (hexafônica)</h2>
<p>Seis notas, todas a <b>um tom</b> de distância: Dó Ré Mi Fá♯ Sol♯ Lá♯. Como é toda igual, não tem um \"centro\": soa flutuante, como um sonho. Existem só <b>duas</b> escalas de tons inteiros diferentes (a de Dó e a de Dó♯); todas as outras são repetições delas.</p>
${st("G","C4/q D4/q E4/q F#4/q G#4/q A#4/q C5/q",{bpm:100,cap:"Tons inteiros a partir de Dó"})}
<p><b>Uso</b>: acordes dominantes com 5ª aumentada, <b>X7(♯5)</b> ou X7(9, ♯11, ♭13). Sobre C7(♯5): Dó(1) Ré(9) Mi(3) Fá♯(♯11) Sol♯(♯5) Lá♯(♭7).</p>
<h2>2️⃣ Escala diminuta (octatônica)</h2>
<p>Oito notas alternando tom e semitom. Tem duas versões:</p>
<ul><li><b>Tom-semitom</b> (começa com tom): para <b>acordes diminutos</b>. Cº: Dó Ré Mi♭ Fá Sol♭ Lá♭ Lá Si.</li><li><b>Semitom-tom</b> (começa com semitom), chamada \"dominante diminuta\": para <b>X7(♭9)</b> e X7(♭9, 13). Sobre G7: Sol Lá♭ Si♭ Si Dó♯ Ré Mi Fá.</li></ul>
${st("G","G4/e:1 Ab4/e:♭9 Bb4/e:♯9 B4/e:3 C#5/e:♯11 D5/e:5 E5/e:13 F5/e:♭7",{bpm:100,playNotes:"G2+F3+B3/w G4/e Ab4/e Bb4/e B4/e C#5/e D5/e E5/e F5/e G5/q",cap:"Dominante diminuta de Sol (semitom-tom)"})}
${box("ana","Escalas simétricas são como papel de parede com um desenho que se repete: não importa onde você comece, o padrão é o mesmo. Isso as torna ótimas para criar sequências e padrões que \"flutuam\" sobre a harmonia.")}
${box("prof","Por simetria, a dominante diminuta de G7 é a mesma de B♭7, D♭7 e E7 (acordes a terças menores de distância). Essa propriedade é muito explorada em padrões: um desenho repetido a cada 3 semitons cabe perfeitamente na escala. Compositores como Rimsky-Korsakov, Debussy, Messiaen (\"modos de transposição limitada\") e Stravinsky usaram essas escalas muito antes do jazz.")}
${box("pra","Sobre um C7(♯5), toque a escala de tons inteiros. Sobre um G7(♭9), toque a dominante diminuta. Depois crie um padrão de 3 notas e repita-o subindo de 3 em 3 semitons dentro da diminuta.")}
${box("res","Tons inteiros: 6 notas de um tom, para 7(♯5). Diminuta tom-semitom: para º. Semitom-tom: para 7(♭9).")}
`,
quiz:[
["Quantas escalas de tons inteiros diferentes existem?",["12","6","2"],2,"Só duas coleções de notas."],
["Qual diminuta usar sobre G7(♭9)?",["Tom-semitom","Semitom-tom (dominante diminuta)","Tons inteiros"],1,"Começa com semitom a partir da fundamental."],
["A escala de tons inteiros combina com qual acorde?",["X7M","X7(♯5)","Xm7"],1,"Tem ♯5, 9, ♯11."]
],
pdf:[["Cromatismo (alvos simétricos)","Cromatismo.pdf"],["Livro de Escalas Completo",(NP+"LIVRO DE ESCALA COMPLETO- AVANÇADO.pdf").normalize("NFD")]]},

{t:"Tocar \"fora\" e sobrepor acordes", e:"🛸", min:"16 min", sub:"Outside, side-slipping, estruturas superiores",
goal:"criar tensão planejada saindo da harmonia e voltando.",
body:`
<p>O mapa \"Memorizado\" tem os galhos <b>Outside</b> e <b>Sobreposição de acordes</b>. São técnicas de nível profissional: tocar notas <b>fora</b> da harmonia de propósito, criar tensão e depois <b>resolver</b>.</p>
<h2>1️⃣ Side-slipping (deslizar meio tom)</h2>
<p>Toque uma ideia na tonalidade <b>meio tom acima</b> (ou abaixo) do acorde, e depois volte. Sobre Dm7 (dórico de Ré), toque um trecho em Mi♭ dórico e volte para Ré dórico.</p>
${st("G","D5/e F5/e A5/e C6/e Eb5/e:fora Gb5/e Bb5/e Db6/e | C6/e A5/e F5/e D5/e C5/h",{time:"4/4",bpm:110,playNotes:"D3+F3+A3+C4/w D3+F3+A3+C4/w D5/e F5/e A5/e C6/e Eb5/e Gb5/e Bb5/e Db6/e C6/e A5/e F5/e D5/e C5/h",cap:"Dentro → fora (meio tom acima) → dentro"})}
<h2>2️⃣ Sobreposição (estruturas superiores)</h2>
<p>Toque o arpejo de um <b>outro acorde</b> por cima do acorde do momento, escolhido para gerar tensões. Exemplos:</p>
${tbl(["Acorde da base","Arpejo sobreposto","Tensões resultantes"],[["C7M","Em7 (Mi Sol Si Ré)","3, 5, 7, 9"],["C7M","D (Ré Fá♯ Lá)","9, ♯11, 13 (som lídio)"],["G7","A♭m (Lá♭ Dó♭ Mi♭)","♭9, 3 (grafada como Dó♭), ♭13 (som alterado)"],["G7","E (Mi Sol♯ Si)","13, ♭9, 3"],["Dm7","F7M (Fá Lá Dó Mi)","3, 5, 7, 9"]])}
${box("aten","A regra de ouro do outside: <b>saia com convicção e volte com clareza</b>. Uma ideia forte (motivo claro, ritmo firme) torna a tensão intencional. Notas tímidas fora do tom soam só como erro.")}
${box("prof","Os saxofonistas John Coltrane e, depois, Michael Brecker e Jerry Bergonzi, além do pianista McCoy Tyner, são referências no uso de pentatônicas e tríades sobrepostas e de side-slipping. O conceito de \"upper structure triads\" (tríades de estrutura superior) é muito usado por pianistas e arranjadores para gerar acordes dominantes alterados.")}
${box("pra","Sobre um Dm7 de 8 compassos: 2 compassos dentro, 1 compasso meio tom acima, 1 compasso dentro. Repita. Grave e ouça se a volta ficou clara.")}
${box("res","Outside = sair da harmonia de propósito e voltar. Side-slipping (meio tom), sobreposição de arpejos (estruturas superiores). Convicção na saída, clareza na volta.")}
`,
quiz:[
["O que é side-slipping?",["Tocar meio tom acima ou abaixo do tom por um momento e voltar","Tocar sem ritmo","Tocar só notas do acorde"],0,"Deslizar para fora e voltar."],
["Sobre C7M, um arpejo de D maior gera quais tensões?",["♭9 e ♭13","9, ♯11 e 13","Só a 3ª"],1,"Ré (9), Fá♯ (♯11), Lá (13)."],
["Qual a regra de ouro do outside?",["Tocar baixinho","Sair com convicção e voltar com clareza","Nunca voltar"],1,"Intenção torna a tensão musical."]
],
pdf:[["Mapa: Memorizado","Screenshot_20220702-102412.png"],["Patterns for Jazz","Patterns for Jazz - by Jerry Coker Jimmy Casale Gary Campbel.pdf"]]}
]},
