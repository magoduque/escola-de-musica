const embocadura = {t:"A embocadura certa, passo a passo", e:"👄", min:"22 min", sub:"Lábios, cantos, dentes, queixo e bocal",
goal:"formar uma embocadura funcional, sem pressão excessiva, e conferir cada ponto no espelho.",
body:`
<p><b>Embocadura</b> é o conjunto formado pelos lábios, pelos músculos em volta da boca, pelo maxilar e pela colocação do bocal. Não existe uma única embocadura perfeita para todos, porque cada pessoa tem dentes e lábios diferentes. Mas existem <b>princípios</b> que praticamente todos os bons trombonistas seguem.</p>
${ill("embocadura","Os pontos da embocadura. A proporção de lábio dentro do bocal varia de pessoa para pessoa.")}
<h2>📋 Montando a embocadura em 7 passos</h2>
<ol>
<li><b>Lábios em \"M\"</b>: encostados de leve, úmidos (passe a língua antes de tocar).</li>
<li><b>Cantos firmes</b>: os cantos da boca ficam firmes, levemente para baixo, <b>sem sorrir</b>. O centro fica relaxado para vibrar.</li>
<li><b>Dentes separados</b>: os de cima e os de baixo afastados (mais ou menos a largura do dedo mínimo na região média; mais aberto no grave, menos no agudo). O ar precisa de passagem.</li>
<li><b>Queixo liso</b>: \"plano\" e apontando levemente para baixo, sem enrugar ou fazer \"bolinha\".</li>
<li><b>Bochechas paradas</b>: nada de inflar.</li>
<li><b>Colocação do bocal</b>: <b>centralizado na horizontal</b> (ou quase, dependendo dos dentes). Na vertical, a maioria dos trombonistas fica com <b>mais lábio de cima</b> dentro do bocal (algo perto de 2/3 em cima e 1/3 embaixo), mas há ótimos músicos com outras proporções. O importante: os dois lábios vibram livres.</li>
<li><b>Pressão mínima</b>: o bocal encosta só o necessário para vedar o ar. Quem faz o trabalho são o ar e os cantos da boca.</li>
</ol>
${foto("coluna","A direção da coluna de ar: os lábios devem dirigir o ar para dentro do bocal, e não para baixo (figura do Método Básico para Trombone, da pasta de estudos)",420)}

<h2>🪞 Exercício do espelho (todo dia, 2 minutos)</h2>
<ol><li>Na frente do espelho, <b>sem</b> o instrumento: forme a embocadura e faça buzz por 4 segundos. Confira os 5 primeiros passos.</li><li>Agora <b>com o bocal</b>: coloque, confira se está centralizado e faça buzz por 4 segundos.</li><li>Tire o bocal e olhe a marca: ela deve ser <b>leve</b> e sumir em poucos segundos. Marca funda e vermelha = pressão demais.</li><li>Repita 5 vezes, colocando o bocal <b>sempre no mesmo lugar</b>.</li></ol>
<h2>🎯 Exercício de colocação (no trombone)</h2>
<p>Coloque o bocal, toque uma nota longa, <b>tire o bocal do rosto</b>, respire e coloque de novo. O objetivo é achar o mesmo ponto toda vez, sem \"procurar\".</p>

<script>
/* ============ BT 1 · CONHECENDO ============ */
BTMODS.push({id:"btm1", t1:"Conhecendo", t2:"a Bateria", g:"🥁", c:"#e11d2a", sub:"Peças, montagem, baquetas e leitura",
desc:"O instrumento por dentro, com imagens: as peças e seus nomes, qual membro toca cada uma, como montar para o seu corpo, como segurar as baquetas e como ler uma partitura de bateria.",

{t:"As peças da bateria", e:"🧩", min:"15 min", sub:"Tambores, pratos e quem toca cada um",
goal:"nomear cada peça, saber o som, a função e qual mão ou pé toca cada uma.",
body:`
<p>A <b>bateria</b> é um conjunto de instrumentos de percussão (tambores e pratos) tocado por <b>uma pessoa só</b>, usando as duas mãos e os dois pés. Ela surgiu nos Estados Unidos no começo do século XX, quando músicos de banda juntaram bumbo, caixa e pratos para um único instrumentista tocar tudo. A invenção do <b>pedal de bumbo</b> foi o que tornou isso possível.</p>
${foto("kit","As peças de uma bateria básica, vistas de cima (figura do Manual do Batera, de Armando Viana, da pasta de estudos). \"Chimbal\" e \"contratempo\" são dois nomes para a mesma peça.",560)}

["<b>Chimbal</b> (hi-hat, contratempo)","à esquerda","<span style='color:#f87171'>mão direita</span> (cruzando por cima) e <span style='color:#facc15'>pé esquerdo</span> (pedal)","condução: o \"relógio\" contínuo"],
["<b>Tom 1 e Tom 2</b>","sobre o bumbo","as duas mãos","viradas e efeitos"],
["<b>Surdo</b> (tom de chão)","à direita, no chão","as duas mãos","viradas e grooves graves"],
["<b>Prato de condução</b> (ride)","à direita","<span style='color:#f87171'>mão direita</span>","condução alternativa ao chimbal (\"ding\")"],
["<b>Prato de ataque</b> (crash)","acima dos tons","qualquer mão","acentos e começo de partes (\"pshhh\")"]])}
${ill("kitMembros","O mesmo kit, colorido pelo membro que normalmente toca cada peça")}
<h2>🔊 Ouça cada peça</h2>
${stB("F4/q:Bumbo C5/q:Caixa xG5/q:Chimbal E5/q:Tom_1 | D5/q:Tom_2 A4/q:Surdo xF5/q:Condução xA5/q:Ataque",{spacing:74,bpm:70,cap:"Som aproximado de cada peça (sintetizado pelo site)"})}
${box("ana","A bateria é uma banda de percussão numa pessoa só: o bumbo é o \"passo\" de quem marcha, a caixa é a \"palma\", o chimbal é o \"relógio\" que não para e os pratos são os \"fogos de artifício\".")}
<h2>🔩 A caixa por dentro</h2>
${ill("caixa","As partes da caixa. A esteira é o que dá o som \"chiado\"; a alavanca liga e desliga.")}
<ul><li><b>Pele de ataque</b> (onde se bate) e <b>pele de resposta</b> (embaixo). Todo tambor tem as duas (o bumbo também).</li><li><b>Aro</b>: a borda de metal. Bater com a baqueta deitada, apoiada na pele e tocando o aro, produz o som de <b>aro</b> (cross-stick), seco como um \"toc\".</li><li><b>Tarraxas</b>: os parafusos que esticam a pele e afinam o tambor.</li></ul>

{t:"Montagem e ergonomia", e:"🪑", min:"12 min", sub:"A bateria se ajusta a você",
goal:"montar a bateria na altura e na distância certas para tocar sem dor e com controle.",
body:`
<p>Uma bateria mal montada causa dor nas costas e nos punhos e atrapalha a técnica. A regra de ouro: <b>a bateria se adapta ao seu corpo</b>, não o contrário.</p>
<h2>📋 Passo a passo</h2>
<ol>
<li><b>Banco primeiro</b>: sente e ajuste a altura para que as <b>coxas fiquem paralelas ao chão ou levemente inclinadas para baixo</b> (joelho um pouco abaixo do quadril). Costas retas, sem encostar.</li>
<li><b>Bumbo e pedal</b>: pé direito apoiado no pedal com o joelho num ângulo confortável (um pouco mais de 90°).</li>
<li><b>Chimbal</b>: pedal na mesma distância para o pé esquerdo. Os pratos ficam um pouco acima da altura da caixa, para a mão direita cruzar por cima sem bater na esquerda.</li>
<li><b>Caixa</b>: entre os joelhos, um pouco abaixo da linha da cintura, reta ou levemente inclinada para você.</li>
<li><b>Tons</b>: perto, inclinados para você, sem precisar esticar o braço. <b>Surdo</b>: à direita, na altura da caixa.</li>
<li><b>Pratos</b>: alcançáveis sem levantar o ombro nem inclinar o corpo.</li>
</ol>
${foto("caixa","Braços relaxados e próximos ao corpo; antebraços e baquetas formam um \"triângulo\" apontando para o centro da caixa (figura do método de Anderson Faccioli, da pasta de estudos).",300)}
${box("aten","Sinais de montagem errada: ombros subindo para alcançar os pratos, braço totalmente esticado nos tons, costas curvadas, dor na lombar. Se sentir isso, pare e ajuste antes de continuar.")}
${box("ana","Pense no banco como o banco do motorista: você ajusta o assento e os espelhos antes de dirigir. Um motorista mal sentado cansa rápido e reage mal.")}
${box("pra","Sente, feche os olhos e \"toque no ar\" cada peça. Onde a mão vai naturalmente? Leve a peça até lá.")}
${box("res","Banco com coxas paralelas ao chão, caixa um pouco abaixo da cintura, tudo ao alcance sem esticar o corpo nem subir os ombros.")}
`,
quiz:[
["O que ajustar primeiro?",["Os pratos","O banco","Os tons"],1,"Tudo depende da altura em que você senta."],
["Como ficam as coxas com o banco na altura certa?",["Apontando para cima","Paralelas ao chão ou levemente inclinadas para baixo","Muito inclinadas"],1,"Joelho um pouco abaixo do quadril."],
["O que indica que um prato está alto demais?",["Você precisa levantar o ombro para tocá-lo","O som fica grave","Nada"],0,"Nada deve exigir tensão para alcançar."]

{t:"Baquetas e a pegada", e:"🥢", min:"18 min", sub:"Pinça, mola, fulcro e rebote",
goal:"segurar as baquetas de forma relaxada, com o fulcro correto, aproveitando o rebote.",
body:`
<h2>🥢 Tipos de baqueta</h2>
${foto("baquetas","Da esquerda para a direita: baquetas comuns, baquetas sem ponta, \"hot rods\" (feixes de varetas, para volume baixo), vassourinhas (jazz e bossa) e baquetas de feltro (rulos em pratos e tímpanos). Figura do Manual do Batera.",560)}
${tbl(["Modelo","Espessura","Uso típico"],[["7A","fina, leve","jazz, música suave, mãos pequenas"],["5A","média","a mais comum: pop, rock, igreja, estudo"],["5B","um pouco mais grossa","rock, mais volume, estudo técnico"],["2B","grossa, pesada","estudo de força, rock pesado"]])}
<p>Ponta de <b>madeira</b>: som mais quente nos pratos. Ponta de <b>náilon</b>: som mais brilhante e dura mais. Para começar: <b>5A de madeira</b>.</p>
<h2>✋ Pinça e mola</h2>
<p>Uma forma simples de entender a pegada é dividir a mão em duas partes:</p>
<ul><li><b>Pinça</b>: polegar e indicador, na mesma altura, segurando a baqueta sem apertar. É o <b>fulcro</b>, o ponto onde ela gira.</li><li><b>Mola</b>: médio, anelar e mínimo, que abraçam a baqueta de leve e funcionam como uma mola que acompanha o movimento.</li></ul>
${foto("pinca","Pinça (polegar + indicador) e mola (os outros três dedos). A baqueta fica alinhada com o antebraço, como uma continuação dele. Figuras do método de Anderson Faccioli.",420)}
${ill("baqueta","Onde fica o fulcro: a cerca de um terço a partir da base")}
${box("ana","Solte uma bola de basquete e deixe ela quicar: você não empurra a bola de volta, só acompanha. A baqueta é igual: ela bate na pele e <b>volta sozinha</b> (rebote). Sua mão acompanha e dá o próximo impulso.")}
<h2>🙌 Pegada paralela (matched grip)</h2>
${foto("matched","Pegada paralela: as duas mãos seguram do mesmo jeito. 1: pinça. 2: os outros dedos abraçam. 3: posição na caixa. Figura do Manual do Batera.",330)}
${tbl(["Variação","Palmas","Movimento","Uso"],[["<b>Alemã</b>","para baixo","mais pulso","volume e força"],["<b>Americana</b>","a uns 45°","pulso + dedos","a mais versátil: recomendada para começar"],["<b>Francesa</b>","viradas para dentro (polegar em cima)","mais dedos","velocidade leve, condução, jazz"]])}
<h2>🎖️ Pegada tradicional</h2>
${foto("trad","Pegada tradicional: a mão esquerda segura por baixo, com a baqueta entre o polegar e o indicador, apoiada no anelar. Vem dos tocadores de caixa militar e é muito usada no jazz. Figura do Manual do Batera.",520)}
${box("aten","Os dois erros mais comuns: <b>apertar demais</b> (a baqueta não quica, o som fica \"engasgado\" e o punho dói) e <b>segurar muito na ponta de trás</b> (perde equilíbrio e rebote). Se o antebraço cansa rápido, você está apertando.")}
${box("prof","Os métodos concordam no princípio (fulcro + rebote), mas variam no detalhe: alguns professores preferem o fulcro no dedo médio (mais relaxado para rulos), outros no indicador (mais controle). O essencial é a baqueta se mover livremente no fulcro.")}
<h2>🎯 Exercício de rebote (com metrônomo)</h2>
${stB("C5/q:D C5/q:D C5/q:D C5/q:D | C5/q:E C5/q:E C5/q:E C5/q:E",{time:"4/4",bpm:70,t:"Um toque por clique",cap:"4 toques com a direita (D), 4 com a esquerda (E). Deixe a baqueta voltar sozinha à altura de onde saiu. Ligue o 🔔 metrônomo e compare lento e rápido."})}
${box("res","5A de madeira para começar. Pinça (fulcro) + mola, a 1/3 da base. Dedos soltos, deixe quicar. Pegada paralela americana é a mais versátil.")}
`,
quiz:[
["O que é o fulcro?",["A ponta da baqueta","O ponto onde a baqueta gira na mão, entre polegar e indicador","O tipo de madeira"],1,"É a \"pinça\"."],
["Qual modelo de baqueta é o mais comum para estudo?",["2B","5A","7A"],1,"Média, versátil."],
["Qual o erro mais comum na pegada?",["Segurar de leve","Apertar demais e impedir o rebote","Usar as duas mãos"],1,"A baqueta precisa quicar."]
],

{t:"Lendo partitura de bateria", e:"📄", min:"18 min", sub:"Uma linha para cada peça",
goal:"saber onde cada peça é escrita na pauta e ler um ritmo simples de bateria.",
body:`
<p>A bateria usa a mesma pauta de 5 linhas, mas com a <b>clave de percussão</b> (dois tracinhos verticais). Aqui as linhas e os espaços não são notas musicais: cada posição representa uma <b>peça</b>.</p>
${stB("xA5/q:Ataque xG5/q:Chimbal xF5/q:Condução E5/q:Tom_1 D5/q:Tom_2 | C5/q:Caixa A4/q:Surdo F4/q:Bumbo xD4/q:Chimbal_pé xC5/q:Aro",{spacing:70,bpm:70,cap:"Posição mais usada de cada peça (padrão mais comum; alguns métodos variam)"})}
<h2>📏 Regras</h2>
<ul><li>Tambores (caixa, tons, bumbo, surdo): <b>cabeça normal</b> (bolinha).</li><li>Pratos (chimbal, condução, ataque): <b>cabeça em \"x\"</b>.</li><li><b>Chimbal aberto</b>: um \"o\" em cima da nota; fechado: um \"+\" (ou nada).</li><li><b>Acento</b>: o sinal &gt; em cima da nota (tocar mais forte).</li><li><b>Nota fantasma</b> (bem fraca): cabeça entre parênteses.</li><li>Notas tocadas <b>juntas</b> ficam na mesma haste.</li><li>Figuras e pausas são <b>exatamente as mesmas</b> dos Níveis 1 e 2.</li><li><b>Manulação</b>: D (direita) e E (esquerda). Em livros em inglês: R e L.</li></ul>
<h2>🟦 A grade de ritmo deste curso</h2>
<p>Além da partitura, cada ritmo aqui aparece numa <b>grade</b>: uma linha por peça, uma coluna por pedacinho de tempo, e a <b>cor</b> mostra qual membro toca. Leia da esquerda para a direita; o que está na mesma coluna é tocado junto.</p>
${groove({t:"Exemplo: a levada básica",rows:[["HH","MD",H8],["SN","ME",S24],["BD","PD",K13]],bpm:[60,85,120],d:"Chimbal em todas as colcheias (mão direita), caixa nos tempos 2 e 4 (mão esquerda), bumbo nos tempos 1 e 3 (pé direito)."})}
${box("aten","Cada método pode ter uma pequena variação de notação (a posição do chimbal ou dos tons, por exemplo). Todo bom método traz uma <b>legenda</b> na primeira página: leia a legenda antes de começar.")}
${box("dica","Ler bateria é mais fácil que ler melodia: você não pensa em nome de nota, só em <b>qual peça</b> e <b>quando</b>. Os Níveis 1 e 2 (figuras, pausas, compasso, células rítmicas, síncope) são a base de toda leitura de bateria.")}
${box("res","Clave de percussão. Cada linha ou espaço = uma peça. Bumbo embaixo, caixa no 3º espaço, chimbal em \"x\" acima da pauta. Na grade, a cor mostra o membro.")}
`,
quiz:[
["Em qual espaço fica a caixa (padrão mais comum)?",["1º espaço","3º espaço","4º espaço"],1,"Caixa = 3º espaço."],
["Como são escritos os pratos?",["Com cabeça em x","Com cabeça vazia","Com um ponto"],0,"Cabeça em x."],
["Na grade de ritmo, o que a cor de cada quadrinho mostra?",["O volume","Qual membro toca (mão ou pé, direito ou esquerdo)","O tipo de baqueta"],1,"Vermelho: mão direita; azul: mão esquerda; verde: pé direito; amarelo: pé esquerdo."]
],
pdf:[["101 Levadas (legenda de notação)",BT+"Método Bateria 17.pdf"],["Drumming Boy (notação musical)",BT+"Duda moura.pdf"],["Método de Bateria (André Cabelo)",BT+"Método Bateria 16.pdf"]]}
]});

BTMODS.push({id:"btm2", t1:"Técnica", t2:"de Mãos", g:"🙌", c:"#f59e0b", t2c:"#ffc400", sub:"Golpes, rudimentos, acentos",
desc:"As mãos do baterista: os 4 tipos de golpe, toques simples e duplos, paradiddles, flams e rulos. Cada exercício tem partitura, som, metrônomo e a mão indicada em cada nota.",
aulas:[
{t:"Os 4 golpes", e:"✋", min:"18 min", sub:"Full, down, tap, up",
goal:"executar os quatro tipos de golpe e controlar a altura da baqueta.",
body:`
<p>A <b>altura</b> de onde a baqueta sai define o volume da nota. Controlar <b>de onde ela sai</b> e <b>onde ela para</b> é o segredo dos acentos e da velocidade sem tensão. Todo golpe cabe em uma de quatro categorias:</p>
${ill("golpes","Os quatro golpes: onde a baqueta começa e onde ela termina")}
${tbl(["Golpe","Começa","Termina","Para que serve"],[
["<b>Full</b> (completo)","alto","alto (volta com o rebote)","notas fortes repetidas"],
["<b>Down</b> (para baixo)","alto","baixo (você segura perto da pele)","o acento, quando a próxima nota é fraca"],
["<b>Tap</b> (toque)","baixo","baixo","notas fracas entre acentos"],
["<b>Up</b> (para cima)","baixo","alto (já preparando)","nota fraca que prepara o próximo acento"]])}
<p>Num trecho com acentos, a mão faz um ciclo: <b>down</b> (acento) → <b>taps</b> (notas fracas) → <b>up</b> (a última fraca, já subindo) → <b>down</b> (próximo acento).</p>
${stB("C5/s*:D C5/s:D C5/s:D C5/s:D C5/s*:D C5/s:D C5/s:D C5/s:D",{time:"2/4",bpm:60,t:"Exercício 1 · uma mão",cap:"Mão direita: acento (down) – tap – tap – up. Depois repita com a esquerda."})}
${stB("C5/s*:D C5/s:E C5/s:D C5/s:E C5/s*:D C5/s:E C5/s:D C5/s:E | C5/s*:E C5/s:D C5/s:E C5/s:D C5/s*:E C5/s:D C5/s:E C5/s:D",{time:"2/4",bpm:70,t:"Exercício 2 · mãos alternadas",cap:"Acento na primeira de cada tempo: um compasso começando com a direita, outro com a esquerda."})}
${box("ana","É como quicar uma bola com a mão: para um quique alto você deixa a bola subir (full); para parar a bola perto do chão depois de um quique forte, você \"segura\" (down); quiques baixinhos são taps; e para preparar um quique forte você deixa a bola subir (up).")}
${box("prof","Essa classificação é amplamente ensinada (por exemplo, por Dom Famularo e nos métodos ligados à técnica Moeller). Alturas de referência: notas fracas a 3-5 cm da pele; acentos a 20-30 cm. Quanto maior a diferença de altura, maior o contraste de volume.")}
${box("pra","Metrônomo a 60. Exercício 1 por 1 minuto com cada mão. A altura das notas fracas deve ser sempre igual, e a do acento também. Grave um vídeo de lado e confira.")}
${box("res","Full (alto→alto), down (alto→baixo), tap (baixo→baixo), up (baixo→alto). Altura da baqueta = volume.")}
`,
quiz:[
["Qual golpe usar num acento seguido de notas fracas?",["Full","Down","Up"],1,"Começa alto e para baixo, pronto para as fracas."],
["O que define o volume da nota?",["A força do braço","A altura de onde a baqueta sai","A cor da baqueta"],1,"Altura = volume, com relaxamento."],
["O up stroke serve para...",["tocar forte","preparar o próximo acento","parar o som"],1,"Toca fraco e já sobe."]
],
pdf:[["Berklee · 4 strokes (Rod Morgenstein)",BT+"(Schlagzeug)4 Stroke 1 Hand Drums.pdf"],["Wrist Stroke Studies",BT+"Método Bateria 11.pdf"]]},

{t:"Toques simples e duplos", e:"🔁", min:"18 min", sub:"D E D E e D D E E",
goal:"tocar o rulo de toques simples e o de toques duplos com as mãos iguais, em três velocidades.",
body:`
<h2>1️⃣ Toque simples (single stroke)</h2>
<p>Mãos alternadas: <b>D E D E</b>. É o mais usado de todos: grooves, viradas, condução.</p>
${stB("C5/s:D C5/s:E C5/s:D C5/s:E C5/s:D C5/s:E C5/s:D C5/s:E",{time:"2/4",bpm:80,t:"Toques simples",cap:"Use os botões 🐢 e 🐇 para ouvir a diferença entre lento e rápido."})}
<h2>2️⃣ Toque duplo (double stroke)</h2>
<p>Duas notas por mão: <b>D D E E</b>. A segunda nota de cada mão vem do <b>rebote</b> e de um pequeno impulso dos dedos, não de dois movimentos de braço. É a base do <b>rulo aberto</b>.</p>
${stB("C5/s:D C5/s:D C5/s:E C5/s:E C5/s:D C5/s:D C5/s:E C5/s:E",{time:"2/4",bpm:80,t:"Toques duplos"})}
${box("aten","No toque duplo, a segunda nota costuma sair mais fraca. O objetivo é que as duas tenham o mesmo volume. Treine devagar, grave e escute: você ouve \"TA-ta TA-ta\" ou \"ta-ta ta-ta\" igual?")}
<h2>3️⃣ Pirâmide de subdivisões</h2>
<p>O exercício clássico para sentir as divisões do tempo: semínimas, colcheias, tercinas e semicolcheias, sem parar, sempre em toques simples.</p>
${stB("C5/q:D C5/q:E C5/q:D C5/q:E | C5/e:D C5/e:E C5/e:D C5/e:E C5/e:D C5/e:E C5/e:D C5/e:E | C5/e3:D C5/e3:E C5/e3:D C5/e3:E C5/e3:D C5/e3:E C5/e3:D C5/e3:E C5/e3:D C5/e3:E C5/e3:D C5/e3:E | C5/s:D C5/s:E C5/s:D C5/s:E C5/s:D C5/s:E C5/s:D C5/s:E C5/s:D C5/s:E C5/s:D C5/s:E C5/s:D C5/s:E C5/s:D C5/s:E",{time:"4/4",bpm:60,t:"Pirâmide: 1, 2, 3 e 4 notas por tempo",cap:"Ligue o metrônomo: o clique não muda, só a quantidade de notas dentro de cada clique."})}
<h2>📈 Como ganhar velocidade</h2>
<ol><li>Comece num andamento em que tudo fica <b>perfeito e relaxado</b>.</li><li>Toque 1 minuto. Se estiver perfeito, suba 4 bpm.</li><li>Quando aparecer tensão ou irregularidade, volte 8 bpm e fique lá alguns dias.</li></ol>
${metro(60,4)}
${box("dica","O <b>Stick Control</b> (George Lawrence Stone, na pasta de estudos) é o livro mais usado no mundo para treinar combinações de D e E. A primeira página é exatamente isto: simples, duplos e paradiddles.")}
${box("res","Simples: D E D E. Duplos: D D E E (segunda nota com rebote + dedos). Pirâmide para sentir as subdivisões. Suba o metrônomo só quando estiver perfeito.")}
`,
quiz:[
["Qual é a manulação do toque duplo?",["D E D E","D D E E","D E D D"],1,"Duas por mão."],
["De onde vem a segunda nota do toque duplo?",["De um novo movimento de braço","Do rebote e de um impulso dos dedos","Do pé"],1,"Aproveitando o rebote."],
["Na pirâmide de subdivisões, o que muda?",["A velocidade do clique","A quantidade de notas dentro de cada clique","A peça tocada"],1,"O pulso fica igual."]
],
pdf:[["Stick Control (George L. Stone)",BT+"Método Bateria 12.pdf"],["Apostila De Bateria (exercícios de caixa)",BT+"Apostila De Bateria.pdf"]]},

{t:"Paradiddles", e:"🔀", min:"16 min", sub:"D E D D  E D E E",
goal:"tocar o paradiddle e suas variações e usá-lo na bateria.",
body:`
<p>O <b>paradiddle</b> mistura simples e duplos: <b>D E D D  E D E E</b>. O nome imita o som: \"pa-ra-di-dle\". Ele alterna a mão que começa cada grupo, e por isso serve para quase tudo.</p>
${stB("C5/s*:D C5/s:E C5/s:D C5/s:D C5/s*:E C5/s:D C5/s:E C5/s:E",{time:"2/4",bpm:80,t:"Paradiddle simples",cap:"Acento na primeira nota de cada grupo"})}
<h2>🧬 Variações</h2>
${stB("C5/e3*:D C5/e3:E C5/e3:D C5/e3:E C5/e3:D C5/e3:D | C5/e3*:E C5/e3:D C5/e3:E C5/e3:D C5/e3:E C5/e3:E",{time:"2/4",bpm:80,t:"Paradiddle duplo (D E D E D D)",cap:"Seis notas: encaixa em tercinas ou sextinas"})}
${stB("C5/e3*:D C5/e3:E C5/e3:D C5/e3:D C5/e3:E C5/e3:E",{time:"2/4",bpm:80,t:"Paradiddle-diddle (D E D D E E)",cap:"Sempre começa com a mesma mão: ótimo para condução rápida e viradas"})}
<h2>🥁 Paradiddle na bateria</h2>
<p>Mão direita no chimbal, esquerda na caixa, bumbo no tempo 1: o paradiddle vira um groove com sabor funk.</p>
${groove({t:"Paradiddle distribuído",sub:4,beats:2,time:"2/4",bpm:[55,80,110],rows:[["HH","MD","x.xx.x.."],["SN","ME",".g..X.gg"],["BD","PD","x......."]],how:"A mão esquerda faz notas fantasma bem fracas, menos a do tempo 2, que é acentuada."})}
${box("prof","Ron Spagnardi escreveu um livro inteiro sobre isso (\"Paradiddle Power\", na pasta de estudos): aplicar paradiddles a grooves, viradas e condução distribuindo as mãos entre as peças.")}
${box("pra","Paradiddle na caixa com metrônomo: 60 → 100 bpm. Depois distribua: D no surdo, E na caixa. Depois D no tom 1, E no tom 2.")}
${box("res","Paradiddle = D E D D E D E E. Alterna a mão que começa. Distribuído pelas peças, vira groove e virada.")}
`,
quiz:[
["Qual é a manulação do paradiddle simples?",["D E D E E D E D","D E D D E D E E","D D E E D D E E"],1,"Simples + duplo."],
["Qual a vantagem do paradiddle?",["Tocar só com uma mão","Alternar a mão que começa cada grupo","Tocar mais alto"],1,"Muito útil para grooves e viradas."],
["Quantas notas tem o paradiddle duplo?",["4","6","8"],1,"D E D E D D."]
],
pdf:[["Paradiddle Power (Spagnardi)",BT+"(drums)paradiddle power-ron spagnardi-1.pdf"],["Stick Control",BT+"Método Bateria 12.pdf"]]},

{t:"Os rudimentos: flams, drags e rulos", e:"📜", min:"22 min", sub:"O \"alfabeto\" das mãos",
goal:"conhecer as 4 famílias de rudimentos e tocar flam, drag, rulos de 5 e 9 e rulo de pressão.",
body:`
<p><b>Rudimentos</b> são padrões básicos de manulação: o \"alfabeto\" do baterista. A <b>Percussive Arts Society</b> (PAS) organizou em 1984 uma lista de <b>40 rudimentos internacionais</b>, em quatro famílias:</p>
${tbl(["Família","Exemplos"],[["<b>Rulos</b> (rolls)","toque simples, toque duplo, rulo de pressão (buzz), rulos de 5, 7, 9..."],["<b>Diddles</b>","paradiddle, paradiddle duplo, paradiddle-diddle..."],["<b>Flams</b>","flam, flam tap, flam accent, flamacue..."],["<b>Drags</b>","drag (ruff), drag tap, ratamacue..."]])}
<h2>🌀 Flam</h2>
<p>Duas notas quase juntas: uma <b>bem fraca</b> (a apojatura, vinda de uma mão baixa) e logo depois uma <b>forte</b> (a outra mão, alta). Soa \"<b>flã</b>\", uma nota gorda. As duas mãos <b>não</b> podem bater exatamente juntas.</p>
${stB("fC5/q:eD fC5/q:dE fC5/q:eD fC5/q:dE",{time:"4/4",bpm:70,t:"Flams alternados",cap:"\"eD\" = a esquerda faz a notinha e a Direita a nota principal; \"dE\" é o contrário."})}
${stB("fC5/e:eD C5/e:D fC5/e:dE C5/e:E fC5/e:eD C5/e:D fC5/e:dE C5/e:E",{time:"4/4",bpm:70,t:"Flam tap",cap:"Flam + um toque da mesma mão"})}
<h2>🌀 Drag (ruff)</h2>
<p>Duas notas fraquinhas e rápidas (um duplo de uma mão) antes da nota principal da outra mão: \"<b>trrrá</b>\".</p>
${stB("gC5/s:E gC5/s:E C5/e*:D gC5/s:D gC5/s:D C5/e*:E",{time:"2/4",bpm:60,t:"Drag",cap:"EE-D, DD-E: as duas primeiras bem baixinhas"})}
<h2>🌀 Rulos de 5 e de 9</h2>
${stB("C5/s:D C5/s:D C5/s:E C5/s:E C5/q*:D | C5/s:E C5/s:E C5/s:D C5/s:D C5/q*:E",{time:"2/4",bpm:70,t:"Rulo de 5 (DD EE D)",cap:"Dois duplos e uma nota acentuada. Alterna a mão que começa."})}
${stB("C5/s:D C5/s:D C5/s:E C5/s:E C5/s:D C5/s:D C5/s:E C5/s:E | C5/q*:D r/q",{time:"2/4",bpm:70,t:"Rulo de 9 (DD EE DD EE D)"})}
<h2>🌀 Rulo de pressão (buzz)</h2>
<p>Cada baqueta é pressionada contra a pele e produz vários quiques rápidos (\"zzz\"). Alternando as mãos sem buracos, o som fica contínuo.</p>
${stB("zC5/q:D zC5/q:E zC5/q:D zC5/q:E | zC5/w",{time:"4/4",bpm:70,t:"Rulo de pressão"})}
${box("ana","Rudimentos são como os golpes básicos de uma arte marcial: sozinhos parecem simples, mas combinados formam qualquer luta. Todo groove e toda virada é uma combinação de rudimentos.")}
${box("prof","Charley Wilcoxon (\"The All-American Drummer: 150 Rudimental Solos\", na pasta de estudos) é o clássico dos solos rudimentais, muito usado para caixa clara e em provas. Para caixa orquestral, os métodos de Ney Rosauro (também na pasta) são referência brasileira.")}
${box("pra","5 minutos por dia: um rudimento novo por semana, sempre com metrônomo, nas três velocidades (lento, normal, rápido).")}
${box("res","4 famílias: rulos, diddles, flams, drags. Flam = fraca + forte quase juntas. Drag = duas fraquinhas + principal. Rulo de 5 = DD EE D.")}
`,
quiz:[
["Quantos rudimentos tem a lista internacional da PAS?",["26","40","100"],1,"40 rudimentos internacionais."],
["No flam, as duas mãos...",["batem exatamente juntas","batem quase juntas: uma fraca antes da forte","nunca tocam"],1,"Se baterem juntas, é o erro clássico."],
["Rulo de 5 é...",["D E D E D","DD EE D","D D D D D"],1,"Dois duplos e uma nota."]
],
pdf:[["Standard Drum Rudiments",BT+"Cynic_Drums_Rudiments.pdf"],["Wilcoxon · All-American Drummer",BT+"The All American Drummer 150 Rudimental Solos.pdf"]]}
]});

</script>
<script>
/* ============ BT 3 · COORDENAÇÃO ============ */
BTMODS.push({id:"btm3", t1:"Coordenação", t2:"& Levadas", g:"🦶", c:"#22c55e", t2c:"#3cff7a", sub:"Pés, primeira levada, independência",
desc:"Juntar mãos e pés: a técnica dos pedais, a primeira levada montada peça por peça, variações de bumbo, semicolcheias, chimbal aberto e o clique.",
aulas:[
{t:"Os pés: bumbo e chimbal", e:"🦶", min:"16 min", sub:"Calcanhar em cima ou embaixo",
goal:"tocar o bumbo e o pedal do chimbal com controle, nas duas técnicas principais.",
body:`
${ill("pedal","As duas técnicas de pé no pedal do bumbo")}
${tbl(["Técnica","Como","Som e uso"],[["<b>Calcanhar embaixo</b> (heel down)","calcanhar apoiado no pedal; o movimento vem do tornozelo","mais controle e volume baixo: jazz, baladas, igreja"],["<b>Calcanhar levantado</b> (heel up)","calcanhar no ar; o movimento vem da perna e do tornozelo","mais volume e velocidade: rock, pop, gospel animado"]])}
<p>Depois do golpe, a batedeira pode <b>voltar</b> (deixa a pele soar mais) ou <b>ficar encostada</b> na pele (som mais curto e seco). Os dois são válidos; comece deixando voltar, que soa mais aberto e cansa menos.</p>
<h2>🦶 Pedal do chimbal</h2>
<ul><li>Pedal pressionado = <b>chimbal fechado</b>; aliviado = <b>aberto</b>.</li><li>Tocar o chimbal <b>só com o pé</b> (\"chick\") marca tempos, muito usado no jazz (tempos 2 e 4) e no samba (contratempos).</li></ul>
<h2>🎯 Exercícios de pés</h2>
${groove({t:"1 · Bumbo em semínimas",rows:[["BD","PD","x...x...x...x..."]],bpm:[50,70,100]})}
${groove({t:"2 · Bumbo e chimbal com o pé, alternados",rows:[["BD","PD","x.......x......."],["HP","PE","....x.......x..."]],bpm:[50,70,100],d:"Pé direito nos tempos 1 e 3, pé esquerdo nos tempos 2 e 4: como andar."})}
${groove({t:"3 · Bumbo em colcheias, chimbal marcando os tempos",rows:[["BD","PD","x.x.x.x.x.x.x.x."],["HP","PE","x...x...x...x..."]],bpm:[50,70,95]})}
${box("aten","Não tensione a perna nem o ombro ao tocar o bumbo. O peso do corpo fica no banco; a perna só se movimenta.")}
${box("res","Heel down = controle; heel up = potência. Pedal do chimbal: pressionado fecha, aliviado abre; pode marcar o tempo sozinho.")}
`,
quiz:[
["Qual técnica de bumbo dá mais controle em volumes baixos?",["Calcanhar levantado","Calcanhar embaixo","Ponta do pé"],1,"Heel down, movimento do tornozelo."],
["Com o pedal do chimbal pressionado, o chimbal fica...",["aberto","fechado","desligado"],1,"Pressionado = fechado."],
["O que é tocar o chimbal só com o pé?",["Um erro","Um recurso comum para marcar tempos (\"chick\")","Impossível"],1,"Muito usado no jazz e no samba."]
],
pdf:[["Método de Bateria (coordenação inicial)",BT+"Metodo De Bateria.pdf"],["Manual do Batera",BT+"MANUAL DO BATERA COMPLETO.pdf"]]},

{t:"Sua primeira levada, peça por peça", e:"🎉", min:"20 min", sub:"O groove de rock em colcheias",
goal:"tocar a levada básica com os membros coordenados, montando um de cada vez.",
body:`
<p><b>Levada</b> (groove) é o padrão rítmico que se repete e sustenta a música. Vamos montar a mais importante de todas em quatro passos. Em cada passo, clique em <b>Tocar em loop</b>, ouça, e toque junto. Comece no 🐢 <b>Lento</b>.</p>
${groove({t:"Passo 1 · Só a mão direita no chimbal",rows:[["HH","MD",H8]],bpm:[55,75,110],d:"Conte em voz alta: \"1 e 2 e 3 e 4 e\". Oito toques iguais por compasso."})}
${groove({t:"Passo 2 · Acrescente o bumbo",rows:[["HH","MD",H8],["BD","PD",K13]],bpm:[55,75,110],d:"O pé direito toca junto com a mão direita nos tempos 1 e 3."})}
${groove({t:"Passo 3 · Mão direita + mão esquerda",rows:[["HH","MD",H8],["SN","ME",S24]],bpm:[55,75,110],d:"Agora sem o pé: a caixa nos tempos 2 e 4, junto com o chimbal."})}
${groove({t:"Passo 4 · A levada completa",rows:[["HH","MD",H8],["SN","ME",S24],["BD","PD",K13]],bpm:[55,80,120],d:"Chimbal sem parar, bumbo no 1 e 3, caixa no 2 e 4."})}
${box("ana","É como aprender a andar de bicicleta: primeiro você pedala, depois equilibra, depois olha para a frente. No começo parece impossível fazer tudo junto; depois de alguns dias o corpo faz sozinho.")}
${box("aten","Erro comum: a mão direita \"para\" quando a esquerda toca a caixa. O chimbal nunca para. Outro erro: bater o chimbal tão forte quanto a caixa. O chimbal é mais suave; a caixa, forte; o bumbo, firme.")}
${box("dica","Essa levada, com pequenas variações, toca uma quantidade enorme de músicas de pop, rock e louvor. Coloque uma música de que você gosta e toque junto.")}
${box("res","Chimbal em colcheias (não para), bumbo no 1 e 3, caixa no 2 e 4. Monte uma peça por vez, do lento ao rápido.")}
`,
quiz:[
["Na levada básica, em que tempos fica a caixa?",["1 e 3","2 e 4","Só no 1"],1,"Backbeat: 2 e 4."],
["O que o chimbal toca?",["Só nos tempos","Colcheias contínuas","Só no fim do compasso"],1,"8 colcheias por compasso."],
["Qual o erro mais comum?",["Tocar devagar","A mão direita parar quando a esquerda toca","Usar metrônomo"],1,"A condução nunca para."]
],
pdf:[["Groove Essentials (Tommy Igoe)",BT+"Tommy Igoe - Grooves Essentials.pdf"],["Método de Bateria (André Cabelo · condução)",BT+"Método Bateria 16.pdf"]]},

{t:"Variações de bumbo e independência", e:"🧠", min:"20 min", sub:"Mãos fixas, pés mudando",
goal:"variar o bumbo mantendo chimbal e caixa estáveis.",
body:`
<p><b>Independência</b> é a capacidade de cada membro fazer uma coisa diferente sem atrapalhar os outros. O primeiro passo: <b>mãos fixas</b> (a levada básica) e o <b>bumbo mudando</b>. Toque cada variação 4 vezes e passe para a próxima sem parar.</p>
${groove({t:"Variação 1 · bumbo no 1, no 3 e no \"e\" do 3",rows:[["HH","MD",H8],["SN","ME",S24],["BD","PD","x.......x.x....."]],bpm:[55,80,115]})}
${groove({t:"Variação 2 · bumbo no 1, no \"e\" do 2 e no 3",rows:[["HH","MD",H8],["SN","ME",S24],["BD","PD","x.....x.x......."]],bpm:[55,80,115]})}
${groove({t:"Variação 3 · dois bumbos no começo",rows:[["HH","MD",H8],["SN","ME",S24],["BD","PD","x.x.....x......."]],bpm:[55,80,115]})}
${groove({t:"Variação 4 · bumbo sincopado",rows:[["HH","MD",H8],["SN","ME",S24],["BD","PD","x.....x...x....."]],bpm:[55,80,115],d:"Bumbo no 1, no \"e\" do 2 e no \"e\" do 3: o tempo 3 fica sem bumbo."})}
${groove({t:"Variação 5 · bumbo em semicolcheia",rows:[["HH","MD",H8],["SN","ME",S24],["BD","PD","x..x....x.x....."]],bpm:[50,75,105],d:"O segundo bumbo cai entre duas notas do chimbal (no \"a\" do 1). É o primeiro bumbo \"sozinho\"."})}
<h2>🧠 Como treinar independência</h2>
<ol><li>Fale o ritmo do bumbo em voz alta (\"tum . . tum tum . .\") antes de tocar.</li><li>Comece no lento, até ficar automático.</li><li>Troque de variação a cada 4 compassos sem parar.</li></ol>
${box("prof","\"Syncopation\" (Ted Reed) e \"Advanced Funk Studies\" (Rick Latham), ambos na pasta de estudos, são as referências clássicas. Ted Reed é usado de dezenas de maneiras: por exemplo, lendo a linha de ritmo com o bumbo enquanto as mãos fazem a levada.")}
${box("res","Mãos fixas, bumbo variando. Fale o ritmo antes, toque devagar, troque de variação sem parar.")}
`,
quiz:[
["O que é independência na bateria?",["Tocar sozinho","Cada membro fazer uma coisa diferente sem atrapalhar os outros","Tocar sem metrônomo"],1,"Coordenação dos 4 membros."],
["Qual o primeiro passo do treino de independência?",["Mudar tudo ao mesmo tempo","Mãos fixas e bumbo mudando","Tocar muito rápido"],1,"Uma variável por vez."],
["Qual livro clássico é usado para esse treino?",["Syncopation (Ted Reed)","Arban","Real Book"],0,"Na sua pasta."]
],

{t:"Tempo, clique e contagem", e:"⏱️", min:"14 min", sub:"O baterista é o relógio da banda",
goal:"manter o andamento estável, contar a banda e tocar com clique.",
body:`
<p>A função número um do baterista não é fazer viradas incríveis: é <b>manter o tempo</b>. A banda inteira se apoia nele.</p>
<h2>🐢🐇 Sinta as velocidades</h2>
<p>Ligue o metrônomo e clique em cada velocidade para sentir no corpo a diferença:</p>
${metro(100,4)}
${tbl(["Andamento","bpm","Onde aparece"],[["Muito lento","50-65","adoração lenta, baladas, blues lento"],["Lento","66-85","baladas, reggae, hip-hop"],["Médio","86-115","pop, louvor, funk, samba-canção"],["Rápido","116-150","rock, samba, forró, disco"],["Muito rápido","150+","frevo, punk, metal, drum and bass, shout"]])}
<h2>🗣️ Contando a banda</h2>
<p>Antes de começar, o baterista <b>conta</b> no andamento certo: \"1, 2, 3, 4\" batendo as baquetas. Cante mentalmente o refrão <b>antes</b> de contar, para achar a velocidade.</p>
<h2>🎧 Tocar com clique</h2>
<ul><li><b>Clique</b> é o metrônomo no fone, muito usado em igrejas e gravações.</li><li>O objetivo é \"esconder\" o clique: sua nota cai tão em cima do clique que você deixa de ouvi-lo.</li><li>Depois treine com o clique só nos tempos 2 e 4, depois só no tempo 1, depois a cada 2 compassos: isso cria o <b>relógio interno</b>.</li></ul>
${groove({t:"Treino: levada com clique",rows:[["HH","MD",H8],["SN","ME",S24],["BD","PD",K13]],bpm:[60,90,130],d:"Ligue o 🔔 Metrônomo ao lado do botão de tocar e ouça como a levada encaixa no clique."})}
${box("aten","Acelerar na virada e no refrão é o erro mais comum de bateristas. Grave-se com o clique e confira se você volta exatamente no tempo.")}
${box("res","Tempo é a função número um. Conte a banda no andamento certo. Treine com clique e depois com clique esparso para criar o relógio interno.")}
`,
quiz:[

["Como desenvolver o relógio interno?",["Nunca usar metrônomo","Usar o clique em partes cada vez mais esparsas","Tocar sempre rápido"],1,"Clique só no 2 e 4, depois só no 1..."]
],
pdf:[["Método de Estudo para Bateria (Igreja Cristã Maranata)",BT+"Método de Estudo para Bateria.pdf"]]}

BTMODS.push({id:"btm4", t1:"Viradas", t2:"& Fraseado", g:"💥", c:"#8b5cf6", t2c:"#b18cff", sub:"Onde, como e quanto virar",
desc:"Viradas (fills) conectam as partes da música. Onde colocar, como construir com semicolcheias, tercinas e sextinas, e como voltar no tempo 1. Todas com a mão indicada em cada nota.",

{t:"O que é uma virada e onde colocar", e:"🗺️", min:"14 min", sub:"Pontuação entre as partes",
goal:"saber em que ponto da música fazer uma virada e de que tamanho.",
body:`
<p>A <b>virada</b> é uma frase curta que sai da levada e <b>anuncia</b> uma mudança: o fim de uma frase, a entrada do refrão, a volta ao verso. É a pontuação da música.</p>
<h2>📍 Onde</h2>
<ul><li>No <b>último compasso</b> de uma frase de 4 ou 8 compassos (lembre da fraseologia do Nível 4).</li><li>Antes de uma <b>nova parte</b> (refrão, ponte).</li><li>Tamanho: de <b>1 tempo</b> (discreta) até <b>1 compasso inteiro</b> (anúncio forte).</li></ul>
<h2>🎯 A regra da volta</h2>
<p>A virada termina e a levada <b>volta exatamente no tempo 1</b> do compasso seguinte, geralmente com <b>prato de ataque + bumbo</b>.</p>
${groove({t:"Levada + virada de 1 tempo + volta no 1",bars:2,rows:[["CR","MD","x..............................."],["HH","MD","..x.x.x.x.x.x.x.x.x.x.x.x.x....."],["SN","MM","....L.......L.......L.......RL.."],["T1","MD","..............................R."],["FT","ME","...............................L"],["BD","PD","x.......x.......x.......x......."]],bpm:[55,80,110],d:"Compasso 1: levada começando com prato de ataque. Compasso 2: no tempo 4, virada D E D E (caixa, caixa, tom, surdo). O loop volta no ataque."})}
${box("ana","A virada é como a respiração antes de uma frase importante num discurso. Pequena e no lugar certo, dá força ao que vem depois. Toda hora e comprida demais, cansa quem escuta.")}
${box("dica","Menos é mais: em música de igreja e pop, uma virada simples e no tempo vale muito mais que uma virada complicada que atrasa.")}
${box("res","Virada = pontuação no fim das frases (4 ou 8 compassos) e antes de novas partes. De 1 tempo a 1 compasso. Sempre volte no 1 com ataque + bumbo.")}
`,
quiz:[
["Onde normalmente se coloca uma virada?",["No meio de qualquer compasso","No último compasso de uma frase ou antes de uma nova parte","No primeiro tempo da música"],1,"Ela anuncia a mudança."],
["Como a virada normalmente termina?",["Com silêncio","Voltando no tempo 1 com ataque + bumbo","Com um rulo longo"],1,"A volta no 1 é o ponto crítico."],
["Qual o tamanho mais comum de uma virada?",["De 1 tempo a 1 compasso","8 compassos","Uma música inteira"],0,"Curta e no lugar."]
],
pdf:[["Apostila De Bateria (exercícios de virada)",BT+"Apostila De Bateria.pdf"]]},

{t:"Viradas em semicolcheias pelos tambores", e:"🌊", min:"18 min", sub:"Caixa → tons → surdo",

${groove({t:"Virada 2 · duas notas em cada tambor (meio compasso)",rows:[["HH","MD","x.x.x.x........."],["SN","MM","....L...RL......"],["T1","MM","..........RL...."],["T2","MM","............RL.."],["FT","MM","..............RL"],["BD","PD","x..............."]],bpm:[50,75,105],d:"Levada nos tempos 1 e 2, virada nos tempos 3 e 4."})}
${groove({t:"Virada 3 · com bumbo no meio (mão, mão, pé)",rows:[["SN","MM","RL..RL.........."],["FT","MM","........RL..RL.."],["BD","PD","..x...x...x...x."]],bpm:[50,72,100],d:"D E pé (espaço) repetido: caixa, caixa, bumbo... depois surdo, surdo, bumbo."})}
${groove({t:"Virada 4 · com acentos de 3 em 3",rows:[["SN","MM","XggXggXggXggXggX"]],bpm:[50,72,100],d:"Todas as semicolcheias na caixa, em D E D E, acentuando uma nota a cada três. O ouvido sente um \"3 contra 4\"."})}
<h2>🧩 Para criar as suas</h2>

${groove({t:"Exemplo de como ler: rock básico",rows:[["HH","MD",H8],["SN","ME",S24],["BD","PD",K13]],bpm:[60,90,130],d:"Cada linha é uma peça. A cor é o membro. ● é um toque normal, ▲ é acento, ○ é nota fantasma (bem fraca), ◯ é chimbal aberto."})}
${box("aten","Todo ritmo tem <b>muitas variações</b>, que mudam de região para região, de músico para músico e de método para método. O que está aqui é a <b>levada-base mais ensinada</b> de cada estilo, às vezes simplificada para a bateria (muitos desses ritmos nasceram em instrumentos de percussão, não na bateria). Quando um ritmo aparece marcado como \"forma simplificada\", use-o como ponto de partida e consulte os métodos indicados para as formas tradicionais.")}

{t:"Baião, xote e arrasta-pé", e:"🌵", min:"26 min", sub:"Os ritmos do forró",
goal:"tocar as levadas-base dos ritmos de forró.",
body:`
<p>O trio tradicional do forró é <b>sanfona, zabumba e triângulo</b>. Na bateria: o <b>bumbo</b> imita o som grave da zabumba, o <b>aro ou a caixa</b> imita o \"bacalhau\" (a vareta fina que bate na pele de baixo da zabumba) e o <b>chimbal</b> imita o triângulo.</p>
${estilo("Baião","Popularizado por Luiz Gonzaga nos anos 1940. O bumbo toca no tempo 1 e na última semicolcheia do tempo 1 (\"tum . . tum\"); esse segundo toque soa até o tempo 2. O aro responde no contratempo do 2.",
 {t:"Baião básico",time:"2/4",beats:2,bars:2,bpm:[60,90,115],rows:[["HH","MD","x.X.x.X.x.X.x.X."],["XS","ME","......x.......x."],["BD","PD","x..x....x..x...."]],how:"O chimbal acentua os contratempos, como o triângulo (que abre no contratempo)."},
 [{t:"Variação: triângulo com chimbal aberto",time:"2/4",beats:2,bars:2,bpm:[60,90,115],rows:[["HH","MD","x.o.x.o.x.o.x.o."],["SN","ME","......x.......x."],["BD","PD","x..x....x..x...."],["HP","PE","x...x...x...x..."]],d:"Chimbal abrindo no contratempo e fechando no tempo com o pé; caixa no lugar do aro."},
  {t:"Variação: bumbo 3+3+2",time:"2/4",beats:2,bars:2,bpm:[60,90,115],rows:[["HH","MD","x.X.x.X.x.X.x.X."],["XS","ME","....x.......x..."],["BD","PD","x..x..x.x..x..x."]],d:"O bumbo acrescenta o \"e\" do 2: muito comum no forró atual."}])}
${estilo("Xote (forma simplificada)","Mais lento e \"arrastado\", bom para dançar coladinho. Bumbo no 1 e no \"e\" do 2, aro no 2.",
 {t:"Xote",time:"2/4",beats:2,bars:2,bpm:[50,68,85],rows:[["HH","MD","x.x.x.x.x.x.x.x."],["XS","ME","....x.......x..."],["BD","PD","x.....x.x.....x."]],how:"Forma simplificada; o balanço do xote tem um leve swing que só se pega ouvindo."})}
${estilo("Arrasta-pé (marcha junina)","O forró rápido das festas juninas. É uma marcha: bumbo nos dois tempos, caixa nos contratempos.",
 {t:"Arrasta-pé",time:"2/4",beats:2,bars:2,bpm:[90,125,150],rows:[["HH","MD","x.x.x.x.x.x.x.x."],["SN","ME","..x...x...x...x."],["BD","PD","x...x...x...x..."]],how:"\"Tum-tá tum-tá\". É a mesma estrutura da polca."})}
${box("prof","A apostila de Edgard Rocca (na pasta de estudos) mostra cada ritmo primeiro nos instrumentos de percussão originais e depois na adaptação para bateria, incluindo xaxado, coco, maracatu, frevo e ciranda.")}
${box("res","Bumbo = zabumba (\"tum . . tum\"), aro = bacalhau, chimbal = triângulo. Xote é lento; arrasta-pé é uma marcha rápida.")}
`,
quiz:[
["No baião, o bumbo imita...",["o surdo","a zabumba","o pandeiro"],1,"A zabumba."],
["O chimbal no baião imita...",["o triângulo","a sanfona","o agogô"],0,"Acentuando os contratempos."],
["O arrasta-pé tem a caixa...",["nos tempos","nos contratempos","só no 1"],1,"Bumbo no tempo, caixa no contratempo."]
],
pdf:[["Ritmos brasileiros (Edgard Rocca)",BT+"Apostila de PercussÃ£o -  Edgard Rocca.pdf"],["101 Levadas (parte 2)",BT+"Método Bateria 15.pdf"]]},

${box("res","Marcha: bumbo nos tempos, caixa \"x.xx\". Marchinha: acento no 2. Frevo: marcha muito rápida com rulos e acentos. Samba-reggae: célula em clave sobre base grave.")}
`,

],

<p>No nível avançado, você mantém um padrão fixo (<b>ostinato</b>) em alguns membros enquanto outro membro toca algo independente, lido ou improvisado.</p>
<h2>📋 Sistemas de estudo</h2>
<ol><li><b>Ostinato de pés</b>: bumbo e pé do chimbal fazem um padrão fixo (samba, baião); as mãos leem as lições do Ted Reed.</li><li><b>Ostinato de mão direita</b>: condução de jazz fixa; caixa e bumbo leem as síncopas.</li><li><b>Linear</b>: nenhuma peça toca junto com outra (veja em Funk).</li></ol>
${groove({t:"Ostinato de samba nos pés + mãos livres",time:"2/4",beats:2,bars:2,bpm:[50,75,100],rows:[["SN","MM","R.L.RL.R.L.R.RL."],["BD","PD","x..xx..xx..xx..x"],["HP","PE","..x...x...x...x."]],d:"Os pés não mudam nunca. As mãos tocam o teleco-teco alternando D e E. Depois, improvise com as mãos."})}
${groove({t:"Ostinato de jazz + bumbo com acentos sincopados",sub:3,bars:2,bpm:[70,110,150],rows:[["RD","MD","x..x.xx..x.xx..x.xx..x.x"],["HP","PE","...x.....x.....x.....x.."],["BD","PD","..x.....x..x......x....."]],d:"O prato e o chimbal são automáticos; o bumbo faz acentos sincopados (as \"bombas\" do bebop)."})}
${groove({t:"Ostinato de baião nos pés + semicolcheias com acentos nas mãos",time:"2/4",beats:2,bars:2,bpm:[50,72,95],rows:[["SN","MM","XggXggXgXggXggXg"],["BD","PD","x..x....x..x...."],["HP","PE","....x.......x..."]],d:"As mãos alternam D E D E na caixa, com acentos em 3+3+2."})}
${box("ana","É como dirigir um carro com câmbio manual conversando: pés na embreagem e no acelerador, mão no volante, outra no câmbio e a cabeça na conversa. Só é possível quando cada parte está automatizada.")}
${box("prof","A metodologia de independência por ostinatos é a base de livros como \"Advanced Techniques for the Modern Drummer\" (Jim Chapin) e \"The Art of Bop Drumming\" (John Riley). Na sua pasta, Garibaldi e Rick Latham trazem o lado funk/linear.")}
${box("res","Ostinato fixo em alguns membros, leitura ou improviso em outro.")}
`,
quiz:[["O que é um ostinato?",["Um padrão repetido fixo","Um prato","Uma virada"],0,"A base da independência avançada."],["Por que é possível tocar 4 membros independentes?",["Por talento apenas","Porque cada parte foi automatizada separadamente","Porque é fácil"],1,"Automatização."],["No ostinato de jazz, o que fica livre?",["Caixa e bumbo","O prato de condução","O pé do chimbal"],0,"Para os comentários."]],
pdf:[["Future Sounds (Garibaldi)",BT+"David Garibald - Future Sounds.pdf"],["Advanced Funk Studies",BT+"Método Bateria 1.pdf"]]},

{t:"Deslocamento e polirritmia", e:"🌀", min:"18 min", sub:"Grooves que \"andam\" pelo compasso",
goal:"deslocar um groove e tocar 3 contra 4 mantendo o pulso.",
body:`
<h2>↔️ Deslocamento</h2>
<p>Pegue uma levada e comece-a <b>uma colcheia depois</b>. As notas são as mesmas, mas caem em outros lugares e o groove ganha um sabor totalmente novo.</p>
${groove({t:"Levada normal",rows:[["HH","MD",H8],["SN","ME",S24],["BD","PD",K13]],bpm:[55,80,110]})}
${groove({t:"A mesma levada, deslocada uma colcheia",rows:[["HH","MD",H8],["SN","ME","......x.......x."],["BD","PD","..x.......x....."]],bpm:[55,80,110],d:"Caixa e bumbo andaram uma colcheia para a frente. Ligue o metrônomo para não perder o tempo 1."})}
<h2>🔺 3 contra 4</h2>
${groove({t:"Acentos de 3 em 3 sobre o pulso",rows:[["SN","MM","XggXggXggXggXggX"],["BD","PD","x...x...x...x..."]],bpm:[50,75,100],d:"As mãos acentuam a cada 3 semicolcheias; o bumbo mantém os 4 tempos. O ouvinte sente dois pulsos ao mesmo tempo."})}
${groove({t:"3 contra 2 entre prato e bumbo",time:"6/8",beats:2,sub:3,bpm:[50,70,95],rows:[["RD","MD","x.x.x."],["BD","PD","x..x.."]],d:"O prato divide o compasso em 3; o bumbo, em 2. É a polirritmia do Nível 5, agora nos membros."})}
${box("aten","Mantenha o pulso real claro (bumbo ou pé do chimbal nos tempos) enquanto faz o efeito. Sem a referência, a banda se perde.")}

{t:"Técnica Moeller, velocidade e pé duplo", e:"⚡", min:"18 min", sub:"Movimento em chicote",
goal:"entender o movimento Moeller e os caminhos para velocidade nos pés.",
body:`
<h2>🪢 Técnica Moeller</h2>
<p>Criada a partir da observação de tocadores de caixa militares por <b>Sanford Moeller</b> (início do século XX) e popularizada por <b>Jim Chapin</b>, ela usa um movimento de <b>chicote</b>: o braço sobe, o pulso vem atrás e a baqueta \"estala\" na pele. Um só movimento produz várias notas (acento + notas fracas) com pouco esforço.</p>
${stB("C5/e3*:D C5/e3:D C5/e3:D C5/e3*:D C5/e3:D C5/e3:D C5/e3*:D C5/e3:D C5/e3:D C5/e3*:D C5/e3:D C5/e3:D",{time:"4/4",bpm:70,t:"Moeller em grupos de 3 (uma mão)",cap:"Acento (chicote para baixo) – tap – up. A mão faz um círculo contínuo. Repita com a esquerda."})}
${stB("C5/s*:D C5/s:D C5/s:D C5/s:D C5/s*:D C5/s:D C5/s:D C5/s:D",{time:"2/4",bpm:70,t:"Moeller em grupos de 4 (uma mão)"})}
<h2>🦶🦶 Velocidade nos pés</h2>
<ul><li><b>Pedal duplo</b>: duas batedeiras no mesmo bumbo, uma para cada pé (veja em Rock pesado).</li><li><b>Heel-toe</b> (calcanhar-ponta): um pé toca duas notas, uma com o calcanhar descendo e outra com a ponta.</li><li><b>Slide</b>: o pé desliza no pedal produzindo duas notas.</li></ul>
${groove({t:"Duplos no bumbo com um pé",rows:[["HH","MD",H8],["SN","ME",S24],["BD","PD","xx......xx......"]],bpm:[50,75,105],d:"Dois bumbos rápidos (heel-toe ou slide) no tempo 1 e no tempo 3."})}
${box("aten","Velocidade vem de relaxamento, não de força. Se a canela ou o antebraço doem, pare, diminua o andamento e reveja a técnica.")}
${box("res","Moeller = chicote: um movimento, várias notas. Pés: pedal duplo, heel-toe, slide. Relaxamento antes de velocidade.")}
`,
quiz:[["Quem popularizou a técnica Moeller?",["Jim Chapin","Ted Reed","Luiz Gonzaga"],0,"A partir dos estudos de Sanford Moeller."],["O que é heel-toe?",["Duas notas com um pé: calcanhar e ponta","Um tipo de prato","Uma baqueta"],0,"Técnica de pé."],["De onde vem a velocidade?",["Da força","Do relaxamento e da técnica","Do volume"],1,"Tensão trava o movimento."]],
pdf:[["Paradiddle Power",BT+"(drums)paradiddle power-ron spagnardi-1.pdf"],["Franco Rossi · Metodo per Batteria",BT+"Franco Rossi - Metodo per Batteria.pdf"]]},

{t:"Solo de bateria com musicalidade", e:"🎤", min:"14 min", sub:"Contar uma história com ritmo",
goal:"construir um solo com começo, meio e fim.",
body:`
<p>Um bom solo de bateria não é uma sequência de viradas rápidas: é uma <b>história</b>. As mesmas ferramentas do improviso melódico (Nível 4) valem aqui.</p>
<ul><li><b>Motivo</b>: comece com uma ideia rítmica simples e reconhecível.</li><li><b>Desenvolvimento</b>: repita e varie (outros tambores, outras dinâmicas, deslocamento).</li><li><b>Espaço</b>: pausas dão peso às notas.</li><li><b>Dinâmica</b>: comece suave, construa até o clímax.</li><li><b>Forma</b>: muitos solos seguem a forma da música; outros usam um ostinato de pés por baixo.</li></ul>
${groove({t:"Um motivo simples...",rows:[["SN","MM","R.L.R..........."],["BD","PD","......x........."],["HP","PE","....x.......x..."]],bpm:[60,85,110],d:"Três notas na caixa e um bumbo. O resto é espaço."})}
${groove({t:"...e o mesmo motivo desenvolvido nos tambores",bars:2,rows:[["SN","MM","R.L.R..........................."],["T1","MM","........R.L.R..................."],["FT","MM","................R.L.R...R.L.R..."],["BD","PD","......x.......x.......x.......x."],["HP","PE","....x.......x.......x.......x..."]],bpm:[60,85,110],d:"Mesma ideia, passando por outros tambores e se repetindo no fim: o ouvinte reconhece e acompanha."})}
${box("dica","Cante o solo antes de tocar. Se você consegue cantar (\"tum ka tá, tum ka tá...\"), ele tem sentido rítmico.")}
${box("res","Solo = história: motivo, desenvolvimento, espaço, dinâmica e forma. Cante antes de tocar.")}
`,
quiz:[["O que torna um solo de bateria musical?",["Velocidade máxima o tempo todo","Motivo, desenvolvimento, espaço e dinâmica","Tocar todas as peças ao mesmo tempo"],1,"Como qualquer improviso."],["Por que cantar o solo antes?",["Para aquecer a voz","Para garantir que ele tem sentido rítmico","Não tem motivo"],1,"Se canta, tem frase."],["Qual método da pasta traz modelos de solos?",["Wilcoxon (150 Rudimental Solos)","Syncopation","Real Book"],0,"Solos rudimentais com forma."]],
pdf:[["Wilcoxon · 150 Rudimental Solos",BT+"The All American Drummer 150 Rudimental Solos.pdf"]]}

{t:"Afinação da bateria", e:"🔧", min:"16 min", sub:"Peles, tensão em estrela e intervalos",
goal:"afinar caixa, tons e bumbo de forma equilibrada.",
body:`
${ill("estrela","A ordem de aperto em estrela, num tambor de 8 tarraxas: sempre a tarraxa do lado oposto")}
<h2>🔧 Passo a passo (cada tambor)</h2>
<ol>
<li>Solte todas as tarraxas. Coloque a pele centralizada.</li>
<li>Aperte cada tarraxa com os dedos até encostar.</li>
<li>Com a chave, dê a mesma quantidade de volta (por exemplo, meia volta) em cada tarraxa, seguindo a ordem em <b>estrela</b>, nunca em círculo.</li>
<li>Repita até chegar perto do som desejado.</li>
<li>Bata de leve a 2-3 cm de cada tarraxa: o som deve ser <b>igual</b> em todos os pontos. Ajuste a que estiver diferente.</li>
<li>Faça o mesmo na pele de resposta.</li>
</ol>
${box("ana","Afinar em estrela é como apertar os parafusos da roda de um carro: se você apertar um lado todo primeiro, a roda fica torta. Alternando lados opostos, a pressão fica igual.")}
<h2>🎚️ Relação entre as peles</h2>
<ul><li>Resposta <b>igual</b> à de ataque: sustentação longa e nota clara.</li><li>Resposta <b>mais aguda</b>: o som \"cai\" de afinação (efeito bonito nos tons).</li><li>Resposta <b>mais grave</b>: som mais curto.</li></ul>
<p>Muitos bateristas afinam os tons em <b>intervalos</b> (terças ou quartas entre tom 1, tom 2 e surdo) para que as viradas soem musicais.</p>
${stB("E5/q:Tom_1 D5/q:Tom_2 A4/q:Surdo r/q",{bpm:70,cap:"Tom 1, tom 2 e surdo: do agudo ao grave, como uma pequena melodia"})}
<h2>🥁 Caixa e bumbo</h2>
<ul><li><b>Caixa</b>: a pele de resposta (fininha) costuma ficar mais esticada que a de ataque, para a esteira responder bem. Ajuste a esteira até soar clara, sem \"chiar\" demais.</li><li><b>Bumbo</b>: peles mais frouxas e um abafador (almofada ou cobertor encostado na pele) dão o som curto e \"seco\" do pop e do rock.</li></ul>
${box("prof","A \"Bíblia para afinar Bateria\" (Scott Johnson, tradução na pasta de estudos) detalha cada tambor, tipos de pele e soluções para ressonâncias indesejadas.")}
${box("res","Tensão em estrela, mesma volta em cada tarraxa, conferir o som perto de cada uma. Tons em intervalos musicais.")}
`,
quiz:[["Em que ordem apertar as tarraxas?",["Em círculo","Em estrela (cruzada)","Uma só"],1,"Pressão distribuída."],["Como conferir se a pele está equilibrada?",["Batendo no centro com força","Batendo de leve perto de cada tarraxa e comparando","Olhando a pele"],1,"O som deve ser igual."],["A pele de resposta da caixa costuma ficar...",["mais esticada que a de ataque","frouxa","sem esteira"],0,"Para a esteira responder."]],
pdf:[["Bíblia para afinar Bateria (Scott Johnson)",BT+"Bíblia para afinar Bateria.pdf"]]},

{t:"Bateria eletrônica no computador (REAPER)", e:"💻", min:"22 min", sub:"Cabo por cabo, passo a passo",
goal:"ligar a bateria eletrônica no computador, gravar em MIDI no REAPER e usar sons de bateria virtual.",
body:`
<p>Uma bateria eletrônica pode mandar para o computador <b>dados MIDI</b> (qual peça foi tocada e com que força) e/ou <b>áudio</b> (o som pronto do módulo). Com MIDI, você grava e depois troca o som por qualquer bateria virtual.</p>
<h2>🔌 1. A ligação física</h2>
${tbl(["Opção","Cabo","De onde → para onde"],[
["<b>USB (mais comum)</b>","cabo USB (do tipo que o módulo tem: USB-B \"de impressora\", micro-USB ou USB-C)","porta USB do <b>módulo</b> → porta USB do <b>computador</b>"],
["<b>MIDI 5 pinos</b> (módulos antigos)","interface USB-MIDI (cabo com dois conectores redondos de 5 pinos e um USB)","saída <b>MIDI OUT</b> do módulo → conector <b>IN</b> da interface; USB da interface → computador"],
["<b>Áudio</b>","cabo P10 (6,35 mm) ou P2 (3,5 mm) estéreo","saída <b>OUTPUT</b> (ou PHONES) do módulo → entrada da <b>interface de áudio</b> (ou entrada de linha do PC)"]])}
${box("aten","Ligue o módulo <b>antes</b> de abrir o REAPER, senão o programa pode não enxergar o dispositivo MIDI. Muitos módulos (Roland, Alesis, Yamaha) funcionam por USB sem instalar nada; alguns pedem um driver do site do fabricante: confira o manual do seu modelo.")}
<h2>⚙️ 2. Configurar o REAPER</h2>
<ol>
<li><b>Áudio</b>: menu <i>Options → Preferences → Audio → Device</i>. Em \"Audio system\", escolha <b>ASIO</b>. Use o driver ASIO da sua interface de áudio; se não tiver interface, instale o gratuito <b>ASIO4ALL</b>. Coloque o tamanho do bloco (buffer) em <b>128</b> ou <b>256</b> samples. Buffer menor = menos atraso, mas mais carga no computador.</li>
<li><b>MIDI</b>: <i>Options → Preferences → Audio → MIDI Inputs</i> (em versões novas, \"MIDI Devices\"). O nome do seu módulo aparece na lista. Clique com o botão direito nele e marque <b>Enable input</b>.</li>
<li><b>Nova faixa</b>: aperte <b>Ctrl+T</b>.</li>
<li>Na faixa, clique no <b>botão vermelho</b> (armar gravação). Clique na área de entrada e escolha: <i>Input: MIDI → [nome do seu módulo] → All channels</i>.</li>
<li>Ative o <b>monitoramento</b> (o ícone de alto-falante ao lado do botão vermelho) para ouvir o que toca.</li>
<li>Clique em <b>FX</b> na faixa e adicione um <b>instrumento de bateria virtual</b> (VSTi). Opções gratuitas conhecidas: <b>MT-PowerDrumKit</b> e <b>Steven Slate Drums Free</b>. Também dá para usar o <b>ReaSamplOmatic5000</b>, que já vem no REAPER, com amostras suas.</li>
<li>Toque: você deve ouvir a bateria virtual. Para gravar: <b>Ctrl+R</b>; para parar, <b>barra de espaço</b>.</li>
</ol>
<h2>🗺️ 3. O mapa de notas (General MIDI)</h2>
${tbl(["Peça","Nota MIDI (padrão GM)"],[["Bumbo","36"],["Caixa","38"],["Aro (cross-stick)","37"],["Chimbal fechado","42"],["Chimbal com o pé","44"],["Chimbal aberto","46"],["Tom 1 (agudo)","48 (ou 50)"],["Tom 2","45 (ou 47)"],["Surdo","43 (ou 41)"],["Prato de ataque","49"],["Prato de condução","51"]])}
<p>Se uma peça tocar o som errado na bateria virtual, o mapa do seu módulo é diferente. Ajuste as notas no próprio módulo ou no mapa do plugin (os dois costumam permitir).</p>
<h2>🩺 Se não funcionar</h2>
${tbl(["Problema","O que conferir"],[["O REAPER não mostra o módulo","módulo ligado antes de abrir o programa; cabo USB de dados (não só de carga); driver do fabricante"],["Toca mas não sai som","monitoramento ligado; faixa armada; instrumento virtual carregado no FX; saída de áudio correta em Device"],["Som atrasado (latência)","usar ASIO; diminuir o buffer para 128 ou 256"],["Peças com som trocado","ajustar o mapa de notas"]])}
${box("dica","Com a gravação em MIDI, você pode corrigir notas, trocar o som depois e aprender com a tela: o editor MIDI (duplo clique no item gravado) mostra onde cada batida caiu em relação ao tempo. É um ótimo espelho para o seu tempo.")}
${box("res","USB (ou MIDI OUT + interface) → REAPER com ASIO e buffer 128/256 → Enable input do módulo → faixa com Input MIDI + monitoramento → bateria virtual no FX → Ctrl+R. Mapa GM: bumbo 36, caixa 38, chimbal 42.")}
`,
quiz:[["Qual ligação envia dados MIDI pelo cabo mais comum hoje?",["P10 de áudio","USB do módulo ao computador","HDMI"],1,"USB-MIDI."],["Onde habilitar o módulo como entrada MIDI no REAPER?",["Options → Preferences → Audio → MIDI Inputs (Enable input)","Menu File","Não precisa"],0,"Botão direito → Enable input."],["Qual nota MIDI é o bumbo no padrão General MIDI?",["36","60","49"],0,"36 = bumbo; 38 = caixa."]],
pdf:[]},

{t:"Tocando na igreja", e:"⛪", min:"16 min", sub:"Servir a música",
goal:"tocar no louvor com volume, dinâmica e atenção adequados.",
body:`
<h2>🎯 O papel da bateria no louvor</h2>
<ul><li><b>Servir</b> a música e a congregação: a bateria sustenta o canto, não compete com ele.</li><li><b>Volume</b> adequado ao ambiente. Em igrejas pequenas, a bateria acústica fica alta com facilidade: use baquetas mais leves (hot rods, 7A), aro, vassourinhas, e controle nos pratos. A bateria eletrônica ajuda muito, com o volume controlado pela mesa de som.</li><li><b>Dinâmica</b> que acompanha o momento: oração pede quase silêncio; celebração pede energia.</li><li><b>Tempo firme</b>: a congregação canta junto. Use clique se a equipe usar.</li></ul>
<h2>🎚️ A mesma música em três intensidades</h2>
${groove({t:"1 · Verso (suave)",rows:[["HH","MD",H8],["XS","ME",S24],["BD","PD","x.......x......."]],bpm:[60,72,90],d:"Aro, chimbal fechado e leve, pouco bumbo."})}
${groove({t:"2 · Pré-refrão (crescendo)",rows:[["FT","MD",H8],["SN","ME",S24],["BD","PD","x...x...x...x..."]],bpm:[60,72,90],d:"A mão direita vai para o surdo; o bumbo marca todos os tempos."})}
${groove({t:"3 · Refrão (aberto)",rows:[["CR","MD","x..............."],["RD","MD","..x.x.x.x.x.x.x."],["SN","ME","....X.......X..."],["BD","PD","x.....x.x.x....."]],bpm:[60,72,90],d:"Ataque no 1, condução no prato, caixa cheia."})}
<h2>👀 Comunicação</h2>
<ul><li>Fique atento ao <b>ministro</b>: sinais de repetir, terminar, ir para a ponte, baixar.</li><li>Combine com o baixista: bumbo e baixo formam uma dupla.</li><li>Em finais, observe o sinal para o <b>corte</b> junto com a banda.</li></ul>
${box("ana","Numa igreja, a bateria é como o chão de uma casa: ninguém fica olhando para o chão, mas se ele tremer, todo mundo percebe.")}
${box("prof","O \"Método de Estudo para Bateria\" da Igreja Cristã Maranata, na pasta de estudos, é um material pensado justamente para bateristas de igreja.")}
${box("res","Servir a música, volume e dinâmica adequados ao ambiente e ao momento, tempo firme, atenção ao ministro e ao baixista.")}
`,
quiz:[["Qual a principal função da bateria no louvor?",["Aparecer mais que todos","Sustentar e servir a música e o canto","Tocar sempre forte"],1,"Servir."],["Em uma igreja pequena, como controlar o volume da bateria acústica?",["Baquetas mais leves, aro, vassourinhas, controle nos pratos","Tocar mais forte","Tirar a caixa"],0,"Ferramentas de volume."],["Com quem o baterista deve estar em sintonia constante?",["Ministro e baixista","Só com o técnico de som","Ninguém"],0,"Comunicação é essencial."]],
pdf:[["Método de Estudo para Bateria (ICM)",BT+"Método de Estudo para Bateria.pdf"]]},

{t:"Caixa clara (percussão sinfônica e rudimental)", e:"🎖️", min:"20 min", sub:"Rulos, dinâmica e repertório",
goal:"conhecer a técnica de caixa clara e como preparar uma peça de repertório.",
body:`
<p>A <b>caixa clara</b> sozinha tem um repertório próprio, com duas tradições: a <b>rudimental</b> (bandas militares e marciais, solos como os de Wilcoxon) e a <b>sinfônica/orquestral</b> (orquestras, com sons mais delicados e rulos fechados).</p>
<h2>🌀 Os rulos</h2>

<script>

/* ================= RITMOS DE BATERIA (grade + loop) ================= */
const INST={BD:["Bumbo","F4"],SN:["Caixa","C5"],XS:["Aro","xC5"],HH:["Chimbal","xG5"],HP:["Chimbal (pé)","xD4"],RD:["Condução","xF5"],CR:["Ataque","xA5"],T1:["Tom 1","E5"],T2:["Tom 2","D5"],FT:["Surdo","A4"],CB:["Cowbell","xE5"],CS:["Casco do surdo","xA4"]};

const partPitch=s=>{ let head=null; if(s.length>2 && /^[xogfz]/.test(s)){ head=s[0]; s=s.slice(1); } const p=parsePitch(s); p.head=head; return p; };

  const DUR={1:{1:"q"},2:{1:"e",2:"q"},3:{1:"e3",2:"q3",3:"q"},4:{1:"s",2:"e",3:"e.",4:"q"},6:{1:"s3",2:"e3",3:"e3.",6:"q"}}[sub];

function wrapStaff(o,maxW){
  const wOf = oo => +staffSVG(oo).match(/width="(\d+)"/)[1];
  if(!(wOf(o) > maxW && / \| /.test(o.notes))) return staffSVG(o);
  const ms = o.notes.trim().split(/\s+\|\s+/); const lines=[]; let cur=[];
  ms.forEach(m=>{ const test=cur.concat([m]); const oo=Object.assign({},o,{notes:test.join(" | ")+" |",time:lines.length?null:o.time,minw:0});
    if(cur.length && wOf(oo)>maxW){ lines.push(cur); cur=[m]; } else cur=test; });
  if(cur.length) lines.push(cur);
  return lines.map((ln,i)=>{ const last=i===lines.length-1; return `<div style="margin:4px 0">${staffSVG(Object.assign({},o,{notes:ln.join(" | ")+(last?"":" |"),time:i?null:o.time,h:o.h||150}))}</div>`; }).join("");

  toks.forEach(n=>{
    if(n.bar){ out.push({bar:n.bar,x}); x+= n.bar==="|"?20:24; return; }
    const w = o.spacing || ({w:50,h:44,q:38,e:32,s:28}[n.dur]||38) + (n.label?8:0) + (n.dot?6:0) + ((n.pitches||[]).some(p=>p.accSym)?12:0);
    const nx = x + ((n.pitches||[]).some(p=>p.accSym)?12:0);
    out.push(Object.assign({x:nx},n)); x+=w;
  });
  const W = Math.max(x+16, o.minw||0), H = o.h || 170;
  const Z=o.zoom||1.35; let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${Math.round(W*Z)}" height="${Math.round(H*Z)}" viewBox="0 0 ${W} ${H}" font-family="Montserrat,Segoe UI,sans-serif">`;
  if(o.clef!=="none"||!o.noStaff) for(let i=0;i<5;i++){ const y=TOP+i*SP; s+=`<line x1="4" x2="${W-6}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="1.2" opacity=".85"/>`; }
  if(o.lineNums){ for(let i=0;i<5;i++){ s+=`<text x="${W-2}" y="${BOT-i*SP+4}" font-size="9" fill="#fca5a5" text-anchor="end" font-weight="800">${i+1}ª</text>`; } }
  if(o.clef==="P"){ s+=`<rect x="16" y="${TOP+10}" width="4" height="20" fill="${col}"/><rect x="25" y="${TOP+10}" width="4" height="20" fill="${col}"/>`; }
  else if(o.clef && o.clef!=="none"){
    const cy = o.clef==="G" ? BOT+C.dy : o.clef==="F" ? TOP+SP+C.dy+ (SP*1.6) : TOP+20+C.dy+12;
    s+=`<text x="${C.x}" y="${cy}" font-size="${C.size}" fill="${col}" font-family="${getComputedStyle(document.documentElement).getPropertyValue('--music')}">${C.glyph}</text>`;
  }
  if(o.key){ // armadura: lista tipo "F#4 C#5" já na posição
    let kx = 50; o.key.forEach(k=>{ const p=parsePitch(k); if(!p) return; const y=yOf(p.dia); s+=`<text x="${kx}" y="${y+ (p.acc<0?4:6)}" font-size="${p.acc<0?22:20}" fill="${col}">${p.acc<0?"♭":"♯"}</text>`; kx+=11; });
  }
  if(o.time){ const [a,b]=o.time.split("/"); s+=`<text x="${tsX+12}" y="${TOP+18}" font-size="22" font-weight="900" fill="${col}" text-anchor="middle">${a}</text><text x="${tsX+12}" y="${TOP+38}" font-size="22" font-weight="900" fill="${col}" text-anchor="middle">${b}</text>`; }
  out.forEach(n=>{
    if(n.bar){
      if(n.bar==="|") s+=`<line x1="${n.x}" x2="${n.x}" y1="${TOP}" y2="${BOT}" stroke="${col}" stroke-width="1.4"/>`;
      else if(n.bar==="||") s+=`<line x1="${n.x}" x2="${n.x}" y1="${TOP}" y2="${BOT}" stroke="${col}" stroke-width="1.3"/><line x1="${n.x+5}" x2="${n.x+5}" y1="${TOP}" y2="${BOT}" stroke="${col}" stroke-width="4"/>`;
      else if(n.bar===":|") s+=`<circle cx="${n.x-6}" cy="${TOP+15}" r="2.4" fill="${col}"/><circle cx="${n.x-6}" cy="${TOP+25}" r="2.4" fill="${col}"/><line x1="${n.x}" x2="${n.x}" y1="${TOP}" y2="${BOT}" stroke="${col}" stroke-width="1.3"/><line x1="${n.x+5}" x2="${n.x+5}" y1="${TOP}" y2="${BOT}" stroke="${col}" stroke-width="4"/>`;
      else if(n.bar==="|:") s+=`<line x1="${n.x}" x2="${n.x}" y1="${TOP}" y2="${BOT}" stroke="${col}" stroke-width="4"/><line x1="${n.x+5}" x2="${n.x+5}" y1="${TOP}" y2="${BOT}" stroke="${col}" stroke-width="1.3"/><circle cx="${n.x+11}" cy="${TOP+15}" r="2.4" fill="${col}"/><circle cx="${n.x+11}" cy="${TOP+25}" r="2.4" fill="${col}"/>`;
      return;
    }
    const c = n.hl?hl:col;
    if(n.rest){
      const x=n.x;
      if(n.dur==="w") s+=`<rect x="${x-7}" y="${TOP+SP}" width="14" height="5" fill="${c}"/>`;
      else if(n.dur==="h") s+=`<rect x="${x-7}" y="${TOP+2*SP-5}" width="14" height="5" fill="${c}"/>`;
      else if(n.dur==="q") s+=`<path d="M${x-3} ${TOP+8} l7 9 l-6 7 l6 8 c-6 -3 -10 1 -5 7 c-9 -4 -7 -12 1 -9 l-6 -8 l6 -6 z" fill="${c}"/>`;
      else { const fl = n.dur==="e"?1:2; s+=`<line x1="${x+4}" y1="${TOP+14}" x2="${x-1}" y2="${TOP+34+(fl-1)*6}" stroke="${c}" stroke-width="1.6"/>`;
        for(let k=0;k<fl;k++){ const yy=TOP+14+k*8; s+=`<circle cx="${x-3}" cy="${yy+1}" r="3" fill="${c}"/><path d="M${x-3} ${yy+3} q4 1 7 -3" stroke="${c}" stroke-width="1.6" fill="none"/>`; } }
      if(n.dot) s+=`<circle cx="${n.x+11}" cy="${TOP+15}" r="2.2" fill="${c}"/>`;
      if(n.label) s+=`<text x="${n.x}" y="${H-12}" font-size="12" font-weight="700" fill="${n.hl?hl:'#a1a1aa'}" text-anchor="middle">${n.label}</text>`;
      return;
    }
    if(n.perc){ const y=TOP+2*SP; s+=`<path d="M${n.x-5} ${y-5} l10 10 M${n.x+5} ${y-5} l-10 10" stroke="${c}" stroke-width="2"/>`;
      if(n.dur!=="w") s+=`<line x1="${n.x+5}" y1="${y}" x2="${n.x+5}" y2="${y-34}" stroke="${c}" stroke-width="1.4"/>`;
      if(n.label) s+=`<text x="${n.x}" y="${H-12}" font-size="12" font-weight="700" fill="${n.hl?hl:'#a1a1aa'}" text-anchor="middle">${n.label}</text>`; return; }
    const ds = n.pitches.map(p=>p.dia), lo=Math.min(...ds), hi=Math.max(...ds);
    // linhas suplementares
    for(let d=bottomD-2; d>=lo; d-=2) s+=`<line x1="${n.x-11}" x2="${n.x+11}" y1="${yOf(d)}" y2="${yOf(d)}" stroke="${col}" stroke-width="1.2"/>`;
    for(let d=topD+2; d<=hi; d+=2) s+=`<line x1="${n.x-11}" x2="${n.x+11}" y1="${yOf(d)}" y2="${yOf(d)}" stroke="${col}" stroke-width="1.2"/>`;
    const open = n.dur==="w"||n.dur==="h";
    const up = o.clef==="P" ? true : ((lo+hi)/2) < bottomD+4;
    if(o.clef==="P" && n.hl) s+=`<text x="${n.x}" y="${TOP-22}" font-size="16" font-weight="900" fill="${hl}" text-anchor="middle">&gt;</text>`;
    if(n.pitches.some(p=>p.head==="z")) s+=`<text x="${n.x+6}" y="${yOf(hi)-20}" font-size="12" font-weight="900" fill="${c}" text-anchor="middle">z</text>`;
    n.pitches.forEach(p=>{
      const y=yOf(p.dia);
      // segundas no acorde: desloca
      const shift = n.pitches.some(q=>q!==p && q.dia===p.dia-1 && ((p.dia-lo)%2===1)) ? 13 : 0;
      const hx = n.x+shift;
      if(p.accSym) s+=`<text x="${n.x-13}" y="${y+(p.acc<0?4:6)}" font-size="${p.acc<0?22:20}" fill="${c}" text-anchor="middle">${{"#":"♯","b":"♭","n":"♮","##":"𝄪","bb":"♭♭"}[p.accSym]}</text>`;
      if(p.head==="x"||p.head==="o"){ s+=`<path d="M${hx-5} ${y-5} l10 10 M${hx+5} ${y-5} l-10 10" stroke="${c}" stroke-width="2.2"/>`; if(p.head==="o") s+=`<circle cx="${hx}" cy="${TOP-14}" r="4" fill="none" stroke="${c}" stroke-width="1.6"/>`; }
      else { s+=`<ellipse cx="${hx}" cy="${y}" rx="${n.dur==="w"?7.5:6.4}" ry="${n.dur==="w"?5:4.6}" transform="rotate(${n.dur==="w"?-10:-22} ${hx} ${y})" fill="${open?'#111114':c}" stroke="${c}" stroke-width="${open?2.1:1}"/>`;
        if(p.head==="g") s+=`<text x="${hx-11}" y="${y+5}" font-size="14" fill="${c}">(</text><text x="${hx+7}" y="${y+5}" font-size="14" fill="${c}">)</text>`;
        if(p.head==="f") s+=`<ellipse cx="${hx-13}" cy="${y}" rx="3.6" ry="2.6" transform="rotate(-22 ${hx-13} ${y})" fill="${c}"/><line x1="${hx-10}" y1="${y}" x2="${hx-10}" y2="${y-18}" stroke="${c}" stroke-width="1"/><line x1="${hx-15}" y1="${y-6}" x2="${hx-6}" y2="${y-14}" stroke="${c}" stroke-width="1"/>`; }
      if(n.dot){ const dy = ((p.dia-bottomD)%2===0)?-5:0; s+=`<circle cx="${n.x+13}" cy="${y+dy}" r="2.2" fill="${c}"/>`; }
    });
    if(n.dur!=="w"){
      const sx = up? n.x+6 : n.x-6, y1 = up? yOf(lo) : yOf(hi), y2 = up? yOf(hi)-34 : yOf(lo)+34;
      s+=`<line x1="${sx}" y1="${y1}" x2="${sx}" y2="${y2}" stroke="${c}" stroke-width="1.5"/>`;
      const fl = n.dur==="e"?1:n.dur==="s"?2:0;
      for(let k=0;k<fl;k++){ const fy = up? y2+k*8 : y2-k*8;
        s+= up? `<path d="M${sx} ${fy} c1 7 11 9 9 21" stroke="${c}" stroke-width="2" fill="none"/>` : `<path d="M${sx} ${fy} c1 -7 11 -9 9 -21" stroke="${c}" stroke-width="2" fill="none"/>`; }
    }
    if(n.label) s+=`<text x="${n.x}" y="${H-12}" font-size="12" font-weight="700" fill="${n.hl?hl:'#a1a1aa'}" text-anchor="middle">${n.label}</text>`;
  });
  return s+`</svg>`;
}

/* ================= TECLADO (SVG) ================= */
function kbdSVG(o){
  const a=parsePitch(o.from).midi, b=parsePitch(o.to).midi;
  const marks = {}; (o.mark||"").trim().split(/\s+/).filter(Boolean).forEach((t,i)=>{ const [p,lab]=t.split(":"); const pp=parsePitch(p); if(pp) marks[pp.midi]=lab!==undefined?lab.replace(/_/g," "):(i+1); });
  const isBlack = m => [1,3,6,8,10].includes(((m%12)+12)%12);
  const names = ["Dó","Dó♯","Ré","Ré♯","Mi","Fá","Fá♯","Sol","Sol♯","Lá","Lá♯","Si"], lets=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
  const WW=o.ww||34, WH=130, BW=WW*.62, BH=82;
  const whites=[]; for(let m=a;m<=b;m++) if(!isBlack(m)) whites.push(m);
  const W=whites.length*WW+2; let s=`<svg class="kbd" xmlns="http://www.w3.org/2000/svg" width="${W}" height="${WH+4}" viewBox="0 0 ${W} ${WH+4}" font-family="Montserrat,Segoe UI,sans-serif">`;
  const lab = m => { const i=((m%12)+12)%12; const oc=Math.floor(m/12)-1; if(o.labels==="none") return ""; if(o.labels==="en") return lets[i]+(o.oct?oc:""); if(o.labels==="both") return names[i]; return names[i]; };
  const has = m => Object.prototype.hasOwnProperty.call(marks,m);
  whites.forEach((m,i)=>{ const x=1+i*WW, on=has(m);
    s+=`<rect class="k" data-m="${m}" x="${x}" y="1" width="${WW-1}" height="${WH}" rx="3" fill="${on?'#ff4d4d':'#f4f4f5'}" stroke="#111"/>`;
    if(on && marks[m]!=="") s+=`<text x="${x+WW/2}" y="${WH-30}" text-anchor="middle" font-size="12" font-weight="900" fill="#fff" pointer-events="none">${marks[m]}</text>`;
    if(o.labels!=="none"){ s+=`<text x="${x+WW/2}" y="${WH-10}" text-anchor="middle" font-size="${WW<30?9:11}" font-weight="800" fill="${on?'#fff':'#333'}" pointer-events="none">${lab(m)}${o.labels==="both"?"":""}</text>`;
      if(o.labels==="both") s+=`<text x="${x+WW/2}" y="${WH+2}" text-anchor="middle" font-size="9" fill="#999" pointer-events="none"></text>`; }
  });
  whites.forEach((m,i)=>{ const bm=m+1; if(bm<=b && isBlack(bm)){ const x=1+(i+1)*WW-BW/2, on=has(bm);
    s+=`<rect class="k" data-m="${bm}" x="${x}" y="1" width="${BW}" height="${BH}" rx="2" fill="${on?'#ff4d4d':'#18181b'}" stroke="#000"/>`;
    if(on && marks[bm]!=="") s+=`<text x="${x+BW/2}" y="${BH-10}" text-anchor="middle" font-size="10" font-weight="900" fill="#fff" pointer-events="none">${marks[bm]}</text>`; } });
  return s+`</svg>`;
}

/* ================= METRÔNOMO ================= */
let metroTimer=null;
function mountMetro(el,o){
  el.innerHTML = `<div class="metro"><button class="play">▶ Ligar metrônomo</button><b>${o.bpm} bpm</b><input type="range" min="40" max="220" value="${o.bpm}">${Array.from({length:o.beats},(_,i)=>`<span class="dot${i===0?' first':''}"></span>`).join("")}</div><div class="pctl"><span class="chip" data-b="50">🐢 Muito lento 50</span><span class="chip" data-b="70">Lento 70</span><span class="chip" data-b="100">Médio 100</span><span class="chip" data-b="140">Rápido 140</span><span class="chip" data-b="180">🐇 Muito rápido 180</span></div><div class="cap">Bolinha amarela = tempo 1 (o mais forte). Clique nas velocidades para comparar o lento com o rápido.</div>`;
  const btn=el.querySelector("button"), lab=el.querySelector("b"), rng=el.querySelector("input"), dots=[...el.querySelectorAll(".dot")], chips=[...el.querySelectorAll(".chip")];
  let bpm=o.bpm, i=0, on=false;
  const tick=()=>{ const t=ac().currentTime+.01; click(t,i===0); dots.forEach((d,k)=>d.classList.toggle("on",k===i)); i=(i+1)%o.beats; metroTimer=setTimeout(tick,60000/bpm); };
  const setB=v=>{ bpm=v; rng.value=v; lab.textContent=bpm+" bpm"; chips.forEach(c=>c.classList.toggle("on",+c.dataset.b===v)); };
  rng.oninput=()=>setB(+rng.value); chips.forEach(c=>c.onclick=()=>setB(+c.dataset.b));
  btn.onclick=()=>{ on=!on; clearTimeout(metroTimer); if(on){ stopAll(); stopGroove(); i=0; tick(); btn.textContent="■ Parar"; btn.classList.add("on"); } else { btn.textContent="▶ Ligar metrônomo"; btn.classList.remove("on"); dots.forEach(d=>d.classList.remove("on")); } };
}

function hydrate(root){
  root.querySelectorAll("[data-staff]").forEach(el=>{
    const o=JSON.parse(decodeURIComponent(el.dataset.staff));
    const maxW = Math.max(260,(el.clientWidth||800)-36);
    const svgs = wrapStaff(o,maxW);
    const b0=o.bpm||90, slow=Math.max(40,Math.round(b0*.6/2)*2), fast=Math.round(b0*1.4/2)*2;
    const ctl = o.play===false ? "" : `<div class="pctl" data-ctl="${enc({notes:o.playNotes||o.notes,bpm:b0,drum:o.clef==="P",time:o.time||"4/4"})}"><button class="play">▶ ${o.playLabel||"Ouvir"}</button><span class="chip" data-b="${slow}">🐢 Lento ${slow}</span><span class="chip on" data-b="${b0}">Normal ${b0}</span><span class="chip" data-b="${fast}">🐇 Rápido ${fast}</span><span class="chip cclk">🔔 Metrônomo</span></div>`;
    el.innerHTML = (o.t?`<div class="gtitle">${o.t}</div>`:"")+(o.d?`<div class="gsub">${o.d}</div>`:"")+svgs +(o.cap?`<div class="cap">${o.cap}</div>`:"") + ctl + (o.how?`<div class="how">${o.how}</div>`:"");
  });
  root.querySelectorAll("[data-ctl]").forEach(bar=>{
    const o=JSON.parse(decodeURIComponent(bar.dataset.ctl)); let bpm=o.bpm, clk=false;
    const btn=bar.querySelector(".play"), chips=[...bar.querySelectorAll(".chip[data-b]")], ck=bar.querySelector(".cclk");
    chips.forEach(c=>c.onclick=()=>{ bpm=+c.dataset.b; chips.forEach(x=>x.classList.toggle("on",x===c)); if(playing&&playing.btn===btn) go(); });
    ck.onclick=()=>{ clk=!clk; ck.classList.toggle("on",clk); };
    const go=()=>playSeq(o.notes,bpm,btn,o.drum,{click:clk,time:o.time});
    btn.onclick=()=>{ if(playing&&playing.btn===btn){ stopAll(); return; } go(); };
  });
  root.querySelectorAll("[data-groove]").forEach(el=>mountGroove(el,JSON.parse(decodeURIComponent(el.dataset.groove))));
  root.querySelectorAll("[data-kbd]").forEach(el=>{
    const o=JSON.parse(decodeURIComponent(el.dataset.kbd));
    el.innerHTML = kbdSVG(o) + `<div class="cap">${o.cap||"Clique nas teclas para ouvir."}</div>` + (o.seq?`<div>${ouvir(o.seq,o.playLabel||"Ouvir",o.bpm)}</div>`:"");
    el.querySelectorAll("rect.k").forEach(r=>r.addEventListener("click",()=>{ const a=ac(); tone(freq(+r.dataset.m),a.currentTime+.02,.7,.25); }));
  });
  root.querySelectorAll("[data-metro]").forEach(el=>mountMetro(el,JSON.parse(decodeURIComponent(el.dataset.metro))));
  root.querySelectorAll("[data-seq]").forEach(b=>b.onclick=()=>{ if(playing&&playing.btn===b){ stopAll(); return; } const o=JSON.parse(decodeURIComponent(b.dataset.seq)); playSeq(o.notes,o.bpm,b,o.drum); });
}
