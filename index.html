{t:"Os graus da escala e seus nomes", e:"🔢", min:"10 min", sub:"Tônica, dominante, sensível...",
goal:"saber o número e o nome de cada nota da escala e por que alguns graus são mais importantes.",
body:`
<p>Cada nota da escala recebe um <b>número</b>, chamado <b>grau</b> (normalmente em algarismos romanos), e um <b>nome</b> que conta qual é o papel dela.</p>
${tbl(["Grau","Nome","Em Dó maior","O que ela faz"],[["I","<b>Tônica</b>","Dó","A \"casa\". A nota de repouso, onde a música termina."],["II","Supertônica","Ré","Está logo acima da tônica."],["III","Mediante","Mi","Fica no meio do caminho entre a tônica e a dominante."],["IV","<b>Subdominante</b>","Fá","Fica um grau abaixo da dominante."],["V","<b>Dominante</b>","Sol","A segunda nota mais importante: cria vontade de voltar para a tônica."],["VI","Superdominante (ou submediante)","Lá","Fica acima da dominante."],["VII","<b>Sensível</b>","Si","Fica a um semitom da tônica e \"puxa\" para ela."]])}
${box("ana","Pense na tônica como a sua casa. A dominante é a esquina da sua rua: quando você chega nela, dá vontade de entrar em casa. E a sensível é você já na porta, com a mão na maçaneta.")}
<p>Ouça como a <b>sensível</b> pede para subir para a tônica. Se a escala parar no 7º grau, parece que falta alguma coisa:</p>
${ouvir("C4/q D4/q E4/q F4/q G4/q A4/q B4/h.","Escala parando na sensível (incompleta)",110)} ${ouvir("C4/q D4/q E4/q F4/q G4/q A4/q B4/q C5/h","Escala completa (resolvida)",110)}
<h2>⭐ Os graus principais</h2>
<p>Os graus <b>I, IV e V</b> (tônica, subdominante e dominante) são chamados de <b>graus tonais</b>. Com os acordes construídos sobre eles dá para acompanhar milhares de músicas. Você vai estudar isso no Nível 3.</p>
${box("prof","Quando o VII grau está a um <b>tom</b> da tônica (como na escala menor natural), ele se chama <b>subtônica</b>, e não sensível, porque não tem a mesma força de atração. O nome \"sensível\" é reservado para o grau a um semitom abaixo da tônica.")}
${box("pra","Em Sol maior, diga qual nota é a tônica, a dominante, a subdominante e a sensível. (Respostas: Sol, Ré, Dó, Fá♯.)")}
${box("res","I tônica (casa), IV subdominante, V dominante (pede a volta), VII sensível (semitom abaixo da tônica, puxa para ela).")}
`,
quiz:[
["Qual é a dominante de Dó maior?",["Fá","Sol","Si"],1,"V grau de Dó maior = Sol."],
["Qual grau é a sensível?",["VII","V","II"],0,"VII grau, a um semitom da tônica."],
["Em Fá maior, qual é a tônica?",["Dó","Fá","Si♭"],1,"A tônica é a nota que dá nome à escala."]
],
pdf:[["Priolli · vol. 2",NP+"Priolli Teoria Volume 2.pdf"]]},

{t:"Tonalidade e armadura de clave", e:"🔐", min:"14 min", sub:"Os acidentes fixos do começo da pauta",
goal:"ler a armadura de clave e tocar as notas certas em toda a música.",
body:`
<p>Quando uma música usa as notas de uma escala, dizemos que ela está <b>na tonalidade</b> (ou no <b>tom</b>) daquela escala. Uma música em Sol maior usa principalmente as notas de Sol maior, e a tônica Sol é o centro, a casa.</p>
<p>Escrever o sustenido do Fá♯ toda vez que ele aparece daria muito trabalho. Por isso, os acidentes da escala são escritos <b>uma vez só</b>, logo depois da clave, em todas as linhas da pauta. Isso se chama <b>armadura de clave</b>.</p>
${st("G","G4/q A4/q B4/q C5/q D5/q E5/q F5/q G5/q",{key:["F#5"],bpm:100,cap:"Com a armadura de Sol maior, todo Fá é Fá♯, mesmo sem acidente ao lado. Ouça: o Fá soa sustenido.",playNotes:"G4/q A4/q B4/q C5/q D5/q E5/q F#5/q G5/q"})}
<h2>📜 Regras da armadura</h2>
<ol><li>Vale para a <b>música inteira</b> (até aparecer outra armadura).</li><li>Vale para <b>todas as oitavas</b>: o sustenido está escrito na 5ª linha, mas o Fá do 1º espaço também é sustenido.</li><li>Um acidente ocorrente (bequadro, por exemplo) pode mudar a nota <b>só naquele compasso</b>.</li></ol>
${st("F","Bb2/q C3/q D3/q Eb3/q F3/q G3/q A3/q Bb3/q",{key:["Bb2","Eb3"],bpm:100,cap:"Armadura de Si♭ maior na clave de Fá: Si♭ e Mi♭",playNotes:"Bb2/q C3/q D3/q Eb3/q F3/q G3/q A3/q Bb3/q"})}
${box("aten","A armadura sozinha não diz se a música é maior ou menor. A mesma armadura serve para uma tonalidade maior e para uma menor (as <b>relativas</b>, que você vê daqui a duas aulas). Para saber qual é, olhe a última nota e o último acorde: geralmente é a tônica.")}
${box("dica","Antes de tocar qualquer partitura, leia a armadura em voz alta: \"dois bemóis: Si♭ e Mi♭\". Esse hábito de 3 segundos evita a maioria dos erros de leitura.")}
${box("pra","Olhe um hino ou uma música de banda que você conhece e diga quais notas são alteradas pela armadura.")}
${box("res","Armadura = acidentes da tonalidade escritos no começo. Valem para a música toda e em todas as oitavas.")}
`,
quiz:[
["A armadura tem um Fá♯. Aparece um Fá no 1º espaço (clave de Sol), sem acidente. Como tocar?",["Fá natural","Fá♯","Depende do compasso"],1,"A armadura vale em todas as oitavas."],
["Até onde vale a armadura?",["Até a próxima barra de compasso","A música inteira, até mudar a armadura","Só na primeira linha"],1,"Os acidentes da armadura são fixos."],
["Qual é a armadura de Si♭ maior?",["Si♭ e Mi♭","Si♭","Fá♯ e Dó♯"],0,"Si♭ maior: Si♭ Dó Ré Mi♭ Fá Sol Lá. Dois bemóis."]

{t:"O ciclo de quintas", e:"🔄", min:"18 min", sub:"O mapa de todas as tonalidades",
goal:"descobrir a tonalidade de qualquer armadura e saber a ordem dos sustenidos e bemóis de cor.",
body:`
<p>Existem 12 tonalidades maiores, e cada uma tem uma armadura diferente. Parece muito para decorar, mas existe um padrão lindo que organiza tudo: o <b>ciclo de quintas</b>.</p>
<h2>➕ Subindo de quinta em quinta: sustenidos</h2>
<p>Comece em Dó (nenhum acidente). Suba 5 notas (uma quinta): Sol, que tem <b>1</b> sustenido. Suba mais uma quinta: Ré, com <b>2</b>. E assim cada nova tonalidade ganha <b>um sustenido a mais</b>:</p>
${tbl(["Tonalidade","Dó","Sol","Ré","Lá","Mi","Si","Fá♯","Dó♯"],[["Sustenidos","0","1","2","3","4","5","6","7"],["Novo sustenido","—","Fá♯","Dó♯","Sol♯","Ré♯","Lá♯","Mi♯","Si♯"]])}
<p>A <b>ordem dos sustenidos</b> é sempre a mesma: <b>Fá – Dó – Sol – Ré – Lá – Mi – Si</b>.</p>
<h2>➖ Descendo de quinta em quinta: bemóis</h2>
<p>Agora ande no sentido contrário: de Dó, desça uma quinta, e chegue em Fá, com <b>1</b> bemol. Cada nova tonalidade ganha <b>um bemol a mais</b>:</p>
${tbl(["Tonalidade","Dó","Fá","Si♭","Mi♭","Lá♭","Ré♭","Sol♭","Dó♭"],[["Bemóis","0","1","2","3","4","5","6","7"],["Novo bemol","—","Si♭","Mi♭","Lá♭","Ré♭","Sol♭","Dó♭","Fá♭"]])}
<p>A <b>ordem dos bemóis</b> é a dos sustenidos <b>de trás para frente</b>: <b>Si – Mi – Lá – Ré – Sol – Dó – Fá</b>.</p>
${fig(`<svg width="460" height="460" viewBox="0 0 360 360" style="max-width:100%;height:auto" font-family="Montserrat,sans-serif">${(()=>{const K=["Dó","Sol","Ré","Lá","Mi","Si/Dó♭","Fá♯/Sol♭","Ré♭/Dó♯","Lá♭","Mi♭","Si♭","Fá"],N=["0","1♯","2♯","3♯","4♯","5♯ / 7♭","6♯ / 6♭","5♭ / 7♯","4♭","3♭","2♭","1♭"],M=["Lá m","Mi m","Si m","Fá♯ m","Dó♯ m","Sol♯ m","Ré♯/Mi♭ m","Si♭ m","Fá m","Dó m","Sol m","Ré m"];let s='<circle cx="180" cy="180" r="170" fill="#16161a" stroke="#3f3f46"/><circle cx="180" cy="180" r="92" fill="#111114" stroke="#3f3f46"/>';K.forEach((k,i)=>{const a=(i*30-90)*Math.PI/180,x=180+Math.cos(a)*138,y=180+Math.sin(a)*138,x2=180+Math.cos(a)*108,y2=180+Math.sin(a)*108,x3=180+Math.cos(a)*72,y3=180+Math.sin(a)*72;s+='<text x="'+x+'" y="'+(y+5)+'" text-anchor="middle" font-size="'+(k.length>4?11:15)+'" font-weight="900" fill="#fff">'+k+'</text><text x="'+x2+'" y="'+(y2+4)+'" text-anchor="middle" font-size="10" font-weight="700" fill="#fca5a5">'+N[i]+'</text><text x="'+x3+'" y="'+(y3+4)+'" text-anchor="middle" font-size="'+(M[i].length>6?8:10)+'" font-weight="700" fill="#a1a1aa">'+M[i]+'</text>';});return s+'<text x="180" y="184" text-anchor="middle" font-size="11" font-weight="800" fill="#71717a">ciclo de quintas</text>';})()}</svg>`,"Sentido horário: +1 sustenido (sobe uma quinta). Anti-horário: +1 bemol (desce uma quinta). Por dentro, a tonalidade menor relativa.")}
<h2>🕵️ Truques para descobrir a tonalidade pela armadura</h2>
<ul>
<li><b>Sustenidos</b>: pegue o <b>último sustenido</b> e suba <b>um semitom</b>. Ex.: Fá♯ Dó♯ Sol♯ → o último é Sol♯ → subindo meio tom: <b>Lá maior</b>.</li>
<li><b>Bemóis</b>: o <b>penúltimo bemol</b> é o nome da tonalidade. Ex.: Si♭ Mi♭ Lá♭ → o penúltimo é Mi♭ → <b>Mi♭ maior</b>. (A única que você precisa decorar é Fá maior, que tem um bemol só.)</li>
</ul>
${box("prof","Três pares de tonalidades são enarmônicos e soam iguais: Si maior (5♯) = Dó♭ maior (7♭); Fá♯ maior (6♯) = Sol♭ maior (6♭); Dó♯ maior (7♯) = Ré♭ maior (5♭). Por isso, embora existam 15 armaduras, só existem 12 sons de tonalidade maior. Os músicos normalmente preferem a versão com menos acidentes.")}
${box("dica","Para o trombone e para toda banda de sopros, as tonalidades com <b>bemóis</b> (Fá, Si♭, Mi♭, Lá♭) são as mais comuns, porque os instrumentos transpositores em Si♭ e Mi♭ ficam mais confortáveis nelas. Comece por elas.")}
${box("pra","Sem olhar: diga a ordem dos sustenidos (Fá Dó Sol Ré Lá Mi Si) e dos bemóis (Si Mi Lá Ré Sol Dó Fá). Depois descubra: 4 sustenidos = ? (Mi maior). 3 bemóis = ? (Mi♭ maior).")}
${box("res","Subindo quintas: +1♯. Descendo quintas: +1♭. Sustenidos: Fá Dó Sol Ré Lá Mi Si. Bemóis: Si Mi Lá Ré Sol Dó Fá.")}
`,
quiz:[
["Qual tonalidade maior tem 2 sustenidos?",["Sol","Ré","Lá"],1,"Dó (0), Sol (1), Ré (2)."],
["Uma armadura tem Si♭, Mi♭, Lá♭ e Ré♭. Qual tonalidade maior?",["Ré♭","Lá♭","Mi♭"],1,"Penúltimo bemol = Lá♭."],
["Qual é o terceiro sustenido na ordem?",["Sol♯","Ré♯","Dó♯"],0,"Fá, Dó, Sol..."]
],
pdf:[["Roda dos modos (Circle Major Modes)","Circle_Major_Modes.pdf"],["Círculo de acordes aleatórios","circulo acordes aleatorios.pdf"]]},

{t:"As escalas menores", e:"🌙", min:"18 min", sub:"Natural, harmônica e melódica",
goal:"montar as três escalas menores e reconhecer o som de cada uma.",
body:`
<p>A escala maior soa luminosa. A <b>escala menor</b> soa mais escura, séria ou melancólica. O que muda é principalmente o <b>3º grau</b>: na menor, ele fica um semitom mais baixo.</p>
${ouvir("C4/q D4/q E4/q F4/q G4/h","Início de Dó maior",100)} ${ouvir("C4/q D4/q Eb4/q F4/q G4/h","Início de Dó menor",100)}
<h2>1️⃣ Menor natural</h2>
<p>Receita: <b>T – S – T – T – S – T – T</b>. Em Lá, ela usa só teclas brancas:</p>
${st("G","A4/q:1 B4/q:2 C5/q*:♭3 D5/q:4 E5/q:5 F5/q*:♭6 G5/q*:♭7 A5/q:8",{bpm:100,cap:"Lá menor natural. Comparada com Lá maior, tem o 3º, o 6º e o 7º graus abaixados."})}
<h2>2️⃣ Menor harmônica</h2>
<p>A menor natural tem um problema: o 7º grau (Sol, em Lá menor) fica a um <b>tom</b> da tônica e não "puxa" para ela. A solução, usada há séculos, é <b>subir o 7º grau</b> um semitom, criando uma sensível de verdade (Sol♯).</p>
${st("G","A4/q B4/q C5/q D5/q E5/q F5/q G#5/q* A5/q",{bpm:100,cap:"Lá menor harmônica: Sol♯"})}
<p>Repare no salto de Fá para Sol♯: são <b>3 semitons</b> (uma "segunda aumentada"). É esse degrau que dá o som "árabe", "cigano" ou "de filme de mistério" dessa escala.</p>
<h2>3️⃣ Menor melódica</h2>
<p>O salto de 3 semitons da harmônica é difícil de cantar. Para suavizar, sobe-se também o <b>6º grau</b>. Subindo, a escala fica: Lá Si Dó Ré Mi <b>Fá♯ Sol♯</b> Lá.</p>
${st("G","A4/q B4/q C5/q D5/q E5/q F#5/q* G#5/q* A5/q",{bpm:100,cap:"Lá menor melódica, subindo"})}
${box("aten","Na tradição clássica, a menor melódica é diferente na subida e na descida: <b>subindo</b>, 6º e 7º graus elevados; <b>descendo</b>, volta a ser a menor natural (Sol♮, Fá♮). No <b>jazz</b> e na música popular, a menor melódica é usada com 6º e 7º elevados nas duas direções, e às vezes é chamada de \"escala menor de jazz\". As duas definições estão certas, cada uma no seu contexto.")}
${tbl(["Escala (em Lá)","6º grau","7º grau","Uso típico"],[["Menor natural","Fá","Sol","Melodias, pop, rock, MPB"],["Menor harmônica","Fá","<b>Sol♯</b>","Harmonia (cria o acorde de dominante), música clássica, sons \"exóticos\""],["Menor melódica","<b>Fá♯</b>","<b>Sol♯</b>","Melodias clássicas subindo; improvisação no jazz"]])}
${box("pra","Monte as três escalas menores de <b>Ré</b>. (Natural: Ré Mi Fá Sol Lá Si♭ Dó Ré. Harmônica: troque Dó por Dó♯. Melódica subindo: troque também Si♭ por Si♮.)")}
${box("res","Menor natural = T-S-T-T-S-T-T. Harmônica = natural com o 7º elevado. Melódica = natural com 6º e 7º elevados (subindo, na tradição clássica).")}
`,

],

{t:"Tons relativos e homônimos", e:"👯", min:"10 min", sub:"Irmãs que dividem a mesma armadura",
goal:"achar a relativa menor de qualquer tonalidade maior e diferenciar relativo de homônimo.",
body:`
<p>Lá menor natural usa as mesmas notas de Dó maior: todas brancas. As duas escalas dividem a mesma armadura (nenhum acidente), só começam em notas diferentes. Elas são <b>tons relativos</b>.</p>
<h2>🔎 Como achar a relativa</h2>
<ul><li>A relativa <b>menor</b> fica no <b>6º grau</b> da escala maior (ou 3 semitons <b>abaixo</b> da tônica maior).</li><li>A relativa <b>maior</b> fica no <b>3º grau</b> da escala menor (ou 3 semitons <b>acima</b>).</li></ul>
${tbl(["Maior","Relativa menor","Armadura"],[["Dó","Lá menor","nenhum acidente"],["Sol","Mi menor","1♯"],["Fá","Ré menor","1♭"],["Si♭","Sol menor","2♭"],["Mi♭","Dó menor","3♭"],["Ré","Si menor","2♯"]])}
<h2>🆚 Relativo x homônimo</h2>
<p><b>Homônimos</b> são tons com a <b>mesma tônica</b> e modos diferentes: Dó maior e Dó menor. Eles têm <b>armaduras diferentes</b> (Dó menor tem 3 bemóis).</p>
${ouvir("C4/q D4/q E4/q F4/q G4/q A4/q B4/q C5/q","Dó maior",120)} ${ouvir("A3/q B3/q C4/q D4/q E4/q F4/q G4/q A4/q","Lá menor (relativa: mesmas notas)",120)} ${ouvir("C4/q D4/q Eb4/q F4/q G4/q Ab4/q Bb4/q C5/q","Dó menor (homônima: mesma tônica)",120)}
${box("ana","Relativos são como irmãos que moram na mesma casa (mesma armadura), mas cada um tem o seu quarto (tônica diferente). Homônimos são como a mesma pessoa de bom humor e de mau humor: é o mesmo nome (tônica), com outro jeito.")}
${box("prof","Trocar entre tons homônimos (Dó maior ↔ Dó menor) é a base do <b>empréstimo modal</b>, um recurso de harmonia avançada que você estuda no Nível 5.")}
${box("pra","Descubra a relativa menor de Lá maior (3 sustenidos). Resposta: Fá♯ menor.")}
${box("res","Relativos: mesma armadura, tônicas diferentes (menor no 6º grau da maior). Homônimos: mesma tônica, armaduras diferentes.")}
`,
quiz:[
["Qual é a relativa menor de Fá maior?",["Ré menor","Fá menor","Lá menor"],0,"6º grau de Fá maior: Ré."],
["Dó maior e Dó menor são tons...",["relativos","homônimos","enarmônicos"],1,"Mesma tônica, modos diferentes = homônimos."],
["Sol menor é relativa de qual tom maior?",["Si♭ maior","Ré maior","Mi♭ maior"],0,"3 semitons acima de Sol: Si♭. Ambas com 2 bemóis."]
],
pdf:[["Priolli · vol. 2",NP+"Priolli Teoria Volume 2.pdf"]]}
]},

/* ============ MÓDULO 3 · INTERVALOS ============ */
{id:"n2m3", t1:"Intervalos", t2:"a Distância", g:"📏", c:"#8b5cf6", t2c:"#b18cff", sub:"Medir, classificar, inverter e ouvir",
desc:"Intervalo é a distância entre duas notas. É o assunto mais importante da teoria: acordes, escalas e melodias são feitos de intervalos.",
aulas:[
{t:"O que é intervalo e como contar", e:"🔢", min:"12 min", sub:"Número do intervalo",
goal:"dar o número de qualquer intervalo (2ª, 3ª, 5ª...) contando as notas.",
body:`
<p><b>Intervalo</b> é a distância de altura entre duas notas. Ele pode ser:</p>
<ul><li><b>Melódico</b>: as notas soam uma depois da outra (numa melodia).</li><li><b>Harmônico</b>: as notas soam ao mesmo tempo (num acorde).</li></ul>
${st("G","C4/h E4/h | C4+E4/w",{bpm:70,cap:"Dó-Mi melódico (uma depois da outra) e harmônico (juntas)"})}
<h2>🔢 O número: conte as letras, incluindo as duas pontas</h2>
<p>Para saber o <b>número</b> do intervalo, conte os nomes das notas <b>incluindo a primeira e a última</b>:</p>
<ul><li>Dó → Mi: Dó(1) Ré(2) Mi(3) = <b>3ª (terça)</b></li><li>Dó → Sol: Dó Ré Mi Fá Sol = <b>5ª (quinta)</b></li><li>Ré → Lá: Ré Mi Fá Sol Lá = <b>5ª</b></li><li>Dó → Dó acima = <b>8ª (oitava)</b></li><li>Nota igual repetida = <b>uníssono</b> (1ª)</li></ul>
${st("G","C4+C4/w:Uníssono C4+D4/w:2ª C4+E4/w:3ª C4+F4/w:4ª C4+G4/w:5ª C4+A4/w:6ª C4+B4/w:7ª C4+C5/w:8ª",{bpm:60,cap:"Todos os intervalos a partir do Dó"})}
${box("aten","Os acidentes <b>não mudam o número</b> do intervalo. Dó→Mi, Dó→Mi♭ e Dó♯→Mi são todos <b>terças</b>, porque as letras são C e E. O que muda é a <b>qualidade</b> (maior, menor...), o assunto da próxima aula.")}
<h2>📦 Simples e compostos</h2>
<p>Intervalos de até uma oitava são <b>simples</b>. Os maiores que uma oitava são <b>compostos</b>: 9ª, 10ª, 11ª, 12ª, 13ª... Para achar o intervalo simples equivalente, <b>subtraia 7</b>: uma 9ª é uma 2ª mais uma oitava; uma 13ª é uma 6ª mais uma oitava.</p>
${box("prof","Os compostos 9ª, 11ª e 13ª são exatamente os números que aparecem nas cifras de jazz (C7(9), F7M(11+), G7(13)). Por que 9, 11, 13 e não 2, 4, 6? Porque essas notas são pensadas como empilhamento de terças acima da 7ª do acorde: 1-3-5-7-9-11-13.")}
${box("pra","Diga o número: Mi→Si (5ª), Fá→Ré (6ª), Sol→Fá (7ª), Lá→Dó (3ª), Si→Mi (4ª).")}
${box("res","Número do intervalo = conte as letras incluindo as duas pontas. Acidentes não mudam o número. Composto − 7 = simples.")}
`,
quiz:[
["Qual o número do intervalo Ré → Si?",["5ª","6ª","7ª"],1,"Ré Mi Fá Sol Lá Si = 6 notas: 6ª."],
["Dó → Mi♭ é que intervalo (número)?",["2ª","3ª","4ª"],1,"C e E: 3ª. O bemol muda só a qualidade."],
["Uma 10ª equivale a que intervalo simples mais uma oitava?",["2ª","3ª","4ª"],1,"10 − 7 = 3."]
],
pdf:[["Teoria Elementar (Pablo Gusmão) · Intervalos",NP+"Teoria Elementar da Música(Pablo Gusmão).pdf"]]},

{t:"Maior, menor, justo, aumentado, diminuto", e:"⚖️", min:"20 min", sub:"A qualidade do intervalo",
goal:"classificar qualquer intervalo com número e qualidade, contando semitons.",
body:`
<p>O número diz quantas letras. A <b>qualidade</b> diz o tamanho exato, em semitons. As qualidades são:</p>
<ul><li><b>Justo (J)</b>: só para uníssono, 4ª, 5ª e 8ª.</li><li><b>Maior (M)</b> e <b>menor (m)</b>: para 2ª, 3ª, 6ª e 7ª.</li><li><b>Aumentado (A)</b>: um semitom a mais que o justo ou o maior.</li><li><b>Diminuto (d)</b>: um semitom a menos que o justo ou o menor.</li></ul>
<h2>📋 A tabela que resolve tudo</h2>
${tbl(["Semitons","Intervalo","Exemplo a partir de Dó","Ouvir"],[
["0","Uníssono justo (1J)","Dó–Dó",ouvir("C4/h C4/h","",70)],
["1","2ª menor (2m)","Dó–Ré♭",ouvir("C4/h Db4/h","",70)],
["2","2ª maior (2M)","Dó–Ré",ouvir("C4/h D4/h","",70)],
["3","3ª menor (3m)","Dó–Mi♭",ouvir("C4/h Eb4/h","",70)],
["4","3ª maior (3M)","Dó–Mi",ouvir("C4/h E4/h","",70)],
["5","4ª justa (4J)","Dó–Fá",ouvir("C4/h F4/h","",70)],
["6","4ª aumentada (4A) ou 5ª diminuta (5d) = <b>trítono</b>","Dó–Fá♯ ou Dó–Sol♭",ouvir("C4/h F#4/h","",70)],
["7","5ª justa (5J)","Dó–Sol",ouvir("C4/h G4/h","",70)],
["8","6ª menor (6m)","Dó–Lá♭",ouvir("C4/h Ab4/h","",70)],
["9","6ª maior (6M)","Dó–Lá",ouvir("C4/h A4/h","",70)],
["10","7ª menor (7m)","Dó–Si♭",ouvir("C4/h Bb4/h","",70)],
["11","7ª maior (7M)","Dó–Si",ouvir("C4/h B4/h","",70)],
["12","8ª justa (8J)","Dó–Dó",ouvir("C4/h C5/h","",70)]])}
<h2>🧮 O método em 2 passos</h2>
<ol><li><b>Número</b>: conte as letras (ex.: Mi → Sol = 3ª).</li><li><b>Qualidade</b>: conte os semitons e consulte a tabela (Mi → Sol = 3 semitons = 3ª <b>menor</b>).</li></ol>
${box("dica","Atalho usado por muitos músicos: pense na escala maior da nota de baixo. Todos os intervalos da tônica até as notas da escala maior são <b>maiores ou justos</b> (2M, 3M, 4J, 5J, 6M, 7M, 8J). Se a nota de cima estiver um semitom abaixo da escala, o intervalo é menor (ou diminuto, se era justo). Exemplo: Ré → Fá. Na escala de Ré maior, o 3º grau é Fá♯. Fá está um semitom abaixo: 3ª menor.")}
<h2>😈 O trítono</h2>
<p>O intervalo de <b>6 semitons</b> (3 tons inteiros, por isso \"trítono\") divide a oitava exatamente ao meio. Ele soa tenso e instável, e na Idade Média era evitado pelos compositores de música sacra. Hoje ele é o motor da harmonia: é a tensão dentro do acorde de dominante que pede resolução (Nível 3).</p>
${box("aten","4ª aumentada e 5ª diminuta <b>soam igual</b> (6 semitons), mas são escritas diferente: Fá–Si é 4ª aumentada (F e B: 4 letras); Si–Fá é 5ª diminuta (B, C, D, E, F: 5 letras). O nome depende da escrita, não só do som. Isso também vale para outros pares, como 2ª aumentada (Fá–Sol♯) e 3ª menor (Fá–Lá♭).")}
${box("pra","Classifique: Mi→Fá (2m), Ré→Lá (5J), Sol→Mi (6M), Lá→Sol (7m), Fá→Si (4A), Si→Fá (5d).")}
${box("res","Justos: 1, 4, 5, 8. Maiores/menores: 2, 3, 6, 7. Aumentado = +1 semitom; diminuto = −1 semitom. Trítono = 6 semitons.")}
`,
quiz:[
["Quantos semitons tem uma 3ª maior?",["3","4","5"],1,"3ª maior = 4 semitons (Dó–Mi)."],
["Ré → Fá é...",["3ª maior","3ª menor","4ª justa"],1,"3 letras, 3 semitons: 3ª menor."],
["Qual intervalo tem 7 semitons?",["5ª justa","4ª justa","6ª menor"],0,"Dó–Sol, 5ª justa."]
],
pdf:[["Bohumil Med · Intervalos",NP+"Teoria da Música - Bohumil Med 4º Edição.pdf"],["Compêndio (Lacerda)",NP+"Compendio de Teoria Elementar da Musica - Osvaldo Lacerda.pdf"]]},

{t:"Inversão de intervalos", e:"🔃", min:"10 min", sub:"Virando o intervalo de cabeça para baixo",
goal:"inverter qualquer intervalo usando as duas regras.",
body:`
<p><b>Inverter</b> um intervalo é passar a nota de baixo para cima (subindo uma oitava), ou a de cima para baixo. Dó–Mi (3ª) invertido vira Mi–Dó (6ª).</p>
${st("G","C4+E4/w:3ª_Maior E4+C5/w:6ª_menor | C4+G4/w:5ª_Justa G4+C5/w:4ª_Justa",{bpm:60,cap:"Dó-Mi vira Mi-Dó; Dó-Sol vira Sol-Dó"})}
<h2>🧮 Duas regras</h2>
<ol><li><b>Número</b>: os dois números sempre <b>somam 9</b>. 3ª ↔ 6ª, 2ª ↔ 7ª, 4ª ↔ 5ª, 1ª ↔ 8ª.</li><li><b>Qualidade</b>: <b>maior ↔ menor</b>, <b>aumentado ↔ diminuto</b>, e <b>justo continua justo</b>.</li></ol>
${tbl(["Intervalo","Invertido"],[["3ª maior","6ª menor"],["2ª menor","7ª maior"],["4ª justa","5ª justa"],["4ª aumentada","5ª diminuta"],["6ª maior","3ª menor"]])}
${box("ana","Um intervalo e sua inversão são como duas peças que, juntas, formam uma oitava inteira: 4 semitons + 8 semitons = 12. Por isso quando um é \"grande\" (maior), o outro é \"pequeno\" (menor).")}
${box("dica","Para que serve? Às vezes é mais fácil calcular o intervalo invertido. Exemplo: Mi–Ré. É 7ª de quê? Inverta: Ré–Mi é 2ª maior, fácil. Então Mi–Ré é 7ª <b>menor</b>.")}
${box("pra","Inverta: 2ª maior (7ª menor), 5ª diminuta (4ª aumentada), 7ª menor (2ª maior), 6ª menor (3ª maior).")}
${box("res","Inversão: números somam 9; maior↔menor, aumentado↔diminuto, justo↔justo.")}
`,
quiz:[
["A inversão de uma 6ª maior é...",["3ª menor","3ª maior","4ª justa"],0,"6+3=9 e maior vira menor."],
["A inversão de uma 5ª justa é...",["4ª justa","4ª aumentada","3ª maior"],0,"Justo continua justo; 5+4=9."],
["Uma 2ª menor invertida vira...",["7ª menor","7ª maior","6ª maior"],1,"2+7=9; menor vira maior."]
],
pdf:[["Teoria Elementar (Pablo Gusmão) · Inversão",NP+"Teoria Elementar da Música(Pablo Gusmão).pdf"]]},

{t:"Consonância, dissonância e ouvido", e:"👂", min:"15 min", sub:"Repouso e tensão, e como reconhecer de ouvido",
goal:"saber quais intervalos soam estáveis e quais soam tensos, e começar a reconhecê-los de ouvido.",
body:`
<p>Alguns intervalos soam <b>estáveis</b>, "em paz": são as <b>consonâncias</b>. Outros soam <b>tensos</b>, pedindo movimento: são as <b>dissonâncias</b>. Dissonância não é erro: é tempero. Sem tensão, a música não anda.</p>
${tbl(["Tipo","Intervalos","Sensação"],[["Consonâncias perfeitas","Uníssono, 8ª J, 5ª J","Muito estáveis, \"ocas\""],["Consonâncias imperfeitas","3ª M/m, 6ª M/m","Estáveis e \"doces\""],["Dissonâncias","2ª M/m, 7ª M/m, trítono, aumentados e diminutos","Tensas, pedem resolução"]])}
${ouvir("C4+G4/w C4+C5/w","Consonâncias perfeitas (5ª e 8ª)",60)} ${ouvir("C4+E4/w C4+A4/w","Consonâncias imperfeitas (3ª e 6ª)",60)} ${ouvir("C4+D4/w C4+B4/w B3+F4/w","Dissonâncias (2ª, 7ª, trítono)",60)}
${box("prof","A 4ª justa é um caso especial. Na teoria do contraponto tradicional, ela é tratada como <b>dissonância</b> quando está acima da nota mais grave (o baixo), mas como consonância entre vozes superiores. Em harmonia popular e jazz, ela é usada livremente (acordes sus4, voicings em quartas). A explicação física: quanto mais simples a proporção de frequências (8ª = 2:1, 5ª = 3:2, 4ª = 4:3), mais consonante o intervalo tende a soar.")}
<h2>👂 Treinando o ouvido</h2>
<p>Reconhecer intervalos de ouvido é uma habilidade que se treina, como reconhecer vozes de pessoas. Um método muito usado é associar cada intervalo a uma sensação ou ao começo de uma melodia que você conhece bem. Escolha <b>suas próprias</b> referências: músicas da igreja, do rádio, de desenho animado. O importante é a primeira distância entre as duas primeiras notas da melodia.</p>
${tbl(["Intervalo","Sensação comum","Ouvir subindo"],[["2ª maior","passo, continuação",ouvir("C4/h D4/h","",80)],["3ª maior","alegre, brilhante",ouvir("C4/h E4/h","",80)],["3ª menor","triste, suave",ouvir("C4/h Eb4/h","",80)],["4ª justa","chamado, hino, marcha",ouvir("C4/h F4/h","",80)],["5ª justa","aberto, heroico",ouvir("C4/h G4/h","",80)],["6ª maior","amplo, romântico",ouvir("C4/h A4/h","",80)],["7ª menor","\"bluesy\", suspenso",ouvir("C4/h Bb4/h","",80)],["8ª justa","mesma nota, mais aguda",ouvir("C4/h C5/h","",80)]])}
${box("pra","Todo dia, 5 minutos: toque (ou ouça aqui) um intervalo, cante as duas notas e diga o nome. Comece só com 3ª maior, 3ª menor e 5ª justa. Quando acertar sempre, acrescente a 4ª e a 8ª, depois as outras.")}
${box("res","Consonâncias: 8ª, 5ª, 3ªs, 6ªs. Dissonâncias: 2ªs, 7ªs, trítono. Dissonância cria tensão e movimento, não é erro.")}
`,
quiz:[
["Qual destes é uma consonância imperfeita?",["5ª justa","3ª maior","7ª menor"],1,"3ªs e 6ªs são consonâncias imperfeitas."],
["Dissonância é...",["um erro que deve ser evitado","uma tensão que dá movimento à música","o mesmo que desafinar"],1,"Dissonâncias criam tensão, que depois resolve."],
["Qual intervalo divide a oitava ao meio e é muito tenso?",["Trítono","5ª justa","6ª maior"],0,"6 semitons: trítono."]
],
pdf:[["Série Harmônica","Serie Harmonica.pdf"],["Lacerda · Solfejo e Ditado",NP+"Curso Preparatorio de Solfejo e Ditado Musical(Osvaldo Lacerda).pdf"]]}
]},

/* ============ MÓDULO 4 · RITMO II ============ */
{id:"n2m4", t1:"Ritmo", t2:"Nível 2", g:"🥁", c:"#22c55e", t2c:"#3cff7a", sub:"Composto, síncope, quiálteras, células",
desc:"Ritmos que dão \"balanço\": compassos em que o tempo se divide em três, notas fora do tempo, e grupos irregulares.",
aulas:[
{t:"Compasso simples x composto", e:"🎠", min:"15 min", sub:"6/8, 9/8 e 12/8",
goal:"entender por que 6/8 tem 2 tempos e sentir a diferença entre dividir o tempo em 2 e em 3.",
body:`
<p>Até agora, cada tempo se dividia em <b>duas</b> partes (uma semínima = duas colcheias). Isso é o <b>compasso simples</b>. Mas existe outro tipo de balanço, em que cada tempo se divide em <b>três</b>: o <b>compasso composto</b>.</p>
${ouvir("C5/e G4/e C5/e G4/e C5/e G4/e C5/e G4/e","Tempo dividido em 2 (simples)",80)} ${ouvir("C5/e G4/e G4/e C5/e G4/e G4/e C5/e G4/e G4/e C5/e G4/e G4/e","Tempo dividido em 3 (composto)",200)}
<h2>🎠 O 6/8</h2>
<p>No 6/8, a colcheia é a unidade que você vê escrita, e cabem 6 por compasso. Mas elas são agrupadas de <b>3 em 3</b>. Então o compasso tem <b>2 tempos</b>, e cada tempo vale uma <b>semínima pontuada</b> (três colcheias).</p>
${st("G","C5/e*:1 G4/e G4/e C5/e*:2 G4/e G4/e | C5/q.*:1 C5/q.*:2",{time:"6/8",bpm:180,cap:"6/8: 2 tempos, cada um com 3 colcheias. Conte \"UM-e-a DOIS-e-a\"."})}
${box("ana","Pense num cavalinho de carrossel ou numa canção de ninar: \"TA-ta-ta TA-ta-ta\". É o balanço do 6/8. Um 3/4 (valsa) tem três tempos iguais; um 6/8 tem dois tempos \"de galope\".")}
${tbl(["Fórmula","Tempos","Cada tempo vale","Contagem"],[["6/8","2 (binário composto)","semínima pontuada","1-e-a 2-e-a"],["9/8","3 (ternário composto)","semínima pontuada","1-e-a 2-e-a 3-e-a"],["12/8","4 (quaternário composto)","semínima pontuada","1-e-a 2-e-a 3-e-a 4-e-a"]])}
<h2>🔍 Como reconhecer</h2>
<p>Quando o número de cima é <b>6, 9 ou 12</b>, quase sempre o compasso é composto. Para saber quantos tempos ele tem, divida o número de cima por 3.</p>
${box("aten","6/8 e 3/4 têm o mesmo total (6 colcheias), mas não são iguais! 3/4 = três tempos (colcheias agrupadas de 2 em 2). 6/8 = dois tempos (agrupadas de 3 em 3). A diferença está onde caem os acentos.")}
${st("G","C5/e* G4/e C5/e* G4/e C5/e* G4/e | C5/e* G4/e G4/e C5/e* G4/e G4/e",{time:"6/8",bpm:160,cap:"1º compasso agrupado como 3/4 (3 grupos de 2); 2º compasso agrupado como 6/8 (2 grupos de 3). Ouça a diferença de balanço."})}
${box("prof","O 12/8 é a base do blues lento, de muitas baladas de soul, e de ritmos afro-latinos. Muitos grooves \"swingados\" escritos em 4/4 na verdade são sentidos como 12/8. Em andamentos muito rápidos, o 3/8 pode ser sentido com um tempo só por compasso.")}
${box("pra","Com o metrônomo em 60, fale \"1-e-a 2-e-a\" encaixando três sílabas em cada clique. Depois bata palma só no \"1\" e no \"2\".")}
${box("res","Simples: tempo divide em 2. Composto: tempo divide em 3. 6/8 = 2 tempos de semínima pontuada. Tempos = número de cima ÷ 3.")}
`,
quiz:[
["Quantos tempos tem um compasso 6/8?",["6","3","2"],2,"6 colcheias em 2 grupos de 3: 2 tempos."],
["No compasso composto, cada tempo se divide em...",["2 partes","3 partes","4 partes"],1,"Divisão ternária."],
["Qual figura vale um tempo inteiro no 6/8?",["Semínima","Semínima pontuada","Colcheia"],1,"3 colcheias = semínima pontuada."]
],
pdf:[["Mato Alonso · Manual de Rítmica",NP+"manual-de-ritmica-abelardo-mato-alonsopdf.pdf"],["Bohumil Med · Ritmo",NP+"Bohumil Med - Ritmo.pdf"]]},

{t:"Contratempo, síncope e anacruse", e:"💃", min:"15 min", sub:"Notas fora do lugar esperado",
goal:"reconhecer e tocar contratempos, síncopes e anacruses.",
body:`
<p>Se todas as notas caíssem sempre no tempo forte, a música ficaria como um soldado marchando. O \"balanço\" aparece quando algumas notas caem <b>fora</b> dos tempos fortes.</p>
<h2>1️⃣ Contratempo</h2>
<p>Nota tocada na <b>parte fraca</b> do tempo, com <b>pausa</b> na parte forte. Você ouve o silêncio no tempo e o som logo depois.</p>
${st("G","r/e C5/e r/e C5/e r/e C5/e r/e C5/e",{time:"4/4",bpm:90,cap:"Contratempo: a nota cai no \"e\" (1 E 2 E 3 E 4 E)"})}
<h2>2️⃣ Síncope</h2>
<p>Nota que começa numa parte <b>fraca</b> e se <b>prolonga</b> por cima de uma parte <b>forte</b>. A parte forte fica "engolida", e o acento se desloca. É o coração do samba, do choro, do baião e do jazz.</p>
${st("G","C5/e C5/q C5/e C5/h | C5/q C5/h C5/q",{time:"4/4",bpm:90,cap:"1º compasso: colcheia-semínima-colcheia, a síncope mais comum (a semínima começa no \"e\" do 1 e atravessa o tempo 2). 2º compasso: síncope de tempo inteiro (a mínima começa no 2 e atravessa o 3)."})}
${box("ana","Na síncope você \"chega antes\" e \"segura\". É como alguém que dá um passo de dança antes da batida e fica parado quando todo mundo esperava o passo.")}
<h2>3️⃣ Anacruse</h2>
<p>Uma ou mais notas que vêm <b>antes do primeiro tempo forte</b> da música, num compasso incompleto no início. Muitos hinos e canções começam assim: a primeira nota é um "impulso" para chegar no tempo 1.</p>
${st("G","G4/q | C5/q C5/q D5/q E5/q | C5/h. ||",{time:"4/4",bpm:90,cap:"Começa com uma semínima de anacruse (no 4º tempo) antes do primeiro compasso completo"})}
${box("prof","Por tradição, quando uma música começa com anacruse, o último compasso costuma vir incompleto, somando com a anacruse um compasso inteiro. E, na hora de contar os compassos (para ensaio, por exemplo), o compasso da anacruse não recebe número: o compasso 1 é o primeiro completo.")}
${box("pra","Com o metrônomo a 80: (1) bata palma só nos \"e\" (contratempo). (2) Fale \"ta-TAA-ta\" no ritmo colcheia-semínima-colcheia, sentindo o acento no meio.")}
${box("res","Contratempo: nota na parte fraca, pausa na forte. Síncope: nota da parte fraca que se prolonga sobre a forte. Anacruse: notas antes do primeiro tempo forte.")}
`,
quiz:[
["O que caracteriza a síncope?",["Nota na parte fraca prolongada sobre a parte forte","Uma pausa longa","Notas muito rápidas"],0,"O acento se desloca para a parte fraca."],
["No contratempo, o que acontece na parte forte do tempo?",["Uma nota forte","Uma pausa","Uma nota ligada"],1,"Silêncio no tempo, som na parte fraca."],
["Anacruse é...",["o último compasso","nota(s) antes do primeiro tempo forte","um tipo de pausa"],1,"É o \"impulso\" inicial."]
],
pdf:[["Pozzoli · Divisão rítmica",NP+"Guia Prático -Teórico Partes I e II(Pozzoli).pdf"],["Prince 1",NP+"PRINCE-1 - completo.pdf"]]},

{t:"Quiálteras: tercinas e companhia", e:"3️⃣", min:"12 min", sub:"Grupos irregulares",
goal:"tocar tercinas e entender o que significa uma quiáltera.",
body:`
<p>Às vezes o compositor quer dividir um tempo de um jeito que não é o \"normal\" do compasso. Por exemplo, colocar <b>3 notas iguais no espaço de 2</b>. Esse grupo irregular se chama <b>quiáltera</b>, e é marcado com um número em cima ou embaixo do grupo.</p>
<h2>🔺 A tercina</h2>
<p>A mais comum é a <b>tercina</b>: 3 colcheias no lugar de 2, ou seja, 3 notas iguais dentro de <b>um tempo</b> de semínima.</p>
${st("G","C5/e G4/e C5/e G4/e | C5/e3:3 G4/e3 G4/e3 C5/e3:3 G4/e3 G4/e3",{time:"2/4",bpm:80,cap:"1º compasso: 2 colcheias por tempo. 2º compasso: tercinas, 3 notas por tempo (o número 3 fica escrito sobre o grupo)."})}
${box("ana","Divida uma barra de chocolate com dois amigos: você corta em 2. Com três amigos, corta em 3. O tamanho da barra (o tempo) é o mesmo; só muda em quantos pedaços iguais ela é dividida.")}
<p>Fale "tri-o-la" ou "ta-ca-ta" em cada tempo para sentir a tercina. As três notas precisam ser <b>exatamente iguais</b> em duração.</p>
${box("aten","O erro mais comum é tocar a tercina como \"colcheia-duas semicolcheias\" ou \"duas semicolcheias-colcheia\". Treine com o metrônomo e grave-se: as três notas devem ter o mesmo tamanho.")}
<h2>➕ Outras quiálteras</h2>
${tbl(["Nome","O que é"],[["Tercina","3 notas no lugar de 2"],["Duína / quartina","2 ou 4 notas no lugar de 3 (comum em compasso composto)"],["Quintina, sextina, setina...","5, 6, 7 notas no lugar de 4 (ou do valor indicado)"]])}
${box("prof","Existem também tercinas de semínima: 3 semínimas no espaço de 2 tempos (ou seja, de uma mínima). Elas soam \"atravessadas\" em relação ao pulso e são muito usadas em música popular e jazz. A mesma lógica vale: três partes iguais de um espaço que normalmente teria duas.")}
${box("pra","Metrônomo em 60: alterne 1 compasso de colcheias (\"1-e 2-e\") e 1 compasso de tercinas (\"1-e-a 2-e-a\"), sem parar.")}
${box("res","Quiáltera = grupo irregular marcado com um número. Tercina = 3 notas iguais no lugar de 2.")}
`,
quiz:[
["Uma tercina de colcheias coloca quantas notas em um tempo de semínima?",["2","3","4"],1,"3 colcheias no lugar de 2."],
["As notas de uma tercina devem ser...",["de durações diferentes","exatamente iguais","sempre acentuadas"],1,"Três partes iguais."],
["Como a quiáltera é indicada na partitura?",["Com um número sobre o grupo","Com um ponto","Com uma ligadura de valor"],0,"O número (3, 5, 6...) indica o grupo irregular."]
],
pdf:[["Bohumil Med · Ritmo",NP+"Bohumil Med - Ritmo.pdf"],["Mato Alonso · Rítmica",NP+"manual-de-ritmica-abelardo-mato-alonsopdf.pdf"]]},

{t:"Células rítmicas com semicolcheias", e:"🧱", min:"18 min", sub:"Os blocos que formam 90% dos ritmos",
goal:"ler de relance as combinações mais comuns dentro de um tempo.",
body:`
<p>Leitores experientes não leem nota por nota: eles reconhecem <b>blocos de um tempo</b>, chamados <b>células rítmicas</b>, como quem lê palavras em vez de letras. Dentro de um tempo de semínima (em 2/4, 3/4, 4/4), estas são as células mais comuns:</p>
${tbl(["Célula (1 tempo)","Como falar","Ouvir"],[
["semínima","ta",ouvir("C5/q","",70)],
["2 colcheias","ta-ta",ouvir("C5/e C5/e","",70)],
["4 semicolcheias","ta-ka-di-mi",ouvir("C5/s C5/s C5/s C5/s","",70)],
["colcheia + 2 semicolcheias (\"galope\")","ta — di-mi",ouvir("C5/e C5/s C5/s","",70)],
["2 semicolcheias + colcheia","ta-ka — di",ouvir("C5/s C5/s C5/e","",70)],
["semicolcheia + colcheia + semicolcheia","ta — ka — mi (síncope curta)",ouvir("C5/s C5/e C5/s","",70)],
["colcheia pontuada + semicolcheia","taa — mi (\"pontuado\")",ouvir("C5/e. C5/s","",70)],
["semicolcheia + colcheia pontuada","ta — kaa (\"estalo\")",ouvir("C5/s C5/e.","",70)]])}
${st("G","C5/e C5/s C5/s C5/s C5/s C5/e | C5/s C5/e C5/s C5/e. C5/s | C5/q C5/e C5/e | C5/h",{time:"2/4",bpm:72,cap:"Uma frase misturando células"})}
${box("ana","As células são como sílabas: \"ca\", \"sa\", \"pa\"... Depois de conhecer as sílabas, você lê \"casa\" de uma vez, sem soletrar.")}
${box("dica","A colcheia pontuada + semicolcheia é muito comum em marchas e dobrados. A semicolcheia + colcheia + semicolcheia é a síncope característica do samba e do choro. Reconhecer isso ajuda a tocar com o estilo certo.")}
${box("pra","Escolha 4 células por dia e faça cartões. Sorteie e fale no ritmo, com o metrônomo a 60. Quando estiver fácil, suba para 80 e depois para 100.")}
${box("res","Decore as células de um tempo. Ler por células é como ler palavras em vez de letras.")}
`,
quiz:[
["Quantas semicolcheias cabem num tempo de semínima?",["2","4","8"],1,"Semínima = 4 semicolcheias."],
["Colcheia pontuada + semicolcheia somam...",["1 tempo","1 tempo e meio","meio tempo"],0,"¾ + ¼ = 1."],
["Por que ler por células?",["Porque fica mais bonito","Para ler rápido, reconhecendo blocos em vez de nota por nota","Porque não precisa de metrônomo"],1,"É como ler palavras inteiras."]
],
pdf:[["Grupos Rítmicos MTS",NP+"Grupos Ritmicos MTS e H5.pdf"],["Pozzoli · Ditado rítmico",NP+"Pozzoli - Ditado Ritmico.pdf"]]}
]},

{id:"n2m5", t1:"Sinais &", t2:"Expressão", g:"🎭", c:"#fb7185", t2c:"#ff5c7a", sub:"Andamento, dinâmica, articulação, repetições",
desc:"As notas dizem o quê; os sinais dizem COMO. Velocidade, força, jeito de atacar cada nota e o caminho de leitura da partitura.",
aulas:[
{t:"Andamento: a velocidade da música", e:"🐢", min:"10 min", sub:"Largo, Adagio, Allegro, Presto...",
goal:"entender os termos de andamento e as mudanças de velocidade.",
body:`
<p><b>Andamento</b> é a velocidade do pulso. Ele pode vir como número de metrônomo (♩ = 90) ou como uma palavra, geralmente em <b>italiano</b>, porque foram os italianos que espalharam esses termos pela Europa nos séculos XVII e XVIII.</p>
${tbl(["Termo","Significado","bpm aproximado"],[["Largo","largo, muito lento","40–60"],["Larghetto","um pouco menos lento que o largo","60–66"],["Adagio","lento, calmo","66–76"],["Andante","\"andando\", passo tranquilo","76–108"],["Moderato","moderado","108–120"],["Allegro","rápido, alegre","120–168"],["Presto","muito rápido","168–200"],["Prestissimo","o mais rápido possível","acima de 200"]])}
${box("aten","Os números são <b>aproximados</b> e variam de livro para livro. O termo italiano descreve também um <b>caráter</b>: \"Allegro\" significa alegre, e não só rápido. Dois músicos podem tocar o mesmo Allegro em velocidades um pouco diferentes, e os dois estarem certos.")}
<h2>🔄 Mudanças de andamento</h2>
${tbl(["Termo","Abreviação","Significado"],[["Accelerando","accel.","acelerando aos poucos"],["Ritardando / Rallentando","rit. / rall.","atrasando aos poucos"],["Ritenuto","riten.","mais lento de repente"],["A tempo","—","volta ao andamento anterior"],["Rubato","—","liberdade expressiva: adianta e atrasa, sem perder o sentido"],["Fermata","𝄐","segura a nota (ou pausa) mais tempo que o escrito, à vontade do intérprete ou do regente"]])}
${box("pra","Ligue o metrônomo e experimente: Adagio (70), Andante (90), Allegro (130). Cante a mesma melodia nas três velocidades e perceba como o caráter muda.")}
${metro(90,4)}
${box("res","Andamento = velocidade. Termos em italiano descrevem velocidade e caráter. accel. acelera, rit. atrasa, a tempo volta.")}
`,
quiz:[
["Qual termo indica o andamento mais lento?",["Largo","Andante","Allegro"],0,"Largo é o mais lento da lista."],
["O que significa \"rit.\"?",["Acelerar","Ir atrasando aos poucos","Voltar ao tempo"],1,"Ritardando: desacelerar gradualmente."],
["O que a fermata pede?",["Parar a música","Segurar a nota além do valor escrito","Tocar mais forte"],1,"A fermata prolonga a nota ou pausa."]
],
pdf:[["Andamento, variações e expressividade",NP+"andamento variacoes e expressividade(1).pdf"]]},

{t:"Dinâmica: forte e piano", e:"🔉", min:"10 min", sub:"pp, p, mp, mf, f, ff, crescendo",
goal:"ler e executar as indicações de dinâmica.",
body:`
<p><b>Dinâmica</b> é a variação de <b>intensidade</b> (forte/fraco) ao longo da música. As indicações também vêm do italiano e aparecem em letras em negrito itálico, geralmente embaixo da pauta.</p>
${tbl(["Sinal","Nome","Significado"],[["<b><i>pp</i></b>","pianissimo","muito fraco"],["<b><i>p</i></b>","piano","fraco"],["<b><i>mp</i></b>","mezzo piano","meio fraco"],["<b><i>mf</i></b>","mezzo forte","meio forte"],["<b><i>f</i></b>","forte","forte"],["<b><i>ff</i></b>","fortissimo","muito forte"],["<b>&lt;</b> ou cresc.","crescendo","aumentando aos poucos"],["<b>&gt;</b> ou dim./decresc.","diminuendo / decrescendo","diminuindo aos poucos"],["<b><i>sfz</i></b>","sforzando","acento súbito e forte numa nota"],["<b><i>fp</i></b>","forte-piano","ataca forte e cai logo para piano"]])}
${box("ana","O \"piano\" (instrumento) tem esse nome por causa disso: o nome original era <i>pianoforte</i>, o teclado que conseguia tocar <b>piano</b> e <b>forte</b> dependendo da força do dedo, coisa que o cravo, mais antigo, praticamente não conseguia.")}
${box("aten","Dinâmica é <b>relativa</b>: o <i>f</i> de um trio de câmara é diferente do <i>f</i> de uma banda sinfônica. E em instrumentos de sopro, tocar forte <b>não pode</b> virar tocar desafinado ou com som rasgado, nem tocar piano pode virar tocar sem apoio de ar.")}
${box("dica","Para instrumentos de sopro: tocar <i>piano</i> exige <b>mais</b> controle de ar, não menos. O ar continua firme e contínuo, só em menor quantidade. Treine notas longas em <i>p</i>: é um dos melhores exercícios de controle.")}
${box("pra","Escolha uma nota fácil e faça: 4 tempos em <i>p</i>, 4 em <i>mf</i>, 4 em <i>f</i>. Depois um crescendo de <i>p</i> a <i>f</i> em 8 tempos e um diminuendo de volta.")}
${box("res","pp < p < mp < mf < f < ff. Crescendo aumenta aos poucos; diminuendo diminui. Dinâmica é relativa ao grupo e ao estilo.")}
`,
quiz:[
["O que é mezzo forte (mf)?",["Muito forte","Meio forte","Fraco"],1,"Mezzo = meio."],
["O sinal < embaixo de algumas notas indica...",["crescendo","diminuendo","acento"],0,"Abre = cresce."],
["Tocar piano num instrumento de sopro exige...",["relaxar o ar completamente","ar firme e controlado, em menor quantidade","tocar desafinado"],1,"Controle de ar é essencial no piano."]
],
pdf:[["Bohumil Med · Dinâmica",NP+"Teoria da Música - Bohumil Med 4º Edição.pdf"]]},

{t:"Articulação: o jeito de cada nota", e:"✂️", min:"14 min", sub:"Staccato, legato, acento, tenuto",
goal:"reconhecer e executar os sinais de articulação.",
body:`
<p><b>Articulação</b> é o jeito como cada nota começa, dura e termina: separada, ligada, com peso, curtinha... Ela muda completamente o caráter de uma melodia, mesmo com as mesmas notas e o mesmo ritmo.</p>
${tbl(["Sinal","Nome","Como tocar"],[["• (ponto sobre/sob a nota)","<b>Staccato</b>","curto e destacado, com espaço depois (em geral, cerca de metade do valor, dependendo do estilo)"],["▾ (cunha)","Staccatissimo","ainda mais curto e seco"],["— (traço)","<b>Tenuto</b>","nota sustentada pelo valor completo, com leve peso"],["&gt;","<b>Acento</b>","ataque mais forte que as notas vizinhas"],["^","Marcato","acento forte e marcado, geralmente com separação"],["⌒ (arco sobre notas diferentes)","<b>Legato</b> (ligadura de expressão)","notas bem ligadas, sem interromper o som"]])}
${ouvir("C5/q C5/q C5/q C5/q","Normal",100)} ${ouvir("C5/e r/e C5/e r/e C5/e r/e C5/e r/e","Staccato",100)} ${ouvir("C5/q D5/q E5/q F5/q","Legato",100)}
${box("aten","Não confunda a <b>ligadura de valor</b> (arco entre notas <b>iguais</b>: soma durações, Nível 1) com a <b>ligadura de expressão</b> (arco entre notas <b>diferentes</b>: tocar ligado).")}
<h2>🎺 Em instrumentos de sopro</h2>
<p>Nos sopros, a articulação é feita principalmente com a <b>língua</b>: ela \"abre a torneira\" do ar em cada nota, pronunciando sílabas como \"tu\" ou \"du\". Numa ligadura de expressão, só a <b>primeira</b> nota é atacada com a língua; as outras mudam sem interromper o ar.</p>
${box("prof","No trombone, o legato tem um detalhe único: como a vara desliza, ligar notas sem língua pode produzir um <b>glissando</b> (som escorregando). Por isso trombonistas usam uma língua muito suave, \"du\" ou \"lu\", para marcar o início de cada nota ligada. Você aprende isso na trilha do trombone.")}
${box("pra","Pegue uma escala simples e toque (ou cante) de quatro jeitos: normal, toda em staccato, toda em legato e com acento no primeiro tempo de cada compasso.")}
${box("res","Staccato = curto. Tenuto = cheio. Acento = mais forte. Legato = ligado. Ligadura de expressão ≠ ligadura de valor.")}
`,
quiz:[
["Um ponto em cima da nota indica...",["staccato","tenuto","fermata"],0,"Ponto = staccato, curto."],
["O arco entre notas DIFERENTES indica...",["somar durações","tocar ligado (legato)","repetir"],1,"Ligadura de expressão."],
["O traço horizontal (tenuto) pede...",["nota curtíssima","valor completo, com leve peso","pausa"],1,"Tenuto = sustentado."]
],
pdf:[["Farkas · A arte de tocar metais",NP+"A arte de tocar metais - Philip Farkas.pdf"]]},

{t:"Repetições e o caminho da partitura", e:"🗺️", min:"15 min", sub:"Ritornelo, casas, D.C., D.S., Coda, Fine",
goal:"seguir qualquer roteiro de repetição sem se perder.",
body:`
<p>Para não escrever tudo de novo, a partitura usa sinais que funcionam como <b>placas de trânsito</b>: \"volte aqui\", \"pule para lá\", \"termine aqui\".</p>
<h2>🔁 Ritornelo</h2>
<p>Duas barras com dois pontinhos. Ao chegar no <b>:‖</b> (pontos à esquerda), volte até o <b>‖:</b> (pontos à direita). Se não houver ‖:, volte ao começo da música. Repete-se <b>uma vez</b>, salvo indicação.</p>
${st("G","|: C5/q D5/q E5/q F5/q | G5/w :|",{bpm:110,playNotes:"C5/q D5/q E5/q F5/q G5/w C5/q D5/q E5/q F5/q G5/w",cap:"Toca 2 compassos, volta e toca de novo"})}
<h2>1️⃣ 2️⃣ Casas (1ª e 2ª vez)</h2>
<p>Às vezes o fim do trecho repetido muda. Da <b>1ª vez</b>, toque o compasso marcado \"1.\" e volte; da <b>2ª vez</b>, pule a casa 1 e toque direto a casa \"2.\".</p>
<h2>🧭 D.C., D.S., Fine e Coda</h2>
${tbl(["Sinal","Nome","O que fazer"],[["<b>D.C.</b>","Da Capo","volte para o <b>começo</b> (\"da cabeça\")"],["<b>D.S.</b> ou 𝄋","Dal Segno","volte para o <b>sinal</b> 𝄋"],["<b>Fine</b>","Fim","termine aqui (na volta)"],["<b>𝄌</b> ou \"To Coda\"","Coda","na volta, ao chegar neste sinal, <b>pule</b> para a seção marcada Coda (o final)"],["<b>D.C. al Fine</b>","","volte ao começo e termine no Fine"],["<b>D.S. al Coda</b>","","volte ao sinal 𝄋, toque até o \"To Coda\" e pule para a Coda"]])}
<h2>🧩 Exemplo de roteiro</h2>
<p>Uma música com as partes A B C, com \"𝄋\" no início de B, \"To Coda\" no fim de B, \"D.S. al Coda\" depois de C, e uma Coda no final. O caminho é:</p>
<p style="text-align:center;font-weight:900;font-size:18px">A → B → C → (volta ao 𝄋) B → (pula) Coda</p>
${box("aten","Convenção tradicional: depois de um D.C. ou D.S., os ritornelos <b>não</b> se repetem de novo (toca-se só a última casa), a menos que a partitura diga o contrário. Em bandas e big bands isso costuma ser combinado no ensaio. Na dúvida, pergunte ao regente.")}

{t:"Solfejo: cantar o que está escrito", e:"🎤", min:"15 min", sub:"O treino que forma o ouvido interno",
goal:"saber como estudar solfejo e ditado, passo a passo.",
body:`
<p><b>Solfejar</b> é ler uma partitura <b>cantando</b> o nome das notas, na altura e no ritmo certos. É o treino que cria o <b>ouvido interno</b>: a capacidade de \"ouvir na cabeça\" uma música só de olhar para o papel. Todo bom músico tem isso, e para instrumentos de afinação livre, como o trombone, isso é essencial: o ouvido é que acerta a posição exata da vara.</p>
<h2>🧩 Existem dois tipos de solfejo</h2>
<ul><li><b>Solfejo rítmico (ou falado)</b>: falar os nomes das notas no ritmo, sem cantar as alturas. É o que métodos como Pozzoli (parte de divisão) e Bona treinam.</li><li><b>Solfejo melódico (ou entoado)</b>: cantar as alturas afinadas com os nomes das notas.</li></ul>
<h2>📋 Passo a passo para solfejar uma lição</h2>
<ol><li>Olhe clave, armadura e compasso.</li><li>Marque o pulso (com a mão, fazendo os gestos de regência, ou com o pé).</li><li>Faça o <b>solfejo falado</b> primeiro, bem devagar.</li><li>Toque ou ouça a <b>primeira nota</b> (use um afinador ou teclado) e cante a escala da tonalidade para \"entrar no tom\".</li><li>Cante a lição, devagar, sem parar mesmo se errar.</li><li>Confira no instrumento os trechos que ficaram em dúvida.</li></ol>
${st("G","C4/q E4/q G4/q E4/q | F4/q A4/q G4/h | E4/q D4/q C4/q E4/q | D4/w",{time:"4/4",bpm:80,playLabel:"Conferir depois de cantar",cap:"Lição de exemplo: cante primeiro, depois clique para conferir"})}
<h2>✍️ Ditado: o caminho inverso</h2>
<p>No <b>ditado</b>, você ouve e escreve. Comece com ditados rítmicos (só o ritmo), depois melódicos curtos (3 a 5 notas). Aplicativos de treino auditivo ajudam muito.</p>
${box("dica","Solfeje 10 minutos por dia. É pouco tempo e dá um resultado enorme em leitura, afinação e improvisação.")}
${box("prof","Existem dois sistemas de solfejo cantado: o <b>Dó fixo</b> (usado no Brasil, na França, na Itália), em que Dó é sempre a nota Dó, e o <b>Dó móvel</b> (comum nos EUA e no Reino Unido, método Kodály), em que \"Dó\" é sempre a tônica da tonalidade. O Dó móvel treina muito bem a percepção de função das notas; o Dó fixo, a leitura absoluta. Conhecer os dois é vantagem.")}
${box("res","Solfejo falado → solfejo cantado → ditado. Todo dia, pouco tempo. Cria o ouvido interno, fundamental para afinar.")}
`,
quiz:[
["O que é solfejo melódico?",["Falar as notas sem altura","Cantar as notas nas alturas certas","Tocar sem partitura"],1,"Solfejo melódico = entoado."],
["Por que o solfejo é tão importante para o trombonista?",["Porque o trombone não tem notas","Porque o ouvido é que guia a posição exata da vara e a afinação","Porque é obrigatório na igreja"],1,"Sem trastes nem teclas fixas, a afinação depende do ouvido."],
["No ditado musical, você...",["canta o que está escrito","escreve o que ouve","toca de memória"],1,"Ditado é o caminho inverso: do som para o papel."]
],
pdf:[["50 solfejos fáceis",NP+"50 solfejos faceis.pdf"],["Pozzoli · Solfejo",NP+"SOLFEJO - Pozzoli.pdf"],["Bona · Clave de Fá",NP+"Bona clave de Fá.pdf"],["Nascimento & Silva · Solfejo",NP+"Metodo de Solfejo - Frederico do Nascimento e Jose Raymundo da Silva - Vol 1.pdf"]]}
]}
]});

{t:"O que é harmonia", e:"🧱", min:"8 min", sub:"Melodia é horizontal, harmonia é vertical",

body:`
<p>Na partitura, a música tem duas direções:</p>
<ul><li><b>Horizontal (→)</b>: as notas uma depois da outra formam a <b>melodia</b>, a parte que você canta.</li><li><b>Vertical (↑)</b>: as notas que soam <b>ao mesmo tempo</b> formam a <b>harmonia</b>.</li></ul>
<p>Um grupo de três ou mais notas diferentes soando juntas é um <b>acorde</b>. A harmonia é a sequência de acordes que acompanha a melodia e dá a ela uma \"cor\" e um \"chão\".</p>
${st("G","E4/h D4/h | C4/w",{bpm:70,cap:"Só a melodia"})}
${st("G","C4+E4+G4/h G3+B3+D4/h | C4+E4+G4/w",{bpm:70,cap:"A mesma melodia (nota de cima) com harmonia: cada nota ganha um acorde embaixo"})}
${box("ana","A melodia é a pessoa andando; a harmonia é o cenário. A mesma pessoa andando numa praia ensolarada ou numa rua escura passa sensações totalmente diferentes. Com a mesma melodia e outra harmonia, a emoção da música muda.")}
${box("prof","Harmonia, no sentido da teoria, estuda a formação dos acordes, o encadeamento entre eles (como passar de um para outro) e a função de cada um dentro da tonalidade. É o que você vai ver neste nível inteiro. Contraponto, que você vê no Nível 5, estuda o outro lado: como várias melodias independentes soam juntas.")}
${box("res","Melodia = horizontal, notas em sequência. Harmonia = vertical, notas simultâneas. Acorde = 3 ou mais notas diferentes juntas.")}
`,

{t:"Tríades: os 4 tipos de acorde básico", e:"🔺", min:"18 min", sub:"Maior, menor, diminuta, aumentada",
goal:"montar as quatro tríades a partir de qualquer nota.",
body:`
<p>A forma mais comum de construir acordes é <b>empilhar terças</b>. Pegue uma nota (a <b>fundamental</b>), pule uma nota e pegue a próxima (a <b>terça</b>), pule mais uma e pegue a seguinte (a <b>quinta</b>). Três notas: uma <b>tríade</b>.</p>
${st("G","C4/q:1 E4/q:3 G4/q:5 C4+E4+G4/w:Dó",{bpm:80,cap:"Dó (1), Mi (3), Sol (5): a tríade de Dó maior"})}
<p>Como as terças podem ser <b>maiores</b> (4 semitons) ou <b>menores</b> (3 semitons), existem quatro combinações possíveis:</p>
${tbl(["Tríade","Terças (de baixo para cima)","Intervalos a partir da fundamental","Em Dó","Cifra","Ouvir"],[
["<b>Maior</b>","3M + 3m","3M e 5J","Dó Mi Sol","C",ouvir("C4+E4+G4/w","",60)],
["<b>Menor</b>","3m + 3M","3m e 5J","Dó Mi♭ Sol","Cm",ouvir("C4+Eb4+G4/w","",60)],
["<b>Diminuta</b>","3m + 3m","3m e 5d","Dó Mi♭ Sol♭","Cdim ou Cm(♭5)",ouvir("C4+Eb4+Gb4/w","",60)],
["<b>Aumentada</b>","3M + 3M","3M e 5A","Dó Mi Sol♯","C+ ou C(♯5)",ouvir("C4+E4+G#4/w","",60)]])}
${st("G","C4+E4+G4/w:Maior C4+Eb4+G4/w:Menor C4+Eb4+Gb4/w:Diminuta C4+E4+G#4/w:Aumentada",{bpm:50})}
${box("ana","Pense em sabores: <b>maior</b> é doce e luminoso, <b>menor</b> é agridoce e mais sério, <b>diminuto</b> é tenso como um suspense, <b>aumentado</b> é estranho e flutuante, como um sonho.")}
<h2>🔍 O papel de cada nota</h2>
<ul><li><b>Fundamental</b> (1): dá o nome ao acorde.</li><li><b>Terça</b> (3): decide se é maior ou menor. É a nota que dá a \"cor\".</li><li><b>Quinta</b> (5): dá estabilidade. Justa na maior e na menor; alterada na diminuta e na aumentada.</li></ul>
${box("dica","Truque rápido: acorde maior = fundamental + 4 semitons + 3 semitons. Acorde menor = fundamental + 3 + 4. No teclado, conte as teclas.")}
${kb("C4","B4","C4:1 E4:3 G4:5",{cap:"Dó maior no teclado: pule uma tecla branca, pegue outra"})}
${box("pra","Monte as tríades maiores e menores de Fá, Sol, Ré e Si♭. (Fá: Fá Lá Dó / Fá Lá♭ Dó. Sol: Sol Si Ré / Sol Si♭ Ré. Ré: Ré Fá♯ Lá / Ré Fá Lá. Si♭: Si♭ Ré Fá / Si♭ Ré♭ Fá.)")}
${box("res","Tríade = fundamental + terça + quinta. Maior (3M+3m), menor (3m+3M), diminuta (3m+3m), aumentada (3M+3M).")}
`,
quiz:[
["Quais notas formam Ré menor?",["Ré Fá♯ Lá","Ré Fá Lá","Ré Fá Lá♭"],1,"Ré-Fá = 3ª menor; Ré-Lá = 5ª justa."],
["Qual nota decide se a tríade é maior ou menor?",["A fundamental","A terça","A quinta"],1,"A terça dá a cor."],
["Duas terças maiores empilhadas formam uma tríade...",["diminuta","aumentada","menor"],1,"3M + 3M = aumentada (5ª aumentada)."]
],

{t:"Inversões: quem está no baixo", e:"🔄", min:"12 min", sub:"Estado fundamental, 1ª e 2ª inversão",
goal:"reconhecer e escrever acordes invertidos, inclusive em cifra com barra.",
body:`
<p>As notas de um acorde podem estar em qualquer ordem. O que muda o <b>nome da posição</b> é só uma coisa: <b>qual nota está no baixo</b> (a mais grave).</p>
${tbl(["Posição","Nota no baixo","Dó maior","Cifra"],[["Estado fundamental","a fundamental","<b>Dó</b> Mi Sol","C"],["1ª inversão","a terça","<b>Mi</b> Sol Dó","C/E"],["2ª inversão","a quinta","<b>Sol</b> Dó Mi","C/G"]])}
${st("G","C4+E4+G4/w:C E4+G4+C5/w:C/E G4+C5+E5/w:C/G",{bpm:50,cap:"O mesmo acorde de Dó maior nas três posições"})}
<h2>➗ A barra na cifra</h2>
<p>Na cifra, a <b>barra</b> indica o baixo: <b>C/E</b> se lê \"Dó com baixo em Mi\". A letra antes da barra é o acorde; a letra depois é a nota mais grave.</p>
${box("aten","A barra também aparece com baixos que <b>não pertencem</b> ao acorde, por exemplo <b>D/C</b> (acorde de Ré maior com Dó no baixo). Isso já não é uma inversão simples, e sim um acorde com baixo diferente, muito usado em música popular.")}
<h2>🎯 Para que servem as inversões?</h2>
<ul><li>Fazer o baixo andar de forma suave, por graus vizinhos, em vez de pular.</li><li>Mudar a cor do acorde: a 2ª inversão soa menos estável; a 1ª, mais leve.</li></ul>
${st("F","C3/h G2/h | A2/h E2/h",{bpm:70,playNotes:"C3+E3+G3/h G2+B2+D3/h A2+C3+E3/h E2+G2+B2/h",cap:"Baixo pulando: C  G  Am  Em"})}
${st("F","C3/h B2/h | A2/h G2/h",{bpm:70,playNotes:"C3+E3+G3/h B2+D3+G3/h A2+C3+E3/h G2+B2+E3/h",cap:"Baixo descendo por graus: C  G/B  Am  Em/G. É um dos encadeamentos mais famosos da música popular."})}
${box("prof","Na harmonia tradicional a 2ª inversão (acorde de 6/4) é tratada como instável e tem usos específicos (por exemplo, o 6/4 cadencial antes do V). A nomenclatura de baixo cifrado barroco chama a 1ª inversão de \"acorde de sexta\" (6) e a 2ª de \"acorde de quarta e sexta\" (6/4).")}
${box("res","Inversão = qual nota está no baixo. Fundamental (1 no baixo), 1ª inversão (3 no baixo), 2ª inversão (5 no baixo). Cifra com barra: acorde/baixo.")}
`,

{t:"Tétrades: acordes de 4 notas", e:"🟥", min:"20 min", sub:"7M, 7, m7, m7(♭5), º",
goal:"montar as cinco tétrades principais e reconhecer seu som.",
body:`
<p>Continue empilhando terças por cima da tríade e você ganha uma quarta nota: a <b>sétima</b>. Acordes de quatro notas são as <b>tétrades</b>. Elas são a base da harmonia do jazz, da bossa nova e da MPB, e aparecem muito no gospel e no pop.</p>
<p>A sétima pode ser <b>maior</b> (11 semitons acima da fundamental, um semitom abaixo da oitava) ou <b>menor</b> (10 semitons, um tom abaixo da oitava). Combinando com as tríades:</p>
${tbl(["Nome","Tríade + 7ª","Em Dó","Cifra","Ouvir"],[
["Maior com sétima maior","maior + 7M","Dó Mi Sol <b>Si</b>","C7M (Cmaj7, CΔ)",ouvir("C4+E4+G4+B4/w","",60)],
["<b>Dominante</b> (maior com sétima menor)","maior + 7m","Dó Mi Sol <b>Si♭</b>","C7",ouvir("C4+E4+G4+Bb4/w","",60)],
["Menor com sétima menor","menor + 7m","Dó Mi♭ Sol <b>Si♭</b>","Cm7",ouvir("C4+Eb4+G4+Bb4/w","",60)],
["Meio-diminuto","diminuta + 7m","Dó Mi♭ Sol♭ <b>Si♭</b>","Cm7(♭5) ou Cø",ouvir("C4+Eb4+Gb4+Bb4/w","",60)],
["Diminuto","diminuta + 7ª diminuta","Dó Mi♭ Sol♭ <b>Si♭♭</b> (soa como Lá)","Cº (Cdim7)",ouvir("C4+Eb4+Gb4+A4/w","",60)]])}
${st("G","C4+E4+G4+B4/w:C7M C4+E4+G4+Bb4/w:C7 C4+Eb4+G4+Bb4/w:Cm7 C4+Eb4+Gb4+Bb4/w:Cm7(♭5)",{bpm:45})}
${box("aten","Confusão clássica: na cifra, <b>C7</b> sozinho significa sétima <b>menor</b> (o acorde dominante). Para sétima <b>maior</b>, escreve-se <b>7M</b>, maj7 ou Δ. \"C7\" nunca é \"Dó com sétima maior\".")}
<h2>🎭 O caráter de cada uma</h2>
<ul><li><b>7M</b>: repouso sofisticado, som de bossa nova.</li><li><b>7</b> (dominante): tensão que pede resolução. A estrela da harmonia tonal (próximo módulo).</li><li><b>m7</b>: menor suave, muito usado.</li><li><b>m7(♭5)</b>: tenso e melancólico; aparece muito antes de acordes dominantes em tom menor.</li><li><b>º</b>: muito tenso e simétrico; funciona como \"ponte\" entre acordes.</li></ul>
${box("prof","O acorde diminuto (tétrade) é formado só por terças menores empilhadas (3 semitons + 3 + 3), então divide a oitava em quatro partes iguais. Consequência: Cº, E♭º, G♭º e Aº têm as mesmas quatro notas (com nomes enarmônicos). Só existem <b>três</b> acordes diminutos diferentes em todo o sistema. Existem outras tétrades menos comuns, como <b>m(7M)</b> (menor com sétima maior) e <b>7M(♯5)</b>.")}
${box("pra","Monte as cinco tétrades a partir de Fá e toque os arpejos (nota por nota) no seu instrumento. (F7M: Fá Lá Dó Mi. F7: Fá Lá Dó Mi♭. Fm7: Fá Lá♭ Dó Mi♭. Fm7(♭5): Fá Lá♭ Dó♭ Mi♭. Fº: Fá Lá♭ Dó♭ Mi♭♭.)")}
${box("res","Tétrade = tríade + 7ª. C7M, C7 (dominante), Cm7, Cm7(♭5), Cº. Na cifra, \"7\" sozinho = sétima menor.")}
`,
quiz:[
["Quais notas formam G7?",["Sol Si Ré Fá♯","Sol Si Ré Fá","Sol Si♭ Ré Fá"],1,"Tríade maior + 7ª menor: Sol Si Ré Fá."],
["Em cifra, C7M indica...",["Dó menor com sétima","Dó maior com sétima maior","Dó com sétima menor"],1,"7M = sétima maior."],
["Qual tétrade é formada por tríade diminuta + 7ª menor?",["Diminuta","Meio-diminuta, m7(♭5)","Dominante"],1,"Também chamada de meio-diminuta (ø)."]

{t:"Lendo qualquer cifra", e:"🔤", min:"18 min", sub:"Extensões, alterações, sus, add, barras",
goal:"decifrar cifras completas como G7(♭9), F7M(♯11), Dm7(9), Csus4, C6.",
body:`
<p>Uma cifra completa tem até quatro partes. Leia sempre da esquerda para a direita:</p>
<p style="text-align:center;font-size:20px;font-weight:900">[fundamental] [tipo] [sétima] ([extensões/alterações]) / [baixo]</p>
${tbl(["Parte","Exemplos","O que significa"],[["Fundamental","C, F♯, B♭","a nota que dá nome"],["Tipo (tríade)","(nada), m, dim/º, +, sus4","maior, menor, diminuto, aumentado, suspenso"],["Sétima","7, 7M","7ª menor ou 7ª maior"],["Extensões","9, 11, 13","notas acima da 7ª (9ª = 2ª, 11ª = 4ª, 13ª = 6ª, uma oitava acima)"],["Alterações","♭9, ♯9, ♯11, ♭13, ♭5, ♯5","extensão ou quinta subida/descida um semitom"],["Baixo","/E, /B♭","nota mais grave"]])}
<h2>📚 Exemplos lidos em voz alta</h2>
${tbl(["Cifra","Leitura","Notas (a partir da fundamental)"],[
["C6","Dó com sexta","Dó Mi Sol Lá"],["Cm6","Dó menor com sexta (maior)","Dó Mi♭ Sol Lá"],
["Csus4 (ou C4)","Dó com quarta suspensa (sem terça)","Dó Fá Sol"],
["C(9) ou Cadd9","Dó com nona adicionada, sem sétima","Dó Mi Sol Ré"],
["C7(9)","Dó dominante com nona","Dó Mi Sol Si♭ Ré"],
["G7(♭9)","Sol dominante com nona menor","Sol Si Ré Fá Lá♭"],
["F7M(♯11)","Fá com sétima maior e décima primeira aumentada","Fá Lá Dó Mi Si"],
["Dm7(9)","Ré menor com sétima e nona","Ré Fá Lá Dó Mi"],
["G7(13)","Sol dominante com décima terceira","Sol Si (Ré) Fá Mi"],

["Bb/D","Si♭ maior com baixo em Ré","Ré no baixo + Si♭ Ré Fá"]])}
${ouvir("C3+G3+E4+Bb4+D5/w","Ouvir C7(9)",50)} ${ouvir("G2+F3+B3+E4/w","Ouvir G7(13)",50)} ${ouvir("F2+E3+A3+C4+B4/w","Ouvir F7M(♯11)",50)}
${box("aten","Há diferenças entre escolas de cifra. No Brasil (padrão Almir Chediak), extensões vão entre parênteses, C7(9), e \"C(9)\" quer dizer nona <b>sem</b> sétima. Em livros americanos, \"C9\" normalmente já inclui a sétima menor (= C7(9)) e a nona sem sétima é \"Cadd9\". Na dúvida, veja qual padrão o livro usa.")}
${box("prof","Na prática, músicos que acompanham omitem notas de acordes grandes: a 5ª justa costuma ser a primeira a sair, e em G7(13) a 5ª (Ré) geralmente não é tocada. A 11ª justa quase nunca é usada em acordes maiores e dominantes (ela choca com a 3ª); por isso se usa ♯11 nesses acordes, e 11 justa em acordes menores (Dm7(11)) ou no lugar da 3ª (sus4).")}
${box("pra","Escreva as notas de: A7, Em7(♭5), B♭7M, D7(♭9), Gm6, Fsus4. (A7: Lá Dó♯ Mi Sol. Em7(♭5): Mi Sol Si♭ Ré. B♭7M: Si♭ Ré Fá Lá. D7(♭9): Ré Fá♯ Lá Dó Mi♭. Gm6: Sol Si♭ Ré Mi. Fsus4: Fá Si♭ Dó.)")}
${box("res","Ordem: fundamental → tipo → sétima → (extensões) → /baixo. 9=2, 11=4, 13=6 na oitava de cima. Padrão brasileiro: extensões entre parênteses.")}
`,

["A 13ª de Sol é...",["Mi","Fá","Lá"],0,"13ª = 6ª uma oitava acima; 6ª de Sol = Mi."],

],
pdf:[["Sistema de cifragens (Fernando Mattos)","Sistema de cifragens de acordes - PROF. FERNANDO LEWIS DE MATTOS.pdf"],["Dicionário de acordes","dicionario-de-acordes-curtos.pdf"]]}

/* ============ MÓDULO 2 · CAMPO HARMÔNICO ============ */
{id:"n3m2", t1:"Campo", t2:"Harmônico", g:"🏛️", c:"#f59e0b", t2c:"#ffb020", sub:"Os acordes de cada tom e suas funções",
desc:"Os sete acordes que nascem de uma escala, o papel de cada um (tônica, subdominante, dominante) e as fórmulas de final de frase (cadências).",
aulas:[
{t:"Campo harmônico maior (tríades)", e:"🏠", min:"15 min", sub:"Os 7 acordes da escala maior",
goal:"montar o campo harmônico maior de qualquer tom e decorar o padrão.",
body:`
<p>Se você construir uma tríade sobre <b>cada nota</b> da escala maior, usando <b>só notas da escala</b>, ganha sete acordes. Esse conjunto se chama <b>campo harmônico</b>. É a \"família\" de acordes daquela tonalidade.</p>
${st("G","C4+E4+G4/w:C D4+F4+A4/w:Dm E4+G4+B4/w:Em F4+A4+C5/w:F G4+B4+D5/w:G A4+C5+E5/w:Am B4+D5+F5/w:Bdim",{bpm:60,cap:"Campo harmônico de Dó maior"})}
${tbl(["Grau","I","II","III","IV","V","VI","VII"],[["Tipo","Maior","menor","menor","Maior","Maior","menor","diminuto"],["Em Dó","C","Dm","Em","F","G","Am","Bdim"],["Em Sol","G","Am","Bm","C","D","Em","F♯dim"],["Em Si♭","B♭","Cm","Dm","E♭","F","Gm","Adim"]])}
<p style="text-align:center;font-weight:900;font-size:18px">Maior · menor · menor · Maior · Maior · menor · diminuto</p>
<p>Esse padrão é igual em <b>todas</b> as tonalidades maiores, porque todas seguem a mesma receita T-T-S-T-T-T-S. Decore uma vez e sirva-se para sempre.</p>
${box("ana","Uma tonalidade é como uma família de sete irmãos. Todos têm o \"sobrenome\" da tônica (usam as mesmas notas), mas cada um tem personalidade própria. Três são \"alegres\" (maiores), três são \"sérios\" (menores) e um é \"nervoso\" (diminuto).")}
${box("dica","Com os três acordes maiores (I, IV e V) dá para acompanhar uma quantidade enorme de hinos, músicas folclóricas e sucessos populares. Acrescente o VI menor e você tem a famosa progressão I–V–VI–IV, presente em muitos sucessos do pop.")}
${ouvir("C4+E4+G4/h G3+B3+D4/h A3+C4+E4/h F3+A3+C4/h C4+E4+G4/w","Ouvir I – V – VI – IV – I em Dó",80)}
${box("pra","Escreva o campo harmônico de Fá maior e de Ré maior. (Fá: F Gm Am B♭ C Dm Edim. Ré: D Em F♯m G A Bm C♯dim.)")}
${box("res","Campo harmônico maior: I maior, II menor, III menor, IV maior, V maior, VI menor, VII diminuto. Igual em todos os tons.")}
`,
quiz:[
["No campo harmônico maior, qual grau é diminuto?",["II","V","VII"],2,"VII grau: tríade diminuta."],
["Qual é o IV grau de Sol maior?",["C","Cm","D"],0,"Sol maior: G Am Bm C D Em F♯dim."],
["Qual é o VI grau de Fá maior?",["Dm","D","Gm"],0,"Fá: F Gm Am B♭ C Dm Edim."]
],
pdf:[["Alan Gomes · Harmonia 1","Curso_de_harmonia1.pdf"],["Silvio Ribeiro · Harmonia Essencial","Coleção-Harmonia-Essencial-PDF-.pdf"]]},

{t:"Campo harmônico maior (tétrades)", e:"🏢", min:"12 min", sub:"I7M IIm7 IIIm7 IV7M V7 VIm7 VIIm7(♭5)",
goal:"saber o campo harmônico com sétimas, a linguagem da música popular e do jazz.",
body:`
<p>Acrescentando a 7ª (sempre usando só notas da escala), o campo harmônico vira:</p>
${st("G","C4+E4+G4+B4/w:C7M D4+F4+A4+C5/w:Dm7 E4+G4+B4+D5/w:Em7 F4+A4+C5+E5/w:F7M G4+B4+D5+F5/w:G7 A4+C5+E5+G5/w:Am7 B4+D5+F5+A5/w:Bm7(♭5)",{bpm:55})}
${tbl(["Grau","I","II","III","IV","V","VI","VII"],[["Tétrade","7M","m7","m7","7M","<b>7</b>","m7","m7(♭5)"],["Em Dó","C7M","Dm7","Em7","F7M","<b>G7</b>","Am7","Bm7(♭5)"],["Em Si♭","B♭7M","Cm7","Dm7","E♭7M","<b>F7</b>","Gm7","Am7(♭5)"]])}
${box("aten","Repare: o <b>único</b> acorde dominante (maior com 7ª menor) do campo maior é o do <b>V grau</b>. Por isso, quando você vê um acorde \"X7\", a primeira suspeita é: ele é o V de alguém. Guarde isso, é a chave do Módulo 3.")}
${box("prof","A tétrade do VII grau, m7(♭5), é chamada de meio-diminuta. Na harmonia popular ela é pouco usada como VII do tom maior; aparece muito mais como II grau do tom menor (a próxima aula de campo menor).")}
${box("pra","Toque (ou cante) os arpejos das sete tétrades de Si♭ maior, subindo, no seu instrumento. É o primeiro passo do o mapa \"Pensando em Números\".")}
${box("res","I7M IIm7 IIIm7 IV7M V7 VIm7 VIIm7(♭5). Só o V é dominante.")}
`,

["Qual o IIm7 de Si♭ maior?",["Cm7","C7","Dm7"],0,"II grau de Si♭ = Dó: Cm7."],
["Qual grau tem tétrade 7M?",["I e IV","II e V","V e VII"],0,"I7M e IV7M."]
],

{t:"Funções: casa, passeio e vontade de voltar", e:"🧭", min:"15 min", sub:"Tônica, subdominante e dominante",
goal:"classificar os acordes do campo harmônico pela função.",
body:`
<p>Cada acorde do campo tem um <b>papel</b> na história que a música conta. Na harmonia funcional, são três papéis:</p>
${tbl(["Função","Sensação","Acorde principal","Substitutos"],[["<b>Tônica (T)</b>","repouso, casa, estabilidade","I","VI (e às vezes III)"],["<b>Subdominante (SD)</b>","afastamento, passeio, preparação","IV","II"],["<b>Dominante (D)</b>","tensão, vontade de voltar para casa","V","VII"]])}
${ouvir("C4+E4+G4/w","T: repouso (C)",60)} ${ouvir("F3+A3+C4/w","SD: afastamento (F)",60)} ${ouvir("G3+B3+D4+F4/w","D: tensão (G7)",60)} ${ouvir("C4+E4+G4/w","T: volta para casa (C)",60)}
<h2>🔁 A frase clássica: T → SD → D → T</h2>
<p>Uma quantidade enorme de músicas segue o roteiro: sai de casa, passeia, sente vontade de voltar, volta. Em Dó: <b>C → F → G7 → C</b>, ou com substitutos: <b>C → Dm7 → G7 → C</b>.</p>
${ouvir("C4+E4+G4/h F3+A3+C4/h G3+B3+D4+F4/h C4+E4+G4/h","Ouvir T – SD – D – T",70)}
${box("ana","É a história de todo filme de aventura: o herói está em casa (T), parte para a jornada (SD), enfrenta o grande perigo (D) e volta para casa transformado (T).")}
<h2>🤔 Por que os substitutos funcionam?</h2>
<p>Porque eles <b>compartilham notas</b> com o acorde principal. Dm (Ré Fá Lá) tem duas notas em comum com F (Fá Lá Dó). Am (Lá Dó Mi) tem duas em comum com C (Dó Mi Sol). Bdim (Si Ré Fá) tem duas em comum com G (Sol Si Ré), justamente Si e Fá, o trítono do G7.</p>
${box("prof","O III grau é ambíguo: Em (Mi Sol Si) compartilha duas notas com o I, C (Mi e Sol), e duas com o V, G (Sol e Si). Por isso alguns autores o classificam como tônica e outros como dominante fraca. Na prática, o contexto decide. Essa classificação em três funções vem da teoria do alemão Hugo Riemann, no fim do século XIX, e é a base da \"harmonia funcional\" ensinada por Koellreutter no Brasil.")}
${box("pra","Pegue um hino ou música com cifra e escreva T, SD ou D em cima de cada acorde.")}
${box("res","T (I, VI, III) = repouso. SD (IV, II) = afastamento. D (V, VII) = tensão que pede T.")}
`,
quiz:[
["Qual função gera vontade de voltar para a tônica?",["Subdominante","Dominante","Tônica"],1,"A dominante cria tensão que pede resolução."],
["Em Dó maior, qual acorde pode substituir o F (subdominante)?",["Dm","G","Am"],0,"Dm compartilha Fá e Lá com F."],
["O VI grau (Am em Dó) costuma ter função de...",["dominante","tônica","subdominante"],1,"Am compartilha Dó e Mi com C."]
],
pdf:[["Koellreutter · Harmonia Funcional","Harmonia Funcional_ H. J. Koellreuter.pdf"],["Hannelore Bucher · Harmonia Funcional Prática","Harmonia Funcional Prática_Hannelore Bucher.pdf"]]},

{t:"Cadências: a pontuação da música", e:"🔚", min:"12 min", sub:"Autêntica, plagal, meia cadência, de engano",
goal:"reconhecer os quatro tipos de cadência de ouvido e no papel.",
body:`
<p>Assim como um texto tem ponto final, vírgula e reticências, a música tem <b>cadências</b>: encadeamentos de acordes que <b>encerram</b> uma frase.</p>
${tbl(["Cadência","Acordes","Equivalente no texto","Ouvir"],[
["<b>Autêntica (perfeita)</b>","V → I","ponto final",ouvir("G3+B3+D4+F4/h C4+E4+G4/w","",70)],
["<b>Plagal</b>","IV → I","ponto final suave (o \"Amém\" dos hinos)",ouvir("F3+A3+C4/h C4+E4+G4/w","",70)],
["<b>Meia cadência</b>","qualquer → V","vírgula ou ponto de interrogação",ouvir("C4+E4+G4/h F3+A3+C4/h G3+B3+D4/w","",70)],
["<b>De engano (interrompida)</b>","V → VI","\"reticências\", surpresa",ouvir("G3+B3+D4+F4/h A3+C4+E4/w","",70)]])}
${box("ana","Cadência autêntica: \"Fim.\" Meia cadência: \"E então...?\" Cadência de engano: \"E eles viveram felizes para... <i>espera, o que foi aquele barulho?</i>\"")}
${box("prof","Na teoria clássica, a cadência autêntica é chamada <b>perfeita</b> quando os dois acordes estão no estado fundamental e a melodia termina na tônica; caso contrário, <b>imperfeita</b>. A plagal é famosa como a cadência do \"Amém\" no fim dos hinos protestantes.")}
${box("pra","Ouça 3 músicas e tente perceber o final de cada frase: termina \"fechado\" (autêntica/plagal) ou \"aberto\" (meia cadência)?")}
${box("res","Autêntica V→I (ponto final). Plagal IV→I (Amém). Meia cadência →V (vírgula). Engano V→VI (surpresa).")}
`,
quiz:[
["Qual cadência termina no acorde de dominante?",["Autêntica","Meia cadência","Plagal"],1,"Meia cadência para no V, deixando a frase \"em aberto\"."],
["A cadência do \"Amém\" é a...",["plagal (IV→I)","autêntica (V→I)","de engano"],0,"IV→I, comum no final de hinos."],
["V → VI é uma cadência...",["de engano","perfeita","plagal"],0,"O ouvido espera o I e recebe o VI."]
],
pdf:[["Hindemith · Harmonia Tradicional","Harmonia Tradicional_Paul Hindemith_12ed.pdf"]]},

{t:"Campo harmônico menor", e:"🌑", min:"18 min", sub:"Por que o V do tom menor é maior",
goal:"montar o campo harmônico menor usado na prática e entender de onde vem cada acorde.",
body:`
<p>Se você fizer o campo harmônico da escala <b>menor natural</b> (em Lá menor: só teclas brancas), o V grau sai <b>menor</b>: Em. E um V menor não tem sensível (não tem Sol♯), então não \"puxa\" de volta para Lá com força.</p>
${ouvir("E3+G3+B3/h A3+C4+E4/w","Em → Am (fraco)",70)} ${ouvir("E3+G#3+B3+D4/h A3+C4+E4/w","E7 → Am (forte, com Sol♯)",70)}
<p>A solução: pegar o V da escala <b>menor harmônica</b> (com Sol♯), que é <b>E7</b>. Na prática, o campo harmônico menor mistura acordes da natural e da harmônica:</p>
${tbl(["Grau","I","II","♭III","IV","V","♭VI","♭VII / VII"],[["Menor natural","Im7","IIm7(♭5)","♭III7M","IVm7","Vm7","♭VI7M","♭VII7"],["Menor harmônica","Im(7M)","IIm7(♭5)","♭III7M(♯5)","IVm7","<b>V7</b>","♭VI7M","<b>VIIº</b>"],["Uso mais comum (Lá menor)","Am7 / Am","Bm7(♭5)","C7M","Dm7","<b>E7</b>","F7M","G7 ou <b>G♯º</b>"]])}
<h2>🎯 A cadência menor</h2>
<p>A fórmula mais importante: <b>IIm7(♭5) → V7 → Im</b>. Em Lá menor: <b>Bm7(♭5) → E7 → Am</b>.</p>
${ouvir("B2+A3+D4+F4/h E3+G#3+B3+D4/h A2+E3+A3+C4/w","Ouvir Bm7(♭5) – E7 – Am",70)}
${box("prof","Os números com ♭ (♭III, ♭VI, ♭VII) indicam que o grau está um semitom abaixo do grau correspondente da escala maior homônima. É a forma mais comum de nomear graus em harmonia popular: tudo é comparado com a escala maior da mesma tônica.")}
${box("pra","Monte o campo menor \"de uso comum\" de Ré menor. (Dm7, Em7(♭5), F7M, Gm7, A7, B♭7M, C7 ou C♯º.)")}
${box("res","No tom menor, o V vem da menor harmônica (V7, com sensível). Cadência menor: IIm7(♭5) – V7 – Im.")}
`,
quiz:[
["Por que se usa E7 em vez de Em em Lá menor?",["Porque é mais fácil de tocar","Porque o Sol♯ (sensível) cria atração forte para Lá","Porque Em não existe"],1,"O V7 com sensível resolve com força."],
["Qual é o IIm7(♭5) de Lá menor?",["Bm7(♭5)","Dm7(♭5)","Em7(♭5)"],0,"II grau de Lá = Si."],
["De qual escala vem o V7 do tom menor?",["Menor natural","Menor harmônica","Escala cromática"],1,"A harmônica tem o 7º grau elevado."]
],
pdf:[["Chediak · Harmonia e Improvisação I","Harmonia e Improvisação Vol I Almir Chediak.pdf"],["Ian Guest · vol. 2","Harmonia Ian Guest Vol 2.pdf"]]}
]},

/* ============ MÓDULO 3 · MOVIMENTO ============ */
{id:"n3m3", t1:"Tensão &", t2:"Resolução", g:"⚡", c:"#3b82f6", t2c:"#4c9bff", sub:"Trítono, II-V-I, dominantes secundárias",
desc:"O motor da harmonia tonal: por que o acorde dominante pede resolução, a progressão mais importante do jazz e como \"emprestar\" dominantes para qualquer acorde.",
aulas:[
{t:"O trítono: o motor da harmonia", e:"🧲", min:"14 min", sub:"Por que o V7 quer ir para o I",
goal:"explicar, nota por nota, por que G7 resolve em C.",
body:`
<p>Dentro de <b>G7</b> (Sol Si Ré Fá) existe um intervalo de <b>trítono</b>: entre <b>Si</b> (a 3ª) e <b>Fá</b> (a 7ª). É o intervalo mais instável que existe, e ele \"quer\" se resolver. Veja como cada nota caminha:</p>
<ul><li><b>Si</b> (a sensível) sobe um semitom para <b>Dó</b>.</li><li><b>Fá</b> desce um semitom para <b>Mi</b>.</li></ul>
<p>O trítono se \"abre\" numa terça (Dó–Mi), e essas duas notas são justamente a fundamental e a terça de C. É por isso que <b>G7 → C</b> soa tão conclusivo.</p>
${st("G","B3+F4/h:Si-Fá C4+E4/h*:Dó-Mi",{bpm:60,cap:"O trítono Si-Fá se resolvendo em Dó-Mi"})}
${st("G","G3+B3+D4+F4/h:G7 G3+C4+E4/h*:C",{bpm:60,cap:"Dentro dos acordes completos"})}
${box("ana","Pense em dois ímãs segurados perto de outros dois: Si está a um passinho do Dó e Fá a um passinho do Mi. Quando você solta, eles grudam. Essa força de atração é a \"vontade de voltar para casa\" da dominante.")}
${box("prof","Esse movimento por semitom se chama <b>condução de vozes</b> (voice leading). A 3ª e a 7ª de um acorde, que carregam o trítono no dominante, são chamadas de <b>notas-guia</b> (guide tones). No Nível 4 você vai usá-las para improvisar e no Nível 5 para rearmonizar (substituição de trítono).")}
${box("pra","No instrumento: toque Si–Dó e depois Fá–Mi, sentindo a resolução. Depois faça o mesmo em Si♭ maior: o V7 é F7; o trítono é Lá–Mi♭; resolve em Si♭–Ré.")}
${box("res","O V7 tem um trítono entre a 3ª e a 7ª. A 3ª sobe meio tom para a tônica, a 7ª desce meio tom para a 3ª do I. Isso é a resolução.")}
`,
quiz:[
["Quais notas formam o trítono de G7?",["Sol e Ré","Si e Fá","Sol e Fá"],1,"3ª (Si) e 7ª (Fá) do G7."],
["Na resolução G7 → C, o Si vai para...",["Dó","Lá","Mi"],0,"A sensível sobe meio tom para a tônica."],
["E o Fá vai para...",["Sol","Mi","Ré"],1,"A 7ª desce meio tom para a 3ª do acorde de Dó."]
],
pdf:[["Koellreutter · Harmonia Funcional","Harmonia Funcional_ H. J. Koellreuter.pdf"]]},

{t:"II – V – I: a progressão mais importante", e:"🔑", min:"15 min", sub:"Dm7 – G7 – C7M",
goal:"reconhecer e tocar o II–V–I em tons maiores e menores.",
body:`
<p>Juntando o que você já sabe: a subdominante (II) prepara a dominante (V), que resolve na tônica (I). Em tétrades: <b>IIm7 – V7 – I7M</b>. Em Dó: <b>Dm7 – G7 – C7M</b>.</p>
${ouvir("D3+F3+A3+C4/w G2+F3+B3+D4/w C3+E3+G3+B3/w","Ouvir Dm7 – G7 – C7M",70)}
<p>Essa é a progressão mais comum do jazz, da bossa nova e de grande parte da música popular. Alguns standards de jazz são praticamente uma corrente de II–V–Is em tons diferentes.</p>
<h2>🔗 Por que soa tão bem?</h2>
<p>Olhe as notas-guia (3ª e 7ª) andando por graus mínimos:</p>
${tbl(["","Dm7","G7","C7M"],[["7ª / 3ª","Dó (7ª)","Si (3ª)","Si (7ª)"],["3ª / 7ª","Fá (3ª)","Fá (7ª)","Mi (3ª)"]])}
<p>A cada acorde, uma nota desce meio tom e a outra fica parada. É a condução de vozes mais econômica possível.</p>
${st("G","C4+F4/w:Dm7 B3+F4/w:G7 B3+E4/w*:C7M",{bpm:60,cap:"Só as notas-guia: quase não se movem"})}
<h2>🌙 No tom menor</h2>
<p><b>IIm7(♭5) – V7 – Im</b>. Em Dó menor: <b>Dm7(♭5) – G7 – Cm</b>.</p>
${ouvir("D3+Ab3+C4+F4/w G2+F3+B3+D4/w C3+Eb3+G3+C4/w","Ouvir Dm7(♭5) – G7 – Cm",70)}
${box("dica","Treine o II–V–I nas 12 tonalidades seguindo o ciclo de quintas. É o exercício de harmonia mais útil que existe, para quem acompanha e para quem improvisa. No seu instrumento, arpeje: Dm7 (Ré Fá Lá Dó) – G7 (Sol Si Ré Fá) – C7M (Dó Mi Sol Si).")}
${box("pra","Escreva o II–V–I maior de Fá (Gm7 C7 F7M), Si♭ (Cm7 F7 B♭7M) e Mi♭ (Fm7 B♭7 E♭7M).")}
${box("res","Maior: IIm7 – V7 – I7M. Menor: IIm7(♭5) – V7 – Im. As notas-guia se movem por semitom ou ficam paradas.")}
`,
quiz:[
["Qual é o II–V–I de Fá maior?",["Gm7 C7 F7M","Dm7 G7 C7M","Cm7 F7 B♭7M"],0,"II de Fá = Sol; V = Dó."],
["No II–V–I menor, o II é...",["m7","m7(♭5)","7M"],1,"IIm7(♭5), o meio-diminuto."],
